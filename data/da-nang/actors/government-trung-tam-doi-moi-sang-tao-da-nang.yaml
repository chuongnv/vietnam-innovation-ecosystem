history:
- date: '2026-10-09'
  text: UBND thành phố ban hành Quyết định 4640/QĐ-UBND thành lập Trung tâm trên cơ sở hợp nhất DISSC, DBC và DSAC; Trung tâm kế thừa nhiệm vụ của ba đơn vị cho đến khi có quy định chức năng, nhiệm vụ mới.
  source: https://startupdanang.vn/da-nang-thanh-lap-trung-tam-doi-moi-sang-tao
- date: '2026-11-01'
  text: Chính thức hoạt động.
  source: https://startupdanang.vn/da-nang-thanh-lap-trung-tam-doi-moi-sang-tao
- date: '2026-11-02'
  text: 'Sở KH&CN công bố quyết định thành lập và bổ nhiệm lãnh đạo. Sở giao Trung tâm sớm ban hành quy chế, đẩy mạnh chuyển đổi số, góp phần đưa Đà Nẵng vào nhóm 3–5 địa phương dẫn đầu về Chỉ số đổi mới sáng tạo cấp tỉnh (PII). Năm nhiệm vụ trọng tâm: ổn định tổ chức; bàn giao tài chính, tài sản, hồ sơ; phát huy nghiên cứu, chuyển giao công nghệ và khởi nghiệp; tăng kỷ luật, sử dụng hiệu quả tài sản công; phối hợp với các phòng, ban.'
  source: https://startupdanang.vn/da-nang-thanh-lap-trung-tam-doi-moi-sang-tao
- date: '2026-12-01'
  text: Đồng tổ chức Hội thảo Kết nối Đổi mới sáng tạo xanh Nhật Bản – Đà Nẵng cùng Thành phố Yokohama, YUSA và YBA Đà Nẵng.
  source: https://www.ybadanang.com/to-chuc/dnic/
