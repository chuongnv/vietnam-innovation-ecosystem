description:
  vi: Đơn vị sự nghiệp công lập thuộc Sở KH&CN Đà Nẵng, hợp nhất DISSC, DBC và DSAC theo Quyết định 4640/QĐ-UBND ngày 09/10/2026, hoạt động từ 01/11/2026. Nghiên cứu, đào tạo, phát triển và chuyển giao công nghệ; cung cấp dịch vụ về đổi mới sáng tạo, khởi nghiệp sáng tạo, công nghệ sinh học, vi mạch, bán dẫn và AI, thông tin thống kê KH&CN và chuyển đổi số; quản lý hạ tầng KH&CN được giao.
  en: Public service unit of the Da Nang Department of Science and Technology, merging DISSC, DBC and DSAC under Decision 4640/QD-UBND (9 October 2026), operating from 1 November 2026. Research, training, technology development and transfer; services in innovation, innovative startups, biotech, microchips, semiconductors, AI, S&T statistics and digital transformation; manages assigned S&T facilities.
