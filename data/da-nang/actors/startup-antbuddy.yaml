description:
  vi: 'Nền tảng kết nối và tăng trưởng khách hàng cho doanh nghiệp, mạnh ở chuỗi bán lẻ: gom chat từ Zalo, Facebook, TikTok, Shopee và hơn 20 kênh, tổng đài đám mây AntRing, CRM khách hàng 360°, khách hàng thân thiết, bán hàng qua Zalo Mini App và AI Agent, chatbot, voicebot (AntBot). Văn phòng tại Đà Nẵng và TP.HCM; đã có khách hàng ở Đông Nam Á và Trung Đông.'
  en: 'A customer engagement and growth platform for businesses, strong in retail chains: chat aggregation from Zalo, Facebook, TikTok, Shopee and 20+ channels, AntRing cloud call centre, 360° CRM, loyalty, Zalo Mini App sales, and AI Agent, chatbot, voicebot (AntBot). Offices in Da Nang and Ho Chi Minh City; customers in Southeast Asia and the Middle East.'
