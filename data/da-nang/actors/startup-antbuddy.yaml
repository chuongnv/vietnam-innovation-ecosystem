  source: https://www.antbuddy.com/about-antbuddy
- date: 2026-11
  text: 'Đang hoạt động, sản phẩm gồm ba nhóm: Kết nối+ (chat, gọi đa kênh, AI), Khách hàng 360+ (CRM, chăm sóc, khảo sát, khách hàng thân thiết), Bán trực tiếp (đơn hàng đa kênh, Zalo Mini App, chiến dịch ZNS, SMS, email); có SDK chat, gọi, video để tích hợp vào ứng dụng của doanh nghiệp.'
