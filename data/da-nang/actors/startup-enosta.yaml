description:
  vi: 'Công ty tư vấn và phát triển sản phẩm số theo mô hình AI-native: từ ý tưởng, thiết kế, phát triển web, mobile, cloud, giải pháp AI và dữ liệu đến thương hiệu và đưa sản phẩm ra thị trường. Trụ sở tại Đà Nẵng, văn phòng tại Melbourne (Úc) và Gatineau (Canada); hơn 150 nhân sự, đạt ISO 27001. Đứng sau phần mềm quản lý bất động sản cho thuê Smartos.'
  en: 'AI-native digital product consulting and development company: from ideation, design, web, mobile and cloud development, AI and data solutions to branding and go-to-market. Headquartered in Da Nang, with offices in Melbourne (Australia) and Gatineau (Canada); over 150 staff, ISO 27001 certified. Behind the rental property management software Smartos.'
history:
- date: '2011'
  text: Thành lập Enouvo IT Solutions tại Đà Nẵng, tiền thân về công nghệ và nhân sự của Enosta.
  source: https://enosta.com/about-us
- date: '2020'
  text: Ra mắt Enosta tại Đà Nẵng; cuối năm mở văn phòng Melbourne (Úc).
  source: https://enosta.com/about-us
- date: '2022'
  text: Được Clutch, The Manifest, SME100 Asia ghi nhận ở các hạng mục dịch vụ CNTT, phát triển ứng dụng, thiết kế sản phẩm, thương hiệu.
  source: https://enosta.com/about-us
- date: '2024'
  text: Mở văn phòng Gatineau (Canada) qua hợp tác với LOYAL Group; Enouvo Group đổi tên thành Enosta Group.
  source: https://enosta.com/about-us
- date: '2025'
  text: Đạt chứng nhận ISO 27001, chuyển sang mô hình vận hành AI-native; tham gia Claude Partner Network, là AWS Select Partner, Strapi Community Partner.
  source: https://enosta.com/about-us
- date: '2026'
  text: Hơn 150 nhân sự tại Việt Nam, Úc, Canada; phục vụ hơn 55 khách hàng, hơn 75 sản phẩm và dự án đã bàn giao.
  source: https://enosta.com/about-us
- date: 2026-07
  text: Hợp tác chiến lược với Đại Thắng Holdings (qua giải pháp Smartos).
  source: indanang.vn
region: da-nang
