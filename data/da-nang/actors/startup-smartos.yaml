  date: '2026'
  summary: Case study do Smartos công bố về chuỗi văn phòng X2Office của Đại Thắng Holdings.
  points:
  - Trước đây thông tin khách thuê, hợp đồng, công nợ nằm riêng ở từng tòa nhà; báo cáo cho lãnh đạo phải tổng hợp thủ công.
  - 'Sau triển khai: quản lý tập trung 7 tòa nhà, nhiều pháp nhân, hơn 20.000 m² trên một nền tảng; đồng bộ hợp đồng, công nợ, hóa đơn VAT với kế toán; báo cáo doanh thu, dòng tiền tự động; dùng cho cả văn phòng cho thuê và coworking.'
