description:
  vi: 'Startup công nghệ tại Đà Nẵng, agency TikTok chính thức cho thương mại điện tử: tài khoản quảng cáo, TikTok Shop, quảng cáo game và ứng dụng, dịch vụ white-label. Vận hành Ecombator, vườn ươm giúp doanh nghiệp Việt bán hàng xuyên biên giới sang Mỹ qua TikTok Shop, hợp tác cùng Swiss EP; ươm tạo startup ad-tech, martech, AI.'
  en: 'A technology startup in Da Nang and official TikTok agency for e-commerce: ad accounts, TikTok Shop, game and app advertising, white-label services. Operates Ecombator, an incubator helping Vietnamese businesses sell cross-border to the US via TikTok Shop, in partnership with Swiss EP; incubates ad-tech, martech and AI startups.'
history:
- date: '2020'
  text: Thành lập tại Đà Nẵng. Tên Ecomdy ghép từ "Ecommerce" và chữ "đi" ("Let's Ecomdy!").
  source: https://ecomdymedia.com/company-about-us
- date: 2022-10
  text: Nhận giải TikTok Campaign Management.
  source: https://ecomdymedia.com/company-about-us
- date: 2023-11
  text: Được trao huy hiệu TikTok Agency Partner.
  source: https://ecomdymedia.com/company-about-us
- date: 2024-05
  text: Nhận giải TikTok Agency Marketing Partner of the Year.
  source: https://ecomdymedia.com/company-about-us
- date: '2024'
  text: 'Khởi động Ecombator, sáng kiến chung của Ecomdy Media và Ecomdy Global hợp tác cùng Swiss EP: ươm tạo doanh nghiệp in theo yêu cầu (POD), dropshipping bán sang Mỹ qua TikTok Shop; quy trình nộp hồ sơ trực tuyến, phỏng vấn 1-1, xác minh, ươm tạo và tăng tốc.'
  source: https://ecombator.com/
- date: '2026'
  text: Thắng giải "Innovation in Agency" tại TikTok Partner Innovation Awards 2026, là agency châu Á – Thái Bình Dương duy nhất được ghi nhận toàn cầu về đổi mới; trở thành Premier TikTok Marketing Partner.
  source: https://ecomdymedia.com/
- date: 2026-06
  text: Đợt ươm tạo 9 startup AI.
