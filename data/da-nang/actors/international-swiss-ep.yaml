history:
- date: '2014'
  text: SECO khởi xướng ý tưởng, J.E. Austin Associates (JAA) thực hiện nghiên cứu khả thi.
  source: https://swissep.org/about-us/behind-swiss-ep
- date: 2015-06
  text: 'Bắt đầu hoạt động; SECO giao Swisscontact và JAA thực hiện tại 6 nước: Albania, Bosnia và Herzegovina, Bắc Macedonia, Peru, Serbia, Việt Nam.'
  source: https://swissep.org/about-us/behind-swiss-ep
- date: '2019'
  text: Kosovo tham gia, nâng tổng số nước lên 7.
  source: https://swissep.org/about-us/behind-swiss-ep
- date: '2025'
  text: Tròn 10 năm; 628 chuyên gia đã tham gia các đợt hỗ trợ tại các nước chương trình.
  source: https://swissep.org/our-impact/decade-of-swiss-ep
- date: 2026-11
  text: Tại Việt Nam, Swiss EP nhận định hệ sinh thái đang lan ra các thành phố cấp hai, chuyên sâu theo ngành dọc và đổi mới sáng tạo trong doanh nghiệp lớn; khoảng trống còn lại là vốn giai đoạn đầu và vốn cho nhà sáng lập nữ.
  source: https://swissep.org/countries/vietnam
case_studies:
- title: Cách Swiss EP làm việc với tổ chức hỗ trợ khởi nghiệp
  url: https://swissep.org/our-work/working-principles
  publisher: Swiss Entrepreneurship Program
  date: '2026'
  summary: Nguyên tắc làm việc rút ra sau 10 năm thực hiện chương trình.
  points:
  - 'Trao quyền cho tổ chức địa phương: hỗ trợ đối tác tự thiết kế, thực hiện hoạt động thay vì làm thay.'
  - 'Nuôi dưỡng tinh thần làm chủ: đối tác tự xác định sứ mệnh và nhu cầu của nhà sáng lập.'
  - Hỗ trợ năng lực, không trợ cấp chi phí vận hành hay lương ngắn hạn.
  - 'Dịch vụ: tư vấn trực tiếp của nhóm địa phương, chia sẻ kinh nghiệm từ nhà sáng lập quốc tế (workshop, nói chuyện, gặp 1-1), kết nối mạng lưới, đề xuất hợp tác để lấp khoảng trống hệ sinh thái.'
