description:
  vi: 'Chương trình của Cục Kinh tế Liên bang Thụy Sĩ (SECO), do Swisscontact và J.E. Austin Associates thực hiện, hoạt động tại 7 nước gồm Việt Nam. Hỗ trợ tổ chức hỗ trợ khởi nghiệp và startup tăng trưởng qua tư vấn của nhóm địa phương và mạng lưới hơn 700 chuyên gia quốc tế. Phương châm: "Họ dẫn dắt, chúng tôi hỗ trợ".'
  en: 'A programme of the Swiss State Secretariat for Economic Affairs (SECO), implemented by Swisscontact and J.E. Austin Associates, operating in 7 countries including Vietnam. It helps startup support organisations and startups grow through advice from local teams and a network of more than 700 international experts. Motto: "They lead, we support".'
