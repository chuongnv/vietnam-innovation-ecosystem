- Swiss EP Vietnam
- Chương trình Khởi nghiệp Thụy Sĩ
type: international
categories:
- Chương trình phát triển hệ sinh thái khởi nghiệp (SECO tài trợ)
- Nâng năng lực tổ chức hỗ trợ khởi nghiệp
