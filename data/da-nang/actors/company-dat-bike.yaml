description:
  vi: Startup xe máy điện thành lập năm 2019 tại Đà Nẵng, từ Batch 2019 của DNES; tự phát triển pin, bộ điều khiển động cơ, firmware và sản xuất tại Việt Nam.
  en: Electric motorbike startup founded in 2019 in Da Nang, from DNES Batch 2019; develops its own batteries, motor controllers and firmware, and manufactures in Vietnam.
case_studies:
- title: 'Dat Bike: một startup địa phương trở thành năng lực công nghiệp'
  url: https://indanang.vn/dat-bike-case-study
  publisher: inDanang – Đà Nẵng Startup Ecosystem
  date: 2026-08
  summary: Phân tích cách Dat Bike giữ phần khó của ngành xe điện (pin, bộ điều khiển, phần mềm, sản xuất) ở lại Việt Nam, đóng góp của doanh nghiệp cho kinh tế địa phương, và những gì hệ sinh thái Đà Nẵng cần xây để có thêm doanh nghiệp tương tự.
  points:
  - 'Tích hợp dọc là lợi thế: toàn bộ công nghệ lõi (pin, BMS, bộ điều khiển động cơ, firmware, OTA) do đội ngũ trong nước phát triển; chi phí hệ truyền động trên hiệu năng giảm khoảng 60% sau 4 năm.'
  - 'Sáu thế hệ sản phẩm là sáu vòng thử–sai: từ Weaver (2019) chứng minh năng lực kỹ thuật, Quantum (2023) chuyển sang thị trường đại chúng, đến Era (2026) giá từ 29,9 triệu đồng cho nhu cầu gia đình.'
  - 'Tác động lan tỏa: khoảng 90% chuỗi cung ứng nội địa với khoảng 300 doanh nghiệp Việt, 80% nhà cung cấp trong bán kính 30 km quanh nhà máy; hơn 500 việc làm trực tiếp.'
  - 'Bài học cho Đà Nẵng: cần hạ tầng thử nghiệm hard-tech dùng chung, vốn kiên nhẫn cho R&D (grant, vay chuyển đổi, quỹ đồng đầu tư), cầu nối startup với nhà cung cấp, sandbox đô thị và chuyên gia từng vận hành sản xuất.'
  - 'Thách thức giai đoạn tới: biên lợi nhuận, chất lượng ở quy mô hàng chục nghìn xe, vòng đời và tái chế pin, quốc tế hóa sang Thái Lan và Đông Nam Á.'
