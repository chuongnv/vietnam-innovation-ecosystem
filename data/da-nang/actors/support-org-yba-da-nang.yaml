history:
- date: '2000'
  text: 'Thành lập từ CLB Doanh nghiệp trẻ thành phố Đà Nẵng với 36 hội viên; Chủ tịch khóa I: Dương Viết Roãn (Cienco5).'
  source: https://ybadanang.com/lanh-dao-hoi/
- date: '2010'
  text: Khoảng 350 hội viên.
  source: https://ybadanang.com/lanh-dao-hoi/
- date: '2015'
  text: Khoảng 500 hội viên.
  source: https://ybadanang.com/lanh-dao-hoi/
- date: '2020'
  text: Khoảng 600 hội viên.
  source: https://ybadanang.com/lanh-dao-hoi/
- date: '2021'
  text: Đại hội VII (2021–2025), chủ đề "Nâng tầm, Kết nối, Phát triển"; Chủ tịch Lê Trí Hải (Green Global).
  source: https://ybadanang.com/lanh-dao-hoi/
- date: '2025'
  text: 'Kết quả nhiệm kỳ VII: khoảng 800 hội viên, 12 CLB; Ngày hội việc làm 2025 với 185 doanh nghiệp, hơn 8.100 vị trí; hai diễn đàn cùng AmCham về đầu tư Hoa Kỳ vào miền Trung; ký hợp tác toàn diện với Hội Doanh nhân trẻ Hải Phòng; Hội nghị gặp gỡ chính quyền và doanh nghiệp với hơn 300 doanh nhân; góp ý chính sách phát triển kinh tế tư nhân theo Nghị quyết 68-NQ/TW.'
  source: https://ybadanang.com/lanh-dao-hoi/
- date: '2025-12-20'
  text: Đại hội lần thứ VIII (2025–2028) tại Ariyana Đà Nẵng, bầu Chủ tịch Mai Minh Vương; ký ghi nhớ hợp tác với Ban quản lý Khu công nghệ cao và các Khu công nghiệp Đà Nẵng; kỷ niệm 25 năm thành lập, đón nhận Huân chương Lao động hạng Nhất.
  source: https://ybadanang.com/lanh-dao-hoi/
- date: 2026-11
  text: 'Nhiệm kỳ VIII (2025–2028): Ban Chấp hành 89, Ban Thường vụ 41, Thường trực 16 thành viên; 15 Ban chuyên môn (có Ban Khởi nghiệp và Đổi mới sáng tạo, Ban Chuyển đổi số) và 12 CLB. Mục tiêu 1.500 hội viên; mạng lưới 20 doanh nghiệp dẫn dắt, 200 doanh nghiệp đồng hành, 2.000 doanh nghiệp trong chuỗi giá trị; đồng hành chương trình đào tạo "500 CEO" giai đoạn 2025–2030.'
  source: https://ybadanang.com/lanh-dao-hoi/
