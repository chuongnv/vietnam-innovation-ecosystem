description:
  vi: Tổ chức xã hội nghề nghiệp của doanh nhân trẻ Đà Nẵng, khoảng 800 hội viên. Kết nối giao thương, đào tạo quản trị và chuyển đổi số, đối thoại chính sách, trách nhiệm xã hội; có Ban Khởi nghiệp và Đổi mới sáng tạo.
  en: A socio-professional organisation of young entrepreneurs in Da Nang, with about 800 members. Business networking, management and digital transformation training, policy dialogue, social responsibility; has a Startup and Innovation Committee.
