description:
  vi: Cộng đồng riêng của founder, nhà đầu tư và builder Web3 tại Việt Nam và Đông Nam Á. Vận hành Da Nang Blockchain Hub, Web3 Builders' Summit, chuỗi Web3 Builders' Voice; chương trình tăng tốc sqrBUIDL (BUIDL-athon trên Solana, Lisk), hạ tầng node sqrNODE, mảng AI agent sqrAI; đầu tư pre-seed, seed vào dự án của thành viên.
  en: A private community of Web3 founders, investors and builders in Vietnam and Southeast Asia. Runs Da Nang Blockchain Hub, Web3 Builders' Summit and the Web3 Builders' Voice series; the sqrBUIDL accelerator (BUIDL-athon on Solana, Lisk), sqrNODE node infrastructure and the sqrAI AI agent arm; makes pre-seed and seed investments in members' projects.
