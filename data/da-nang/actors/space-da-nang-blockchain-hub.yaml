description:
  vi: 'Không gian Web3 dành cho builder tại miền Trung, chào đón mọi hệ sinh thái blockchain uy tín: đào tạo kiến thức nền (bảo mật, hợp đồng thông minh, account abstraction), không gian làm việc chung và sự kiện, kết nối tư vấn pháp lý và sandbox. Do sqrDAO vận hành; mở thứ Hai đến thứ Sáu, 9:00–18:00.'
  en: 'A Web3 space for builders in Central Vietnam, welcoming all reputable blockchain ecosystems: foundational training (security, smart contracts, account abstraction), co-working space and events, and connections to legal advice and sandboxes. Operated by sqrDAO; open Monday to Friday, 9:00–18:00.'
history:
