  text: 'Tài trợ theo năm từ đối tác: Premium Partner 300 USD/tháng (Pharos Network, Superteam Vietnam, Avalanche Team1, DiiD), Ecosystem Partner 100 USD/tháng (Swiss EP Vietnam, 9AM Games, Punkga.me); đối tác chiến lược sqrDAO, NAPA Global, DNIC.'
