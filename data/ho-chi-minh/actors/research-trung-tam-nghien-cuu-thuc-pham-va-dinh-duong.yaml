id: research-trung-tam-nghien-cuu-thuc-pham-va-dinh-duong
name:
  vi: Trung tâm Nghiên cứu Thực phẩm và Dinh dưỡng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 333/6/14 Lê Văn Sỹ, Phường Tân Sơn Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về dinh dưỡng và công nghệ thực phẩm, sản xuất thử và kinh doanh sản phẩm từ thành quả nghiên cứu; đồng thời cung cấp các dịch vụ thông tin, cơ sở dữ liệu, tư vấn, đánh giá, định giá và môi giới chuyển giao công nghệ.'
  en: 'Centre researching food technology and nutrition, pilot-producing and selling research-based products; it also provides information and database services, consulting, and technology assessment, valuation and transfer brokerage.'
description_source:
  text: '- Nghiên cứu khoa học trong lĩnh vực công nghệ thực phẩm và dinh dưỡng. - Sản xuất thử - thử nghiệm; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. - Dịch vụ KH&CN: Dịch vụ tra cứu và chỉ dẫn thông tin khoa học và công nghệ; dịch vụ nghiên cứu xây dựng cơ sở dữ liệu; dịch vụ nghiên cứu xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu, lưu trữ điện tử; dịch vụ môi giới chuyển giao công nghệ; dịch vụ tư vấn chuyển giao công nghệ; dịch vụ đánh giá công nghệ, dịch vụ định giá công nghệ; dịch vụ giám định công nghệ; dịch vụ xúc tiến chuyển giao công nghệ theo lĩnh vực đăng ký phù hợp quy định pháp luật. Tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
