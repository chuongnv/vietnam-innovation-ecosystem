id: research-vien-cong-nghe-duoc-pham-orioled-hub
name:
  vi: Viện Công Nghệ Dược Phẩm Orioled Hub
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 72 Bình Giã, Phường Tân Bình, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc một công ty dược phẩm tư nhân, nghiên cứu về dược lý, dược lâm sàng, dược liệu, hóa dược và thực phẩm chức năng; sản xuất thử, kinh doanh sản phẩm nghiên cứu và cung cấp dịch vụ tư vấn, chuyển giao, tập huấn.'
  en: 'An institute under a private pharmaceutical company researching pharmacology, clinical pharmacy, medicinal materials, pharmaceutical chemistry and functional foods; it pilots and sells research products and offers consulting, transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Dược lý học; Dược học lâm sang và điều trị; Dược liệu học; Hóa dược học; Thực phẩm chức năng;…. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ, tư vấn, chuyển giao kết quả nghiên cứu; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp với Luật định (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
