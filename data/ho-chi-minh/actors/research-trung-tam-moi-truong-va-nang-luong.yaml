id: research-trung-tam-moi-truong-va-nang-luong
name:
  vi: Trung tâm Môi trường và Năng lượng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 314, Trường Chinh, Phường Tân Bình, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ xử lý chất thải, quan trắc, kiểm soát ô nhiễm, sản xuất sạch, tái chế và năng lượng, nhiên liệu ngoài dầu khí; cung cấp tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng.'
  en: 'Centre researching and applying waste treatment, pollution monitoring and control, cleaner production, recycling, and energy and non-petroleum fuel technologies; it provides consulting, transfer of research results and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; công nghệ sản xuất sạch và tái chế; công nghệ năng lượng và nhiên liệu không phải dầu khí. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
