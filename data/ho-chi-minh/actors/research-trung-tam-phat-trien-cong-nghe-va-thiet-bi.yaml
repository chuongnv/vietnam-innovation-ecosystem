id: research-trung-tam-phat-trien-cong-nghe-va-thiet-bi
name:
  vi: Trung tâm Phát triển Công nghệ và Thiết bị
type: research
categories:
- Tổ chức khoa học và công nghệ
address: F1/68 B, Ấp 6, Xã Tân Vĩnh Lộc, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm hoạt động trong lĩnh vực công trình giao thông, thủy lợi, dân dụng và hạ tầng kỹ thuật, cung cấp tư vấn lập dự án, khảo sát thiết kế, thẩm tra, giám sát, thí nghiệm và kiểm định chất lượng công trình, chứng nhận sự phù hợp và đào tạo quản lý xây dựng.'
  en: 'A centre working on transport, irrigation, civil and technical infrastructure works, providing project preparation, survey and design, appraisal, supervision, testing and quality inspection of works, conformity certification and construction management training.'
description_source:
  text: 'giao thông. - Dịch vụ KH&CN: + Tư vấn đấu thầu, lập dự án đầu tư, quản lý dự án, khảo sát thiết kế, thẩm tra, thẩm định thiết kế và dự toán các công trình giao thông, thủy lợi, dân dụng, công nghiệp và hạ tầng kỹ thuật, đánh giá tác động môi trường trong công trình xây dựng, giao thông. + Tư vấn giám sát, khảo sát địa chất công trình, thí nghiệm, kiểm định chất lượng các công trình giao thông, thủy lợi, dân dụng, công nghiệp và hạ tầng kỹ thuật. + Tư vấn kiểm tra, chứng nhận sự phù hợp về chất lượng công trình xây dựng theo Luật định. + Liên kết đào tạo bồi dưỡng, chuyển giao công nghệ mới về quản lý công trình xây dựng, giao thông. - Hợp tác với các tổ chức trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
