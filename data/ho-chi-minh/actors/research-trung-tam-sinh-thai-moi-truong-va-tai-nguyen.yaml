id: research-trung-tam-sinh-thai-moi-truong-va-tai-nguyen
name:
  vi: Trung tâm Sinh thái Môi trường và Tài nguyên
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 3, Lê Văn Miến, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về quản lý, xử lý chất thải, phục hồi môi trường, quan trắc và kiểm soát ô nhiễm, kỹ thuật xây dựng; cung cấp tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research on waste management and treatment, environmental remediation, monitoring and pollution control and construction engineering; it provides consulting, transfer of research results and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng khí); công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; kỹ thuật xây dựng. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
  url: https://opendata.hochiminhcity.gov.vn/dataset/dữ-liệu-tổ-chức-khoa-học-và-công-nghệ-tổ-chức-khoa-học-và-công-nghệ-0
