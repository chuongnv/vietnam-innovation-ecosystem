id: research-trung-tam-tu-van-khoa-hoc-cong-nghe-va-moi-truong-mien-namtr
name:
  vi: Trung Tâm Tư Vấn Khoa Học Công Nghệ Và Môi Trường Miền NamTrung Tâm Khoa Học Công Nghệ Và Môi Trường Miền Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 25, Hàn Thuyên, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm thuộc hệ thống Liên minh Hợp tác xã Việt Nam, thực hiện chương trình, dự án về khoa học công nghệ, môi trường, CNTT; tư vấn chuyển giao công nghệ, sở hữu trí tuệ, xây dựng thương hiệu, truy xuất nguồn gốc, chứng nhận, kiểm nghiệm sản phẩm và xúc tiến thương mại.'
  en: 'A centre within the Vietnam Cooperative Alliance system that runs S&T, environmental and IT programmes and projects; it advises on technology transfer, IP and branding, traceability, product certification and testing, and trade promotion.'
description_source:
  text: '1. Xây dựng và tổ chức thực hiện các chương trình, kế hoạch, đề án, đề tài, dự án về khoa học công nghệ; bảo vệ môi trường; công nghệ thông tin, xúc tiến thương mại và đầu tư trong hệ thống Liên minh Hợp tác xã Việt Nam. 2. Dịch vụ khoa học và Công nghệ: + Triển khai các hoạt động tư vấn, dịch vụ theo quy định của pháp luật về nghiên cứu ứng dụng, chuyển giao công nghệ vào sản xuất; bảo vệ môi trường; công nghệ thông tin; thương mại điện tử, sở hữu trí tuệ; xây dựng thương hiệu; chỉ dẫn địa lý, truy xuất nguồn gốc; chứng nhận thực hành sản xuất; chứng nhận, kiểm nghiệm, thử nghiệm, kiểm định sản phẩm, an toàn vệ sinh thực phẩm theo quy trình, quy chuẩn, tiêu chuẩn trong nước và quốc tế + Đào tạo, dạy nghề, xây dựng các mô hình sản xuất, kinh doanh; xúc tiến thương mại và đầu tư (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
