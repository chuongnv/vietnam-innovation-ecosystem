description:
  vi: 'Trung tâm trực thuộc Sở Văn hóa và Thể thao TP.HCM, phụ trách huấn luyện, thi đấu thể thao; nghiên cứu, ứng dụng khoa học trong thể thao như y học, sinh lý, sinh cơ, tâm lý và điều trị, phục hồi chấn thương cho vận động viên.'
  en: 'Centre under the HCMC Department of Culture and Sports for sports training and competition; it researches and applies sports science, including sports medicine, physiology, biomechanics, psychology, and treatment and rehabilitation of athletes'' injuries.'
description_source:
  text: 'Tổ chức nghiên cứu, thí nghiệm và ứng dụng khoa học - công nghệ trong lĩnh vực thể dục thể thao và các lĩnh vực khoa học có liên quan như: y học, sinh lý học, sinh cơ học, sinh hóa học, tâm lý học, quản lý học; điều trị và phục hồi chấn thương thể thao.'
