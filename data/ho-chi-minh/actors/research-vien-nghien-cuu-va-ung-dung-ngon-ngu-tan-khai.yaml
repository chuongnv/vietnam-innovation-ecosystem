id: research-vien-nghien-cuu-va-ung-dung-ngon-ngu-tan-khai
name:
  vi: Viện Nghiên cứu và Ứng Dụng Ngôn Ngữ Tân Khai
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 12, Đường số 01, Phường Tân Vĩnh Lộc, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học về ngôn ngữ, gồm tiếng Việt, các ngôn ngữ khác và ngôn ngữ học ứng dụng; tổ chức hội thảo, cung cấp thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'An institute conducting linguistic research on Vietnamese, other languages and applied linguistics, organising conferences and providing scientific information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực: Nghiên cứu chung về ngôn ngữ; Nghiên cứu ngôn ngữ Việt Nam; Nghiên cứu ngôn ngữ khác; Ngôn ngữ học ứng dụng. 2. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo; thông tin khoa học và công nghệ; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
