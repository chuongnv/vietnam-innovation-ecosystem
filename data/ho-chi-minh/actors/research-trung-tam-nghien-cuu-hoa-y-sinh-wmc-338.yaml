id: research-trung-tam-nghien-cuu-hoa-y-sinh-wmc-338
name:
  vi: Trung tâm nghiên cứu Hóa - y sinh WMC (338)
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Lô I-10-7, Đường D7 - CNC, Phường Long Bình, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng trong hai mảng thiết bị y tế và công nghệ hóa sinh; sản xuất thử sản phẩm từ thành quả nghiên cứu, đồng thời tư vấn, chuyển giao công nghệ và tập huấn chuyên môn.'
  en: 'Centre researching and applying biochemical technology and medical device engineering; it pilot-produces research-based products and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ hóa sinh và kỹ thuật thiết bị y tế. 2. Sản xuất thử - thử nghiệm các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
