id: research-trung-tam-nghien-cuu-phat-trien-moi-truong-va-cong-nghe-sai
name:
  vi: Trung tâm nghiên cứu phát triển môi trường và công nghệ Sài Gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 76, Đường số 06, Phường Linh Xuân, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu công nghệ xử lý chất thải, xử lý sinh học, vi sinh nông nghiệp, năng lượng ngoài dầu khí, cây trồng và giống cây rừng; sản xuất thử, kinh doanh sản phẩm từ kết quả nghiên cứu, tư vấn và chuyển giao công nghệ.'
  en: 'Centre researching waste treatment, biological treatment, agricultural microbiology, non-petroleum energy, crops and forest tree breeding; it pilot-produces and sells research-based products and provides consulting and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ hóa hữu cơ; Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); Công nghệ sản xuất sạch, tái chế; Công nghệ xử lý môi trường bằng phương pháp sinh học; Công nghệ vi sinh vật trong nông nghiệp; Các công nghệ xử lý sinh học, xúc tác sinh học, lên men; Công nghệ năng lượng và nhiên liệu không phải dầu khí; Cây rau, cây hoa và cây ăn quả; Bảo vệ thực vật; Chọn, tạo giống cây rừng; Nhân giống cây rừng. 2. Sản xuất thử - thử nghiệm; Sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, chuyển giao công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
