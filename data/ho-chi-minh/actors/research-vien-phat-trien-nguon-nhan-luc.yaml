description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. - Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
