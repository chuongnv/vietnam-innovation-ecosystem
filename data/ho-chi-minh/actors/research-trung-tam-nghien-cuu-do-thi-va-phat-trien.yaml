id: research-trung-tam-nghien-cuu-do-thi-va-phat-trien
name:
  vi: Trung tâm Nghiên cứu Đô thị và Phát triển
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 568/8, Trần Hưng Đạo, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về quy hoạch và phát triển đô thị, nông thôn, cùng xã hội học, lịch sử, địa lý kinh tế - văn hóa; xây dựng cơ sở dữ liệu, hệ thống thông tin, lưu trữ điện tử, đồng thời tư vấn và tập huấn chuyên môn.'
  en: 'Centre researching urban and rural planning and development, sociology, economic and cultural geography and history; it builds databases, information systems and electronic archives and provides consulting and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: quy hoạch, phát triển đô thị và nông thôn; xã hội học chuyên đề; địa lý kinh tế và văn hóa; lịch sử Việt Nam và thế giới. 2. Dịch vụ KH&CN: - Dịch vụ nghiên cứu xây dựng cơ sở dữ liệu (thư mục và toàn văn). - Dịch vụ nghiên cứu xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu, lưu trữ điện tử. - Tư vấn, chuyển giao công nghệ, thông tin khoa học, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
