id: research-vien-khi-tuong-thuy-van-hai-van-va-moi-truong
name:
  vi: Viện Khí tượng Thủy văn Hải văn và Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 60, Phường Sài Gòn, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng các khoa học về khí quyển, biển, thủy văn, tài nguyên nước và sinh thái, cùng hóa phân tích và công nghệ môi trường (phục hồi, quan trắc, xử lý ô nhiễm); thương mại hóa sản phẩm nghiên cứu và làm dịch vụ tư vấn, chuyển giao công nghệ, đào tạo.'
  en: 'Institute applying research in atmospheric and marine sciences, hydrology, water resources, ecology, analytical chemistry and environmental technology (restoration, monitoring, pollution treatment); it produces and sells research-based products and offers consulting, technology transfer and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: khí tượng học và các khoa học khí quyển; hải dương học; thủy văn; tài nguyên nước; sinh thái học; hóa phân tích; công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. - Sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
