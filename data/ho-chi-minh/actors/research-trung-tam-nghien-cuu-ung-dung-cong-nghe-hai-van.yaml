id: research-trung-tam-nghien-cuu-ung-dung-cong-nghe-hai-van
name:
  vi: Trung tâm Nghiên cứu Ứng dụng Công nghệ Hải Vân
type: research
categories:
- Tổ chức khoa học và công nghệ
address: A11-05, Phú Thuận, Phường Phú Thuận, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về kỹ thuật điện – điện tử, tự động hóa và điều khiển số, cơ điện tử, thiết kế chế tạo máy và cơ khí ứng dụng laser, plasma, hồng ngoại; sản xuất thử, kinh doanh sản phẩm nghiên cứu và tư vấn, chuyển giao công nghệ.'
  en: 'An applied research centre in electrical and electronic engineering, automation and computer control, mechatronics, machine design and laser/plasma/infrared mechanical technology; it pilots and sells research products and provides consulting and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: kỹ thuật điện và điện tử; công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; công nghệ cơ điện tử; kỹ thuật thiết kế và công nghệ chế tạo máy; kỹ thuật thiết kế và công nghệ cơ khí liên quan đến laser, plasma, hồng ngoại. 2. Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
