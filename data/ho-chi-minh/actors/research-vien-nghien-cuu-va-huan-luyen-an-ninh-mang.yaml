address: 137 C, Nguyễn Chí Thanh, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong an ninh mạng; cung cấp dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và huấn luyện chuyên môn về bảo mật mạng.'
  en: 'Institute doing applied research in cybersecurity; offers consulting, transfer of research results, scientific information and professional cybersecurity training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực an ninh mạng. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
