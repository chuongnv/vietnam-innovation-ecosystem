id: research-vien-marketing-va-quan-tri-viet-nam
name:
  vi: Viện Marketing và Quản trị Việt Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
address: B2-14, Mỹ Thái 3, Nguyễn Lương Bằng, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu lý luận và ứng dụng thực tiễn về marketing và quản trị; tư vấn giải pháp marketing, xây dựng thương hiệu, cơ sở dữ liệu thị trường, đồng thời tổ chức đào tạo và hội thảo chuyên ngành.'
  en: 'An institute researching marketing and management theory and practice; it advises on marketing solutions and branding, builds market databases, and organises training and specialist workshops.'
description_source:
  text: '1- Nghiên cứu cơ sở lý luận và ứng dụng thực tiễn khoa học marketing và quản trị. 2- Dịch vụ KH&CN: Tư vấn giải pháp marketing và quản trị, xây dựng hình ảnh và thương hiệu, xây dựng cơ sở dữ liệu và cung cấp thông tin, đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên môn, tổ chức hội nghị, hội thảo về thị trường marketing và quản trị. 3- Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
