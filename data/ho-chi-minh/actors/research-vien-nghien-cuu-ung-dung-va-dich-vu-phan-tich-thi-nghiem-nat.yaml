id: research-vien-nghien-cuu-ung-dung-va-dich-vu-phan-tich-thi-nghiem-nat
name:
  vi: Viện Nghiên cứu Ứng Dụng Và Dịch Vụ Phân Tích Thí Nghiệm Nation-Lab
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 15, Hoàng Quốc Việt, Phường Phú Thuận, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu công nghệ môi trường và vi sinh trong nông nghiệp, đồng thời cung cấp dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, tư vấn xây dựng phòng thử nghiệm và bảo trì thiết bị đo lường.'
  en: 'An institute researching environmental technology and agricultural microbiology, which also provides inspection, calibration and testing of measuring instruments, advice on setting up testing laboratories and maintenance of measurement equipment.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); Công nghệ sản xuất sạch, tái chế; Công nghệ phục hồi và tái tạo môi trường; Công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; Công nghệ xử lý môi trường bằng phương pháp sinh học; Công nghệ vi sinh vật trong nông nghiệp. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Dịch vụ về kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, chuẩn đo lường (trừ hoạt động kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, chuẩn đo lường bức xạ, hạt nhân và hoạt động kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, chuẩn đo lường phục vụ trực tiếp cho hoạt động đo lường đặc thù thuộc lĩnh vực quốc phòng, an ninh). Dịch vụ tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn xây dựng tiêu chuẩn; tư vấn xây
    dựng hệ thống bảo đảm về đo lường. Dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật. Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
