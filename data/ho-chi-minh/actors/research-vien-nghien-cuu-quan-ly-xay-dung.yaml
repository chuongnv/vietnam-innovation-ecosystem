id: research-vien-nghien-cuu-quan-ly-xay-dung
name:
  vi: Viện Nghiên cứu Quản lý Xây dựng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 246A, Đinh Tiên Hoàng, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kiến trúc, kỹ thuật xây dựng và hạ tầng đô thị, thực hiện sản xuất thử nghiệm, chuyển giao công nghệ và cung cấp dịch vụ tư vấn, thông tin, bồi dưỡng chuyên môn trong ngành xây dựng.'
  en: 'An institute researching architecture, construction engineering and urban infrastructure, carrying out pilot production and technology transfer, and providing consulting, information and professional training for the construction sector.'
description_source:
  text: '1- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: kiến trúc, kỹ thuật xây dựng và công trình hạ tầng đô thị. 2- Sản xuất thử - thử nghiệm; chuyển giao công nghệ từ kết quả nghiên cứu. 3- Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
