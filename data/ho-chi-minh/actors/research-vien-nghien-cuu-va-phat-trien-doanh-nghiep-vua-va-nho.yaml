address: 220-222, Quốc lộ 13, Phường Bình Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học về quản trị kinh doanh, hướng tới doanh nghiệp vừa và nhỏ; cung cấp tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và bồi dưỡng nâng cao nghiệp vụ.'
  en: 'Institute researching business administration with a focus on small and medium-sized enterprises; offers consulting, transfer of research results, scientific information and professional upskilling.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực kinh doanh và quản trị kinh doanh. 2. Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn (không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
