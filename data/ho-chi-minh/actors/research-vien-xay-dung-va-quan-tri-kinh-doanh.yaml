id: research-vien-xay-dung-va-quan-tri-kinh-doanh
name:
  vi: Viện xây dựng và quản trị kinh doanh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 76C4, Điện Biên Phủ, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về kiến trúc, kỹ thuật xây dựng, hạ tầng đô thị và quản trị kinh doanh; cung cấp tư vấn và chuyển giao công nghệ, phổ biến thông tin khoa học, bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in architecture, construction engineering, urban infrastructure and business administration; offers consulting, technology transfer, scientific information and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: kiến trúc; kỹ thuật xây dựng; công trình hạ tầng đô thị; kinh doanh và quản trị kinh doanh. 2- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
