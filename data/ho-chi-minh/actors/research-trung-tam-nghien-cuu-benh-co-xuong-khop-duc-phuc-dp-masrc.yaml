id: research-trung-tam-nghien-cuu-benh-co-xuong-khop-duc-phuc-dp-masrc
name:
  vi: Trung tâm Nghiên cứu bệnh cơ xương khớp Đức Phúc (DP-MASRC)
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 174, Nguyễn Văn Thủ, Phường Tân Định, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng về bệnh cơ xương khớp, trải rộng từ chấn thương chỉnh hình, chẩn đoán hình ảnh, hóa sinh y học đến phục hồi chức năng; sản xuất thử, tư vấn, chuyển giao thành quả và tập huấn chuyên môn.'
  en: 'Centre researching and applying orthopaedics and trauma, rehabilitation, diagnostic imaging and medical biochemistry related to musculoskeletal disease; it also does pilot production, consulting, transfer of results and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: chấn thương,chỉnh hình, phục hồi chức năng; chẩn đoán hình ảnh; sinh hoá y học. 2. Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
