id: research-trung-tam-dich-vu-do-luong-va-giam-dinh
name:
  vi: Trung Tâm Dịch Vụ Đo Lường Và Giám Định
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 62A, Phạm Ngọc Thạch, Phường Xuân Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu kỹ thuật điện, điện tử, tự động hóa và cơ khí; cung cấp dịch vụ thử nghiệm, kiểm định, hiệu chuẩn phương tiện đo, giám định hàng hóa, chứng nhận hệ thống quản lý và sản phẩm, mã số mã vạch.'
  en: 'Centre researching electrical, electronic, automation and mechanical engineering; it provides testing, verification and calibration of measuring instruments, goods inspection, management-system and product certification, and barcode services.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Kỹ thuật điện và điện tử; Công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; Kỹ thuật cơ khí nói chung. 2. Sản xuất thử nghiệm, sản xuất, kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Dịch vụ thử nghiệm chất lượng sản phẩm, hàng hóa; Dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo; Dịch vụ chứng nhận hệ thống quản lý chất lượng; chứng nhận sản phẩm phù hợp tiêu chuẩn; Dịch vụ công nhận phòng thử nghiệm, phòng hiệu chuẩn, tổ chức giám định, tổ chức chứng nhận hệ thống, tổ chức chứng nhận sản phẩm; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Dịch vụ tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống đảm bảo
    về đo lường; Dịch vụ ứng dụng kỹ thuật mã số, mã vạch cho sản phẩm hàng hóa dịch vụ; Dịch vụ tư vấn chuyển giao công nghệ; Thông tin khoa học và công nghệ, tập huấn, bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
