id: research-trung-tam-tu-van-ung-dung-kinh-te
name:
  vi: Trung tâm tư vấn ứng dụng kinh tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 149, Pasteur, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng trong kinh tế, xã hội, môi trường và đô thị; tư vấn tài chính, quản trị doanh nghiệp, lập và thẩm định dự án đầu tư, đấu thầu, thẩm định công nghệ, định giá tài sản vô hình và đào tạo nhân lực doanh nghiệp.'
  en: 'A centre doing applied research in economics, social issues, environment and urban affairs; it advises on finance, business management, investment project preparation and appraisal, procurement, technology appraisal and intangible asset valuation, and trains business staff.'
description_source:
  text: '- Nghiên cứu và triển khai ứng dụng trong lĩnh vực kinh tế, xã hội, môi trường, đô thị. - Dịch vụ KH&CN: Tư vấn kinh tế, tài chính, quản trị doanh nghiệp, xúc tiến thị trường; tư vấn lập và thẩm định dự án đầu tư; tư vấn đấu thầu trong nước và quốc tế; thông tin; đào tạo nguồn nhân lực cho doanh nghiệp; thẩm định, đánh giá công nghệ; thẩm định giá trị tài sản vô hình theo Luật định. - Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
