description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong nha khoa; cung cấp dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và bồi dưỡng chuyên môn cho người hành nghề nha khoa.'
  en: 'Institute doing applied research in dentistry; offers consulting, transfer of research results, scientific information and professional training for dental practitioners.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực nha khoa. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng , chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
