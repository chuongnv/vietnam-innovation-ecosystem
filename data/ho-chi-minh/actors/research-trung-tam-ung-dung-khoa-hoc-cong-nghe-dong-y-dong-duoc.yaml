id: research-trung-tam-ung-dung-khoa-hoc-cong-nghe-dong-y-dong-duoc
name:
  vi: Trung tâm Ứng dụng Khoa học Công nghệ Đông Y Đông dược
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 272-275, Nguyễn Văn Trỗi, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng y dược học cổ truyền; dựa trên thành quả nghiên cứu để sản xuất, kinh doanh thuốc đông y, đồng thời đào tạo, nâng cao trình độ chuyên môn.'
  en: 'Centre researching and applying traditional medicine and pharmacy; it produces and sells traditional medicines based on its research and provides professional training.'
description_source:
  text: '- Nghiên cứu phát triển và ứng dụng triển khai các thành tựu khoa học kỹ thuật trong lĩnh vực y và dược học cổ truyền. - Sản xuất và kinh doanh thuốc y học cổ truyền trên cơ sở các kết quả nghiên cứu theo quy định của Nhà nước. - Dịch vụ KH&CN: đào tạo bồi dưỡng nâng cao trình độ chuyên môn, liên kết hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
