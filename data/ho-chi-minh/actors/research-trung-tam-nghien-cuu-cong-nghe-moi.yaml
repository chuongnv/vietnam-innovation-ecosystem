address: 32/30, Nguyễn Cửu Vân, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu thực nghiệm, chế tạo thiết bị công nghệ mới phục vụ sản xuất, đời sống; khảo sát, lập dự án khả thi cho công trình cơ khí, điện tử, nông nghiệp, môi trường, y tế và liên kết dạy nghề kỹ thuật.'
  en: 'Centre doing experimental research and building new-technology equipment for production and daily life; it surveys and prepares feasibility studies for mechanical, electronic, agricultural, environmental and health projects and partners in vocational technical training.'
description_source:
  text: '1- Nghiên cứu thực nghiệm và chế tạo các loại thiết bị công nghệ mới thuộc các lĩnh vực phục vụ sản xuất đời sống. 2- Dịch vụ KH&CN: - Khảo sát thiết kế lập dự án khả thi cho các công trình về cơ khí, điện tử, nông nghiệp, bảo vệ môi trường, y tế, giáo dục. - Liên kết đào tạo dạy nghề về kỹ thuật viên điện tử, cơ khí, tự động hóa'
