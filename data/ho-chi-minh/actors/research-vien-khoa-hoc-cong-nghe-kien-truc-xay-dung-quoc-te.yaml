id: research-vien-khoa-hoc-cong-nghe-kien-truc-xay-dung-quoc-te
name:
  vi: Viện Khoa Học Công Nghệ Kiến Trúc - Xây Dựng Quốc Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 2/17, Huỳnh Văn Nghệ, Phường An Hội Tây, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về vật liệu và cấu kiện xây dựng mới, giải pháp nền móng, thiết kế kiến trúc nhà ở, quy hoạch và công trình giao thông, thủy lợi; sản xuất thử, kinh doanh sản phẩm nghiên cứu và tổ chức hội thảo chuyên ngành.'
  en: 'An institute researching new building materials and components, foundation solutions, residential architecture, planning, and transport and irrigation works; it pilots and sells research products and organises specialist workshops.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Kinh doanh và quản trị kinh doanh; Nghiên cứu, phát triển các chủng loại vật liệu và cấu kiện xây dựng mới; Công nghệ vật liệu xây dựng; Nghiên cứu phát triển giải pháp nền móng, thiết kế kiến trúc về nhà ở; Quy hoạch và thiết kế công trình xây dựng; Công trình giao thông vận tải, công trình thủy lợi. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học Công nghệ: Tổ chức hội nghị, hội thảo trong lĩnh vực đăng ký; Cung cấp các dịnh vụ có liên quan đến hoạt động khoa học và công nghệ trong lĩnh vực đăng ký; Bồi dưỡng, tập huấn, phổ biến thông tin về khoa học công nghệ và tiêu chuẩn xây dựng (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
