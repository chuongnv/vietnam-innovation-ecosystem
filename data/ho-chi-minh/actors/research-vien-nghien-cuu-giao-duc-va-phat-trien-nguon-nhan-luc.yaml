id: research-vien-nghien-cuu-giao-duc-va-phat-trien-nguon-nhan-luc
name:
  vi: Viện Nghiên cứu Giáo Dục Và Phát Triển Nguồn Nhân Lực
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 42/20, Nguyễn Giản Thanh, TP. Hồ Chí Minh
description:
  vi: 'Viện do một nhóm cá nhân thành lập, nghiên cứu về triết học, lý luận và nghiên cứu văn học, điều dưỡng và dược học; cung cấp tư vấn, chuyển giao công nghệ và huấn luyện, đào tạo theo lĩnh vực đăng ký.'
  en: 'An institute founded by a group of individuals, researching philosophy, literary theory and studies, nursing and pharmacy; it provides consulting, technology transfer and training in these fields.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Triết học; Lý luận văn học; Nghiên cứu văn học nói chung; Điều dưỡng; Dược học. 2. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao công nghệ, huấn luyện, đào tạo theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
