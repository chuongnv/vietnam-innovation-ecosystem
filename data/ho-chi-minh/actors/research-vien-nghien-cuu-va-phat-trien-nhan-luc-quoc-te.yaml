id: research-vien-nghien-cuu-va-phat-trien-nhan-luc-quoc-te
name:
  vi: Viện Nghiên cứu và Phát Triển Nhân Lực Quốc Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 65, Nguyễn Bỉnh Khiêm, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu trong các lĩnh vực điện-điện tử, tự động hóa, robot, hệ thống thông tin, phần mềm, quản trị kinh doanh và ngôn ngữ học ứng dụng; cung cấp tập huấn, bồi dưỡng chuyên môn, xây dựng cơ sở dữ liệu và môi giới chuyển giao công nghệ.'
  en: 'An institute researching electrical and electronic engineering, automation, robotics, information systems, software, business administration and applied linguistics; it offers training, database development and technology transfer brokerage.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực: Kỹ thuật điện và điện tử; Tin học trong các ngành khoa học tự nhiên; Người máy và điều khiển tự động; Công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; Các hệ thống thông tin và truyền thông; Công nghệ phần mềm; Kinh doanh và Quản trị kinh doanh; Ngôn ngữ học ứng dụng. 2. Dịch vụ khoa học và công nghệ: tập huấn, bồi dưỡng chuyên môn, chuyển giao công nghệ theo lĩnh vực đăng ký phù hợp Luật định; Dịch vụ nghiên cứu xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu, lưu trữ điện tử; Dịch vụ môi giới chuyển giao công nghệ. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
