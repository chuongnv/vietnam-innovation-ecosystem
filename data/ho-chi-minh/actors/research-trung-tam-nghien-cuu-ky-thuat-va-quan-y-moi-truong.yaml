id: research-trung-tam-nghien-cuu-ky-thuat-va-quan-y-moi-truong
name:
  vi: Trung tâm Nghiên cứu Kỹ thụât và Quản ý Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 3/9, Bình Giã, Phường Tân Sơn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ xử lý chất thải, sản xuất sạch, tái chế và các khía cạnh xã hội của môi trường; đồng thời nhận tư vấn, chuyển giao thành quả, cung cấp thông tin và tập huấn chuyên môn.'
  en: 'Centre researching and applying waste-treatment, cleaner-production and recycling technologies and the social aspects of the environment; it also offers consulting, transfer of results, information and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ sản xuất sạch, tái chế; khoa học môi trường - các khía cạnh xã hội. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
