id: research-trung-tam-nghien-cuu-dieu-tra-tu-van-khao-sat-tai-nguyen-va
name:
  vi: Trung tâm Nghiên cứu Điều tra Tư vấn Khảo sát Tài nguyên và Môi trường biển
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 48, Bùi Bằng Đoàn, Phường Tân Hưng, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng, điều tra và khảo sát về tài nguyên, môi trường biển; ngoài ra nhận tư vấn, chuyển giao thành quả, cung cấp thông tin khoa học và tập huấn chuyên môn.'
  en: 'Centre researching, applying, surveying and investigating marine resources and environment; it also offers consulting, transfer of results, scientific information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực tài nguyên và môi trường biển. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng , chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
