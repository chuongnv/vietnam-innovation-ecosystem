id: research-trung-tam-phat-trien-giao-duc-cong-dong-nguon-sang
name:
  vi: Trung Tâm Phát Triển Giáo Dục Cộng Đồng Nguồn Sáng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 73F, Nguyễn Thượng Hiền, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về tâm lý học, khoa học giáo dục, xã hội học và ngôn ngữ học ứng dụng; cung cấp dịch vụ xây dựng cơ sở dữ liệu, thư viện – lưu trữ tài liệu, kiểm định và chứng nhận chất lượng giáo dục, tư vấn và bồi dưỡng chuyên môn.'
  en: 'A centre researching psychology, education science, sociology and applied linguistics; it provides database development, library and archive services, education quality accreditation, consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực: Tâm lý học nói chung; Tâm lý học chuyên ngành; Khoa học giáo dục nói chung; Phương pháp nghiên cứu xã hội học; Nghiên cứu chung về ngôn ngữ; Ngôn ngữ học ứng dụng. 2. Dịch vụ khoa học và công nghệ: Dịch vụ nghiên cứu xây dựng cơ sở dữ liệu; Dịch vụ nghiên cứu, xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu, lưu trữ điện tử; Dịch vụ thư viện khoa học và công nghệ; Dịch vụ lưu trữ tài liệu khoa học và công nghệ; Dịch vụ kiểm định và tổ chức kiểm định chất lượng giáo dục; Dịch vụ chứng nhận chất lượng giáo dục; Dịch vụ thông tin khoa học và công nghệ, tư vấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp Luật định (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
