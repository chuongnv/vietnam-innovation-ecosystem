id: research-trung-tam-dich-vu-y-te-cong-cong
name:
  vi: Trung tâm Dịch vụ Y tế công cộng Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 121, Lý Chính Thắng, Phường Xuân Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Hội Y tế công cộng TP.HCM, nghiên cứu và ứng dụng trong các mảng y tế công cộng, dinh dưỡng, thực phẩm; đồng thời chuyển giao thành quả nghiên cứu, tư vấn, cung cấp thông tin và tập huấn.'
  en: 'Centre under the Ho Chi Minh City Public Health Association, researching and applying knowledge in public health, nutrition and food; it also transfers research results and provides consulting, information and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực y tế công cộng, dinh dưỡng và thực phẩm. - Chuyển giao công nghệ từ kết quả nghiên cứu theo Luật định. - Dịch vụ KH&CN: Tư vấn, thông tin, huấn luyện bồi dưỡng về y tế công cộng, dinh dưỡng và thực phẩm (không cấp văn bằng, chứng chỉ) - Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
