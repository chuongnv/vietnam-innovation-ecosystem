description:
  vi: 'Viện nghiên cứu ứng dụng trong lĩnh vực khoa học giáo dục; cung cấp tư vấn, thông tin khoa học và huấn luyện, bồi dưỡng nghiệp vụ chuyên môn.'
  en: 'An institute conducting applied research in educational science; it provides consulting, S&T information and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực khoa học giáo dục nói chung. 2- Dịch vụ KH&CN: Tư vấn, thông tin khoa học, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
