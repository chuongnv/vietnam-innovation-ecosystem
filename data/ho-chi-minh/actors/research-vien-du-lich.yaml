id: research-vien-du-lich
name:
  vi: Viện Du Lịch
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 207/3, Hồ Học Lãm, Phường An Lạc, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Học viện Kinh tế – Năng lượng, nghiên cứu về doanh nhân và doanh nghiệp du lịch, khảo sát thị trường cho doanh nghiệp du lịch khởi nghiệp; cung cấp thông tin khoa học, đánh giá tín nhiệm và giám sát đề tài, dự án du lịch.'
  en: 'An institute under the Academy of Economics and Energy researching tourism entrepreneurs and enterprises and conducting market studies for tourism start-ups; it provides S&T information, credit-rating assessments and independent monitoring of tourism projects.'
description_source:
  text: '1. Nghiên cứu khoa học, công nghệ và quản lý theo hướng kết hợp nghiên cứu, triển khai ứng dụng và đào tạo về lĩnh vực doanh nhân, doanh nghiệp du lịch; nghiên cứu thăm dò thị trường cho các doanh nghiệp du lịch khởi nghiệp. Xây dựng luận chứng khoa học cho các chương trình, dự án, kế hoạch, chính sách kinh tế - xã hội phát triển doanh nhân, doanh nghiệp du lịch. 2. Dịch vụ khoa học và công nghệ: thông tin khoa học và công nghệ về du lịch; đánh giá định mức tín nhiệm doanh nhân, doanh nghiệp và khởi nghiệp về du lịch; giám sát độc lập các đề tài/ dự án khoa học và công nghệ về du lịch; Tổ chức chuyển giao các đề tài, dự án, công trình nghiên cứu khoa học và công nghệ về du lịch có tính khả thi vào đời sống sản xuất; Tổ chức đào tạo và bồi dưỡng nhân lực du lịch phục vụ cho công tác nghiên cứu, triển khai ứng dụng khoa học, công nghệ vào sản xuất. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
