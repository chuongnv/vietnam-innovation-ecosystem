id: research-vien-nghien-cuu-dao-tao-cong-nghe-cao-victoria
name:
  vi: Viện Nghiên cứu Đào Tạo Công Nghệ Cao Victoria
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: Phường Long Bình, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Hòa Bình, nghiên cứu đa lĩnh vực gồm công nghệ môi trường, trắc địa – bản đồ, hóa học, kinh tế, công nghệ thông tin, điện – điện tử và giáo dục; kinh doanh sản phẩm nghiên cứu, tổ chức hội thảo và tư vấn chuyển giao công nghệ.'
  en: 'An institute under Hoa Binh University conducting multidisciplinary research in environmental technology, surveying and mapping, chemistry, economics, IT, electrical and electronic engineering and education; it commercialises research products, organises workshops and provides technology-transfer consulting.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ môi trường; Địa vật lý, trắc địa học, bản đồ; Công nghệ hóa học; Kinh tế và kinh doanh; Công nghệ thông tin và truyền thông; Kỹ thuật điện, điện tử; Khoa học giáo dục. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ; Dịch vụ tư vấn chuyển giao công nghệ; Dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu trong lĩnh vực đăng ký; Tập huấn, đào tạo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp với Luật định (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
