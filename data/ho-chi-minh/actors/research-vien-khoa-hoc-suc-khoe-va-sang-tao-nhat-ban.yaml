id: research-vien-khoa-hoc-suc-khoe-va-sang-tao-nhat-ban
name:
  vi: Viện Khoa Học Sức Khỏe Và Sáng Tạo Nhật Bản
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Số 07, Đường 52, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Dịch vụ Quốc tế KAP, nghiên cứu về sản phẩm và vật liệu sinh học, công nghệ sinh học y tế, công nghệ tế bào, gen – protein, vi sinh y học và công nghệ thực phẩm; sản xuất thử, kinh doanh sản phẩm nghiên cứu và cung cấp dịch vụ KH&CN.'
  en: 'An institute under KAP International Services researching bio-based products and materials, medical biotechnology, cell and gene–protein technology, medical microbiology and food technology; it pilots and sells research products and provides S&T services.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Các công nghệ sản phẩm sinh học, vật liệu sinh học, chất dẻo sinh học, nhiên liệu sinh học, các hóa chất được chiết tách từ sinh học, các vật liệu mới có nguồn gốc sinh học; Công nghệ sinh học liên quan đến y học, y tế; Công nghệ tế bào trong y học; Công nghệ gen, protein trong y học; Sinh hóa y học; Vi sinh vật học y học; Kỹ thuật - công nghệ thực phẩm và đồ uống. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu nêu trên. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; huấn luyện, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực
    đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
