id: startup-che-tao-bao-bi-dong-goi-thuc-pham-co-kha-nang-khang-khuan-va
name:
  vi: Chế tạo bao bì đóng gói thực phẩm có khả năng kháng khuẩn và phân hủy sinh học dựa trên tinh bột từ các nguồn phế phẩm nông nghiệp và dịch chiết vỏ măng cụt Việt Nam
type: startup
categories:
- Môi trường
- CN chế biến/ chế tạo
sectors:
- climate
founded: 2025
address: 68 Lý Thường Kiệt, phường Diên Hồng, TP. Hồ Chí Minh.
description:
  vi: 'Dự án nghiên cứu chế tạo bao bì thực phẩm phân hủy sinh học, kháng khuẩn từ tinh bột phế phẩm nông nghiệp (hạt mít, hạt sầu riêng) kết hợp dịch chiết vỏ măng cụt, dùng acid citric để tăng độ bền màng.'
  en: 'A research project developing biodegradable, antibacterial food packaging from starch extracted from agricultural waste (jackfruit and durian seeds) combined with mangosteen peel extract, using citric acid to strengthen the film.'
description_source:
  text: '-- CN chế biến/ chế tạo, Môi trường Mô Hình Kinh Doanh Xanh và Bền Vững 24-05-2025 Việt Nam Hồ Chí Minh, Toàn quốc Ô nhiễm từ rác thải nhựa và tình trạng lãng phí tài nguyên nông nghiệp hiện đang là hai vấn đề môi trường cấp bách tại Việt Nam và trên thế giới. Dự án nghiên cứu này hướng đến việc giải quyết đồng thời cả hai thách thức trên thông qua việc chế tạo một loại bao bì đóng gói thực phẩm mới, thân thiện với môi trường và có khả năng kháng khuẩn. Nguyên liệu chính của bao bì được lựa chọn là tinh bột chiết xuất từ các loại phế phẩm nông nghiệp (như hạt mít, hạt sầu riêng) kết hợp với dịch chiết giàu hoạt tính kháng khuẩn từ vỏ măng cụt (Garcinia mangostana) của Việt Nam. Thành phần dịch chiết vỏ măng cụt chứa hàm lượng cao các hợp chất polyphenol, có khả năng ức chế sự phát triển của vi sinh vật gây hư hỏng thực phẩm, qua đó kéo dài thời gian bảo quản. Đồng thời, vật liệu có khả năng phân hủy sinh học hoàn toàn trong điều kiện tự nhiên, không để lại vi hạt nhựa hay hóa chất
    độc hại, giảm thiểu tác động tiêu cực đến đất và nguồn nước. Việc sử dụng nguyên liệu tự nhiên cũng đảm bảo an toàn khi tiếp xúc trực tiếp với thực phẩm, loại bỏ nguy cơ phát sinh các hợp chất gây hại. Tuy nhiên, các màng nhựa sinh học thường có cơ tính yếu, đặt biệt màng nhựa sinh học có nguồn gốc từ tinh bột thường có tính hút ẩm cao, vì vậy cần thêm các tác nhân khâu mạng để tăng cường cấu trúc mạng lưới liên kết ma trận trong màng. Trong khi đó các loại tác nhân khâu mạng hiện nay thường được sử dụng có giá thành cao và không thân thiện. Vì vậy chúng tôi đã sử dụng acid citric một loại acid hữu cơ an toàn cho con người và có nguồn gốc từ thiên nhiên để tăng cường cấu trúc mạng lưới liên kết trong nền tinh bột qua đó giúp tính chất cơ học của bao bì sinh học được cải thiện. Bao bì được chế tạo có độ bền cơ học vượt trội so với không được liên kết mạng bằng acid citric. Ngoài ra nó cũng thể hiện khả năng kháng khuẩn vượt trội và tính thân thiện với môi trường. Những điều này đã mở
    ra tiềm năng ứng dụng rộng rãi trong ngành công nghiệp thực phẩm bền vững. Dự án được kỳ vọng mang lại những tác động tích cực đối với các nhóm đối tượng liên quan, cụ thể: - Đối với doanh nghiệp sản xuất thực phẩm, việc ứng dụng bao bì kháng khuẩn phân hủy sinh học không chỉ gia tăng giá trị sản phẩm, thể hiện trách nhiệm xã hội, mà còn đáp ứng xu hướng tiêu dùng xanh đang phát triển mạnh mẽ. Khả năng kháng khuẩn của bao bì góp phần giảm đáng kể tỷ lệ hư hỏng thực phẩm, tiết kiệm chi phí và nâng cao uy tín thương hiệu. - Đối với người tiêu dùng, sản phẩm bao bì giúp bảo quản thực phẩm tươi ngon lâu hơn, đảm bảo an toàn sức khỏe, đồng thời khuyến khích hành vi tiêu dùng bền vững. - Đối với nông dân, dự án mở ra kênh tiêu thụ mới cho các loại phế phẩm nông nghiệp, tận dụng tối đa nguồn tài nguyên sẵn có, gia tăng thu nhập và giảm thiểu lãng phí. Mục tiêu cốt lõi của dự án là xây dựng một giải pháp bền vững cho ngành công nghiệp bao bì thực phẩm tại Việt Nam, tập trung vào ba định hướng
    chính: - Giảm thiểu ô nhiễm nhựa thông qua việc thay thế một phần đáng kể lượng bao bì nhựa khó phân hủy bằng vật liệu phân hủy sinh học. - Nâng cao giá trị kinh tế của nông sản Việt Nam bằng cách chuyển hóa phế phẩm nông nghiệp và vỏ măng cụt thành sản phẩm có giá trị gia tăng cao. - Thúc đẩy mô hình kinh tế tuần hoàn thông qua chuỗi sản xuất khép kín, nơi phế phẩm được tái chế thành nguyên liệu đầu vào cho ngành công nghiệp bao bì. Với những định hướng này, dự án không chỉ đóng góp vào mục tiêu phát triển bền vững của quốc gia mà còn tạo nền tảng cho các nghiên cứu và ứng dụng tiếp theo trong lĩnh vực vật liệu xanh.'
