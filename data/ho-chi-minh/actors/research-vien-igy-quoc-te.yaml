id: research-vien-igy-quoc-te
name:
  vi: Viện IGY Quốc tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 793/58, Trần Xuân Soạn, TP. Hồ Chí Minh
description:
  vi: 'Viện tổ chức nghiên cứu khoa học về vi sinh vật, bao gồm vi sinh y học; sản xuất thử và thương mại hóa sản phẩm từ kết quả nghiên cứu, đồng thời làm dịch vụ hội thảo, tư vấn, tập huấn và chuyển giao công nghệ trong chuyên ngành.'
  en: 'Institute researching microbiology, including medical microbiology; it pilots and sells products derived from its research and offers conferences, consulting, training and technology transfer in the field.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: vi sinh vật học, vi sinh vậtt học y học. 2. Sản xuất thử nghiệm, kinh doanh các sản phẩm từ kết quả nghiên cứu trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo, tư vấn, tập huấn, bồi dưỡng chuyên môn, chuyển giao công nghệ theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
