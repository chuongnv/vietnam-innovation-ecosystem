id: research-trung-tam-nghien-cuu-phat-trien-cong-nghe-sinh-hoc-phan-tu-v
name:
  vi: Trung tâm nghiên cứu phát triển công nghệ sinh học phân tử và thiết bị y tế
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Lô I-9-8, đường D2, Khu CNC, P. Long Thạnh Mỹ, TP. Thủ Đức, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ sinh học phân tử trong y học, thiết bị y tế và hóa dược; sản xuất thử từ kết quả nghiên cứu, tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'Centre researching and applying molecular biotechnology for medicine, medical devices and pharmaceutical chemistry; it pilot-produces research outputs and provides consulting, transfer of research results and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ sinh học liên quan đến y học, y tế; công nghệ và kỹ thuật thiết bị y học; hóa dược học. 2. Sản xuất thử - thử nghiệm từ kết quả nghiên cứu khoa học. 3. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
