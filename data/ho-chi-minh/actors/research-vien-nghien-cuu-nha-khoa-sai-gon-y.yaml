id: research-vien-nghien-cuu-nha-khoa-sai-gon-y
name:
  vi: Viện Nghiên cứu Nha Khoa Sài Gòn Y
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: L2-OT-0202, Vinhomes Central Park, Phường Thạnh Mỹ Tây, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu phát triển công nghệ nha khoa như phẫu thuật răng miệng, trồng răng và điều trị răng; sản xuất thử, kinh doanh sản phẩm nghiên cứu, tư vấn, chuyển giao và tập huấn chuyên môn nha khoa.'
  en: 'An institute developing dental technology, including oral surgery, dental implants and dental treatment; it pilots and sells research products and provides consulting, transfer and professional training in dentistry.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Nha khoa (bao gồm: phẫu thuật răng miệng, trồng răng, giá đỡ răng, công nghệ nha khoa, điều trị răng, các vấn đề nha khoa khác). 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao nghiên cứu về Nha khoa; tổ chức hội nghị, hội thảo, tập huấn, bồi dưỡng cho các tổ chức cá nhân theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
