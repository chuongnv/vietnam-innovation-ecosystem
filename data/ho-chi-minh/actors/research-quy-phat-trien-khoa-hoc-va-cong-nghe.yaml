id: research-quy-phat-trien-khoa-hoc-va-cong-nghe
name:
  vi: Quỹ Phát Triển Khoa Học Và Công Nghệ Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 244, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Quỹ trực thuộc Sở Khoa học và Công nghệ TP.HCM, tiếp nhận vốn ngân sách và các nguồn khác để tài trợ, cho vay, bảo lãnh vốn vay cho hoạt động nghiên cứu, đổi mới công nghệ, đổi mới sáng tạo và thương mại hóa kết quả nghiên cứu.'
  en: 'Fund under the HCMC Department of Science and Technology that receives budget and other capital to provide grants, loans and loan guarantees for research, technology upgrading, innovation and commercialisation of research results.'
description_source:
  text: 'Dịch vụ Khoa học và Công nghệ: + Tiếp nhận, quản lý và sử dụng vốn ngân sách và các nguồn vốn khác của các tổ chức, cá nhân trong và ngoài nước. + Thực hiện các hoạt động cấp kinh phí, tài trợ, hỗ trợ, cho vay, bảo lãnh vốn vay nhằm mục đích thúc đẩy hoạt động nghiên cứu, ứng dụng kết quả nghiên cứu khoa học, phát triển công nghệ và đổi mới sáng tạo; nâng cao năng lực khoa học và công nghệ; triển khai ứng dụng kết quả nghiên cứu có triển vọng thành sản phẩm thương mại; chuyển giao công nghệ, đổi mới công nghệ để phục vụ phát triển kinh tế - xã hội của thành phố.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
