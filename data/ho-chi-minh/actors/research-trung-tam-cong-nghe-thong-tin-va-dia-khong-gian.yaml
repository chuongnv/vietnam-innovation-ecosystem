id: research-trung-tam-cong-nghe-thong-tin-va-dia-khong-gian
name:
  vi: Trung tâm Công nghệ Thông tin và Địa không gian Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 244, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Sở Khoa học và Công nghệ TP.HCM, phát triển cơ sở dữ liệu và phần mềm dựa trên GIS, viễn thám, định vị toàn cầu; lưu trữ, tích hợp, chia sẻ thông tin địa lý, tư vấn dịch vụ địa không gian và đào tạo.'
  en: 'Centre under the HCMC Department of Science and Technology developing databases and software based on GIS, remote sensing and GNSS; it stores, integrates and shares geographic information and provides geospatial consulting and training.'
description_source:
  text: '- Nghiên cứu, phát triển công nghệ, xây dựng cơ sở dữ liệu, phần mềm sử dụng hệ thống thông tin địa lý, viễn thám, định vị toàn cầu và các công nghệ liên quan. - Dịch vụ KH&CN: Lưu trữ, tích hợp, chia sẻ, quản lý, bảo dưỡng thông tin địa lý; tư vấn cung cấp các dịch vụ thông tin địa lý; thông tin khoa học và công nghệ; đào tạo bồi dưỡng; chuyển giao công nghệ theo lĩnh vực đăng ký. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
