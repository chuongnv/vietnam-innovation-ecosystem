id: research-trung-tam-nghien-cuu-va-phat-trien-sinh-thai-vuon-nha
name:
  vi: Trung Tâm Nghiên Cứu Và Phát Triển Sinh Thái Vườn - Nhà
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Số 136A, Khu Phố 3, Phường An Phú Đông, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu nông nghiệp sinh thái về giống cây trồng – vật nuôi, vi sinh nông nghiệp, thuốc trừ sâu sinh học, rau hoa quả, cây dược liệu và bảo quản nông sản; kinh doanh sản phẩm nghiên cứu, tổ chức hội thảo, tư vấn và chuyển giao.'
  en: 'An ecological agriculture research centre working on crop and livestock breeding, agricultural microbiology, bio-pesticides, vegetables, flowers, fruit, medicinal plants and post-harvest preservation; it sells research products and runs seminars, consulting and technology transfer.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ hóa hữu cơ; Công nghệ gen, công nghệ nhân giống cây trồng và vật nuôi; Công nghệ vi sinh vật trong nông nghiệp; Công nghệ sản xuất thuốc trừ sâu sinh học; Thổ nhưỡng; Cây lương thực và cây thực phẩm; Cây rau, cây hoa và cây ăn quả; Cây công nghiệp và cây dược liệu; Chọn, tạo giống cây trồng; Công nghệ nhân giống cây trồng; Bảo vệ thực vật; Bảo quản và chế biến nông sản; Quan hệ sản xuất kinh doanh, Kinh doanh và quản trị kinh doanh. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo (như hội thảo chuyên đề, hội thảo khoa học, hội thảo tham vấn, seminars và workshops); Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ về các lĩnh vực đăng ký; Dịch vụ tư vấn chuyển giao công nghệ; tập huấn, bồi dưỡng chuyên môn ngắn
    hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
