id: research-vien-cong-nghe-tai-chinh
name:
  vi: Viện Công Nghệ Tài Chính
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 279, Nguyễn Tri Phương, Phường Diên Hồng, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Kinh tế TP.HCM, nghiên cứu về tài chính và công nghệ tài chính (fintech); tổ chức hội thảo, sự kiện, tư vấn, phát triển dự án và đào tạo, bồi dưỡng chuyên môn.'
  en: 'An institute under the University of Economics Ho Chi Minh City (UEH) researching finance and financial technology (fintech); it organises conferences and events, provides consulting and project development, and runs professional training.'
description_source:
  text: '1. Nghiên cứu và hợp tác nghiên cứu khoa học trong lĩnh vực tài chính và công nghệ tài chính. 2. Dịch vụ khoa học và công nghệ: Tổ chức các hội nghị, hội thảo, các sự kiện, thông tin khoa học công nghệ, chuyển giao công nghệ, tư vấn, phát triển dự án, bồi dưỡng chuyên môn, đào tạo và liên kết đào tạo theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
