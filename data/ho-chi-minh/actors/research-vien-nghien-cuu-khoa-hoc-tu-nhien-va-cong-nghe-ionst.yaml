id: research-vien-nghien-cuu-khoa-hoc-tu-nhien-va-cong-nghe-ionst
name:
  vi: Viện Nghiên cứu Khoa học Tự nhiên và Công nghệ - IONST
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
description:
  vi: 'Viện nghiên cứu khoa học tự nhiên và công nghệ, gồm điện – điện tử, tự động hóa, robot, viễn thông, phần cứng, phần mềm, cơ điện tử, vật liệu tiên tiến, vật lý và hóa học; sản xuất thử sản phẩm và cung cấp dịch vụ môi giới, tư vấn chuyển giao công nghệ.'
  en: 'An institute researching natural sciences and technology, including electrical and electronic engineering, automation, robotics, telecommunications, hardware, software, mechatronics, advanced materials, physics and chemistry; it pilots products and offers technology-transfer brokerage and consulting.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: kỹ thuật điện và điện tử; Người máy và điều khiển tự động; Công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; Các hệ thống thông tin và truyền thông; Kỹ thuật, công nghệ viễn thông; Công nghệ phần cứng và kiến trúc máy tính; Công nghệ phần mềm; Công nghệ cơ điện tử; hệ vi cơ điện tử; Công nghệ vật liệu xây dựng; Công nghệ sản xuất vật liệu tiên tiến. Toán học lý thuyết; Vật lý nguyên tử, vật lý phân tử và vật lý hóa học (lý hóa); Vật lý hạt nhân; Vật lý plasma và chất lỏng; Hóa hữu cơ; Hóa vô cơ và hạt nhân; Hóa lý. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ (hỗ trợ các bên có nhu cầu mua hoặc bán tìm kiếm đối tác để ký kết hợp đồng chuyển
    giao công nghệ); Dịch vụ tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); Dịch vụ tra cứu và chỉ dẫn thông tin khoa học và công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký, Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
