id: research-vien-phat-trien-cong-nghe-va-quan-ly
name:
  vi: Viện Phát triển Công nghệ và Quản lý
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: 61-63, Hồ Hảo Hớn, Phường Cầu Ông Lãnh, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong công nghệ sinh học (xử lý, xúc tác sinh học, lên men), công nghệ phần mềm, kỹ thuật cơ khí và quản trị kinh doanh; cung cấp tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in bioprocessing, biocatalysis and fermentation, software engineering, mechanical engineering and business administration; offers consulting, transfer of research results, scientific information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ xử lý sinh học, xúc tác sinh học, lên men; kỹ thuật cơ khí nói chung; công nghệ phần mềm; kinh doanh và quản trị kinh doanh. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
