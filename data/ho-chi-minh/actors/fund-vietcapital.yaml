founded: 2014
description_source:
  text: Phần mềm, CNTT 15-05-2014 Việt Nam Hồ Chí Minh Với đội ngũ nhân lực bản địa có trình độ đẳng cấp quốc tế, cùng ước vọng nhiệt huyết của tuổi trẻ, Công ty Quản lý Quỹ Bản Việt phấn đấu trở thành một trong những công ty quản lý quỹ hàng đầu tại Việt Nam.
  source: HOIP (tự giới thiệu)
  url: https://hoip.sihub.gov.vn/investor/11
  accessed: '2026-11-22'
description:
  vi: Công ty quản lý quỹ ở TP.HCM (Công ty CP Quản lý Quỹ Bản Việt), quản lý các quỹ đầu tư chứng khoán và danh mục đầu tư, cung cấp dịch vụ tư vấn đầu tư cho nhà đầu tư cá nhân và tổ chức.
  en: Ho Chi Minh City fund management company (Viet Capital Asset Management), managing securities investment funds and portfolios and offering investment advisory services to individual and institutional investors.
