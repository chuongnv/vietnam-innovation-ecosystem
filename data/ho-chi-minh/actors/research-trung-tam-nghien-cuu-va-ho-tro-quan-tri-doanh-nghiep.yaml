- Trung tâm nghiên cứu
address: 268, Lý Thường Kiệt, Phường Diên Hồng, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về quản trị doanh nghiệp, cung cấp dịch vụ tư vấn, thông tin, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn cho doanh nghiệp.'
  en: 'A centre doing applied research in business management, providing consulting, information, transfer of research results and professional training for enterprises.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực quản trị doanh nghiệp. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
