id: research-vien-giao-duc-phat-trien-quoc-te-viet
name:
  vi: Viện giáo dục phát triển Quốc tế Việt
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 28/6, Phạm Huy Thông, Phường An Nhơn, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kinh doanh, quản trị kinh doanh và khoa học giáo dục; cung cấp tư vấn chuyển giao kết quả nghiên cứu cùng các khóa tập huấn, bồi dưỡng nghiệp vụ chuyên môn.'
  en: 'An institute researching business, business management and educational science; it provides consulting on the transfer of research results and runs professional training courses.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: lĩnh vực kinh doanh và quản trị kinh doanh, khoa học giáo dục nói chung. 2. Dịch vụ khoa học và công nghệ: tư vấn chuyển giao kết quả khoa học và công nghệ, tập huấn, đào tạo, bồi dưỡng nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
