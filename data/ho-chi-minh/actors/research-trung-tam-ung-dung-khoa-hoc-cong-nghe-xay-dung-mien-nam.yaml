id: research-trung-tam-ung-dung-khoa-hoc-cong-nghe-xay-dung-mien-nam
name:
  vi: Trung tâm ứng dụng khoa học công nghệ xây dựng Miền Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 63/26, Tạ Quang Bửu, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về vật liệu xây dựng cùng các công trình thủy lợi, giao thông; cung cấp đánh giá, chứng nhận sản phẩm và hệ thống quản lý chất lượng, kiểm định, hiệu chuẩn, thử nghiệm, chuyển giao công nghệ và tập huấn chuyên môn.'
  en: 'Centre researching building materials, transport and irrigation works; it provides assessment and certification of products and quality management systems, inspection, calibration, testing, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: trong lĩnh vực công nghệ vật liệu xây dựng, công trình giao thông vận tải, công trình thủy lợi; 2. Dịch vụ khoa học và công nghệ: đánh giá, chứng nhận hệ thống quản lý chất lượng, sản phẩm, hàng hóa, dịch vụ, tổ chức hội nghị, hội thảo tư vấn, tập huấn, bồi dưỡng chuyên môn, chuyển giao công nghệ, kiểm định, hiệu chuẩn, thử nghiệm môi trường, quy trình công nghệ theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ); 3. Kinh doanh và sản xuất kinh doanh sản phẩm là các kết quả nghiên cứu theo lĩnh vực đăng ký; 4. Chứng nhận hợp quy đối với lĩnh vực sản phẩm, hàng hóa vật liệu xây dựng; 5. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
