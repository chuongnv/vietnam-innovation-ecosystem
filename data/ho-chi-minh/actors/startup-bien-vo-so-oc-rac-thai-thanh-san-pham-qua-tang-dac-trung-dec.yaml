id: startup-bien-vo-so-oc-rac-thai-thanh-san-pham-qua-tang-dac-trung-dec
name:
  vi: biến vỏ sò ốc rác thải thành sản phẩm quà tặng Đặc trưng, Décor Sang trọng
type: startup
categories:
- Môi trường
- Khác
sectors:
- climate
founded: 2019
website: https://davenghethuat.com/
address: 19 Bạch Đằng, Phường Bà Rịa, Thành phố Hồ Chí Minh
description:
  vi: 'Dự án khởi nghiệp thu gom, xử lý vỏ sò, ốc thải bỏ và chế tác thành đồ lưu niệm, quà tặng và vật phẩm trang trí, nhằm giảm rác thải hải sản ra môi trường.'
  en: 'A startup project that collects and processes discarded shells of clams and snails and crafts them into souvenirs, gifts and decorative items, reducing seafood waste in the environment.'
description_source:
  text: 'https://davenghethuat.com/ Môi trường, Khác Mô Hình Kinh Doanh Xanh và Bền Vững 18-12-2019 Việt Nam Toàn quốc Dự án của chúng tôi nhằm biến rác thải vỏ sò, ốc, những phế phẩm thường bị vứt bỏ và gây ô nhiễm môi trường, thành các sản phẩm lưu niệm và décor sang trọng. Quá trình thực hiện dự án được chia thành các bước cụ thể như sau: - Thu Gom và Phân Loại Vỏ Hải Sản - Xử Lý và Vệ Sinh - Chế Tác và Thiết Kế - Hoàn Thiện và Kiểm Tra Chất Lượng - Phân Phối và Tiếp Thị - Đánh Giá và Cải Tiến'
  source: HOIP (tự giới thiệu)
