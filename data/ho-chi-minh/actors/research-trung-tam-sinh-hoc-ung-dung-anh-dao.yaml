id: research-trung-tam-sinh-hoc-ung-dung-anh-dao
name:
  vi: Trung tâm sinh học ứng dụng Anh Đào
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 224, Nguyễn Hữu Thọ, Xã Hiệp Phước, Huyện Nhà Bè, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ gen, nhân giống cây trồng, công nghệ tế bào, enzym – protein và vi sinh phục vụ nông nghiệp; sản xuất thử sản phẩm nghiên cứu và cung cấp tư vấn, chuyển giao, bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research in gene technology, plant propagation, cell, enzyme and protein technology and agricultural microbiology; it pilots research products and provides consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ gen; công nghệ nhân giống cây trồng; công nghệ tế bào; công nghệ enzym và protein; công nghệ vi sinh vật phục vụ nông nghiệp. 2. Sản xuất thử nghiệm các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
