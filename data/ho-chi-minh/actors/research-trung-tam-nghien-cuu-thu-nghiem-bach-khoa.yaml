- Trung tâm nghiên cứu
address: 19A, Thạnh Xuân 39, Phường Thới An, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Bách khoa TP.HCM, nghiên cứu kỹ thuật xây dựng và địa kỹ thuật; thử nghiệm chất lượng vật liệu, sản phẩm xây dựng, tư vấn và bồi dưỡng chuyên môn.'
  en: 'Centre of Ho Chi Minh City University of Technology researching construction engineering and geotechnics; it tests construction materials and products and provides consulting and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: kỹ thuật xây dựng; địa kỹ thuật. - Dịch vụ KH&CN: Thử nghiệm chất lượng sản phẩm hàng hóa trong lĩnh vực xây dựng, tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
