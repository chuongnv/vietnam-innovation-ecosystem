id: research-vien-nghien-cuu-cong-nghe-sinh-hoc-va-moi-truong
name:
  vi: Viện Nghiên cứu Công nghệ Sinh học và Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: KP 6, Phường Linh Xuân, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Nông Lâm TP.HCM, nghiên cứu công nghệ sinh học và môi trường cho nông, lâm, ngư nghiệp, thực phẩm, độc chất học và dược liệu; sản xuất thử, chuyển giao công nghệ và cung cấp phân tích thí nghiệm.'
  en: 'An institute under Nong Lam University – Ho Chi Minh City researching biotechnology and environmental technology for agriculture, forestry, fisheries, food, toxicology and medicinal plants; it pilots and transfers technology and provides laboratory analysis.'
description_source:
  text: '- Nghiên cứu khoa học về công nghệ sinh học và công nghệ môi trường trong các lĩnh vực: nông nghiệp, lâm nghiệp, ngư nghiệp, nông sản thực phẩm, tài nguyên, độc chất học, trồng trọt và khai thác dược liệu. - Sản xuất thử - thử nghiệm; chuyển giao công nghệ; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. - Dịch vụ KH&CN: Phân tích thí nghiệm; tư vấn; chuyển giao công nghệ; thông tin khoa học và công nghệ; huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
