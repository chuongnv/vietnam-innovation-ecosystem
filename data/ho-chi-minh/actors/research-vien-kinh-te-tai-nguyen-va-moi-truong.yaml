id: research-vien-kinh-te-tai-nguyen-va-moi-truong
name:
  vi: Viện kinh tế tài nguyên và môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 224, Điện Biên Phủ, Phường An Lạc, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về kinh tế tài nguyên và môi trường; cung cấp các dịch vụ khoa học – công nghệ như tư vấn, chuyển giao kết quả, phổ biến thông tin và tập huấn chuyên môn.'
  en: 'Institute doing applied research in natural resource and environmental economics; provides S&T services such as consulting, transfer of research results, information dissemination and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh tế tài nguyên và môi trường. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
