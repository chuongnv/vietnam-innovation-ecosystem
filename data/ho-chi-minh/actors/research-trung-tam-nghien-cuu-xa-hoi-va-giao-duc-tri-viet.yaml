  text: '- Nghiên cứu khoa học trong lĩnh vực: xã hội học chuyên đề; khoa học giáo dục nói chung. - Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
