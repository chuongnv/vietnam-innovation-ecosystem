id: research-vien-nghien-cuu-kinh-doanh
name:
  vi: Viện Nghiên cứu kinh doanh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 59C, Nguyễn Đình Chiểu, Phường Xuân Hòa, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Kinh tế TP.HCM, nghiên cứu về kinh tế, kinh doanh và quản lý; tư vấn, đề xuất giải pháp phát triển doanh nghiệp, tổ chức hội nghị, hội thảo và các khóa bồi dưỡng chuyên môn.'
  en: 'Institute under the University of Economics Ho Chi Minh City, researching economics, business and management; it advises on business development, organises conferences and seminars and runs professional training courses.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai công nghệ trong lĩnh vực kinh tế, kinh doanh và quản lý. 2. Dịch vụ khoa học và công nghệ: tư vấn, kiến nghị phát triển kinh doanh và doanh nghiệp; đào tạo, bồi dưỡng chuyên môn về kinh doanh, kinh tế và quản lý; tổ chức hội nghị, hội thảo theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ) 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
