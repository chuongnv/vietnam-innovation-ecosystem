id: research-trung-tam-nghien-cuu-va-ung-dung-ngoc-hoc-liu
name:
  vi: Trung tâm nghiên cứu và ứng dụng ngọc học LIU
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 572B/5, Trần Hưng Đạo, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ngọc học, cung cấp dịch vụ kiểm tra, phân tích, giám định chất lượng đá quý, đào tạo chuyên môn và chuyển giao công nghệ trong lĩnh vực này.'
  en: 'A gemmology research centre providing gemstone testing, analysis and quality certification, professional training and technology transfer in this field.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: trong lĩnh vực ngọc học. 2. Dịch vụ khoa học và công nghệ: kiểm tra, phân tích, giám định, đánh giá chất lượng đá quý; đào tạo, bồi dưỡng chuyên môn, chuyển giao công nghệ theo lĩnh vực đăng ký phù hợp luật định. 3. Kinh doanh và sản xuất kinh doanh sản phẩm là các kết quả nghiên cứu theo lĩnh vực đăng ký phù hợp luật định. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
