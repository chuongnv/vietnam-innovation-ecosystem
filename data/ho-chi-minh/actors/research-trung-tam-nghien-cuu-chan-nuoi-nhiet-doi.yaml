id: research-trung-tam-nghien-cuu-chan-nuoi-nhiet-doi
name:
  vi: Trung Tâm Nghiên Cứu Chăn Nuôi Nhiệt Đới
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 224/9 Phan Văn Hân, Phường Gia Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu sinh lý, hóa sinh, chọn tạo giống, thức ăn, dinh dưỡng và chăm sóc vật nuôi; sản xuất thử sản phẩm từ kết quả nghiên cứu, tổ chức hội thảo, tư vấn và chuyển giao công nghệ chăn nuôi.'
  en: 'Centre researching livestock physiology, biochemistry, breeding, feed, nutrition and husbandry; it pilot-produces research-based products, holds seminars and provides consulting and livestock technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Sinh lý và hóa sinh động vật nuôi; Chọn lọc, lai tạo, nhân giống động vật nuôi; Thức ăn và dinh dưỡng cho động vật nuôi; chăm sóc, nuôi dưỡng và bảo vệ động vật nuôi. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học Công nghệ: Tổ chức hội nghị, hội thảo; Thông tin khoa học và công nghệ; Tư vấn chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
