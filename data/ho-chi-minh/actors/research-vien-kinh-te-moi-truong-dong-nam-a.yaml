id: research-vien-kinh-te-moi-truong-dong-nam-a
name:
  vi: Viện Kinh Tế Môi Trường Đông Nam Á
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1A, Hoàng Diệu, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Kinh tế TP.HCM, nghiên cứu kinh tế phục vụ quản lý tài nguyên và môi trường cùng quản trị kinh doanh; tư vấn chính sách, phát triển doanh nghiệp, tổ chức hội thảo, đào tạo và hỗ trợ đào tạo sau đại học của trường.'
  en: 'An institute under the University of Economics Ho Chi Minh City (UEH) researching economics for natural resource and environmental management as well as business management; it provides policy and business-development advice, workshops and training, and supports the university''s postgraduate programmes.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: kinh tế phục vụ cho lĩnh vực tài nguyên và môi trường; kinh doanh và quản trị kinh doanh; quan hệ sản xuất kinh doanh. 2. Dịch vụ khoa học và công nghệ: tư vấn, kiến nghị phát triển kinh doanh và doanh nghiệp; tổ chức hội nghị, hội thảo, đào tạo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ); thực hiện các vấn đề chính sách; hỗ trợ các hoạt động đào tạo sau đại học của Trường Đại học Kinh tế TP.HCM. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
