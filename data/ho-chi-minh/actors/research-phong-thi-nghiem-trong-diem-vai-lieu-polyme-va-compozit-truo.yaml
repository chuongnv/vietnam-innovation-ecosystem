id: research-phong-thi-nghiem-trong-diem-vai-lieu-polyme-va-compozit-truo
name:
  vi: Phòng thí nghiệm trọng điểm vậi liệu polyme và compozit - Trường Đại học Bách khoa Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 268, Lý Thường Kiệt, Phường Diên Hồng, Thành phố Hồ Chí Minh
description:
  vi: 'Phòng thí nghiệm trọng điểm trực thuộc Trường Đại học Bách khoa TP.HCM, nghiên cứu và ứng dụng công nghệ vật liệu polyme, compozit; sản xuất thử, chuyển giao công nghệ, kiểm nghiệm, tư vấn và đào tạo nhân lực.'
  en: 'Key laboratory of Ho Chi Minh City University of Technology researching and applying polymer and composite materials technology; it carries out pilot production, technology transfer, testing, consulting and workforce training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực công nghệ vật liệu polyme và compozit phục vụ cho các ngành kinh tế - kỹ thuật. - Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, thẩm định, kiểm nghiệm, cung cấp thông tin khoa học và công nghệ, đào tạo bồi dưỡng nguồn nhân lực chất lượng cao theo lĩnh vực đăng ký. - Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
