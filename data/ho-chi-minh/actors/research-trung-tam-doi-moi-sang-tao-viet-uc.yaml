id: research-trung-tam-doi-moi-sang-tao-viet-uc
name:
  vi: Trung Tâm Đổi Mới Sáng Tạo Việt Úc
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Phường Trung Mỹ Tây, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Cao đẳng Viễn Đông, nghiên cứu CNTT, điện - điện tử, chuyển đổi số và một số lĩnh vực kinh tế, kỹ thuật; cung cấp dịch vụ môi giới, đánh giá, xúc tiến chuyển giao công nghệ và hỗ trợ khởi nghiệp, đổi mới sáng tạo.'
  en: 'Centre under Vien Dong College researching IT, electrical and electronic engineering, digital transformation and several economic and technical fields; it provides technology brokerage, assessment and transfer promotion, and supports startups and innovation.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ thông tin; Điện - Điện tử; Truyền thông; Nghiên cứu ứng dụng công nghệ phục vụ chuyển đổi số cho tổ chức, cá nhân có nhu cầu; Xây dựng; Tài chính ngân hàng; Kinh doanh và Quản trị kinh doanh; Logicstic; Môi trường; Chế biến nông sản. 2. Sản xuất thử nghiệm - kinh doanh các sản phẩm là kết quả của các nghiên cứu khoa học trên; Triển khai ứng dụng các kết quả nghiên cứu cho các cá nhân, tổ chức có nhu cầu; 3. Dịch vụ KH&CN: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ, Dịch vụ đánh giá công nghệ, Dịch vụ xúc tiến chuyển giao công nghệ thông qua các hoạt động kết nối giữa các tổ chức đào tạo, nghiên cứu, chính phủ và các doanh nghiệp trong và ngoài nước có liên quan; Thúc đẩy hoạt động nghiên cứu ứng dụng, đổi mới sáng tạo và khởi nghiệp bằng các hoạt động: xây dựng hệ sinh thái khởi nghiệp hoàn chỉnh, tạo môi trường thuận
    lợi nhất có thể cho doanh nghiệp khởi nghiệp, cung cấp cơ sở hổ trợ khởi nghiệp sáng tạo, nghiên cứu phát triển công nghệ, bao gồm phòng thí nghiệm, xưởng sản xuất thử, thiết bị mô phỏng; Tập hợp, kết nối các cơ sở nghiên cứu và ứng dụng đổi mới sáng tạo, các trường đại học, viện nghiên cứu ngoài nước; Đào tạo, tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên. (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
