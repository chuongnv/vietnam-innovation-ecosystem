id: research-vien-phap-ly-ngon-ngu-va-tai-chinh-chau-a
name:
  vi: Viện pháp lý - ngôn ngữ và tài chính Châu Á
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 17, Trần Khánh Dư, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về quan hệ sản xuất kinh doanh, quản trị kinh doanh, ngôn ngữ học và ngôn ngữ học ứng dụng; cung cấp tư vấn sở hữu trí tuệ, môi giới và tư vấn chuyển giao công nghệ, tổ chức hội thảo và bồi dưỡng chuyên môn.'
  en: 'An institute researching business relations, business administration, linguistics and applied linguistics; it provides intellectual property consulting, technology transfer brokerage and consulting, conferences and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: quan hệ sản xuất kinh doanh; kinh doanh và quản trị kinh doanh; nghiên cứu chung về ngôn ngữ; ngôn ngữ học ứng dụng. 2. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo, tư vấn, bồi dưỡng chuyên môn, chuyển giao công nghệ theo lĩnh vực đăng ký; dịch vụ tư vấn về sở hữu trí tuệ (không bao gồm tư vấn liên quan đến thủ tục xác lập và bảo vệ/thực thi quyền sở hữu trí tuệ); dịch vụ môi giới chuyển giao công nghệ (hỗ trợ các bên có nhu cầu mua hoặc bán tìm kiếm đối tác để ký kết hợp đồng chuyển giao công nghệ); dịch vụ tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); dịch vụ xúc tiến chuyển giao công nghệ (tạo, tìm kiếm cơ hội và thúc đẩy chuyển giao công nghệ; quảng cáo, giới thiệu, trưng bày công nghệ; tổ chức chợ, hội chợ, triển lãm công nghệ và trung tâm giao dịch công nghệ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp
    Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
