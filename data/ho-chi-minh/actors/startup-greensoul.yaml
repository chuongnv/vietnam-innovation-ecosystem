description:
  vi: 'Dự án Ecoplant cung cấp bộ kit trồng cây tại nhà gồm giá thể, hạt giống, chậu và hướng dẫn, phù hợp không gian nhỏ, làm quà tặng hoặc hoạt động trải nghiệm, truyền thông môi trường.'
  en: 'The Ecoplant project offers home planting kits with growing medium, seeds, pot and instructions, suited to small spaces and for use as gifts, hands-on activities or environmental outreach.'
description_source:
  text: https://ecoplant-project.netlify.app/ Môi trường Mô Hình Khác 20-12-2023 Việt Nam Hồ Chí Minh Ecoplant – Bộ kit trồng cây xanh tại nhà 🌱 Là bộ sản phẩm trọn gói gồm giá thể, hạt giống, chậu và hướng dẫn trồng, giúp người dùng dễ dàng bắt đầu trồng cây dù ở không gian nhỏ. Bộ kit hướng đến lối sống xanh – bền vững, khuyến khích mọi người tự tay gieo trồng và kết nối với thiên nhiên. Sản phẩm phù hợp làm quà tặng, hoạt động trải nghiệm hoặc truyền thông môi trường.
