id: research-trung-tam-thuc-hanh-dich-vu-va-dao-tao-chuyen-giao-cong-nghe
name:
  vi: Trung tâm Thực hành, Dịch vụ và Đào tạo, Chuyển giao công nghệ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 98, Ngô Tất Tố, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng trong công nghệ thông tin, xây dựng và điện tử – viễn thông; sản xuất thử từ kết quả nghiên cứu, thực hành, tư vấn, chuyển giao công nghệ và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research in IT, construction and electronics and telecommunications; it pilots research outputs and provides practical training, consulting, technology transfer and professional courses.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ thông tin, xây dựng, điện tử - viễn thông. 2- Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
