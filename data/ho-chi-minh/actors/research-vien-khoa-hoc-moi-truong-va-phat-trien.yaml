id: research-vien-khoa-hoc-moi-truong-va-phat-trien
name:
  vi: Viện Khoa học Môi trường và Phát triển
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 179, Bạch Đằng, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về quan trắc và xử lý ô nhiễm, quản lý chất thải, khía cạnh xã hội của môi trường và quy hoạch đô thị, nông thôn; cung cấp tư vấn, chuyển giao công nghệ và đào tạo, bồi dưỡng.'
  en: 'An institute conducting applied research on pollution monitoring and treatment, waste management, social aspects of the environment and urban and rural planning; it provides consulting, technology transfer and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); khoa học môi trường- các khía cạnh xã hội; nghiên cứu quy hoạch, phát triển đô thị và nông thôn. - Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, đào tạo bồi dưỡng theo lĩnh vực đăng ký. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
