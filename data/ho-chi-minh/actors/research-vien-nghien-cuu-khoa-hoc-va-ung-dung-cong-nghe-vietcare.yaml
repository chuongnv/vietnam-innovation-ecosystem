id: research-vien-nghien-cuu-khoa-hoc-va-ung-dung-cong-nghe-vietcare
name:
  vi: Viện Nghiên cứu Khoa Học Và Ứng Dụng Công Nghệ Vietcare
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 38B, Đường 81, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty TNHH Công nghệ Thương mại và Dịch vụ ATG, nghiên cứu về di truyền, tế bào học, công nghệ gen và tế bào trong nông nghiệp, y học và xử lý môi trường bằng phương pháp sinh học; sản xuất thử, kinh doanh sản phẩm nghiên cứu và tổ chức hội thảo.'
  en: 'An institute under ATG Technology Trading and Services Co., Ltd. researching genetics, cytology, gene and cell technology in agriculture and medicine, and biological environmental treatment; it pilots and sells research products and organises workshops.'
description_source:
  text: '''- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Di truyền học (1.7.8); Tế bào học, mô – phôi học (1.7.9); Công nghệ xử lý môi trường bằng phương pháp sinh học (4.7.6); Công nghệ gen, công nghệ nhân giống cây trồng và vật nuôi (4.8.1); Công nghệ tế bào trong nông nghiệp (4.8.2); Công nghệ tế bào trong y học (4.8.9); Công nghệ gen, protein trong y học (4.8.10). - Sản xuất thử - thử nghiệm; sản xuất - kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. - Dịch vụ KH&CN: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Phân tích giải trình tự gen di truyền trên các đối tượng người, động vật, thực vật và vi sinh vật, Dịch vụ môi giới, tư vấn chuyển giao công nghệ; Tư vấn, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên. (Chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm
    quyền); - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
