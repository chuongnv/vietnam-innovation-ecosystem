id: research-vien-cong-nghe-cao-hutech
name:
  vi: Viện Công nghệ cao Hutech
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 475, Điện Biên Phủ, Phường Gia Định, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Công nghệ TP.HCM (HUTECH), nghiên cứu và ứng dụng công nghệ cao trong công nghệ thông tin, công nghệ sinh học và tự động hóa; sản xuất thử sản phẩm nghiên cứu, tư vấn và chuyển giao kết quả.'
  en: 'An institute under Ho Chi Minh City University of Technology (HUTECH) researching and applying high technology in IT, biotechnology and automation, piloting research products, and providing consulting and transfer of results.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng công nghệ cao trong các lĩnh vực: công nghệ thông tin, công nghệ sinh học, công nghệ tự động hóa. 2. Sản xuất thử - thử nghiệm các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
