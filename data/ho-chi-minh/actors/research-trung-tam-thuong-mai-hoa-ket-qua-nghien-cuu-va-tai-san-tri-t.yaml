id: research-trung-tam-thuong-mai-hoa-ket-qua-nghien-cuu-va-tai-san-tri-t
name:
  vi: Trung Tâm Thương Mại Hóa Kết Quả Nghiên Cứu Và Tài Sản Trí Tuệ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 360C, Bến Vân Đồn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về kinh tế, thương mại, sở hữu trí tuệ và mô hình quản trị doanh nghiệp; hỗ trợ thương mại hóa kết quả nghiên cứu thông qua xúc tiến thương mại, đánh giá, môi giới, chuyển giao công nghệ và đại diện, tư vấn sở hữu trí tuệ.'
  en: 'A centre researching economics, trade, intellectual property and business governance models; it supports commercialisation of research results through trade promotion, technology assessment, brokerage and transfer, and IP representation and consulting.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Kinh tế, Thương mai; Sở hữu trí tuệ; Nghiên cứu xây dựng chiến lược, chính sách, pháp luật, các giải pháp hình thức tổ chức quản trị quy hoạch, mạng lưới, liên kết các nguồn lực của doanh nghiệp; nghiên cứu xây dựng mô hình bền vững cho doanh nghiệp. 2. Kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Hỗ trợ xúc tiến thương mại, hội nghị, hội thảo đầu tư trong nước và quốc tế; Chuyển giao công nghệ sản xuất,; Dịch vụ xúc tiến chuyển giao công nghệ; Dịch vụ đánh giá công nghệ; Dịch vụ môi giới chuyển giao công nghệ; Dịch vụ tư vấn chuyển giao công nghệ; Dịch vụ đại diện sở hữu trí tuệ; Dịch vụ tư vấn về sở hữu trí tuệ; Tập huấn bồi dưỡng chuyên môn cho các tổ chức, cá nhân, doanh nghiệp có nhu cầu theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong
    và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định. (Đối với những lĩnh vực hoạt động có điều kiện theo quy định của pháp luật trước khi thực hiện phải được phép của cơ quan Nhà nước có thẩm quyền)'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
