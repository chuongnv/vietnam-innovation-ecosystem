- Viện nghiên cứu
address: 123B, Phan Văn Khỏe, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và ứng dụng về quy hoạch phát triển đô thị và nông thôn, khía cạnh xã hội của môi trường và quản trị kinh doanh; cung cấp dịch vụ tư vấn, thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'An institute researching urban and rural planning and development, the social aspects of environmental science and business management, and providing consulting, scientific information and professional training.'
description_source:
  text: '1 Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: quy hoạch, phát triển đô thị và nông thôn; khoa học môi trường - các khía cạnh xã hội; kinh doanh và quản trị kinh doanh. 2- Dịch vụ KH&CN: tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
