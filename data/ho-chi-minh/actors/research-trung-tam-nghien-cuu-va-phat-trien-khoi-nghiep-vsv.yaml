id: research-trung-tam-nghien-cuu-va-phat-trien-khoi-nghiep-vsv
name:
  vi: Trung Tâm Nghiên Cứu Và Phát Triển Khởi Nghiệp Vsv
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 72, Lê Thánh Tôn, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về kinh doanh và quản trị trong khởi nghiệp, đổi mới sáng tạo; tổ chức hội thảo, phổ biến kiến thức, tư vấn chuyển giao công nghệ, đầu tư vào doanh nghiệp khởi nghiệp và tập huấn chuyên môn.'
  en: 'A centre researching business and management for startups and innovation; it runs seminars, disseminates knowledge, advises on technology transfer, invests in innovative startups and provides training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: Quan hệ sản xuất kinh doanh; Kinh doanh và quản trị kinh doanh trong khởi nghiệp và đổi mới sáng tạo. 2. Dịch vụ khoa học và công nghệ: Thông tin phổ biến kiến thức khoa học và công nghệ; tổ chức hội nghị, hội thảo khoa học; Tư vấn chuyển giao công nghệ; Đầu tư doanh nghiệp khởi nghiệp đổi mới sáng tạo; Tập huấn, bồi dưỡng trình độ chuyên môn và thực hiện các dịch vụ khoa học và công nghệ khác theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
