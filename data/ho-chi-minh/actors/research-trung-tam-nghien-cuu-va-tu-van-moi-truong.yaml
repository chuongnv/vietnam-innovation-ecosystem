id: research-trung-tam-nghien-cuu-va-tu-van-moi-truong
name:
  vi: Trung tâm Nghiên cứu và Tư vấn Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 98, Bành Văn Trân, Phường Bảy Hiền, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ quản lý, xử lý chất thải và quan trắc, kiểm soát ô nhiễm; đồng thời nhận phân tích mẫu, tư vấn, chuyển giao thành quả nghiên cứu và tập huấn chuyên môn.'
  en: 'Centre doing applied research on waste management and treatment and on pollution monitoring and control; it also offers laboratory analysis, consulting, transfer of research results and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. 2- Dịch vụ KH&CN: phân tích thí nghiệm, tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
