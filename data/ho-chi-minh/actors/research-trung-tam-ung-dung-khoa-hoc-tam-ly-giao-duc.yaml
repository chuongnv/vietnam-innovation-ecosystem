address: 87/117/42, Nguyễn Sỹ Sách, Phường Tân Sơn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng tâm lý học và giáo dục học, cung cấp dịch vụ tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research in psychology and pedagogy, providing consulting, transfer of research results and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: tâm lý học, giáo dục học. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng , chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
