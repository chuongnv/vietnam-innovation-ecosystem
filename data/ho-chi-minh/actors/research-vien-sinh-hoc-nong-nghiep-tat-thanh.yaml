id: research-vien-sinh-hoc-nong-nghiep-tat-thanh
name:
  vi: Viện Sinh học Nông nghiệp Tất Thành
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 298-300A, Nguyễn Tất Thành, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong sinh học, công nghệ sinh học, nông nghiệp và công nghệ thực phẩm; sản xuất thử, kinh doanh sản phẩm từ kết quả nghiên cứu và cung cấp tư vấn, chuyển giao công nghệ, huấn luyện chuyên môn.'
  en: 'Institute doing applied research in biology, biotechnology, agriculture and food technology; it pilots and sells research-based products and offers consulting, technology transfer and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: sinh học, công nghệ sinh học, công nghệ thực phẩm, nông nghiệp. - Sản xuất thử - thử nghiệm, sản xuất - kinh doanh các sản phẩm là kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
