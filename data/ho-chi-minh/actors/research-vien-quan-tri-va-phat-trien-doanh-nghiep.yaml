description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh; cung cấp dịch vụ tư vấn, phổ biến thông tin khoa học – công nghệ và đào tạo nâng cao nghiệp vụ chuyên môn.'
  en: 'Institute doing applied research in business administration; offers consulting, science and technology information and professional upskilling.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. 2- Dịch vụ Kh&CN: Tư vấn, thông tin khoa học và công nghệ, đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký(chỉ được cấp Giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
