id: research-trung-tam-tu-van-va-kiem-dinh-xay-dung
name:
  vi: Trung tâm Tư vấn và Kiểm định Xây dựng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 19, Nguyễn Hữu Thọ, Phường Tân Hưng, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về vật liệu xây dựng; nhận khảo sát (địa chất, địa hình, thủy văn), tư vấn thiết kế và giám sát, lập, thẩm tra dự án, kiểm định vật liệu và kiểm tra chất lượng công trình.'
  en: 'Centre doing applied research on building materials; it offers design consulting, supervision, topographic, geological and hydrological surveys, project preparation and review, materials testing and construction quality inspection.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực vật liệu xây dựng. - Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn thiết kế, giám sát, khảo sát địa hình, địa chất, thủy văn, lập và thẩm tra dự án, thiết kế, xây dựng và quản lý các dự án, kiểm định các loại vật liệu, kiểm tra chất lượng công trình xây dựng, tư vấn đấu thầu, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
