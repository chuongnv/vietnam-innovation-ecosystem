id: research-trung-tam-ky-thuat-cong-nghe-tai-nguyen-nuoc
name:
  vi: Trung tâm Kỹ thuật Công nghệ Tài nguyên Nước
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1, 091, Trần Hưng Đạo, Phường An Đông, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Bách khoa TP.HCM, nghiên cứu thủy lợi, môi trường và các mảng địa chất (thủy văn, công trình); nhận lập, thiết kế, thẩm định dự án, đánh giá tác động môi trường và thi công lắp đặt công trình quy mô vừa và nhỏ.'
  en: 'Centre under Ho Chi Minh City University of Technology, researching irrigation, hydrogeology, engineering geology and environment; it prepares, designs and appraises projects, carries out environmental impact assessments and installs small and medium works.'
description_source:
  text: '- Nghiên cứu khoa học về lĩnh vực thủy lợi, địa chất thủy văn, địa chất công trình và môi trường. - Sản xuất thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: + Tư vấn lập dự án khả thi, tư vấn thiết kế thẩm định phản biện các dự án thủy lợi, địa chất và môi trường, đánh giá tác động môi trường, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn. + Xây dựng lắp đặt thiết bị các công trình thủy lợi, địa chất môi trường loại vừa và nhỏ theo quy định Nhà nước. - Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
