id: research-trung-tam-ho-tro-va-tu-van-chuyen-doi-so
name:
  vi: Trung Tâm Hỗ Trợ Và Tư Vấn Chuyển Đổi Số Thành Phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 101, Nguyễn Công Trứ, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Công ty Phát triển Công viên Phần mềm Quang Trung, nghiên cứu tự động hóa, hệ thống thông tin và phần mềm; tư vấn chuyển đổi số, môi giới, xúc tiến chuyển giao công nghệ, tổ chức chợ công nghệ và cung cấp không gian làm việc chung cho khởi nghiệp.'
  en: 'Centre under Quang Trung Software City Development Co. researching automation, information systems and software; it advises on digital transformation, brokers and promotes technology transfer, runs technology fairs and offers co-working space for startups.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; Các hệ thống thông tin và truyền thông; Công nghệ phần mềm. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu nêu trên. 3. Dịch vụ khoa học và công nghệ: Dịch vụ triển lãm khoa học và công nghệ; tổ chức chợ công nghệ và thiết bị; Dịch vụ môi giới chuyển giao công nghệ (hỗ trợ các bên có nhu cầu mua hoặc bán tìm kiếm đối tác để ký kết hợp đồng chuyển giao công nghệ); Dịch vụ tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); Dịch vụ xúc tiến chuyển giao công nghệ (tạo, tìm kiếm cơ hội và thúc đẩy chuyển giao công nghệ; quảng cáo, giới thiệu, trưng bày công nghệ; tổ chức chợ, hội chợ, triển lãm công nghệ và trung tâm giao dịch công nghệ); Cung cấp khu làm việc chung hỗ trợ doanh nghiệp nhỏ và vừa khởi nghiệp sáng
    tạo. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
