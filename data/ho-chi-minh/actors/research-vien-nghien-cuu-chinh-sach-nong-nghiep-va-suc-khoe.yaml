address: 279, Nguyễn Tri Phương, Phường Vườn Lài, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Kinh tế TP.HCM, nghiên cứu chính sách nông nghiệp và kinh tế học sức khỏe; tổ chức hội nghị, hội thảo và cung cấp thông tin, tư vấn, chuyển giao công nghệ cùng bồi dưỡng chuyên môn.'
  en: 'Institute under the University of Economics Ho Chi Minh City, researching agricultural policy and health economics; it organises conferences and seminars and provides information, consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực kinh tế học sức khỏe và chính sách nông nghiệp. 2. Dịch vụ khoa học và công nghệ: tổ chức các hội nghị, hội thảo, thông tin khoa học công nghệ, chuyển giao công nghệ, tư vấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
