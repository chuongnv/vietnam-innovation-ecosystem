id: research-trung-tam-nghien-cuu-tam-ly-xa-hoi-va-phat-trien
name:
  vi: Trung tâm nghiên cứu tâm lý xã hội và phát triển
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 248/13, Bùi Thị Xuân, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu các chuyên ngành tâm lý học; bên cạnh đó nhận tư vấn, chuyển giao thành quả, cung cấp thông tin khoa học và tập huấn chuyên môn về tâm lý.'
  en: 'Centre researching specialised fields of psychology; it also offers consulting, transfer of results, scientific information and professional training in psychology.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực tâm lý học chuyên ngành. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
