id: research-trung-tam-cong-nghe-nang-luong-toan-cau
name:
  vi: Trung tâm công nghệ năng lượng Toàn Cầu
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 58/17, Trần Văn Dư, Phường Tân Bình, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ năng lượng và các loại nhiên liệu ngoài dầu khí; bên cạnh đó nhận tư vấn, chuyển giao công nghệ, phổ biến thông tin và tập huấn chuyên môn cho lĩnh vực này.'
  en: 'Centre researching and applying energy technologies and non-petroleum fuels; it also provides consulting, technology transfer, information and professional training in this field.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực công nghệ năng lượng và nhiên liệu không phải dầu khí. 2- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
