description:
  vi: 'Viện nghiên cứu về tâm lý học và giáo dục học; cung cấp dịch vụ tư vấn, giáo dục pháp luật, phổ biến thông tin khoa học và nâng cao nghiệp vụ cho người làm chuyên môn.'
  en: 'Institute researching psychology and pedagogy; offers consulting, scientific information, legal education and professional upskilling.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực tâm lý học, giáo dục học. 2. Dịch vụ KH&CN: Tư vấn, thông tin khoa học, giáo dục pháp luật, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
