id: research-trung-tam-nghien-cuu-danh-gia-chat-luong-da-quy-kim-cuong-a
name:
  vi: Trung Tâm Nghiên Cứu Đánh Giá Chất Lượng Đá Quý Kim Cương Á Châu
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 35, Nhiêm Tâm, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu địa chất, khoáng sản, thạch học và vật liệu trang sức, đá quý; cung cấp dịch vụ thử nghiệm, giám định chất lượng đá quý, kim cương, vàng bạc, tổ chức hội thảo và đào tạo ngắn hạn.'
  en: 'Centre researching geology, minerals, petrology and gem and jewellery materials; it provides testing and quality assessment of gemstones, diamonds and precious metals, holds seminars and runs short courses.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: địa chất học, địa kỹ thuật, thạch học, địa chất khoáng sản, kỹ thuật vật liệu tiên tiến khác (trang sức, vàng bạc đá quý và mẫu vật địa chất). 2. Kinh doanh và sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu 3. Dịch vụ khoa học công nghệ: Dịch vụ thử nghiệm chất lượng hàng hóa sản phẩm, hàng hóa; Dịch vụ kiểm định, giám định số lượng, chất lượng sản phẩm, hàng hóa; Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; huấn luyện, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
