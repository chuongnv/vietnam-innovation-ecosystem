id: research-vien-nghien-cuu-sinh-trac-van-tay
name:
  vi: Viện Nghiên cứu Sinh Trắc Vân Tay
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 34, Lê Duẩn, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu trong lĩnh vực tâm lý học, khoa học giáo dục, giáo dục chuyên biệt và nhân chủng học, cung cấp dịch vụ lấy mẫu vân tay, xây dựng cơ sở dữ liệu, tổ chức hội thảo và đào tạo theo lĩnh vực đăng ký.'
  en: 'An institute researching psychology, educational science, special education and anthropology, offering fingerprint sampling services, database development, scientific events and training in its registered fields.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Tâm lý học nói chung (bao gồm cả quan hệ người - máy); Tâm lý học chuyên ngành; Khoa học giáo dục nói chung (bao gồm cả sư phạm học, lý luận giáo dục); Giáo dục chuyên biệt cho người khuyết tật; Nhân chủng học. 2. Thử nghiệm, kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Dịch vụ nghiên cứu xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu; Dịch vụ lấy mẫu vân tay; Tổ chức hội nghị, hội thảo khoa học, thực hiện các dịch vụ khoa học và công nghệ theo lĩnh vực đăng ký; Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, đào tạo, huấn luyện, bồi dưỡng trình độ chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
