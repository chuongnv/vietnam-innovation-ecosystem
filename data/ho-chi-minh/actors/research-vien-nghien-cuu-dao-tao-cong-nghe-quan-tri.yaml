id: research-vien-nghien-cuu-dao-tao-cong-nghe-quan-tri
name:
  vi: Viện Nghiên cứu Đào tạo Công nghệ Quản trị
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 133, Tân Chánh Hiệp 33, Xã Đông Thạnh, Huyện Hóc Môn, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh và khoa học giáo dục; dịch vụ gồm tư vấn và chuyển giao công nghệ, phổ biến thông tin, đào tạo nâng cao trình độ chuyên môn.'
  en: 'Institute doing applied research in business administration and education science; services include consulting, technology transfer, information dissemination and professional upskilling.'
description_source:
  text: '1. Nghiên cứu và triển khai ứng dụng trong lĩnh vực: kinh doanh và quản trị kinh doanh; khoa học giáo dục nói chung. 3. Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học, đào tạo bồi dưỡng, nâng cao trình độ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nươc theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
