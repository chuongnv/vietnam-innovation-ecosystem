id: research-vien-nghien-cuu-phat-trien-asian
name:
  vi: Viện Nghiên cứu Phát Triển Asian
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 8, Đường số 7, Phường Hòa Hưng, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kinh doanh, quản trị, khoa học giáo dục và địa lý kinh tế – văn hóa; sản xuất thử sản phẩm nghiên cứu, cung cấp tư vấn, đánh giá, chuyển giao kết quả và huấn luyện chuyên môn.'
  en: 'An institute researching business, management, educational science and economic and cultural geography; it pilots research products and provides consulting, evaluation, transfer of results and professional training.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Quan hệ sản xuất kinh doanh; Kinh doanh và quản trị kinh doanh; Khoa học giáo dục nói chung (bao gồm cả sư phạm học, lý luận giáo dục); Địa lý kinh tế và văn hóa. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký; 3. Dịch vụ Khoa học Công nghệ: Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, không cấp văn bằng chứng chỉ);'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
