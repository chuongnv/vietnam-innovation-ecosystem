id: research-vien-nghien-cuu-khoa-hoc-du-lieu-y-sinh-hoc
name:
  vi: Viện Nghiên cứu Khoa Học Dữ Liệu Y Sinh Học
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 1177, Huỳnh Tấn Phát, Phường Tân Thuận, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học dữ liệu y sinh, gồm tin học, thống kê – xác suất và phần mềm ứng dụng trong y dược và sức khỏe; kinh doanh sản phẩm nghiên cứu, tổ chức hội thảo, tư vấn sở hữu trí tuệ và chuyển giao công nghệ.'
  en: 'An institute researching biomedical data science, including informatics, statistics and probability, and software for medicine, pharmacy and health; it commercialises research products, organises workshops and provides intellectual property and technology-transfer services.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Khoa học thông tin, tin học trong các ngành khoa học tự nhiên, thống kê và xác xuất, công nghệ phần mềm trong các ngành khoa học y dược và sức khỏe. 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: dịch vụ thông tin khoa học và công nghệ, tổ chức Hội nghị, hội thảo; Dịch vụ về sở hữu trí tuệ; Chuyển giao công nghệ, tư vấn, lập dự án, thông tin khoa học và công nghệ; Bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
