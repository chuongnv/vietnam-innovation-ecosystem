id: research-vien-cong-nghe-moi-truong-nang-luong-dai-hoc-sai-gon
name:
  vi: Viện Công nghệ Môi trường - Năng lượng Đại học Sài Gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 20, Ngô Thời Nhiệm, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Sài Gòn, nghiên cứu và chuyển giao công nghệ về môi trường, năng lượng và tái tạo tài nguyên; tư vấn đánh giá tác động môi trường, quan trắc, phân tích và thiết kế, thi công công trình xử lý chất thải, tiết kiệm năng lượng.'
  en: 'An institute under Saigon University researching and transferring technology in environment, energy and resource recovery; it provides environmental impact assessment, monitoring and analysis, and designs and builds waste-treatment and energy-saving installations.'
description_source:
  text: '1- Nghiên cứu khoa học, chuyển giao công nghệ và triển khai ứng dụng các kết quả nghiên cứu các lĩnh vực công nghệ môi trường, năng lượng và tái tạo tài nguyên; 2- Dịch vụ khoa học và côn nghệ: Tư vấn các dịch vụ trong lĩnh vực môi trường và tài nguyên (lập dự án đầu tư, báo cáo đánh giá tác động môi trường chiến lược (ĐMC), đánh giá tác động môi trường (ĐTM), báo cáo xả thải vào nguồn nước, báo cáo giám sát môi trường định kỳ cho các dự án đang hoạt động, cung cấp dịch vụ đào tạo cũng như hỗ trợ về các kỹ năng vận hành, sử dụng trang thiết bị, các kỹ năng phân tích chỉ số ô nhiễm môi trường nước, không khí, đất và chất thải rắn, tư vấn xây dựng và lắp đặt phòng thí nghiệm); Thiết kế, thi công, lắp đặt các công trình xử lý môi trường (nước thải, khí thải, chất thải rắn); Thiết kế, thi công, lắp đặt các công trình hạ tầng điện, chiếu sáng, tiết kiệm năng lượng; Phân tích và nhận các dịch vụ phân tích, quan trắc, dịch vụ kỹ thuật liên quan đến lĩnh vực môi trường, năng lượng và tài
    nguyên. 3- Sản xuất - thử nghiệm, kinh doanh - sản xuất kinh doanh: các sản phẩm là kết quả nghiên cứu. 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
