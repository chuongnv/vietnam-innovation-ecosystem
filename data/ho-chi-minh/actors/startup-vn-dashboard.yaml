description:
  vi: 'Nền tảng phân tích dữ liệu low-code với các mẫu dashboard tùy biến, kết nối dữ liệu đám mây và Google Sheets, giúp doanh nghiệp xây dựng báo cáo phân tích với chi phí thấp.'
