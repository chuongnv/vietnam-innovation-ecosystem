id: research-vien-quan-tri-kinh-doanh-mba
name:
  vi: Viện quản trị kinh doanh MBA
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 78, Thông Tây Hội, Phường Gò Vấp, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh; cung cấp dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và các khóa bồi dưỡng về quản trị.'
  en: 'Institute doing applied research in business administration; offers consulting, transfer of research results, scientific information and management training courses.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
