description:
  vi: '"Venture catalyst" có trụ sở Singapore, chi nhánh Việt Nam: tích hợp AI, phát triển phần mềm, tuyển nhân sự công nghệ và dịch vụ tuyển dụng hộ (EOR) tại Việt Nam, mở rộng thị trường, tư vấn gọi vốn (Capital JDI), xây dựng doanh nghiệp mới và đổi mới sáng tạo doanh nghiệp (Venture JDI). Tổ chức chuỗi sự kiện The Future of AI tại TP.HCM.'
  en: 'Singapore-based "venture catalyst" with a Vietnam branch: AI integration, software development, tech talent recruitment and employer of record (EOR) services in Vietnam, market expansion, fundraising advisory (Capital JDI), new venture building and corporate innovation (Venture JDI). Organises The Future of AI event series in Ho Chi Minh City.'
