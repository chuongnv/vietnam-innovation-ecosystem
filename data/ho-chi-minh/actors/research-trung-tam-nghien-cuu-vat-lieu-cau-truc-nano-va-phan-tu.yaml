id: research-trung-tam-nghien-cuu-vat-lieu-cau-truc-nano-va-phan-tu
name:
  vi: Trung tâm Nghiên cứu Vật liệu cấu trúc Nano và Phân tử
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Khu Phố 6, Phường Đông Hòa, Phường Dĩ An, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển và ứng dụng vật liệu cấu trúc nano và phân tử; sản xuất thử, kinh doanh sản phẩm từ kết quả nghiên cứu và cung cấp tư vấn, chuyển giao công nghệ, bồi dưỡng chuyên môn.'
  en: 'A centre doing R&D and applications of nanostructured and molecular materials; it pilots and sells research-based products and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và ứng dụng các vật liệu cấu trúc nano và phân tử. 2. Sản xuất thử- thử nghiệm; sản xuất- kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. 2. Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
