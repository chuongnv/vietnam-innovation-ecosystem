id: research-vien-doi-moi-sang-tao-truong-dh-kinh-te
name:
  vi: Viện Đổi mới sáng tạo - Trường ĐH Kinh tế Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 232/6, Võ Thị Sáu, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Kinh tế TP.HCM, nghiên cứu về đổi mới sáng tạo và hỗ trợ đưa sản phẩm KH&CN ra thị trường; tư vấn, đào tạo cho cá nhân, doanh nghiệp phát triển ý tưởng đổi mới sáng tạo và tổ chức hội thảo chuyên đề.'
  en: 'An institute under the University of Economics Ho Chi Minh City (UEH) researching innovation and helping bring S&T products to market; it advises and trains individuals and businesses developing innovative ideas and organises thematic workshops.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học về đổi mới sáng tạo: tham mưu tổ chức triển khai các chương trình, đề án nghiên cứu tốt nhất để đưa sản phẩm khoa học công nghệ tiếp cận thử với thị trường, thúc đẩy và hỗ trợ cho các ý tưởng đổi mới sáng tạo, các phát kiến trong khoa học công nghệ có thể hiện thực hóa thành công. 2. Dịch vụ khoa học và công nghệ: - Tư vấn, hỗ trợ cho các cá nhân, tổ chức, doanh nghiệp để phát triển các ý tưởng đổi mới sáng tạo thành công; - Đào tạo, bồi dưỡng kiến thức chuyên môn cho doanh nghiệp và các tổ chức hướng đến tăng cường phát triển khoa học, công nghệ trong nền kinh tế về đổi mới sáng tạo; - Tổ chức hội thảo, hội nghị về đổi mới sáng tạo trong quản lý, kinh doanh. 3. Hợp tác đổi mới sáng tạo thông qua việc khai thác các chương trình, dự án, các quỹ đầu tư đổi mới sáng tạo trong và ngoài nước về lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
