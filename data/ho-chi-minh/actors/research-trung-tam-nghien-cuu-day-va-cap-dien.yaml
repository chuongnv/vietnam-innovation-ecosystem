id: research-trung-tam-nghien-cuu-day-va-cap-dien
name:
  vi: Trung tâm nghiên cứu dây và cáp điện
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 70 – 72, Nam Kỳ Khởi Nghĩa, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng chuyên về dây và cáp điện; bên cạnh đó nhận tư vấn, chuyển giao thành quả, cung cấp thông tin khoa học và tập huấn chuyên môn cho lĩnh vực này.'
  en: 'Centre researching and applying technology for electrical wires and cables; it also offers consulting, transfer of results, scientific information and professional training in this field.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực dây và cáp điện. 2. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
