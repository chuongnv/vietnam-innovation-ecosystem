id: research-trung-tam-nghien-cuu-phat-trien-do-thi-va-giao-thong-van-tai
name:
  vi: Trung tâm Nghiên cứu Phát triển Đô thị và Giao thông vận tải
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 72/2A1, Khu Phố 4, Phường Tân Thuận, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng về công trình hạ tầng đô thị và giao thông vận tải; đồng thời nhận tư vấn, chuyển giao thành quả, cung cấp thông tin khoa học và tập huấn chuyên môn.'
  en: 'Centre researching and applying knowledge on urban infrastructure and transport works; it also offers consulting, transfer of results, scientific information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công trình hạ tầng đô thị và công trình giao thông vận tải. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng , chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
