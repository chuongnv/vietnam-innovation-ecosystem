id: research-vien-chien-luoc-phat-trien-kinh-te-so
name:
  vi: Viện Chiến Lược Phát Triển Kinh Tế Số
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 12, Tân Trào, Phường Tân Mỹ, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kinh doanh, quản trị, công nghệ phần mềm và hệ thống thông tin – truyền thông phục vụ kinh tế số; cung cấp dịch vụ hội thảo, thông tin khoa học, môi giới và tư vấn chuyển giao công nghệ.'
  en: 'An institute researching business, management, software engineering and ICT systems for the digital economy; it offers conferences, S&T information, and technology-transfer brokerage and consulting.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Quan hệ sản xuất kinh doanh; Kinh doanh và quản trị kinh doanh; Công nghệ phần mềm; Các hệ thống thông tin và truyền thông. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học và Công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ (hỗ trợ các bên có nhu cầu mua hoặc bán tìm kiếm đối tác để ký kết hợp đồng chuyển giao công nghệ); Dịch vụ tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); Dịch vụ tra cứu và chỉ dẫn thông tin khoa học và công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký, Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ
    phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
