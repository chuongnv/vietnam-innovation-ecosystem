id: research-trung-tam-dich-vu-khkt-lam-nghiep
name:
  vi: Trung tâm Dịch vụ KHKT Lâm Nghiệp Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 126 H Phan Đăng Lưu, Phường Đức Nhuận, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Nông Lâm TP.HCM, nghiên cứu, ứng dụng trong lâm nghiệp; tư vấn dự án bảo tồn, phát triển rừng, kiểm định giống cây, gỗ và lâm sản, ứng dụng GIS, lâm nghiệp đô thị và đào tạo.'
  en: 'Centre of Nong Lam University HCMC conducting forestry research and applications; it advises on forest conservation and development projects, inspects seeds, timber and forest products, applies GIS, works on urban forestry and offers training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực lâm nghiệp. - Dịch vụ KH&CN: tư vấn, lập dự thầu và thẩm định các dự án bảo tồn, phát triển rừng và nghề rừng; tư vấn kiểm định về hạt giống, con, cây, gỗ và lâm sản ngoài gỗ theo quy định; tư vấn bảo vệ môi trường sinh thái, ứng dụng GIS, lâm nghiệp đô thị; chuyển giao công nghệ; thông tin KH&CN; huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp chứng nhận, không cấp văn bằng, chứng chỉ) - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
