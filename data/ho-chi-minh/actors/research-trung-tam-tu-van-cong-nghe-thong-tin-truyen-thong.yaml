id: research-trung-tam-tu-van-cong-nghe-thong-tin-truyen-thong
name:
  vi: Trung tâm Tư vấn Công nghệ Thông tin - Truyền thông
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 23A, Ký Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng trong điện, điện tử, thông tin và truyền thông; sản xuất thử, chuyển giao công nghệ và tư vấn thẩm định, đánh giá chất lượng, khảo sát thiết kế, giám sát, quản lý dự án công trình viễn thông, điện tử.'
  en: 'A centre doing applied research in electrical engineering, electronics and ICT; it pilots and transfers technology and advises on appraisal, quality assessment, survey and design, supervision and management of telecom and electronics projects.'
description_source:
  text: 1. Nghiên cứu và triển khai ứng dụng trong lĩnh vực điện, điện tử, thông tin và truyền thông. 2. Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. 3. Dịch vụ KH-CN:Tư vấn, thẩm định, đánh giá chất lượng các loại công trình lĩnh vực điện, điện tử, thông tin, truyền thông; khảo sát, thiết kế, thẩm định dự án, thẩm định thiết kế, tư vấn đấu thầu, tư vấn giám sát và tư vấn quản lý dự án; cung cấp thông tin, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn. 4. Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
