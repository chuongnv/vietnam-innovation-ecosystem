id: research-trung-tam-nghien-cuu-phat-trien-rung
name:
  vi: Trung tâm nghiên cứu phát triển rừng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 75 Đường TTH5, Phường Tân Thới Hiệp, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng về lâm sinh, bảo vệ thực vật, sinh thái và môi trường rừng, cũng như chọn tạo, nhân giống cây rừng; sản xuất thử từ thành quả nghiên cứu, kèm tư vấn, chuyển giao và tập huấn.'
  en: 'Centre researching and applying silviculture, forest ecology and environment, forest tree breeding and propagation and plant protection; it does pilot production from its research and provides consulting, transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: lâm sinh, sinh thái và môi trường rừng; chọn, tạo giống cây rừng, nhân giống cây rừng; bảo vệ thực vật. 2. Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
