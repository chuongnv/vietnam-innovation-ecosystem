id: research-trung-tam-nghien-cuu-nong-nghiep-huu-co-hoa-sen
name:
  vi: Trung tâm nghiên cứu nông nghiệp hữu cơ Hoa Sen
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 52, Đường số 10, Phường Tân Hưng, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Công ty TNHH XNK Đại Dương Xanh, nghiên cứu nông nghiệp hữu cơ gồm công nghệ vi sinh, thuốc trừ sâu sinh học, chọn tạo giống, bảo vệ thực vật, chế biến nông sản; sản xuất thử, tư vấn và chuyển giao công nghệ.'
  en: 'Centre under Dai Duong Xanh Import-Export Co. researching organic agriculture, including microbial technology, bio-pesticides, crop breeding, plant protection and post-harvest processing; it pilot-produces and provides consulting and technology transfer.'
description_source:
  text: '1- Nghiên cứu khoa học và phát triển công nghệ: lĩnh vực công nghệ tế bào trong nông nghiệp; công nghệ vi sinh vật trong nông nghiệp; công nghệ sản xuất thuốc trừ sâu sinh học; cây lương thực và cây thực phẩm; chọn, tạo giống cây trồng; công nghệ nhân giống cây trồng; bảo vệ thực vật; bảo quản và chế biến nông sản; 2- Sản xuất thử - thử nghiệm; kinh doanh – sản xuất kinh doanh: các sản phẩm từ kết quả nghiên cứu theo lĩnh vực đăng ký; 3- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ (hỗ trợ các bên lực chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); bồi dưỡng chuyên môn theo lĩnh vực đăng ký; 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
