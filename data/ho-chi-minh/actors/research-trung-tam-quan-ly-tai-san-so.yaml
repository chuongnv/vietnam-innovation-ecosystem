id: research-trung-tam-quan-ly-tai-san-so
name:
  vi: Trung Tâm Quản Lý Tài Sản Số
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 124, Huỳnh Tấn Phát, Phường Tân Thuận, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về kinh tế số, chuyển đổi số và số hóa tài sản; tư vấn cho tổ chức, doanh nghiệp về ứng dụng công nghệ số, dữ liệu, số hóa và quản lý tài sản số, đồng thời ươm tạo doanh nghiệp số và tập huấn nhân lực.'
  en: 'Centre researching digital transformation, the digital economy and asset digitisation; it advises organisations and businesses on digital technology, data, digitisation and digital asset management, incubates digital firms and trains staff.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Chuyển đổi số, kinh tế số, số hóa tài sản, ứng dụng công nghệ số và dữ liệu thông minh; Nghiên cứu thăm dò thị trường cho các loại hình số hóa tài sản và quản lý tài sản số hóa; Nghiên cứu xây dựng luận chứng khoa học cho các chương trình, dự án, kế hoạch, chính sách kinh tế - xã hội về chuyển đổi số, kinh tế số và số hóa tài sản. 2. Dịch vụ khoa học và công nghệ: Thông tin khoa học và công nghệ; Tư vấn, thực hiện các dịch vụ khoa học và công nghệ về chuyển đổi số, ứng dụng công nghệ số và dữ liệu thông minh trong các ngành kinh tế - xã hội; Ứng dụng giải pháp quản trị và số hóa tài sản doanh nghiệp hướng đến nâng cao hiệu quả hoạt động, hiệu quả quản lý; Tổ chức chuyển giao, giám sát độc lập các đề tài, dự án, công trình nghiên cứu khoa học và công nghệ về kinh tế số, số hóa tài sản; Tổ chức hoạt động số hóa tài sản và quản lý tài sản số cho các tổ chức cá nhân có nhu cầu; Tổ chức hoạt động ươm tạo doanh nghiệp số; Tập
    huấn, bồi dưỡng nhân lực phục vụ nghiên cứu, triển khai ứng dụng khoa học và công nghệ số hóa tài sản vào sản xuất kinh doanh (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
