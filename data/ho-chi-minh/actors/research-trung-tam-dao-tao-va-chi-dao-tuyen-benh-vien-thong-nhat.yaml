description:
  vi: 'Trung tâm trực thuộc Bệnh viện Thống Nhất, nghiên cứu khoa học trong lĩnh vực y, dược và sức khỏe; tổ chức đào tạo, tập huấn chuyên môn và hội nghị, hội thảo y khoa.'
  en: 'Centre of Thong Nhat Hospital conducting research in medicine, pharmacy and health; it organises professional training, workshops and medical conferences.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: trong lĩnh vực: khoa học y, dược và sức khỏe. 2. Dịch vụ khoa học và công nghệ: đào tạo, tập huấn, bồi dưỡng chuyên môn, tổ chức hội nghị, hội thảo theo lĩnh vực đăng ký phù hợp luật định. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định'
