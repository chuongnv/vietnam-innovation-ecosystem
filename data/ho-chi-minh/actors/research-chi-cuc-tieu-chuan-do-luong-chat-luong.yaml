id: research-chi-cuc-tieu-chuan-do-luong-chat-luong
name:
  vi: Chi cục Tiêu chuẩn Đo lường Chất lượng Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 263, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh, Phường Xuân Hòa, TP. Hồ Chí Minh
description:
  vi: 'Cơ quan quản lý nhà nước về tiêu chuẩn, đo lường, chất lượng tại TP.HCM, trực thuộc Sở Khoa học và Công nghệ; thực hiện kiểm định, hiệu chuẩn phương tiện đo, thử nghiệm và chứng nhận sản phẩm, hàng hóa, đồng thời tư vấn về tiêu chuẩn, năng suất và rào cản kỹ thuật (TBT).'
  en: 'HCMC''s standards, metrology and quality agency under the Department of Science and Technology; it verifies and calibrates measuring instruments, tests and certifies products and goods, and advises on standards, productivity and technical barriers to trade (TBT).'
description_source:
  text: '- Nghiên cứu, áp dụng, chuyển giao tiến bộ khoa học và công nghệ trong lĩnh vực tiêu chuẩn, đo lường, chất lượng và năng suất. - Dịch vụ KH&CN: Kiểm định, hiệu chuẩn thiết bị, phương tiện đo lường và kiểm định chuẩn đo lường; xây dựng tổ chức kiểm định, hiệu chuẩn thiết bị đo lường; thử nghiệm mẫu phương tiện đo, kiểm tra phép đo hàng đóng gói sẵn theo định lượng; thử nghiệm, giám định chất lượng và an toàn sản phẩm, hàng hoá; chứng nhận sản phẩm, hàng hóa phù hợp tiêu chuẩn, quy chuẩn kỹ thuật; tư vấn về tiêu chuẩn, đo lường, chất lượng, TBT và năng suất theo quy định của pháp luật; tư vấn áp dụng, xây dựng quy chuẩn, tiêu chuẩn và các công cụ cải tiến năng suất; xây dựng phòng thử nghiệm đạt chuẩn ISO 17025; dịch vụ trợ giúp về công bố tiêu chuẩn, giải thưởng chất lượng quốc gia; thông tin khoa học và công nghệ; huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác với các tổ chức trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
