description:
  vi: 'Trung tâm nghiên cứu tâm lý học và giáo dục học, cung cấp dịch vụ tư vấn tâm lý, giáo dục, hôn nhân – gia đình và bồi dưỡng chuyên môn.'
  en: 'A centre researching psychology and pedagogy, offering counselling on psychology, education, marriage and family, and professional training.'
description_source:
  text: '- Nghiên cứu khoa học trong lĩnh vực tâm lý học, giáo dục học. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
