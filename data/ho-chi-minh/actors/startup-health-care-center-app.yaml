id: startup-health-care-center-app
name:
  vi: Health Care Center App
type: startup
categories:
- Y tế, CSSK
sectors:
- health
founded: 2024
address: 85C Nguyễn Cư Trinh, P. Cầu Ông Lãnh, TP. HCM
description:
  vi: 'Đơn vị chăm sóc sức khỏe đặt tại Công viên Phần mềm Quang Trung, phát triển nền tảng theo dõi sức khỏe kết hợp AI và đội ngũ y bác sĩ để hỗ trợ người dân quản lý sức khỏe trước, sau điều trị và cảnh báo sớm nguy cơ bệnh.'
  en: 'A healthcare provider based at Quang Trung Software City that develops a health-monitoring platform combining AI with medical staff to help people manage their health before and after treatment and flag disease risks early.'
description_source:
  text: www.healthcarecenter.asia Y tế, CSSK Subcription – SaaS, Mô Hình O2O (Gắn Kết Online Tới Offline/Ngược Lại), Nền Tảng Thương Mại, Nền Tảng Dịch vụ Theo Yêu Cầu, Dịch Vụ Y Tế Số 28-11-2024 Việt Nam Toàn quốc Health Care Center (HCC) là đơn vị hoạt động trong lĩnh vực chăm sóc sức khỏe toàn diện và ứng dụng công nghệ y tế hiện đại, đặt trụ sở tại Khu Công viên Phần mềm Quang Trung (QTSC), TP. Hồ Chí Minh. Với định hướng trở thành trung tâm tiên phong trong chuyển đổi số y tế, HCC phát triển các giải pháp theo dõi sức khỏe thông minh giúp người dân chủ động chăm sóc sức khỏe trước và sau điều trị, đồng thời cảnh báo sớm nguy cơ bệnh lý tiềm ẩn thông qua nền tảng công nghệ kết hợp trí tuệ nhân tạo (AI) và đội ngũ y – bác sĩ giàu kinh nghiệm. HCC đã và đang triển khai nhiều chương trình hợp tác với bệnh viện, phòng khám, doanh nghiệp và cơ quan nhà nước, góp phần nâng cao nhận thức chăm sóc sức khỏe cộng đồng, đẩy mạnh công tác dự phòng và quản lý sức khỏe liên tục, đồng thời thúc đẩy
    ứng dụng công nghệ vào ngành y tế Việt Nam.
  source: HOIP (tự giới thiệu)
