id: research-trung-tam-tu-van-quan-ly-moi-truong-giao-thong-van-tai
name:
  vi: Trung tâm Tư vấn Quản lý Môi trường Giao thông Vận tải
type: research
categories:
- Tổ chức khoa học và công nghệ
address: C145 KDC Thới An, Phường Trung Mỹ Tây, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm tư vấn môi trường cho ngành giao thông vận tải, phụ trách lập báo cáo ĐTM, thí nghiệm, phân tích, giám sát và tư vấn bảo đảm an toàn môi trường cho dự án giao thông, kèm đào tạo chuyên môn.'
  en: 'Centre providing environmental consulting for the transport sector, preparing environmental impact assessments, testing, analysis, monitoring and environmental-safety advice for transport projects, plus professional training.'
description_source:
  text: '- Dịch vụ KH&CN: Lập hồ sơ đánh giá tác động môi trường, thiết kế, thí nghiệm, phân tích đánh giá, giám sát môi trường giao thông vận tải; tư vấn an toàn môi trường cho các dự án phát triển trong lĩnh vực giao thông vận tải, thông tin khoa học và công nghệ, đào tạo bồi dưỡng về lĩnh vực môi trường trong ngành giao thông vận tải. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
