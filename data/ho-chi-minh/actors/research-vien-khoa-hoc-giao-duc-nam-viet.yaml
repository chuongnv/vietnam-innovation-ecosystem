id: research-vien-khoa-hoc-giao-duc-nam-viet
name:
  vi: Viện Khoa học Giáo dục Nam Việt
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 212/21, Nguyễn Văn Nguyễn, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong giáo dục và công nghệ phần mềm; cung cấp các dịch vụ khoa học – công nghệ như tư vấn, chuyển giao kết quả, phổ biến thông tin và tập huấn chuyên môn.'
  en: 'Institute doing applied research in education science and software engineering; provides S&T services such as consulting, transfer of research results, information dissemination and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực khoa học giáo dục nói chung; công nghệ phần mềm. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
