id: research-vien-phat-trien-cong-nghe-moi-truong-va-tai-nguyen-nuoc-phu
name:
  vi: Viện Phát triển công nghệ môi trường và tài nguyên nước Phú Mỹ
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: 710/14, Lũy Bán Bích, Phường Phú Thọ Hòa, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và ứng dụng công nghệ xử lý chất thải, sản xuất sạch, quan trắc môi trường, đánh giá ô nhiễm đất, nước, không khí cùng thủy văn và tài nguyên nước; sản xuất thử nghiệm và cung cấp tư vấn, đào tạo chuyên môn.'
  en: 'An institute researching and applying technologies for waste treatment, cleaner production, environmental monitoring and pollution assessment of soil, water and air, as well as hydrology and water resources; it does pilot production and provides consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ sản xuất sạch, tái chế; công nghệ quan trắc môi trường, mức độ xả thải, xác định mức độ ô nhiễm của đất, nước, không khí; nghiên cứu chế độ dòng chảy; những vấn đề về thủy văn học, tài nguyên nước. 2. Sản xuất thử nghiệm các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ) Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
