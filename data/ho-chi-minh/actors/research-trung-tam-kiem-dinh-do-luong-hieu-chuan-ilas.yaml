id: research-trung-tam-kiem-dinh-do-luong-hieu-chuan-ilas
name:
  vi: Trung Tâm Kiểm Định Đo Lường Hiệu Chuẩn Ilas
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 7/7S, Bà Điểm 9, Xã Bà Điểm, Huyện Hóc Môn, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Công ty CP Kiểm định Đo lường Hiệu chuẩn ILAS, nghiên cứu cơ khí và chế tạo máy; cung cấp dịch vụ kiểm định, hiệu chuẩn và thử nghiệm cho phương tiện đo, thiết bị.'
  en: 'Centre under ILAS Measurement Inspection and Calibration JSC, researching mechanical engineering and machine building; it provides inspection, calibration and testing services for measuring instruments and equipment.'
description_source:
  text: '1. Nghiên cứu khoa học và công nghệ trong lĩnh vực: Kỹ thuật cơ khí nói chung; Kỹ thuật thiết kế và công nghệ chế tạo máy (máy công cụ, máy động lực, máy phục vụ nông, lâm, ngư nghiệp và công nghiệp chế biến, máy thủy lợi, máy xây dựng, ô tô, giao thông, thiết bị khai khoáng) 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu như: máy công cụ, máy động lực, máy phục vụ nông, lâm, ngư nghiệp và công nghiệp chế biến, máy thủy lợi, máy xây dựng, ô tô, giao thông, thiết bị khai khoáng. 3. Dịch vụ khoa học và công nghệ: dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, thử nghiệm vật liệu; Dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật, tư vấn ISO 1705; Tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp Luật định (chỉ cấp Giấy chứng nhận, không cấp văn bằng, chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
