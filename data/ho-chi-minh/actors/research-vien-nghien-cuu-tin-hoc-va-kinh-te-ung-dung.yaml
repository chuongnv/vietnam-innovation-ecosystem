address: 1, Công trường quốc tế, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong hai mảng quản trị kinh doanh và công nghệ phần mềm; cung cấp tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in business administration and software engineering; offers consulting, transfer of research results, scientific information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: kinh doanh và quản trị kinh doanh; công nghệ phần mềm. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
