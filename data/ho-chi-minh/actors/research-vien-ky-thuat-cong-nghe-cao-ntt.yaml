id: research-vien-ky-thuat-cong-nghe-cao-ntt
name:
  vi: Viện Kỹ thuật Công nghệ cao NTT
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 298 – 300A, Nguyễn Tất Thành, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Nguyễn Tất Thành, nghiên cứu ứng dụng công nghệ thông tin, công nghệ sinh học, vật liệu, tự động hóa và y dược; sản xuất thử, chuyển giao công nghệ và cung cấp tư vấn, bồi dưỡng chuyên môn.'
  en: 'An institute under Nguyen Tat Thanh University conducting applied research in IT, biotechnology, materials, automation and medicine/pharmacy; it pilots and transfers technology and provides consulting and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ thông tin, công nghệ sinh học, công nghệ vật liệu, công nghệ tự động hóa, y - dược. - Sản xuất thử - thử nghiệm, chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
