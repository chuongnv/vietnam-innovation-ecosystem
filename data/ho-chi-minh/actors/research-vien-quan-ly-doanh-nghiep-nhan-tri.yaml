type: research
categories:
- Tổ chức khoa học và công nghệ
address: 356A, Xa lộ Hà Nội, Phường Phước Long A, Thành phố Thủ Đức, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh và doanh nghiệp; cung cấp dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in business and enterprise management; offers consulting, transfer of research results, scientific information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng , chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
