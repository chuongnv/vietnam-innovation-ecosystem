id: research-vien-cong-nghe-va-kinh-te-nang-luong
name:
  vi: Viện Công nghệ và Kinh tế Năng lượng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 125/77, Đường 30/4, Phường Thạnh Mỹ Tây, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về công nghệ năng lượng, dầu khí, xử lý chất thải, quan trắc môi trường, vật liệu và kinh tế, quy hoạch; sản xuất thử, chuyển giao công nghệ và cung cấp tư vấn quản lý chất lượng, đánh giá công nghệ.'
  en: 'An institute researching energy and petroleum technology, waste treatment, environmental monitoring, materials, economics and planning; it pilots and transfers technology and offers quality-management consulting and technology assessment.'
description_source:
  text: '1. Nghiên cứu và triển khai ứng dụng trong lĩnh vực: công nghệ năng lượng và nhiên liệu không phải dầu khí; công nghệ dầu khí; công nghệ quản lý và xử lý chất (rắn, lỏng, khí); công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát ô nhiễm; công nghệ vật liệu kim loại và phi kim loại; khoa học môi trường – các khía cạnh xã hội, nghiên cứu quy hoạch, phát triển đô thị và nông thôn, kinh doanh và quản trị kinh doanh. 2.Sản xuất thử nghiệm, chuyển giao công nghệ từ kết quả nghiên cứu. 3. Dịch vụ KH&CN: dịch vụ tư vấn áp dụng các công cụ quản lý chất lượng; dịch vụ tư vấn chuyển giao công nghệ; dịch vụ đánh giá công nghệ; dịch vụ xúc tiến chuyển giao công nghệ; dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật; tổ chức huấn luyện bồi dưỡng; thông tin khoa học và công nghệ; tư vấn đầu tư theo các lĩnh vực đăng ký. 4. Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
