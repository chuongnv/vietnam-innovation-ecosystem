id: research-vien-nghien-cuu-va-huan-luyen-cap-cuu-ngoai-vien-115
name:
  vi: Viện Nghiên cứu và Huấn Luyện Cấp Cứu Ngoại Viện 115
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 214/19/8B, Nguyễn Văn Nguyễn, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, phát triển công nghệ y tế trong các chuyên ngành như hồi sức cấp cứu, chấn thương chỉnh hình, gây mê, phục hồi chức năng, lão khoa, nội khoa, y học thảm họa, chẩn đoán hình ảnh và quản trị bệnh viện; sản xuất thử sản phẩm và tổ chức hội thảo, tư vấn, tập huấn chuyên môn.'
  en: 'Institute researching medical technology in fields such as emergency and intensive care, orthopaedic trauma, anaesthesia, rehabilitation, geriatrics, internal medicine, disaster medicine, diagnostic imaging and hospital management; it pilots products and runs conferences, consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Điều trị tích cực và hồi sức cấp cứu; Gây mê; Chấn thương, chỉnh hình, phục hồi chức năng, vật lý trị liệu; Kinh tế y tế; Quản trị bệnh viện; Y học thảm họa; Lão Khoa; Nội khoa; Chẩn đoán hình ảnh. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao kết quả nghiên cứu; tổ chức hội nghị, hội thảo; thông tin khoa học và công nghệ; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp với Luật định (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
