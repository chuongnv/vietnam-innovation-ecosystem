id: research-vien-cong-nghe-xay-dung-cau-duong-phia-nam
name:
  vi: Viện Công nghệ Xây dựng Cầu đường phía Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 237, Quốc lộ 13, Phường Bình Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học công nghệ phục vụ xây dựng giao thông; tư vấn lập dự án, thiết kế, thẩm tra, giám sát, thí nghiệm và kiểm định chất lượng công trình giao thông, thủy lợi, dân dụng và hạ tầng kỹ thuật.'
  en: 'An institute researching science and technology for transport construction; it provides project preparation, design, verification, supervision, testing and quality inspection for transport, irrigation, civil and infrastructure works.'
description_source:
  text: '1. Nghiên cứu khoa học công nghệ phục vụ phát triển xây dựng giao thông. 2. Dịch vụ khoa học và công nghệ: - Tư vấn đấu thầu, lập dự án đầu tư, quản lý dự án, khảo sát thiết kế, thẩm tra, thẩm định thiết kế và dự toán các công trình giao thông, thuỷ lợi, dân dụng, công nghiệp và hạ tầng kỹ thuật, đánh giá tác động môi trường trong công trình xây dựng, giao thông. - Tư vấn, giám sát, khảo sát chất lượng công trình, thí nghiệm, kiểm định chất lượng các công trình giao thông, thuỷ lợi, dân dụng, công nghiệp và hạ tầng kỹ thuật. - Tư vấn kiểm tra, chứng nhận sự phù hợp về chất lượng công trình xây dựng theo Luật định. - Liên kết đào tạo bồi dưỡng, chuyển giao công nghệ mới về quản lý công trình xây dựng, giao thông. (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký
    phù hợp với Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
