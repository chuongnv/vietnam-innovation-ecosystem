id: research-vien-y-duoc-viet
name:
  vi: Viện Y Dược Việt
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 56 Cù Lao, Phường Cầu Kiệu, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về dược lý, dược lâm sàng, dược liệu, thuốc nam, dược học cổ truyền, bào chế và thực phẩm chức năng; sản xuất kinh doanh sản phẩm từ nghiên cứu, thử nghiệm và giám định chất lượng hàng hóa, tư vấn và tập huấn.'
  en: 'An institute researching pharmacology, clinical pharmacy, medicinal herbs, traditional medicine, formulation and functional foods; it produces and sells research-based products and provides product testing and inspection, consulting and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Dược lý học; Dược học lâm sàng và điều trị; Dược liệu học; Cây thuốc; Con thuốc; Thuốc Nam; Thuốc dân tộc; Hóa dược học; Bào chế; Dược học cổ truyền; Thực phẩm chức năng. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ; thông tin khoa học và công nghệ; dịch vụ môi giới chuyển giao công nghệ; dịch vụ tư vấn chuyển giao công nghệ; dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
