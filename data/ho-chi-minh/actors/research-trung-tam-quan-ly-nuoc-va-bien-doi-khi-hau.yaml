id: research-trung-tam-quan-ly-nuoc-va-bien-doi-khi-hau
name:
  vi: Trung tâm Quản lý nước và Biến đổi khí hậu
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Khu Phố 6, Phường Đông Hòa, Phường Dĩ An, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu cơ bản và ứng dụng về tài nguyên nước, khí tượng thủy văn, môi trường, GIS – viễn thám, biển đảo và biến đổi khí hậu; tư vấn ứng phó biến đổi khí hậu, mô phỏng ngập lụt, khảo sát, đánh giá tác động môi trường và thiết kế công trình thủy.'
  en: 'A centre doing basic and applied research on water resources, hydrometeorology, environment, GIS and remote sensing, marine and island issues and climate change; it advises on climate adaptation, flood modelling, surveys, environmental impact assessment and hydraulic works design.'
description_source:
  text: '1- Nghiên cứu cơ bản và ứng dụng trong các lĩnh vực: tài nguyên nước, khí tượng - thủy văn, môi trường, kinh tế - xã hội, GIS và viễn thám, sinh thái, địa chất, năng lượng, biển - hải đảo và biến đối khí hậu. 2- Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3- Dịch vụ KH&CN: Tư vấn các giải pháp ứng phó, thích nghi với biến đổi khí hậu, tính toán thủy văn, thủy lực, mô phỏng ngập lụt, quy hoạch và quản lý ngập lụt; tư vấn thiết kế, thẩm định, thẩm tra, quản lý dự án các công trình xây dựng cấp thoát nước, công trình thủy, giao thông, hạ tầng đô thị, môi trường; Khảo sát địa hình, địa chất, thủy văn, quan trắc môi trường, GIS và viễn thám; Đánh giá tác động môi trường, môi trường chiến lược, điều tra, khảo sát kinh tế - xã hội và phát triển cộng đồng; Thông tin khoa học và công nghệ, chuyển giao kết quả nghiên cứu, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký
    phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
