id: research-vien-nghien-cuu-trang-phuc-viet
name:
  vi: Viện Nghiên cứu Trang Phục Việt
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 70, Mạc Đĩnh Chi, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu văn hóa Việt Nam, văn hóa các dân tộc thiểu số và mỹ thuật, gắn với trang phục truyền thống; sản xuất thử nghiệm sản phẩm từ nghiên cứu và cung cấp tư vấn, thông tin, bồi dưỡng chuyên môn.'
  en: 'An institute researching Vietnamese culture, ethnic minority cultures and fine arts with a focus on traditional dress; it produces pilot products from its research and provides consulting, information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: Văn hóa Việt Nam, văn hóa các dân tộc ít người Việt Nam; Mỹ thuật. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao kết quả nghiên cứu; Thông tin khoa học công nghệ, huấn luyện bồi dưỡng theo các lĩnh vực đăng ký trên (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
