id: research-trung-tam-cong-nghe-sinh-hoc
name:
  vi: Trung tâm Công nghệ Sinh học Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 176, Hai Bà Trưng, Phường Trung Mỹ Tây, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Ban Quản lý Khu Công nghệ cao TP.HCM, nghiên cứu cơ bản và ứng dụng công nghệ sinh học trong nông nghiệp, y dược, môi trường; sản xuất thử, chuyển giao quy trình kỹ thuật, tư vấn và đào tạo.'
  en: 'Centre under the Saigon Hi-Tech Park Management Board conducting basic and applied biotechnology research for agriculture, medicine and the environment; it pilot-produces, transfers technical processes, and offers consulting and training.'
description_source:
  text: '- Nghiên cứu cơ bản và ứng dụng trong công nghệ sinh học, nông nghiệp, y dược và môi trường. - Sản xuất thử nghiệm, chuyển giao công nghệ, triển khai các quy trình kỹ thuật hiện đại về công nghệ sinh học phục vụ sản xuất, bảo quản, chế biến các sản phẩm nông nghiệp, y tế và môi trường. - Dịch vụ KH&CN: Tư vấn kỹ thuật, tổ chức huấn luyện, bồi dưỡng thực nghiệm, chuyển giao công nghệ, phổ cập kiến thức công nghệ sinh học. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
