id: research-trung-tam-tu-van-va-dich-vu-tai-nguyen-va-moi-truong
name:
  vi: Trung tâm Tư vấn và Dịch vụ Tài nguyên và Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 236B, Lê Văn Sỹ, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về tài nguyên và môi trường; cung cấp tư vấn dự án, chuyển giao công nghệ, phân tích mẫu, điều tra, kiểm kê, quy hoạch, đo đạc, định giá trong các mảng đất đai, địa chất, môi trường, khí tượng thủy văn, trắc địa bản đồ.'
  en: 'Centre researching natural resources and environment; it provides project consulting, technology transfer, laboratory analysis, surveys, inventories, planning, measurement and valuation in land, environment, geology, surveying and mapping, and hydro-meteorology.'
description_source:
  text: '- Nghiên cứu khoa học về lĩnh vực tài nguyên và môi truờng. - Sản xuất thử - thử nghiệm tư kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn lập dự án, chuyển giao công nghệ, tư vấn lắp đặt thiết bị, huấn luyện, bồi dưỡng; thông tin khoa học và công nghệ; phân tích thí nghiệm; điều tra, thống kê, kiểm kê, quy hoạch, thiết kế; khảo sát, đo đạc, thẩm định, kiểm định, định giá, lập dự toán trong lĩnh vực quản lý đất đai, môi trường, địa chất, trắc địa bản đồ, khí tượng thủy văn – tài nguyên nước, cấp thoát nước và GIS. Tư vấn hệ thống quản lý chất lượng ISO, kiểm toán năng lượng. Đo vẽ lập bản đồ, bình đồ, khảo sát thăm dò: địa chính, địa hình, địa chất, địa vật lý, địa chất công trình, địa chất thủy văn, địa chất môi trường và các mỏ khoáng sản. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
