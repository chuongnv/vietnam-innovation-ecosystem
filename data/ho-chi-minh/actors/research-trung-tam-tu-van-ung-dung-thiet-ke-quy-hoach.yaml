id: research-trung-tam-tu-van-ung-dung-thiet-ke-quy-hoach
name:
  vi: Trung Tâm Tư Vấn Ứng Dụng Thiết Kế, Quy Hoạch
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 65, Mạc Đĩnh Chi, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về quy hoạch, kiến trúc và xây dựng; tư vấn lập dự án đầu tư xây dựng, thiết kế đô thị, kiến trúc, cảnh quan, hạ tầng, tổ chức thi tuyển kiến trúc – quy hoạch, làm mô hình, sa bàn và tập huấn chuyên môn.'
  en: 'A centre researching planning, architecture and construction; it advises on construction investment projects, urban, architectural, landscape and infrastructure design, organises design competitions, builds scale models and runs professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực quy hoạch, kiến trúc, xây dựng. 2. Dịch vụ khoa học và công nghệ: - Tư vấn lập và tổ chức thực hiện các dự án đầu tư xây dựng, phát triển đô thị, thiết kê đô thị, thiết kế kiến trúc, thiết kế cảnh quan, dự án phát triển nhà ở, dự án bất động sản, dự án phát triển hạ tầng kỹ thuật và môi trường, các khu chức năng đặc thù. - Tư vấn đấu thầu, thi tuyển kiến trúc - quy hoạch; thực hiện xây dựng mô hình, sa bàn đồ án quy hoạch, công trình kiến trúc, cảnh quan. - Tổ chức tư vấn, tiếp nhận ứng dụng và chuyển giao công nghệ môi trường công tác lập, nghiên cứu và tổ chức quản lý quy hoạch xây dựng, phát triển đô thị, thiết kế đô thị, thiết kế kiến trúc, hạ tầng kỹ thuật và môi trường, các đề tài nghiên cứu khoa học, các dự án sự nghiệp kinh tế. - Tổ chức hội nghị hội thảo, tập huấn bồi dưỡng chuyên môn theo lĩnh vực quy hoạch kiến trúc, xây dựng. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
