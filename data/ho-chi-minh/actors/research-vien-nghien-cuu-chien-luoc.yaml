id: research-vien-nghien-cuu-chien-luoc
name:
  vi: Viện Nghiên cứu Chiến Lược
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 140, Lê Trọng Tấn, Phường Tây Thạnh, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Công Thương TP.HCM, nghiên cứu chiến lược, chính sách phát triển công nghiệp, thương mại, dịch vụ và kinh tế – xã hội địa phương, doanh nghiệp; cung cấp tư vấn, chuyển giao kết quả, hội thảo và tập huấn.'
  en: 'An institute under Ho Chi Minh City University of Industry and Trade researching strategies and policies for industry, trade, services and local socio-economic and business development; it provides consulting, transfer of results, workshops and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Chiến lược và chính sách phát triển công nghiệp, thương mại và dịch vụ phục vụ quản lý vĩ mô của Bộ Công thương; nghiên cứu phục vụ phát triển kinh tế - xã hội của các địa phương; nghiên cứu các vấn đề phục vụ sự phát triển của doanh nghiệp. 2. Sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: - Tư vấn, chuyển giao kết quả nghiên cứu; tổ chức hội nghị, hội thảo; tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (trong trường hợp cấp văn bằng, chứng chỉ, phải được sự cho phép của cơ quan có thẩm quyền); - Tư vấn cho các địa phương triển khai chính sách kinh tế; hoạch định chiến lược phát triển các lĩnh vực kinh tế - xã hội và giải quyết các vấn đề thực tiễn khác; - Hỗ trợ Trường Đại học Công nghiệp Thực Phẩm thành phố Hồ Chí Minh: Đào tạo, bồi dưỡng các kỹ năng quản lý, lãnh đạo cho cán bộ trong các tồ chức chính quyền,
    đoàn thể, các tổ chức xã hội; Đào tạo, bồi dưỡng kiến thức kỹ năng quản trị và kinh doanh cho cộng đồng doanh nghiệp; Đào tạo khởi nghiệp và kỹ năng mềm cho sinh viên và cho cộng đồng; Đào tạo sau Đại học thông qua các chương trình liên kết với các tổ chức, đơn vị trong và ngoài nước. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
