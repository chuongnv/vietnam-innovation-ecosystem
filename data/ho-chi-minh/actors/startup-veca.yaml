description:
  vi: 'Doanh nghiệp phát triển VECA, phần mềm quản lý mua bán cho các vựa phế liệu, hướng tới số hóa chuỗi cung ứng vật liệu tái chế và cải thiện sinh kế người lao động trong ngành.'
  en: 'The company behind VECA, purchasing and sales management software for scrap yards, aiming to digitise the recycled-materials supply chain and improve the livelihoods of its workers.'
description_source:
  text: https://veca.app/ Phần mềm, CNTT Subcription – SaaS 22-07-2020 Việt Nam Hồ Chí Minh, Đồng Nai, Hà Nội, Đà Nẵng VECA - giải pháp quản lý mua bán dành cho vựa phế liệu, kiên định xây dựng một hệ sinh thái tái chế bền vững và là đòn bẩy thúc đẩy kinh tế tuần hoàn. Song song đó, chúng tôi quyết tâm hướng đến chuyển đổi số và nâng cao sinh kế của người lao động trong chuỗi cung ứng nguyên vật liệu tái chế.
