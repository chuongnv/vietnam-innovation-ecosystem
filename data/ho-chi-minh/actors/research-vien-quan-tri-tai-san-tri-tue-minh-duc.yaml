id: research-vien-quan-tri-tai-san-tri-tue-minh-duc
name:
  vi: Viện Quản Trị Tài Sản Trí Tuệ Minh Đức
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 39, Bến Vân Đồn, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu các vấn đề kinh doanh, quản trị và giáo dục liên quan đến sở hữu trí tuệ; dịch vụ gồm tư vấn sở hữu trí tuệ (không gồm thủ tục xác lập, bảo hộ quyền), hỗ trợ chuyển giao công nghệ, định giá tài sản trí tuệ và công nghệ, tập huấn chuyên môn.'
  en: 'Institute researching business, management and education issues related to intellectual property; services include IP consulting (excluding registration and enforcement procedures), technology transfer support, valuation of IP assets and technology, and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực: quan hệ sản xuất kinh doanh liên quan đến tài sản trí tuệ; kinh doanh và quản trị kinh doanh liên quan đến tài sản trí tuệ; khoa học giáo dục nói chung liên quan đến sở hữu trí tuệ và quản trị tài sản trí tuệ. 2. Dịch vụ khoa học và công nghệ: tư vấn về sở hữu trí tuệ (không bao gồm tư vấn liên quan đến thủ tục xác lập và bảo vệ/thực thi quyền sở hữu trí tuệ); dịch vụ tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán ký kết, thực hiện hợp đồng chuyển giao công nghệ); dịch vụ thẩm định giá công nghệ và tài sản trí tuệ; dịch vụ tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
