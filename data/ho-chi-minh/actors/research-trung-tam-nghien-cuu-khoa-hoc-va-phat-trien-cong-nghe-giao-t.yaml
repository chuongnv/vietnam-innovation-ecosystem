id: research-trung-tam-nghien-cuu-khoa-hoc-va-phat-trien-cong-nghe-giao-t
name:
  vi: Trung tâm Nghiên cứu Khoa học và Phát triển Công nghệ Giao thông vận tải
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 2, D3, Phường Bình Thạnh Tây, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ cho ngành giao thông vận tải, vật liệu và hạ tầng; cung cấp các dịch vụ như thiết kế, tư vấn đầu tư, giám sát, kiểm định và kiểm tra chất lượng thiết bị, phương tiện, công trình giao thông, kèm đào tạo.'
  en: 'Centre researching and applying technology for transport, materials and infrastructure; it offers services such as investment consulting, design, supervision, inspection and quality assessment of transport equipment, vehicles and works, plus training.'
description_source:
  text: '1. Nghiên cứu phát triển và triển khai ứng dụng công nghệ ngành giao thông vận tải. 2. Sản xuất thử, thử nghiệm và chuyển giao công nghệ trong các lĩnh vực công nghiệp, công nghệ vật liệu, và kết cấu hạ tầng công trình giao thông, môi trường, cấp thoát nước và dân dụng. 3. Dịch vụ KH&CN: - Thông tin tư vấn, tổ chức đào tạo bồi dưỡng, ứng dụng tiến bộ khoa học kỹ thuật ngành giao thông vận tải và môi trường, tư vấn đầu tư, thiết kế, giám sát, kiểm định kỹ thuật, đánh giá chất lượng thiết bị, phương tiện, kết cấu hạ tầng công trình giao thông vận tải và môi trường, dàn khoan. 4. Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
