id: research-trung-tam-nghien-cuu-va-ung-dung-dia-chat
name:
  vi: Trung tâm Nghiên cứu và ứng dụng Địa chất
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 227, Nguyễn Văn Cừ, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng địa chất, chế biến nguyên liệu khoáng và vật liệu lọc; thực hiện đo vẽ bản đồ, khảo sát thăm dò địa chất, địa vật lý, khoáng sản, phân tích thí nghiệm địa chất và đào tạo chuyên môn như kiểm định đá quý, kỹ thuật khoan.'
  en: 'A centre doing applied geological research and processing of mineral raw materials and filter media; it carries out mapping, geological, geophysical and mineral surveys, geological lab analysis, and training such as gemstone testing and drilling techniques.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực địa chất. Sản xuất thử nghiệm và chuyển giao công nghệ chế biến nguyên liệu khoáng , vật liệu lọc. - Dịch vụ KH&CN: + Tư vấn, thông tin khoa học kỹ thuật và lập các dự án quy hoạch trong các lĩnh vực nghiên cứu. + Đo vẽ lập bản đồ: địa hình, địa chất, địa chất công trình, địa chất thuỷ văn, địa chất môi trường, khảo sát thăm dò địa chất, địa vật lý, địa chất công trình, địa chất thuỷ văn và các mỏ khoáng sản, tiến hành các thí nghiệm phân tích địa chất. + Đào tạo, huấn luyện, bồi dưỡng và nâng cao nghiệp vụ chuyên môn: kiểm định đá quý, bảo trì vận hành giếng và kỹ thuật khoan, tin học ứng dụng trong địa chất, thí nghiệm viên, kỹ thuật viên.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
