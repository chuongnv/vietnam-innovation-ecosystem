description:
  vi: 'Trung tâm nghiên cứu các vấn đề môi trường và phát triển giao thông vận tải; chuyển giao công nghệ, tư vấn và đào tạo, tuyên truyền nâng cao ý thức bảo vệ môi trường trong ngành.'
  en: 'Centre researching environmental and development issues in transport; it transfers technology, provides consulting, and runs training and awareness activities on environmental protection in the sector.'
description_source:
  text: '- Nghiên cứu các vấn đề về môi trường và phát triển giao thông vận tải. - Sản xuất thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn về môi trường và phát triển giao thông vận tải, đào tạo bồi dưỡng tuyên truyền ý thức bảo vệ môi trường. - Hợp tác trong và ngoài nước về môi trường và phát triển giao thông vận tải.'
