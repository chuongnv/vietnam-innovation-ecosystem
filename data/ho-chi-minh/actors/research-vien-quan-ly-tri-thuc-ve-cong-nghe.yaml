address: 35, Ung Văn Khiêm, Phường Bình Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, triển khai hệ thống quản lý chất lượng; cung cấp dịch vụ chứng nhận hệ thống chất lượng và chứng nhận sản phẩm đạt tiêu chuẩn, phổ biến thông tin khoa học và bồi dưỡng nâng cao nghiệp vụ.'
  en: 'Institute researching and implementing quality management systems; offers quality system certification, product conformity certification, scientific information and professional upskilling.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng các hệ thống quản lý chất lượng. 2. Dịch vụ KH&CN: Dịch vụ chứng nhận hệ thống quản lý chất lượng; chứng nhận sản phẩm phù hợp tiêu chuẩn; thông tin khoa học; huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
