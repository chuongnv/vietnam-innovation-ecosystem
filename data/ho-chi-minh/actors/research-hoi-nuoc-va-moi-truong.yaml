id: research-hoi-nuoc-va-moi-truong
name:
  vi: Hội Nước và Môi Trường Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 224, Điện Biên Phủ, Phường Xuân Hòa, TP. Hồ Chí Minh
description:
  vi: 'Hội chuyên ngành trực thuộc Liên hiệp các Hội Khoa học và Kỹ thuật TP.HCM, nghiên cứu kỹ thuật, quản lý môi trường và biến đổi khí hậu; tư vấn thiết kế hệ thống cấp thoát nước, xử lý chất thải, quan trắc môi trường và tổ chức hội thảo, đào tạo.'
  en: 'Professional association under the HCMC Union of Science and Technology Associations, researching environmental engineering, management and climate change; it advises on water supply, drainage and waste-treatment design, environmental monitoring, and runs seminars and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Kỹ thuật môi trường; Quản lý môi trường; Khoa học môi trường; Sử dụng hợp lý tài nguyên thiên nhiên; Nghiên cứu tình hình biến đổi khí hậu, nước biển dâng; Nghiên cứu ứng dụng công nghệ thông tin và thông tin địa lý trong lĩnh vực qui hoạch, quản lý và bảo vệ tài nguyên môi trường; Nghiên cứu công nghệ và thiết bị xử lý bảo vệ môi trường; Nghiên cứu phát triển bền vững cho các vùng đô thị, nông thôn và các vùng công nghiệp; Nghiên cứu các dự án bảo vệ môi trường cộng đồng. 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tư vấn thiết kế, xây dựng hệ thống xử lý chất thải và hệ thống cấp thoát nước đô thị và nông thôn; Tư vấn, cung cấp các dịch vụ thuộc lĩnh vực nước và môi trường; Quan trắc, phân tích và đánh giá các chỉ tiêu môi trường, lập báo cáo hiện trạng môi trường, báo cáo cấp thoát nước; Thẩm định và chuyển giao công nghệ môi trường; Tư vấn quản lý dự
    án cấp thoát nước và xử lý môi trường; Tổ chức hội nghị, hội thảo khoa học, đào tạo, bồi dưỡng trình độ chuyên môn và thực hiện các dịch vụ khoa học và công nghệ khác theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
