id: research-vien-cong-nghe-va-quan-tri-ung-dung
name:
  vi: Viện Công Nghệ Và Quản Trị Ứng Dụng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 208, Nguyễn Hữu Cảnh, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về kinh tế, quản trị kinh doanh và quan hệ sản xuất kinh doanh; nhận tư vấn, chuyển giao thành quả nghiên cứu, tổ chức hội thảo khoa học và đào tạo, nâng cao chuyên môn.'
  en: 'Institute doing applied research in economics, business administration and production relations; it offers consulting, transfer of research results, scientific seminars and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: Quan hệ sản xuất kinh doanh; kinh tế và quản trị kinh doanh. 2. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao kết quả nghiên cứu, tổ chức hội nghị, hội thảo khoa học, đào tạo, bồi dưỡng trình độ chuyên môn và thực hiện các dịch vụ khoa học và công nghệ khác theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu nêu trên. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
