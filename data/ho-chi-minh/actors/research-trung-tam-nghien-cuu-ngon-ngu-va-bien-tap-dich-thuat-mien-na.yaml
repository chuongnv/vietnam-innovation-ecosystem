address: 26A, Đường 43, Phường Xóm Chiếu, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ngôn ngữ học và ngôn ngữ học ứng dụng; cung cấp dịch vụ biên tập, dịch thuật, tổ chức hội thảo, tư vấn và tập huấn chuyên môn.'
  en: 'Centre researching linguistics and applied linguistics; it provides editing and translation services, holds seminars, and offers consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và công nghệ trong lĩnh vực: nghiên cứu chung về ngôn ngữ; ngôn ngữ học ứng dụng. 2. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo, tư vấn, tập huấn, bồi dưỡng chuyên môn, biên tập, dịch thuật theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
