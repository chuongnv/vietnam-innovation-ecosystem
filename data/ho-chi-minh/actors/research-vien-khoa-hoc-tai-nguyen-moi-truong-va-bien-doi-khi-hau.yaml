id: research-vien-khoa-hoc-tai-nguyen-moi-truong-va-bien-doi-khi-hau
name:
  vi: Viện Khoa Học Tài Nguyên Môi Trường Và Biến Đổi Khí Hậu
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 24/4/6A, Trần Ngọc Diện, Phường An Khánh, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về tài nguyên, môi trường và biến đổi khí hậu, gồm khí tượng, khí hậu, thủy văn, tài nguyên nước, trắc địa – bản đồ, quy hoạch, xử lý chất thải và quan trắc ô nhiễm; cung cấp tư vấn và chuyển giao kết quả nghiên cứu.'
  en: 'An institute researching natural resources, environment and climate change, including meteorology, climatology, hydrology, water resources, surveying and mapping, planning, waste treatment and pollution monitoring; it provides consulting and transfer of research results.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Tin học trong các ngành khoa học tự nhiên; Trắc địa học và bản đồ học, Khí tượng học và các khoa học khí quyển, Khí hậu học, Hải dương học, Thủy văn; Tài nguyên nước; Khoa học Môi trường - các khía cạnh xã hội, Nghiên cứu qui hoạch, phát triển đô thị và nông thôn, Công nghệ quản lý và xử lý chất thải, Công nghệ sản xuất sạch, tái chế, Công nghệ phục hồi và tái tạo môi trường, Công nghệ phân tích chu trình sống, Công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm, Công nghệ xử lý môi trường bằng phương pháp sinh học. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu nêu trên. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ, Dịch vụ đánh giá công nghệ, Dịch vụ xúc tiến chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên
    cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
