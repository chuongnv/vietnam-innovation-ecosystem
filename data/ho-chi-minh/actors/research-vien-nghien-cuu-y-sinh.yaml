id: research-vien-nghien-cuu-y-sinh
name:
  vi: Viện Nghiên cứu Y Sinh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 793/58 Trần Xuân Soạn, Phường Tân Hưng, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và ứng dụng trong vi sinh vật học, miễn dịch học và vi sinh y học; phổ biến kiến thức khoa học, tổ chức hội thảo, tư vấn chuyển giao công nghệ và tập huấn chuyên môn.'
  en: 'An institute doing research and applications in microbiology, immunology and medical microbiology; it disseminates scientific knowledge, organises conferences, advises on technology transfer and runs professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: Vi sinh vật học; Miễn dịch học; Vi sinh vật học y học. 2. Dịch vụ khoa học và công nghệ: Thông tin phổ biến kiến thức khoa học và công nghệ; tổ chức hội nghị, hội thảo khoa học; Tư vấn chuyển giao công nghệ; Tập huấn, bồi dưỡng trình độ chuyên môn và thực hiện các dịch vụ khoa học và công nghệ khác theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
