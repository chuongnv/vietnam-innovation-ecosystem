id: research-trung-tam-phat-trien-khcn-va-dich-vu
name:
  vi: Trung tâm phát triển KHCN và dịch vụ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 12, Nam Kỳ Khởi Nghĩa, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ trong vật lý, điện – điện tử, viễn thông, môi trường và năng lượng; sản xuất thử, chuyển giao công nghệ và cung cấp tư vấn, thông tin, đào tạo chuyên môn.'
  en: 'A centre doing applied research in physics, electrical engineering and electronics, telecoms, environment and energy; it pilots and transfers technology and provides consulting, information and training.'
description_source:
  text: '- Nghiên cứu ứng dụng công nghệ trong lĩnh vực vật lý, điện, điện tử, viễn thông, môi trường, năng lượng. - Sản xuất thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, thông tin khoa học và công nghệ, đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ) . - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
