id: research-vien-khoa-hoc-moi-truong
name:
  vi: Viện Khoa học Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 298-300A, Nguyễn Tất Thành, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng công nghệ xử lý nước cấp, nước thải, chất thải rắn và nguy hại, ô nhiễm không khí, đất, tiếng ồn và mùi; sản xuất thử sản phẩm nghiên cứu, tư vấn và chuyển giao kết quả.'
  en: 'An institute conducting applied research on technologies for treating water supply, wastewater, solid and hazardous waste, air and soil pollution, noise and odour; it pilots research products and provides consulting and transfer of results.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ xử lý nước cấp, nước thải, xử lý chất thải rắn, chất thải độc hại, công nghệ xử lý ô nhiễm không khí, xử lý chống xói mòn và ô nhiễm đất, xử lý tiếng ồn, kỹ thuật khử mùi, điều hòa không khí, công nghệ sạch và quản lý môi trường. 2. Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3- Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4- Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
