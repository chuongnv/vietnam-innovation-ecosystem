id: research-trung-tam-nghien-cuu-vung-va-do-thi
name:
  vi: Trung tâm nghiên cứu vùng và đô thị
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 62A, Phạm Ngọc Thạch, Phường Xuân Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu liên ngành về vùng và đô thị: xã hội học, dân số, địa lý kinh tế – văn hóa, quy hoạch đô thị – nông thôn và giao thông, kiến trúc, kỹ thuật hạ tầng; chuyển giao kết quả nghiên cứu, tổ chức hội thảo và tập huấn.'
  en: 'An interdisciplinary regional and urban studies centre covering sociology, population, economic and cultural geography, urban, rural and transport planning, architecture and infrastructure engineering; it transfers research results and runs seminars and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: phương pháp nghiên cứu xã hội học (2.4.1); nghiên cứu về dân số, nghiên cứu về nếp sống, nghiên cứu về các lĩnh vực sản xuất vật chất và dịch vụ (2.4.4); địa lý kinh tế và văn hóa (2.5.1); khoa học môi trường - các khía cạnh xã hội (2.5.2); nghiên cứu quy hoạch, phát triển đô thị và nông thôn (2.5.3); quy hoạch giao thông và các khía cạnh xã hội của giao thông vận tải (2.5.4); kiến trúc (4.1.1); kỹ thuật xây dựng (4.1.2); công trình hạ tầng đô thị (4.1.3); công trình giao thông vận tải (4.1.4); công trình thủy lợi (4.1.5); địa kỹ thuật (4.1.6). 2. Dịch vụ khoa học công nghệ: chuyển giao kết quả nghiên cứu, tổ chức hội nghị, hội thảo, tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
