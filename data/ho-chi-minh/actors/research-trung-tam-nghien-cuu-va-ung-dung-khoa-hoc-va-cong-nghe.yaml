id: research-trung-tam-nghien-cuu-va-ung-dung-khoa-hoc-va-cong-nghe
name:
  vi: Trung tâm Nghiên cứu và Ứng dụng Khoa học và Công nghệ
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 204, Ba Tháng Hai, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về quan trắc, kiểm soát ô nhiễm, xử lý chất thải, hóa lý, hóa phân tích và đo lường; cung cấp dịch vụ thử nghiệm, giám định chất lượng sản phẩm và kiểm định, hiệu chuẩn phương tiện đo.'
  en: 'A centre doing applied research in environmental monitoring, pollution control, waste treatment, physical and analytical chemistry and metrology; it provides product testing and inspection and calibration of measuring instruments.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: Công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí), hóa lý, hóa phân tích, đo lường. 2. Sản xuất thử - thử nghiệm; sản xuất kinh doanh các sản phẩm từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Dịch vụ thử nghiệm chất lượng sản phẩm, hàng hóa; Dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật; Dịch vụ thông tin khoa học và công nghệ, đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ); Dịch vụ tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống đảm bảo về đo lường; Dịch
    vụ tư vấn chuyển giao công nghệ; Dịch vụ giám định công nghệ. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
