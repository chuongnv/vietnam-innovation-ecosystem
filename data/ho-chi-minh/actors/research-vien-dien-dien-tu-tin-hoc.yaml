id: research-vien-dien-dien-tu-tin-hoc
name:
  vi: Viện Điện - Điện tử - Tin học
type: research
categories:
- Tổ chức khoa học và công nghệ
address: TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về kỹ thuật điện – điện tử, tự động hóa, điều khiển, viễn thông và hệ thống thông tin – truyền thông; sản xuất thử từ kết quả nghiên cứu, tư vấn và bồi dưỡng chuyên môn.'
  en: 'An institute conducting applied research in electrical and electronic engineering, automation, control, telecommunications and ICT systems; it pilots research outputs and provides consulting and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: kỹ thuật điện và điện tử; công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; kỹ thuật, công nghệ viễn thông, các hệ thống thông tin và truyền thông. - Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
