id: research-trung-tam-phan-tich-va-phat-trien-khoa-hoc-cong-nghe
name:
  vi: Trung Tâm Phân Tích Và Phát Triển Khoa Học Công Nghệ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 52, Đường số 6, Phường Long Trường, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu đa lĩnh vực về xử lý chất thải, hóa vô cơ – hữu cơ, phân bón, quan trắc và phục hồi môi trường, cảm biến sinh học, vật liệu nano, địa kỹ thuật và hạ tầng; cung cấp thử nghiệm, giám định chất lượng, tư vấn tiêu chuẩn và phòng thử nghiệm.'
  en: 'A multi-field research centre covering waste treatment, inorganic and organic chemistry, fertilisers, environmental monitoring and remediation, biosensors, nanomaterials, geotechnics and infrastructure; it provides quality testing and inspection and advises on standards and testing laboratories.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ hóa vô cơ và phân bón hóa học; công nghệ hóa hữu cơ; quá trình và thiết bị công nghệ hóa học; công nghệ phục hồi và tái tạo môi trường; công nghệ phân tích chu trình sống; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; công nghệ xử lý môi trường bằng phương pháp sinh học; công nghệ chế tạo cảm biến sinh học (kit) chẩn đoán môi trường; các quy trình nano; công nghệ chế tạo địa chất, địa kỹ thuật; công trình hạ tầng đô thị; công trình thủy lợi; công nghệ chế tạo và kỹ thuật cơ khí thiết bị năng lượng (không bao gồm thiết bị năng lượng hạt nhân). 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: - Tổ chức hội nghị, hội thảo, tư vấn, môi giới chuyển giao công nghệ, tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Dịch vụ nghiên
    cứu xây dựng cơ sở dữ liệu (thư mục và toàn văn); - Dịch vụ thử nghiệm, giám định chất lượng sản phẩm, hàng hóa; - Dịch vụ tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống bảo đảm về đo lường. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
