id: research-vien-nghien-cuu-ung-dung-cong-nghe-sinh-hoc-lotus-aroma
name:
  vi: Viện Nghiên cứu Ứng Dụng Công Nghệ Sinh Học Lotus Aroma
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 3, Hòa Bình, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu công nghệ môi trường và công nghệ sinh học, tập trung vào xử lý chất thải, xử lý ô nhiễm bằng phương pháp sinh học và sản xuất chế phẩm sinh học cho nông nghiệp, thủy sản, thực phẩm và dược phẩm; kèm dịch vụ tư vấn, chuyển giao và đào tạo.'
  en: 'An institute researching environmental technology and biotechnology, focusing on waste treatment, biological pollution treatment and bio-products for agriculture, aquaculture, food and pharmaceuticals, with related consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Khoa học môi trường, công nghệ sinh học và khoa học quản lý; công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ sản xuất sạch, tái chế; công nghệ phục hồi cải tạo môi trường, kiểm soát và xử lý ô nhiễm; công nghệ xử lý môi trường bằng phương pháp sinh học; vệ sinh môi trường; công nghệ sản xuất các chế phẩm sinh học ứng dụng vào các lĩnh vực nông nghiệp, thủy sản, môi trường, thực phẩm, thực phẩm chức năng và dược phẩm. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo khoa học, thực hiện các dịch vụ khoa học và công nghệ theo lĩnh vực đăng ký; tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, đào tạo, huấn luyện, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
