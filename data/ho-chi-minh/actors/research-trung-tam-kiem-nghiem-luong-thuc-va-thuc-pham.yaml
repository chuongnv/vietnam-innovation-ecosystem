id: research-trung-tam-kiem-nghiem-luong-thuc-va-thuc-pham
name:
  vi: Trung tâm Kiểm nghiệm Lương thực và Thực phẩm
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: Phòng C112 - 19 Nguyễn Hữu Thọ, Phường Tân Hưng, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Tôn Đức Thắng, nghiên cứu về chế biến và kiểm nghiệm lương thực, thực phẩm; nhận phân tích mẫu tại phòng thí nghiệm, chuyển giao công nghệ, tư vấn và tập huấn.'
  en: 'Centre under Ton Duc Thang University, researching testing and processing of food and grain; it offers laboratory analysis, consulting, technology transfer and training.'
description_source:
  text: '- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: kiểm nghiệm và chế biến lương thực thực phẩm. - Sản xuất thử - thử nghiệm; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. - Dịch vụ KH&CN: Phân tích thí nghiệm; tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
