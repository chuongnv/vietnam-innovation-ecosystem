id: research-trung-tam-khoi-nghiep-doi-moi-sang-tao-dai-hoc-quoc-gia-tp-h
name:
  vi: Trung tâm khởi nghiệp đổi mới sáng tạo - Đại học Quốc gia TP.HCM (IEC)
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm ĐMST
description:
  vi: 'Trung tâm trực thuộc Đại học Quốc gia TP.HCM, nghiên cứu và cung cấp dịch vụ hỗ trợ khởi nghiệp, đổi mới sáng tạo; kết nối các bên trong hệ sinh thái, hỗ trợ quản trị doanh nghiệp, sở hữu trí tuệ và đào tạo về khởi nghiệp.'
  en: 'Centre of Vietnam National University HCMC that researches and provides startup and innovation support; it connects ecosystem stakeholders, assists with business management and intellectual property, and runs entrepreneurship training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ liên quan đổi mới sáng tạo, khởi nghiệp và hỗ trợ khởi nghiệp; 2. Dịch vụ khoa học và công nghệ: + Cung cấp các dịch vụ đổi mới sáng tạo, hỗ trợ khởi nghiệp; kết nối, hợp tác với các bên liên quan trong hệ sinh thái khởi nghiệp để cung ứng các dịch vụ cho các dự án, doanh nghiệp khởi nghiệp; + Cung ứng các dịch vụ liên quan đến quản trị doanh nghiệp như: marketing, bán hàng, tuyển dụng, quản trị tài sản trí tuệ cho các tổ chức, doanh nghiệp; + Đào tạo, tập huấn về đổi mới sáng tạo, khởi nghiệp và hỗ trợ khởi nghiệp (chỉ cấp chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./."'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
