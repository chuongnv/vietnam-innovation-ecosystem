id: research-trung-tam-chat-luong-quoc-te
name:
  vi: Trung tâm Chất lượng Quốc tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 37, Trần Quý Khoách, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm tư vấn và đào tạo về kinh tế, quản lý, chủ yếu là quản lý chất lượng, cùng các mảng marketing, xuất nhập khẩu, tài chính - kế toán, dự án đầu tư, thương hiệu và nhượng quyền.'
  en: 'Centre providing consulting and training in economics and management, mainly quality management, along with marketing, import-export, finance and accounting, investment projects, branding and franchising.'
description_source:
  text: '- Tư vấn và đào tạo bồi dưỡng các lĩnh vực về kinh tế và quản lý, đặc biệt là quản lý chất lượng bao gồm: + Marketing, bán hàng, quảng cáo. + Dịch vụ xuất nhập khẩu. + Dự án đầu tư + Tài chính và kế toán. + Thẩm định, đánh giá các hoạt động và hiệu quả kinh tế. + Thương hiệu và nhượng quyền. + Các tiêu chuẩn quốc tế và Giám đốc chất lượng. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
