id: research-trung-tam-uom-tao-doanh-nghiep-nong-nghiep-cong-nghe-cao-ban
name:
  vi: Trung tâm Ươm tạo Doanh nghiệp Nông nghiệp Công nghệ cao - Ban Quản Lý Khu NNCNC Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: Ấp 01, Xã Nhuận Đức, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm thuộc Ban Quản lý Khu Nông nghiệp Công nghệ cao TP.HCM, nghiên cứu phát triển nông nghiệp công nghệ cao, sản xuất thử, ươm tạo và chuyển giao công nghệ; hỗ trợ ươm tạo doanh nghiệp nông nghiệp công nghệ cao và cung cấp dịch vụ sở hữu trí tuệ, đào tạo.'
  en: 'A centre under the Management Board of the HCMC Agricultural Hi-Tech Park that does high-tech agriculture R&D, pilot production and technology incubation and transfer; it incubates high-tech agricultural enterprises and provides IP services and training.'
description_source:
  text: '- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực nông nghiệp ứng dụng công nghệ cao. - Sản xuất thử - thử nghiệm, ươm tạo công nghệ và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Dịch vụ sở hữu trí tuệ, thông tin khoa học và công nghệ, đào tạo bồi dưỡng hỗ trợ và ươm tạo doanh nghiệp nông nghiệp công nghệ cao. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
