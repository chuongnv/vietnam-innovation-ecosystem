id: research-vien-nghien-cuu-tam-anh
name:
  vi: Viện Nghiên cứu Tâm Anh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 2B, Phổ Quang, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học trong nhiều chuyên ngành y, dược và sức khỏe (như hỗ trợ sinh sản, tim mạch, tế bào gốc, dược liệu) cùng kinh tế và quản trị bệnh viện; thực hiện sản xuất thử nghiệm, kiểm nghiệm chất lượng sản phẩm, tổ chức hội thảo và đào tạo chuyên môn.'
  en: 'An institute conducting research across many medical, pharmaceutical and health fields (such as assisted reproduction, cardiology, stem cells and medicinal materials) as well as economics and hospital management; it also does pilot production, product quality testing, scientific events and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: - Khoa học Y, Dược và Sức khỏe: Dược lý học, Dược học lâm sàng và điều trị, Dược liệu học; Hóa dược học, Thực phẩm chức năng; Giải phẫu học và hình thái học, Di truyền y học, Miễn dịch học, Thần kinh học, Sinh lý học y học, Mô học, Tế bào gốc, Sinh hóa y học, Vi sinh vật học y học, Ký sinh trùng y học, Sinh lý bệnh, Giải phẫu bệnh và pháp y; Nam học, Sản khoa, phụ khoa, hỗ trợ sinh sản, Nhi khoa, Tim mạch, Huyết học và truyền máu, Bệnh đường hô hấp, Ngoại khoa, Nha khoa, Ung thư học, Nha khoa, Thần kinh học, Tâm thần học, Nội khoa, Chẩn đoán hình ảnh, Bệnh về khớp, Nội tiết và chuyển hóa, Tiêu hóa và gan mật học, Niệu học và thận học, Lão khoa, điều dưỡng. - Kinh tế và Kinh doanh: Kinh tế học; Kinh tế vi mô; Kinh tế vĩ mô; chính sách tiền tệ; Khoa học kinh tế chuyên ngành; Quan hệ sản xuất kinh doanh; Khoa học quản lý; Quản trị kinh doanh; Quản trị bệnh viện; Kế toán; Tài chính; Ngân hàng; Tiếp thị; Bảo hiểm; Kiểm toán
    và các vấn đề kinh doanh và quản lý khác. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm là kết quả của các nghiên cứu khoa học nêu trên. 3. Dịch vụ khoa học và công nghệ: Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ; Thông tin khoa học và công nghệ; Dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa. Tổ chức hội nghị, hội thảo khoa học; Đào tạo nâng cao trình độ quản lý, điều hành sản xuất, kinh doanh và chuyên môn cho đội ngũ cán bộ khoa học và công nghệ trong các lĩnh vực nghiên cứu nêu trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
