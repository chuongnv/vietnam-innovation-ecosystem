id: startup-yuumi-tro-ly-suc-khoe-thong-minh
name:
  vi: Yuumi - Trợ lý sức khỏe thông minh
type: startup
categories:
- Phần mềm, CNTT
- Y tế, CSSK
- Dịch vụ
sectors:
- ai
- health
founded: 2023
website: https://yuumiai.vn/
address: Quận 7, thành phố Hồ Chí Minh
description:
  vi: 'Ứng dụng chăm sóc sức khỏe tích hợp AI do bác sĩ lâm sàng và kỹ sư CNTT phát triển, hỗ trợ khám sàng lọc, lưu trữ hồ sơ sức khỏe và đặt các gói khám chuyên sâu.'
  en: 'An AI-enabled healthcare app developed by clinicians and IT engineers that supports health screening, stores health records and lets users book specialised check-up packages.'
description_source:
  text: https://yuumiai.vn/ Phần mềm, CNTT, Dịch vụ, Y tế, CSSK Dịch Vụ Y Tế Số, Mô Hình Ngang Hàng (P2P) 15-06-2023 Việt Nam Hồ Chí Minh Yuumi mang đến cho bạn trải nghiệm chăm sóc sức khỏe toàn diện, chuyên sâu một cách dễ dàng và thanh toán tiện lợi. Là một ứng dụng đa di năng, tích hợp trí tuệ nhân tạo AI, được tạo nên bởi đội ngũ bác sĩ lâm sàng và công nghệ thông tin, giúp việc khám sàng lọc người dùng được tối ưu thời gian thăm khám, lưu trữ hồ sơ một cách bảo mật. Ứng dụng còn cung cấp nhiều loại gói khám chuyên sâu đặc biệt phù hợp với nhu cầu cá nhân, cùng với vô vàn ưu đãi giúp bạn vừa an tâm vừa khỏe mạnh.
