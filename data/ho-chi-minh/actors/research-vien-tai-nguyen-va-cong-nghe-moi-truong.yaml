id: research-vien-tai-nguyen-va-cong-nghe-moi-truong
name:
  vi: Viện Tài nguyên và Công nghệ Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1091, Trần Hưng Đạo, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về khai thác, bảo vệ tài nguyên thiên nhiên và công nghệ môi trường (sản xuất sạch, phục hồi môi trường, quan trắc, xử lý ô nhiễm); lập đề án thăm dò khai thác khoáng sản, nước, đánh giá tác động môi trường và tư vấn, đào tạo.'
  en: 'An institute researching the use and protection of natural resources and environmental technology (cleaner production, remediation, monitoring and pollution control); it prepares exploration plans for minerals and water, carries out environmental impact assessments and offers consulting and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực khai thác và bảo vệ tài nguyên thiên nhiện; công nghệ sản xuất sạch và tái chế; công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. 2. Sản xuất thử - thử nghiệm; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. 3. Dịch vụ KH&CN: Tư vấn, thông tin khoa học và công nghệ, đào tạo bồi dưỡng theo lĩnh vực đăng ký. - Lập đề án thăm dò khai thác mỏ đá xây dựng, mỏ sét gạch ngói, cát xây dựng, nước ngầm, nước mặt, - Lập đề án nghiên cứu bảo vệ tài nguyên thiên nhiên (bao gồm môi trường không khí, nước, đất và môi trường sinh vật) - Đánh giá tác động môi trường các công trình xây dựng và khai thác tài nguyên thiên nhiên, xử lý ô nhiễm từ các nhà máy. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
