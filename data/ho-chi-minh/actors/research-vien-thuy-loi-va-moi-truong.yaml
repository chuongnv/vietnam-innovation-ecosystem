id: research-vien-thuy-loi-va-moi-truong
name:
  vi: Viện Thủy lợi và Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 2, Trường Sa, Phường Gia Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, phát triển và chuyển giao công nghệ về thủy lợi, thủy điện, địa kỹ thuật, vật liệu xây dựng, cấp thoát nước, môi trường và phòng chống thiên tai; cung cấp tư vấn khảo sát, thiết kế, thí nghiệm và kiểm tra an toàn công trình.'
  en: 'An institute doing research, development and technology transfer in irrigation, hydropower, geotechnics, construction materials, water supply and drainage, environment and disaster prevention; it provides consulting on surveys, design, testing and structural safety checks.'
description_source:
  text: '- Nghiên cứu khoa học, phát triển và chuyển giao công nghệ trong lĩnh vực thủy lợi, thủy điện, địa kỹ thuật, vật liệu và công nghệ xây dựng mới, cấp thoát nước, cơ sở hạ tầng, thủy sản, môi trường, phòng tránh và giảm nhẹ thiên tai. - Sản xuất thử nghiệm, chuyển giao tiến bộ khoa học công nghệ thuộc các lĩnh vực đăng ký, tham gia thi công các công trình có áp dụng tiến bộ khoa học công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn đầu tư, điều tra cơ bản, quy hoạch, lập dự án, khảo sát, thiết kế, thẩm định, đấu thầu, phản biện, giám sát, thí nghiệm, kiểm tra an toàn công trình, đánh giá và xử lý môi trường, thông tin khoa học công nghệ, tham gia đào tạo huấn luyện bồi dưỡng nâng cao nghệp vụ. - Liên kết hợp tác với các tổ chức trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
