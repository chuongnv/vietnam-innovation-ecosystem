id: research-vien-cong-nghe-thong-tin-va-quan-tri-tai-chinh
name:
  vi: Viện Công nghệ Thông tin và Quản trị Tài chính
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 126, Nguyễn Thị Minh Khai, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về quản trị kinh doanh và công nghệ phần mềm; sản xuất thử, kinh doanh sản phẩm nghiên cứu và cung cấp tư vấn, thông tin khoa học, bồi dưỡng chuyên môn.'
  en: 'An institute conducting applied research in business management and software engineering; it pilots and sells research products and offers consulting, S&T information and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: kinh doanh và quản trị kinh doanh; công nghệ phần mềm. 2- Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3- Dịch vụ KH&CN: Tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
