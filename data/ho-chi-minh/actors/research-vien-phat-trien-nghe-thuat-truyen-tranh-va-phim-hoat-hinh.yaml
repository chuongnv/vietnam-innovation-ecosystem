id: research-vien-phat-trien-nghe-thuat-truyen-tranh-va-phim-hoat-hinh
name:
  vi: Viện phát triển nghệ thuật truyện tranh và phim hoạt hình
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: 53, Huỳnh Khương Ninh, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và ứng dụng trong mỹ thuật, điện ảnh, truyền hình và công nghệ phần mềm phục vụ phát triển truyện tranh và phim hoạt hình; cung cấp tư vấn, thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'An institute doing research and applications in fine arts, film, television and software to develop comics and animation, and providing consulting, scientific information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: mỹ thuật, nghệ thuật điện ảnh, nghệ thuật truyền thanh, truyền hình, công nghệ phần mềm. 2. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
