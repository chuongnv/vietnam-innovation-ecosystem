id: research-trung-tam-nghien-cuu-va-ung-dung-cong-nghe-sinh-hoc-nhiet-do
name:
  vi: Trung tâm Nghiên cứu và ứng dụng công nghệ sinh học Nhiệt đới
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 69/4/75, Đường Trục, Phường Bình Lợi, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ sinh học nhiệt đới trong bảo vệ thực vật, nông hóa, chế biến nông sản và vi sinh nông nghiệp; sản xuất thử sản phẩm nghiên cứu, chứng nhận hệ thống quản lý chất lượng và sản phẩm, tư vấn, chuyển giao.'
  en: 'A tropical biotechnology research centre working on plant protection, agrochemistry, post-harvest processing and agricultural microbiology; it pilots research products, certifies quality management systems and products, and provides consulting and technology transfer.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: bảo vệ thực vật, nông hóa, bảo quản và chế biến nông sản, công nghệ vi sinh vật trong nông nghiệp. - Sản xuất thử - thử nghiệm; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. - Dịch vụ KH&CN: dịch vụ chứng nhận hệ thống quản lý chất lượng, chứng nhận sản phẩm phù hợp tiêu chuẩn, tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
