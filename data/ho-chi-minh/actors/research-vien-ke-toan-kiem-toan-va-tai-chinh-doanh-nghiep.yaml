id: research-vien-ke-toan-kiem-toan-va-tai-chinh-doanh-nghiep
name:
  vi: Viện Kế toán Kiểm toán và Tài chính Doanh nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 137E, Nguyễn Chí Thanh, Phường Vườn Lài, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh với trọng tâm là kế toán, kiểm toán và tài chính doanh nghiệp; hoạt động dịch vụ gồm tư vấn, chuyển giao kết quả, phổ biến thông tin và bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in business administration focused on accounting, auditing and corporate finance; services include consulting, transfer of research results, information dissemination and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. - Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định..'
