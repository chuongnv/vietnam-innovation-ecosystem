id: research-trung-tam-ung-dung-tien-bo-khoa-hoc-va-cong-nghe
name:
  vi: Trung tâm Ứng dụng tiến bộ Khoa học và Công nghệ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 176/9A, Lê Văn Sỹ, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm ứng dụng tiến bộ khoa học công nghệ vào sản xuất, đời sống và bảo vệ môi trường; thực hiện dự án sản xuất thử nghiệm, khảo nghiệm, xây dựng mô hình trình diễn, chuyển giao, thương mại hóa kết quả và tập huấn cho người dân, doanh nghiệp.'
  en: 'A centre applying S&T advances to production, daily life and environmental protection; it runs pilot production projects and field trials, builds demonstration models, transfers and commercialises results, and trains residents and businesses.'
description_source:
  text: '1. Nghiên cứu, triển khai ứng dụng thành tựu khoa học và công nghệ trong và ngoài nước vào các lĩnh vực sản xuất, đời sống và bảo vệ môi trường; 2. Dịch vụ khoa học và công nghệ: + Thực hiện các dự án sản xuất thực nghiệm; đào tạo, chuyển giao, thương mại hóa và nhân rộng các kết quả của đề tài và dự án sản xuất thử nghiệm; + Lựa chọn các tiến bộ kỹ thuật và tổ chức khảo nghiệm để hoàn thiện quy trình kỹ thuật phù hợp với điều kiện địa phương đối với các sản phẩm mới; + Xây dựng, lắp đặt và chế tạo thiết bị, sản xuất các sản phẩm hoặc các công trình phục vụ sản xuất và đời sống sau khi nghiên cứu thành công hoặc nhận chuyển giao công nghệ từ các tổ chức khoa học công nghệ trong và ngoài nước; + Thực hiện các nhiệm vụ về phổ biến, giới thiệu, quảng bá và kinh doanh các sản phẩm tiến bộ khoa học và công nghệ phục vụ sản xuất và đời sống; + Cung cấp các kiến thức về khoa học và công nghệ phục vụ phát triển sản xuất cho người dân, tổ chức và doanh nghiệp, tổ chức đào tạo, tập huấn chuyển
    giao các tiến bộ khoa học kỹ thuật đến người dân, tổ chức và doanh nghiệp; Tổ chức các cuộc tham quan các mô hình ứng dụng tiến bộ khoa học kỹ thuật trong và ngoài thành phố; + Xây dựng các mô hình trình diễn về ứng dụng công nghệ mới, các kỹ thuật tiến bộ và phổ biến nhân rộng nhằm phát huy tài năng, thế mạnh của thành phố; + Thực hiện các giải pháp hỗ trợ doanh nghiệp và người dân đổi mới công nghệ, tư vấn, đào tạo và thực hiện dịch vụ khoa học và công nghệ theo thẩm quyền; Hỗ trợ, thúc đẩy hoạt động đổi mới sáng tạo trong doanh nghiệp và khởi nghiệp; + Nghiên cứu tư vấn chuyển giao công nghệ về tiết kiệm năng lượng và năng lượng tái tạo; 3. Hợp tác nghiên cứu khoa học và phát triển công nghệ theo quy định của pháp luật.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
