id: research-trung-tam-nghien-cuu-va-tu-van-nong-nghiep-nhiet-doi
name:
  vi: Trung tâm nghiên cứu và tư vấn nông nghiệp nhiệt đới
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 121 Nguyễn Bĩnh Khiêm, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về nông hóa, thổ nhưỡng, chọn tạo và nhân giống cây trồng nhiệt đới; cung cấp dịch vụ tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research on agrochemistry, soil science and the breeding and propagation of tropical crops; it provides consulting, transfer of research results and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: nông hóa, thổ nhưỡng, chọn tạo giống cây trồng, công nghệ nhân giống cây trồng. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
