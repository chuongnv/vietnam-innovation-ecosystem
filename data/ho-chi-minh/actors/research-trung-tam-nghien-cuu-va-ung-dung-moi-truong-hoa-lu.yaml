id: research-trung-tam-nghien-cuu-va-ung-dung-moi-truong-hoa-lu
name:
  vi: Trung tâm nghiên cứu và Ứng dụng Môi trường Hoa Lư
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 284/41/1, Lý Thường Kiệt, Phường Diên Hồng, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ quản lý, xử lý chất thải và quan trắc, kiểm soát ô nhiễm môi trường; cung cấp dịch vụ tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research on waste management and treatment and environmental monitoring and pollution control, providing consulting, transfer of research results and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ quan trắc môi trường, kiểm sóat và xử lý ô nhiễm. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
