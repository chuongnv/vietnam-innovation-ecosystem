id: research-vien-te-bao-goc
name:
  vi: Viện tế bào gốc
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: Tòa Nhà B2-3, Trường Đại Học Khoa Học Tự Nhiên, Khu Phố 6, Phường Linh Xuân, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ tế bào gốc và công nghệ sinh học, kinh doanh sản phẩm từ nghiên cứu, cung cấp tư vấn chuyển giao công nghệ và đào tạo chuyên môn.'
  en: 'An institute doing research and technology development in stem cells and biotechnology, commercialising research-based products and offering technology transfer consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực tế bào gốc và công nghệ sinh học. 2. Dịch vụ khoa học và công nghệ: tư vấn thiết kế chuyển giao công nghệ; đào tạo, tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký. 3. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
