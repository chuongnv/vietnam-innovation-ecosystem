id: research-trung-tam-nghien-cuu-cong-nghe-hoa-va-dinh-duong-cay-trong
name:
  vi: Trung tâm nghiên cứu công nghệ hóa và dinh dưỡng cây trồng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 139 Đường Man Thiện, Phường Long Hiệp, TP.HCM
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ hóa vô cơ, phân bón hóa học, nông hóa và thổ nhưỡng; sản xuất thử sản phẩm từ kết quả nghiên cứu, tư vấn, chuyển giao và bồi dưỡng chuyên môn.'
  en: 'Centre researching and applying inorganic chemistry, chemical fertilisers, agrochemistry and soil science; it pilot-produces research-based products and provides consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ hóa vô cơ và phân bón hóa học, nông hóa, thổ nhưỡng. 2. Sản xuất thử -thử nghiệm các sản phẩm từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, ứng dụng khoa học công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
