  text: '- Trình độ chuyên môn: + Cử nhân công nghệ thông tin - Trường đại học khoa học tự nhiên (2000-2004) + 2006, Hoàn thành Khóa đào tạo Giám đốc Marketing tại Marcom + 2012, Hoàn thành Khóa đào tạo Quản trị Công ty Tư vấn, do University of Applied Sciences and Arts Northwestern Switzerland và HCM University of Technology phối hợp + 2015, Chứng chỉ Gamification, do Wharton University of Pennsylvania, US. cấp + 2018-2019, Chứng chỉ Huấn luyện viên (Coaching Certificate) - Lĩnh vực tư vấn: Chuyển đổi số doanh nghiệp; Đổi mới sáng tạo; Thương mại điện tử'
