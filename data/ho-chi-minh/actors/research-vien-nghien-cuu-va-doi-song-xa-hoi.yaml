id: research-vien-nghien-cuu-va-doi-song-xa-hoi
name:
  vi: Viện Nghiên cứu và Đời Sống Xã Hội
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 88-90, Ký Con, Phường Bến Thành, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học xã hội về giáo dục, xã hội học (giới, gia đình, dân số, lối sống), nhân chủng học và lịch sử Việt Nam; cung cấp dịch vụ thông tin, xây dựng cơ sở dữ liệu, thư viện, lưu trữ và tổ chức hội thảo.'
  en: 'An institute doing social science research on education, sociology (gender, family, population, lifestyles), anthropology and Vietnamese history, and providing information services, database building, library and archival services and scientific events.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong các lĩnh vực: khoa học giáo dục nói chung; phương pháp nghiên cứu xã hội học; nhân chủng học; xã hội học chuyên đề (Nghiên cứu về giới và phụ nữ; nghiên cứu gia đình; nghiên cứu về dân số; nghiên cứu về nếp sống; nghiên cứu về các lĩnh vực sản xuất vật chất, dịch vụ); lịch sử Việt Nam. 2. Dịch vụ khoa học và công nghệ: cung cấp dịch vụ tra cứu và chỉ dẫn thông tin khoa học và công nghệ; dịch vụ nghiên cứu xây dựng cơ sở dữ liệu (thư mục và toàn văn); dịch vụ nghiên cứu xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu, lưu trữ điện tử; dịch vụ thư viện khoa học và công nghệ; dịch vụ lưu trữ tài liệu khoa học và công nghệ; tập huấn bồi dưỡng chuyên môn, tổ chức hội nghị, hội thảo khoa học theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng kí phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
