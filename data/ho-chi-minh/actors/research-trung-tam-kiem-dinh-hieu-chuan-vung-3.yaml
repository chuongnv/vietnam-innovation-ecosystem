id: research-trung-tam-kiem-dinh-hieu-chuan-vung-3
name:
  vi: Trung Tâm Kiểm Định Hiệu Chuẩn Vùng 3
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 69, Đường số 8, Phường An Khánh, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu cơ khí, cơ điện tử, điện - điện tử và thiết bị năng lượng; cung cấp kiểm định, hiệu chuẩn, thử nghiệm các phương tiện đo cũng như chứng nhận sản phẩm và hệ thống quản lý chất lượng.'
  en: 'Centre researching mechanical engineering, mechatronics, electrical and electronic engineering and energy equipment; it provides inspection, calibration and testing of measuring instruments as well as product and quality-management-system certification.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Kỹ thuật cơ khí nói chung; Công nghệ chế tạo máy nói chung; Công nghệ chế tạo và kỹ thuật cơ khí thiết bị năng lượng (không bao gồm thiết bị năng lượng hạt nhân); Công nghệ cơ điện tử, hệ vi cơ điện tử; Kỹ thuật điện và điện tử 2. Dịch vụ khoa học và công nghệ: + Dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo; + Dịch vụ chứng nhận hệ thống quản lý chất lượng; chứng nhận sản phẩm phù hợp tiêu chuẩn; + Dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật; Dịch vụ thử nghiệm chất lượng sản phẩm, hàng hóa; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Dịch vụ tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống bảo đảm về đo lường. + Thông tin khoa học và công nghệ, chuyển giao công nghệ, tập huấn, bồi dưỡng chuyên
    môn, theo lĩnh vực đăng ký (chỉ cấp Giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
