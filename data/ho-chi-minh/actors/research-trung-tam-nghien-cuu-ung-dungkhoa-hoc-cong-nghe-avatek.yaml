id: research-trung-tam-nghien-cuu-ung-dungkhoa-hoc-cong-nghe-avatek
name:
  vi: Trung Tâm Nghiên Cứu Ứng DụngKhoa Học Công Nghệ Avatek
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 66/122, Bình Thành, Phường Bình Hưng Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về an toàn thực phẩm, hóa phân tích, hóa polyme, công nghệ hóa học và quan trắc, xử lý ô nhiễm môi trường; cung cấp dịch vụ thử nghiệm, giám định chất lượng hàng hóa, kiểm định – hiệu chuẩn phương tiện đo và chuyển giao công nghệ.'
  en: 'A research centre in food safety, analytical and polymer chemistry, chemical engineering and environmental monitoring and pollution control; it provides product testing and inspection, calibration of measuring instruments and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Vệ sinh an toàn thực phẩm; Hóa phân tích; Hóa học cao phân tử; Các vấn đề chung về hóa học công nghiệp; Quá trình và thiết bị công nghệ hóa học Công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; 2. Sản xuất thử - thử nghiệm; sản xuất - kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ; Dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; Kiểm định, hiệu chuẩn phương tiện đo; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên. (Chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền);
    4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
