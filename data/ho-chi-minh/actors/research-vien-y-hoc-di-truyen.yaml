id: research-vien-y-hoc-di-truyen
name:
  vi: Viện Y học Di truyền
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 343/24-26, Sư Vạn Hạnh, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và ứng dụng di truyền y học và công nghệ tế bào trong y học, sản xuất thử nghiệm từ kết quả nghiên cứu và cung cấp tư vấn, chuyển giao công nghệ, bồi dưỡng chuyên môn.'
  en: 'An institute doing research and applications in medical genetics and cell technology in medicine, carrying out pilot production and providing consulting, technology transfer and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: di truyền y học, công nghệ tế bào trong y học. 2- Sản xuất thử nghiệm từ kết quả nghiên cứu. 3- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
