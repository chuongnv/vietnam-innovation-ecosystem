id: research-trung-tam-nghien-cuu-dich-vu-sinh-vat-canh
name:
  vi: Trung tâm Nghiên cứu Dịch vụ Sinh Vật Cảnh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 480A Lê Văn Sỹ, Phường Nhiêu Lộc, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về sinh vật cảnh; tư vấn thiết kế, giám sát, thi công và bảo dưỡng các hạng mục sinh vật cảnh, cung cấp thông tin và bồi dưỡng kiến thức trong lĩnh vực này.'
  en: 'Centre researching ornamental plants and animals; it provides design, supervision, installation and maintenance of ornamental landscaping works, along with information and training in the field.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực sinh vật cảnh. 2. Dịch vụ KH&CN: Tư vấn thiết kế, tư vấn giám sát, tư vấn thi công và bảo dưỡng các dịch vụ sinh vật cảnh, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng kiến thức về sinh vật cảnh (không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
