id: research-trung-tam-cong-nghe-moi-truong-tai
name:
  vi: Trung tâm Công nghệ Môi trường tại Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1, Mạc Đĩnh Chi, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng trong lĩnh vực môi trường; cung cấp dịch vụ thử nghiệm mẫu môi trường, nông nghiệp, thực phẩm, đánh giá tác động môi trường, quy hoạch, tư vấn và đào tạo.'
  en: 'Centre conducting environmental research and applications; it offers testing of environmental, agricultural and food samples, environmental impact assessment, planning, consulting and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực môi trường. - Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: thử nghiệm trong lĩnh vực môi trường, nông nghiệp, thực phẩm; quy hoạch, đánh giá tác động môi trường,; tư vấn, thông tin và đào tạo bồi dưỡng theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
