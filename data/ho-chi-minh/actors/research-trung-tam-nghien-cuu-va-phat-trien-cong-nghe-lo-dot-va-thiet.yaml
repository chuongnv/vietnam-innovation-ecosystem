id: research-trung-tam-nghien-cuu-va-phat-trien-cong-nghe-lo-dot-va-thiet
name:
  vi: Trung Tâm Nghiên Cứu Và Phát Triển Công Nghệ Lò Đốt Và Thiết Bị Nhiệt
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 224, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ lò đốt, thiết bị nhiệt và công nghệ xử lý, tái chế, phục hồi môi trường; kinh doanh sản phẩm từ kết quả nghiên cứu và cung cấp dịch vụ tư vấn, chuyển giao công nghệ, hội thảo, tập huấn.'
  en: 'A centre doing R&D on incinerators, thermal equipment and environmental treatment, recycling and remediation technologies; it sells research-based products and provides consulting, technology transfer, seminars and training.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: Kỹ thuật môi trường; Khoa học môi trường; Công nghệ và thiết bị xử lý môi trường; Công nghệ phục hồi và tái tạo môi trường (các công nghệ tái chế vật liệu; ứng dụng vật liệu trong thiết bị và công nghệ xử lý môi trường; vật liệu xanh, vật liệu thân thiện môi trường…); Công nghệ sản xuất sạch, tái chế (năng lượng sạch, các công nghệ tái chế kim loại, nhựa, dầu phế thải…). 2. Hoạt động kinh doanh và sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu khoa học công nghệ. 3. Hoạt động dịch vụ khoa học công nghệ: Tổ chức hội nghị, hội thảo, tư vấn và chuyển giao kết quả nghiên cứu, thông tin khoa học công nghệ, xúc tiến chuyển giao công nghệ. Tập huấn, bồi dưỡng kiến thức chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
