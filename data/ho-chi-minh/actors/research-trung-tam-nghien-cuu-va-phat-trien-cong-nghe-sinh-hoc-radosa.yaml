id: research-trung-tam-nghien-cuu-va-phat-trien-cong-nghe-sinh-hoc-radosa
name:
  vi: Trung Tâm Nghiên Cứu Và Phát Triển Công Nghệ Sinh Học Radosat
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 26, Đường 516, Xã Nhuận Đức, Huyện Củ Chi, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu công nghệ sinh học nông nghiệp và thủy sản, gồm nhân giống cây trồng, công nghệ tế bào, enzym, vi sinh, lên men, bệnh và nuôi trồng thủy sản; kinh doanh sản phẩm nghiên cứu, phân tích chất lượng và tư vấn, chuyển giao công nghệ.'
  en: 'A centre doing agricultural and aquaculture biotechnology research, including plant propagation, cell, enzyme and microbial technology, fermentation, and aquatic disease and farming; it sells research products, analyses product quality and offers consulting and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ nhân giống cây trồng; Công nghệ tế bào trong nông nghiệp; Công nghệ enzym và protein trong nông nghiệp; Công nghệ vi sinh trong nông nghiệp; Các công nghệ xử lý sinh học, xúc tác sinh học, lên men; Bệnh thủy sản; Nuôi trồng thủy sản. 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, dịch vụ tư vấn, phân tích chất lượng sản phẩm, thông tin khoa học và công, tổ chức hội thảo, tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
