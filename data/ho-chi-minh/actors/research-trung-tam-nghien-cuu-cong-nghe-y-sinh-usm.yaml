id: research-trung-tam-nghien-cuu-cong-nghe-y-sinh-usm
name:
  vi: Trung tâm nghiên cứu công nghệ y sinh USM
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Lô È-a-8, đường 10, Khu CNC, P. Long Thạnh Mỹ, TP. Thủ Đức, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ sinh học y học, thiết bị y tế, công nghệ laser, plasma, hồng ngoại và phần mềm cho y học; sản xuất thử từ kết quả nghiên cứu, tư vấn, chuyển giao công nghệ và bồi dưỡng.'
  en: 'Centre researching and applying medical biotechnology, medical devices, laser, plasma and infrared technologies and medical software; it pilot-produces research outputs and provides consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ sinh học liên quan đến y học, y tế; công nghệ và kỹ thuật thiết bị y học; kỹ thuật thiết kế và công nghệ cơ khí liên quan đến laser, plasma, hồng ngoại phục vụ cho y học; công nghệ phần mềm phục vụ cho y học 2. Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
