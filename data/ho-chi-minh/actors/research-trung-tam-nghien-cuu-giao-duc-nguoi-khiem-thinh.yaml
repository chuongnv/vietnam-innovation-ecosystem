- Trung tâm nghiên cứu
address: 96/14A, Duy Tân, Phường Cầu Kiệu, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Sư phạm TP.HCM, nghiên cứu, ứng dụng giáo dục chuyên biệt cho người khuyết tật, đặc biệt người khiếm thính; tư vấn, cung cấp thông tin và bồi dưỡng chuyên môn.'
  en: 'Centre of Ho Chi Minh City University of Education researching and applying special education for people with disabilities, especially the deaf and hard of hearing; it provides consulting, information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực giáo dục chuyên biệt cho người khuyết tật, xã hội học chuyên đề - Dịch vụ KH&CN: Tư vấn, thông tin khoa học, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
