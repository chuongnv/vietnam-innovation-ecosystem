id: research-vien-nghien-cuu-nang-luong-ben-vung
name:
  vi: Viện Nghiên cứu Năng lượng bền vững
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 268, Lý Thường Kiệt, Phường Diên Hồng, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Bách khoa TP.HCM, nghiên cứu các dạng năng lượng tái tạo như sinh khối, mặt trời, gió, nhiên liệu sinh học và pin nhiên liệu, cùng giải pháp tiết kiệm năng lượng; sản xuất thử sản phẩm, chuyển giao công nghệ và đào tạo chuyên môn.'
  en: 'Institute under Ho Chi Minh City University of Technology, researching renewable energy such as biomass, solar, wind, biofuels and fuel cells, plus energy efficiency; it pilots products, transfers technology and provides professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: lĩnh vực năng lượng sinh học và biomass, năng lượng mặt trời, năng lượng gió, sử dụng hiệu quả và tiết kiệm năng lượng, ứng dụng nhiên liệu sinh học, pin nhiên liệu và các dạng năng lượng tái tạo khác. 2. Sản xuất thử - thử nghiệm: các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: chuyển giao công nghệ, huấn luyện, đào tạo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
