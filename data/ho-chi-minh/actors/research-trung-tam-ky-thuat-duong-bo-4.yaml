id: research-trung-tam-ky-thuat-duong-bo-4
name:
  vi: Trung tâm Kỹ thuật Đường bộ 4
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 296, Nguyễn Văn Đậu, Phường Bình Lợi Trung, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, chuyển giao công nghệ trong xây dựng, quản lý, bảo trì đường bộ; khảo sát dữ liệu đường bộ, tư vấn lập dự án, giám sát, thẩm tra, kiểm định chất lượng công trình và thí nghiệm vật liệu giao thông.'
  en: 'Centre researching and transferring technology for road construction, management and maintenance; it surveys road condition data and provides project preparation, supervision, appraisal, quality inspection of works and testing of road materials.'
description_source:
  text: '- Nghiên cứu, triển khai ứng dụng tiến bộ kỹ thuật và chuyển giao công nghệ trong lĩnh vực xây dựng, quản lý và bảo trì đường bộ. - Khảo sát, thu thập và cập nhật dữ liệu tình trạng đường bộ. - Dịch vụ KH&CN: tư vấn lập dự án đầu tư xây dựng công trình; tư vấn giám sát xây dựng công trình; thẩm tra, thẩm định hồ sơ các dự án, hồ sơ thiết kế kỹ thuật thi công; thẩm tra an toàn giao thông đường bộ; khảo sát, thiết kế, kiểm định chất lượng công trình (kể cả các dự án sửa chữa nâng cấp bến phà, phương tiện thủy) theo quy định pháp luật; kiểm tra, thử tải, đánh giá chất lượng công trình; thí nghiệm, thử nghiệm vật liệu, kết cấu mới thuộc chuyên ngành giao thông đường bộ; đánh giá tác động môi trường dự án xây dựng; quản lý dự án đầu tư xây dựng công trình giao thông. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
