id: research-trung-tam-ky-thuat-quan-trac-moi-truong
name:
  vi: Trung Tâm Kỹ Thuật Quan Trắc Môi Trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 224, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Hội Nước và Môi trường TP.HCM, nghiên cứu mạng lưới, công nghệ và thiết bị quan trắc môi trường, dự báo chất lượng môi trường; thiết kế, lắp đặt, bảo trì trạm quan trắc tự động và đào tạo kỹ năng quan trắc.'
  en: 'Centre under the HCMC Water and Environment Association researching environmental monitoring networks, technologies and equipment and environmental quality forecasting; it designs, installs and maintains automatic monitoring stations and trains monitoring staff.'
description_source:
  text: '1. Thực hiện các đề tài nghiên cứu về thiết lập mạng lưới quan trắc môi trường; phương thức thu thập, truyền dẫn, lưu trữ, sử dụng và tích hợp các dữ liệu quan trắc môi trường phục vụ cho dự báo/cảnh báo chất lượng môi trường và đời sống xã hội; Nghiên cứu công nghệ và thiết bị quan trắc môi trường, các công nghệ ứng dụng vào quan trắc chất lượng môi trường, công nghệ dự báo/cảnh báo chất lượng môi trường dựa trên các số liệu quan trắc, viễn thám, GIS, IoT. 2. Dịch vụ khoa học và công nghệ: Tư vấn, nghiên cứu, thiết kế, lắp đặt, bảo trì các hệ thống quan trắc chất lượng môi trường tự động - liên tục; Lập dự án và thẩm định công nghệ cho các dự án thiết lập trung tâm quan trắc, trạm quan trắc; Thực hiện phản biện cho các dự án/chương trình quan trắc môi trường, các dự án thiết lập phòng thí nghiệm phục vụ quan trắc, trung tâm quan trắc, trạm quan trắc; Đào tạo và huấn luyện về kỹ năng quan trắc, kỹ năng đánh giá số liệu, kỹ năng cảnh báo/dự báo chất lượng môi trường (chỉ được cấp
    giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
