id: startup-chuyen-doi-chuoi-hu-hong-thanh-vat-lieu-hydrogel-chuc-nang-b
name:
  vi: Chuyển đổi chuối hư hỏng thành vật liệu hydrogel chức năng bằng phương pháp Solution Plasma ứng dụng trong xử lý nước
type: startup
categories:
- Môi trường
sectors:
- climate
founded: 2025
address: 74/28 đường 36 Linh Đông, Thủ Đức
description:
  vi: 'Dự án nghiên cứu dùng công nghệ plasma dung dịch (solution plasma) để chuyển chuối hư hỏng thành vật liệu hydrogel xử lý nước, hướng tới ứng dụng cho nước sinh hoạt và nước thải công nghiệp.'
  en: 'A research project using solution plasma technology to turn spoiled bananas into hydrogel materials for water treatment, aimed at domestic water and industrial wastewater applications.'
description_source:
  text: -- Môi trường Mô Hình Kinh Doanh Xanh và Bền Vững 01-05-2025 Việt Nam Hồ Chí Minh, Toàn quốc Hiện nay, vấn đề xử lý rác thải nông nghiệp và ô nhiễm nguồn nước đang trở thành hai thách thức lớn tại Việt Nam. Mỗi năm, hàng nghìn tấn chuối bị hư hỏng trong quá trình thu hoạch, vận chuyển và tiêu thụ bị thải bỏ, gây lãng phí và phát sinh khí nhà kính. Trong khi đó, nhu cầu về các vật liệu xử lý nước thân thiện môi trường, giá thành thấp và hiệu quả cao ngày càng tăng. Từ thực tế đó, dự án “Chuyển đổi chuối hư hỏng thành vật liệu hydrogel chức năng bằng phương pháp plasma dung dịch (Solution Plasma)” được hình thành. Công nghệ plasma dung dịch là một kỹ thuật tiên tiến, không sử dụng hóa chất độc hại nhằm tạo ra sản phẩm hydrogel có khả năng xử lý nước. Sản phẩm không chỉ mang tính xanh, sạch, bền vững, mà còn mở ra hướng tận dụng phụ phẩm nông nghiệp để tạo ra vật liệu có giá trị cao, góp phần phát triển kinh tế tuần hoàn và giảm thiểu tác động môi trường. Dự án hướng đến khả năng thương
    mại hóa trong lĩnh vực xử lý nước sinh hoạt và nước thải công nghiệp, đồng thời thể hiện tinh thần đổi mới sáng tạo vì cộng đồng và môi trường Việt Nam.
  source: HOIP (tự giới thiệu)
