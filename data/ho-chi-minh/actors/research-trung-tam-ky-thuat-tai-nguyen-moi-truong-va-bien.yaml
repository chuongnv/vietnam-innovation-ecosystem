id: research-trung-tam-ky-thuat-tai-nguyen-moi-truong-va-bien
name:
  vi: Trung tâm Kỹ thuật Tài nguyên Môi trường và Biển
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 143/4D/19, Ung Văn Khiêm, Phường Bình Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng về xử lý chất thải, quan trắc ô nhiễm, địa kỹ thuật, tài nguyên rừng, nước, hải dương học, đa dạng sinh học và quy hoạch đô thị, nông thôn; cung cấp tư vấn, chuyển giao công nghệ và bồi dưỡng.'
  en: 'Centre researching and applying waste treatment, pollution monitoring, geotechnics, forest and water resources, oceanography, biodiversity and urban and rural planning; it provides consulting, technology transfer and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng khí); công nghệ sản xuất sạch, tái chế; công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; công nghệ địa chất, địa kỹ thuật; quản lý và bảo vệ tài nguyên rừng; hải dương học; thuỷ văn; tài nguyên nước; đa dạng sinh học; nghiên cứu quy hoạch, phát triển đô thị và nông thôn; công trình hạ tầng đô thị; thổ nhưỡng - Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
