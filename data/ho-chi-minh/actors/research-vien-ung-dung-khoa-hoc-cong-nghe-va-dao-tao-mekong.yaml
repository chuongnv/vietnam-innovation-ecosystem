id: research-vien-ung-dung-khoa-hoc-cong-nghe-va-dao-tao-mekong
name:
  vi: Viện Ứng Dụng Khoa Học Công Nghệ Và Đào Tạo Mekong
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 17, Nguyễn Hữu Cảnh, Phường Bình An, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ trong xã hội học và kỹ thuật cơ khí, chế tạo máy; sản xuất thử nghiệm sản phẩm từ nghiên cứu, tổ chức hội thảo, tư vấn, chuyển giao và tập huấn chuyên môn.'
  en: 'An institute doing research and technology development in sociology and mechanical and machine engineering; it produces pilot products from its research and provides conferences, consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: xã hội học; kỹ thuật cơ khí và công nghệ chế tạo máy. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ, tư vấn, chuyển giao kết quả nghiên cứu; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
