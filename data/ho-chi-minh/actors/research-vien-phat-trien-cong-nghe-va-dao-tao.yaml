id: research-vien-phat-trien-cong-nghe-va-dao-tao
name:
  vi: Viện Phát triển Công nghệ và Đào tạo
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: 241 BIS, Cách Mạng Tháng Tám, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về công nghệ hóa hữu cơ, công nghệ thực phẩm và đồ uống, cùng các sản phẩm, vật liệu và nhiên liệu có nguồn gốc sinh học; sản xuất thử từ kết quả nghiên cứu và làm dịch vụ tư vấn, chuyển giao, phổ biến thông tin, bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in organic chemical technology, food and beverage technology, and bio-based products, materials and fuels; it pilots research outputs and offers consulting, transfer, information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ hóa hữu cơ; các công nghệ sản phẩm sinh học, vật liệu sinh học, chất dẻo sinh học, nhiên liệu sinh học, các hóa chất dược chiết tách từ sinh học, các vật liệu mới có nguồn gốc sinh học; công nghệ thực phẩm và đồ uống. - Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
