id: research-vien-nghien-cuu-minh-triet
name:
  vi: Viện Nghiên cứu Minh Triết
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 304/84, Bùi Đình Túy, Phường Bình Lợi Trung, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kinh tế kinh doanh, quản trị, tâm lý học kinh tế và quản lý, cùng nghệ thuật kiến trúc; sản xuất thử sản phẩm nghiên cứu, tổ chức hội thảo, tư vấn, đánh giá nhiệm vụ KH&CN và bồi dưỡng.'
  en: 'An institute researching business economics, management, economic and managerial psychology, and architectural art; it pilots research products, organises workshops, provides consulting and evaluation of S&T projects, and runs training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Kinh tế học về kinh doanh và quản trị kinh doanh; quan hệ sản xuất kinh doanh; tâm lý học nói chung; tâm lý học chuyên ngành (tâm lý học kinh tế, tâm lý học quản lý); nghệ thuật kiến trúc. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu nêu trên. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; huấn luyện, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
