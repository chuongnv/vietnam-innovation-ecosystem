id: research-trung-tam-nghien-cuu-va-ung-dung-cong-nghe-dia-chinh
name:
  vi: Trung tâm Nghiên cứu và Ứng dụng Công nghệ Địa chính
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Khu Phố 6, Phường Đông Hòa, Phường Dĩ An, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về địa chính, bất động sản, đất đai, tài nguyên và môi trường; làm thử nghiệm, chuyển giao công nghệ, đồng thời tư vấn, tổ chức hội thảo và tập huấn nghiệp vụ cho các lĩnh vực trên.'
  en: 'Centre researching cadastral technology, real estate, land management, natural resources and environment; it does pilot production and technology transfer and provides consulting, seminars and professional training in these fields.'
description_source:
  text: '- Nghiên cứu khoa học công nghệ trong các lĩnh vực công nghệ địa chính, bất động sản, quản lý sử dụng đất đai, tài nguyên và môi trường. - Sản xuất thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, tổ chức hội nghị, hội thảo, đào tạo bồi dưỡng nghiệp vụ chuyên môn trong lĩnh vực công nghệ địa chính, bất động sản, quản lý sử dụng đất đai, tài nguyên và môi trường.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
