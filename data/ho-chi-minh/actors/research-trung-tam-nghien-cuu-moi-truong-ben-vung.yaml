id: research-trung-tam-nghien-cuu-moi-truong-ben-vung
name:
  vi: Trung tâm nghiên cứu môi trường bền vững
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 104/25/8A, Trần Bá Giao, Phường An Nhơn, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Công ty CP Thương mại Đoàn Gia, nghiên cứu, phát triển công nghệ xử lý chất thải, quan trắc và kiểm soát ô nhiễm; nhận phân tích mẫu, tư vấn, chuyển giao thành quả và tập huấn.'
  en: 'Centre under Doan Gia Trading JSC, researching and developing waste-treatment, monitoring and pollution-control technologies; it offers laboratory analysis, consulting, transfer of results and training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai ứng dụng: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. 2. Dịch vụ khoa học và công nghệ: phân tích thí nghiệm, tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ) 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
