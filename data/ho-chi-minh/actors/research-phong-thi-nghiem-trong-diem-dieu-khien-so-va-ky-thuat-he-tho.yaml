id: research-phong-thi-nghiem-trong-diem-dieu-khien-so-va-ky-thuat-he-tho
name:
  vi: Phòng Thí nghiệm Trọng điểm điều khiển số và kỹ thuật hệ thống
type: research
categories:
- Tổ chức khoa học và công nghệ
- Phòng thí nghiệm
address: 268 Đ. Lý Thường Kiệt, Phường Hòa Hưng, TP. Hồ Chí Minh
description:
  vi: 'Phòng thí nghiệm trọng điểm nghiên cứu, thiết kế, chế tạo và chuyển giao thiết bị phần cứng, phần mềm cho điều khiển số, cơ điện tử, tự động hóa và kỹ thuật hệ thống công nghiệp; kèm dịch vụ tư vấn, thi công và đào tạo.'
  en: 'Key laboratory that researches, designs, builds and transfers hardware and software for digital control, mechatronics, automation and industrial systems engineering, along with consulting, installation and training services.'
description_source:
  text: '- Nghiên cứu, thiết kế, chế tạo, lắp đặt, bảo trì và chuyển giao các thiết bị (phần cứng và phần mềm) trong lĩnh vực điều khiển số và kỹ thuật hệ thống, các hệ thống cơ điện tử, viễn thông, công nghệ thông tin, cơ khí tự động hoá và kỹ thuật hệ thống công nghiệp. - Sản xuất thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, thẩm định, thi công, đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên trên lĩnh vực đăng ký theo Luật định. - Hợp tác với các tổ chức trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
