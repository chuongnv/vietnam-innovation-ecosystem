id: research-vien-nghien-cuu-phat-trien-giao-duc-va-kinh-te-exim
name:
  vi: Viện Nghiên cứu Phát Triển Giáo Dục Và Kinh Tế Exim
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 1034, Trường Sa, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về tâm lý học, khoa học giáo dục và giáo dục chuyên biệt cho người khuyết tật; cung cấp dịch vụ xây dựng hệ thống thông tin dữ liệu, tư vấn sở hữu trí tuệ, môi giới, đánh giá công nghệ và đào tạo chuyên môn.'
  en: 'An institute researching psychology, educational science and special education for people with disabilities; it provides information and database system development, intellectual property advice, technology brokerage and assessment, and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực: Tâm lý học nói chung; Tâm lý học chuyên ngành; Khoa học giáo dục nói chung; Khoa học giáo dục chuyên biệt cho người khuyết tật. 2. Dịch vụ khoa học và công nghệ: + Thông tin và khoa học công nghệ: dịch vụ nghiên cứu xây dựng và phát triển hệ thống thông tin ngân hàng dữ liệu, lưu trữ điện tử. + Dịch vụ sở hữu trí tuệ: tư vấn về sở hữu trí tuệ (không bao gồm tư vấn liên quan đến thủ tục xác lập và bảo vệ/thực thi quyền sở hữu trí tuệ. + Dịch vụ chuyển giao công nghệ: dịch vụ môi giới chuyển giao công nghệ (hỗ trợ các bên có nhu cầu mua hoặc bán, tìm kiếm đối tác để ký hợp đồng chuyển giao công nghệ); dịch vụ đánh giá công nghệ (đánh giá trình độ công nghệ, xác định giá trị, hiệu quả kinh tế và tác động của công nghệ đến kinh tế - xã hội và môi trường, định giá khoa học công nghệ (xác định giá trị công nghệ). + Đào tạo, tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp Luật định (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ).
    3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
