id: research-trung-tam-ky-thuat-va-cong-nghe-moi-truong
name:
  vi: Trung tâm Kỹ thuật và Công nghệ Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1, Võ Văn Ngân, Phường Thủ Đức, Thành phố Thủ Đức
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Sư phạm Kỹ thuật TP.HCM, nghiên cứu công nghệ và quản lý môi trường; tư vấn thiết kế, thi công, giám sát công trình môi trường, phân tích thí nghiệm và đào tạo.'
  en: 'Centre of HCMC University of Technology and Education researching environmental technology and management; it provides design, construction and supervision of environmental works, laboratory analysis and training.'
description_source:
  text: '1. Nghiên cứu và triển khai trong lĩnh vực công nghệ và quản lý môi trường. 2- Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. 3- Dịch vụ KH-CN: Tư vấn giám sát, thiết kế thi công các công trình về môi trường, phân tích thí nghiệm, thông tin, đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên môn trong lĩnh vực môi trường. 4- Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
