id: research-vien-khoa-hoc-tai-nguyen-va-moi-truong-duong-huynh
name:
  vi: Viện Khoa Học Tài Nguyên Và Môi Trường Dương Huỳnh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1527/5A, Vườn Lài, Phường An Phú Đông, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty TNHH Môi Trường Dương Huỳnh, nghiên cứu về địa chất, môi trường, thủy văn, tài nguyên nước, trắc địa – bản đồ và xử lý ô nhiễm; kinh doanh sản phẩm nghiên cứu, tư vấn và đánh giá nhiệm vụ KH&CN.'
  en: 'An institute under Duong Huynh Environment Co., Ltd. researching geology, environment, hydrology, water resources, surveying and mapping, and pollution control; it commercialises research products and provides consulting and evaluation of S&T projects.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Địa chất; môi trường; thuỷ văn; tài nguyên nước; sinh thái học; hoá phân tích; công nghệ phục hồi và tái tạo môi trường; kiểm soát và xử lý ô nhiễm; trắc địa học và bản đồ học; Nghiên cứu thiết kế và khai thác các mỏ khoáng sản, công trình dân dụng và công nghiệp. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ; Thông tin khoa học và công nghệ; Dịch vụ tư vấn chuyển giao công nghệ; Dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Lập dự án báo cáo nghiên cứu khả thi, lập báo cáo đánh giá tác động môi trường, giấy phép môi trường, đăng ký môi trường, báo cáo công tác bảo vệ môi trường hằng năm các dự án trong lĩnh vực điều tra, khai thác và bảo vệ tài nguyên thiên nhiên (đất, nước, không
    khí và khoáng sản); Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
