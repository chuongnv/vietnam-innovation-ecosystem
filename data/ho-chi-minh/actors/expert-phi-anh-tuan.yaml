description:
  vi: Chuyên gia trên HOIP, lĩnh vực phần mềm, CNTT, thương mại điện tử, sản xuất thực phẩm, nông/lâm nghiệp, dịch vụ.
  en: 'Expert on HOIP – fields: software, IT, e-commerce, food production, agriculture/forestry, services.'
description_source:
  text: 'Ông PHÍ ANH TUẤN là người sáng lập và điều hành Công ty Tư vấn P.A.T Consulting. Ông có nhiều năm kinh nghiệm trong triển khai hệ thống thông tin quản lý, quản trị DN tích hợp, quản lý bán hàng cho các DN lớn tại Việt Nam trong nhiều ngành như: điện lực, sản xuất, hàng không, dược phẩm, logistics, thương mại dịch vụ. Ngoài ra, ông Tuấn còn là giảng viên môn Hệ thống thông tin quản lý MIS theo chương trình CMU, Trường đại học Văn Lang; giảng viên lớp cao học kế toán quản trị Đại học Kinh tế TP.HCM.'
  source: HOIP (tự giới thiệu)
