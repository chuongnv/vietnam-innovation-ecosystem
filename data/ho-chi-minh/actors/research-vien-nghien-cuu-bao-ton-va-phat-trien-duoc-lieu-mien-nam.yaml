id: research-vien-nghien-cuu-bao-ton-va-phat-trien-duoc-lieu-mien-nam
name:
  vi: Viện Nghiên cứu bảo tồn và phát triển dược liệu miền nam
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 14A23, Thảo Điền, Phường An Khánh, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu bảo tồn và phát triển dược liệu, cây thuốc, con thuốc, bào chế và thực phẩm chức năng; sản xuất thử sản phẩm nghiên cứu, đào tạo, bồi dưỡng và chuyển giao kết quả.'
  en: 'An institute researching the conservation and development of medicinal herbs, plants and animals, drug preparation and functional foods; it pilots research products and provides training and transfer of results.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: lĩnh vực dược liệu học, cây thuốc, con thuốc, bào chế, thực phẩm chức năng. 2. Sản xuất thử - thử nghiệm: các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn đào tạo, bồi dưỡng, huấn luyện chuyên môn, chuyển giao các kết quả nghiên cứu theo lĩnh vực đăng ký. 4. Hợp tác trong và ngoài nước: theo lĩnh vực đăng ký phù hợp với các quy định của pháp luật.'
