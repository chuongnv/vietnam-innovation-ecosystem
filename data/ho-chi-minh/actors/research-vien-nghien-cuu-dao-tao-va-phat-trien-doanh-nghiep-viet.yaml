id: research-vien-nghien-cuu-dao-tao-va-phat-trien-doanh-nghiep-viet
name:
  vi: Viện Nghiên cứu Đào Tạo Và Phát Triển Doanh Nghiệp Việt
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 47A, Đường D5, Phường Bình Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, phát triển công nghệ về kinh doanh và quản trị, địa lý kinh tế, văn hóa và quan hệ sản xuất – kinh doanh; dịch vụ gồm tư vấn, chuyển giao kết quả, tổ chức hội thảo, tập huấn và đào tạo.'
  en: 'Institute researching business and management, economic and cultural geography, and production relations; services include consulting, transfer of research results, conferences, workshops and training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Kinh doanh và quản trị kinh doanh; Quan hệ sản xuất kinh doanh; Địa lý kinh tế và văn hóa.. 2. Dịch vụ khoa học - công nghệ: Tư vấn, chuyển giao kết quả nghiên cứu; tổ chức các hội nghị, hội thảo, tập huấn, đào tạo, bồi dưỡng cho các tổ chức, cá nhân theo lĩnh vực nghiên cứu khoa học và phát triển công nghệ. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
