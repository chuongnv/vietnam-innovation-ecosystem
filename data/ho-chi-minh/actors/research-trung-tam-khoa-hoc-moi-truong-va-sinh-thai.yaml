id: research-trung-tam-khoa-hoc-moi-truong-va-sinh-thai
name:
  vi: Trung tâm Khoa học Môi trường và Sinh thái
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 103/33, Tân Hóa, Phường Phú Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu khoa học môi trường, xử lý chất thải, sản xuất sạch, phục hồi môi trường, quan trắc ô nhiễm và đa dạng sinh học; cung cấp tư vấn, chuyển giao công nghệ, thông tin và bồi dưỡng chuyên môn.'
  en: 'Centre researching environmental science, waste treatment, cleaner production, environmental remediation, pollution monitoring and biodiversity; it provides consulting, technology transfer, information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: khoa học môi trường – các khía cạnh xã hội; công nghệ quản lý và xử lý chất thải rắn, lỏng, khí; công nghệ sản xuất sạch, tái chế; công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; đa dạng sinh học. - Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ; thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
