  text: Chuyên gia trong lĩnh vực tiết kiệm năng lượng và năng lượng tái tạo. Với gần 20 năm kinh nghiệm trong việc Tư vấn hỗ trợ Doanh nghiệp sản xuất công nghiệp, Tòa nhà, Trường học, Bệnh viện nghiên cứu các giải pháp tiết kiệm năng lượng và thực hiện các giải pháp tiết kiệm năng lượng, đổi mới công nghệ, phát triển năng lượng tái tạo.
