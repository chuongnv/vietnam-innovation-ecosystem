id: research-trung-tam-kh-cn-duoc-sai-gon-sapharcen
name:
  vi: Trung tâm KH&CN Dược Sài Gòn (SAPHARCEN)
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 41, Đinh Tiên Hoàng, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Y Dược TP.HCM, nghiên cứu, ứng dụng trong lĩnh vực dược; sản xuất thử sản phẩm từ kết quả nghiên cứu, tư vấn, chuyển giao công nghệ và bồi dưỡng chuyên môn.'
  en: 'Centre of the University of Medicine and Pharmacy at HCMC conducting pharmaceutical research and applications; it pilot-produces research-based products and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực dược. 2. Sản xuất thử - thử nghiệm các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
