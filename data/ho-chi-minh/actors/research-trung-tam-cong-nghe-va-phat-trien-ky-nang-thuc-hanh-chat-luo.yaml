id: research-trung-tam-cong-nghe-va-phat-trien-ky-nang-thuc-hanh-chat-luo
name:
  vi: Trung Tâm Công Nghệ Và Phát Triển Kỹ Năng Thực Hành Chất Lượng Cao
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 5, Đường số 449, Phường Tăng Nhơn Phú A, Thành phố Thủ Đức, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ trong kỹ thuật xây dựng, hạ tầng đô thị, giao thông, thủy lợi và địa kỹ thuật; chuyển giao công nghệ, tổ chức hội thảo và bồi dưỡng chuyên môn.'
  en: 'Centre researching and developing technology in construction engineering, urban infrastructure, transport, irrigation works and geotechnics; it provides technology transfer, seminars and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: kỹ thuật xây dựng, công trình hạ tầng đô thị, công trình giao thông vận tải, công trình thủy lợi, địa kỹ thuật. 2. Dịch vụ khoa học và công nghệ: chuyển giao công nghệ, tổ chức hội nghị, hội thảo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp Luật định (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
