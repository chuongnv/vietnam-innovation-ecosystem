description:
  vi: 'Viện nghiên cứu khoa học về quản trị kinh doanh và quan hệ sản xuất – kinh doanh; cung cấp dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và các khóa bồi dưỡng chuyên môn.'
  en: 'Institute researching business administration and production relations; offers consulting, transfer of research results, scientific information and professional training courses.'
description_source:
  text: '1- Nghiên cứu khoa học trong lĩnh vực quan hệ sản xuất kinh doanh; kinh doanh và quản trị kinh doanh. 2- Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 3- Hợp tác trong và ngoài nước trên lĩnh vực đăng ký phù hợp Luật định'
