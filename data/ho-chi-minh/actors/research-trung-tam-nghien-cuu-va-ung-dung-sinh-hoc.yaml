id: research-trung-tam-nghien-cuu-va-ung-dung-sinh-hoc
name:
  vi: Trung tâm Nghiên cứu và Ứng dụng Sinh học
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 74, Đường Số 2, Phường Tân Hưng, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về vi sinh vật, hóa sinh, sinh học phân tử, công nghệ sinh học y học và các sản phẩm, vật liệu, nhiên liệu sinh học; cung cấp tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research in microbiology, biochemistry, molecular biology, medical biotechnology and bio-based products, materials and fuels; it provides consulting, transfer of research results and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: vi sinh vật học; hoá sinh; sinh học phân tử; công nghệ sinh học liên quan đến y học; các công nghệ sản phẩm sinh học, vật liệu sinh học, nhiên liệu sinh học. 2- Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
