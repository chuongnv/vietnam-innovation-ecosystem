description:
  vi: Chuyên gia trên HOIP, lĩnh vực giáo dục, khác.
  en: 'Expert on HOIP – fields: education, other.'
description_source:
  text: 'Thạc sĩ Nguyễn Thi Ngọc hiện là giảng viên tại Khoa Quản Trị, Trường Đại học Luật TP.HCM. Các môn học đang giảng dạy gồm: Nguyên lý kế toán, Kế toán quản trị, Phân tích hoạt động kinh doanh; Khởi sự kinh doanh. Trước khi trở thành giảng viên tại trường Đại học Luật TP HCM, thạc sĩ Nguyễn Thị Ngọc có nhiều năm kinh nghiệm trong lĩnh vực kế toán – tài chính trong các doanh nghiệp ở các vị trí Kế toán trưởng; Giám đốc tài chính; Phụ trách xây dựng và phát triển mạng lưới nhà cung cấp. Bên cạnh đó, thạc sĩ Nguyễn Thị Ngọc đã có thời gian làm việc tại vị trí phụ trách đào tạo của Viện Marketing và Quản trị Việt Nam với vai trò xây dựng chương trình đào tạo theo nhu cầu của doanh nghiệp, tổ chức các khóa học ngắn hạn cho doanh nghiệp.'
  source: HOIP (tự giới thiệu)
