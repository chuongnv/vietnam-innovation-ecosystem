id: research-vien-ke-toan-quan-tri-doanh-nghiep
name:
  vi: Viện Kế toán Quản trị Doanh nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 157, Lý Chính Thắng, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh, chú trọng kế toán quản trị doanh nghiệp; cung cấp dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in business administration with a focus on management accounting; offers consulting, transfer of research results, scientific information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: kinh doanh và quản trị kinh doanh - Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp Giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
