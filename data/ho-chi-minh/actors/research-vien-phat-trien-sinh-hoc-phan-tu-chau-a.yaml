id: research-vien-phat-trien-sinh-hoc-phan-tu-chau-a
name:
  vi: Viện Phát Triển Sinh Học Phân Tử Châu Á
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: Phòng 1002, Tầng 10, Toàn Nhà Rosana Tower, 60 Nguyễn Đình Chiểu, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ gen, protein và công nghệ sinh học ứng dụng trong y học; hỗ trợ thành lập phòng thí nghiệm, tổ chức hội thảo, tư vấn, chuyển giao công nghệ và tập huấn chuyên môn.'
  en: 'An institute doing research and development in gene and protein technology and medical biotechnology; it helps set up laboratories and provides conferences, consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: công nghệ gen, protein trong y học; công nghệ sinh học liên quan đến y học, y tế. 2. Dịch vụ khoa học và công nghệ: - Tổ chức hội nghị, hội thảo; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ); - Thành lập, phát triển phòng thí nghiệm tại Việt Nam; - Tư vấn, dịch vụ thông tin khoa học công nghệ, chuyển giao công nghệ theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
