- Viện nghiên cứu
address: 27, Yersin, Phường Bến Thành, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh và quan hệ sản xuất – kinh doanh; cung cấp dịch vụ tư vấn, phổ biến thông tin khoa học, chuyển giao thành quả nghiên cứu và bồi dưỡng nâng cao nghiệp vụ.'
  en: 'Institute doing applied research in business administration and production relations; offers consulting, scientific information, transfer of research results and professional upskilling.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: kinh doanh và quản trị kinh doanh; quan hệ sản xuất kinh doanh. 2- Dịch vụ KH&CN: Tư vấn, thông tin khoa học, chuyển giao kết quả nghiên cứu, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
