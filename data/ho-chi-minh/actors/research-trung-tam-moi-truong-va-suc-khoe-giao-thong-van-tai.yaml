id: research-trung-tam-moi-truong-va-suc-khoe-giao-thong-van-tai
name:
  vi: Trung Tâm Môi Trường Và Sức Khỏe Giao Thông Vận Tải
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 518/11, Võ Văn Kiệt, Phường Bến Thành, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Hội Môi trường Giao thông vận tải Việt Nam, nghiên cứu y học lao động, vệ sinh môi trường, sức khỏe nghề nghiệp và HIV/AIDS trong ngành giao thông vận tải; tư vấn, tổ chức hội thảo và tham gia đào tạo.'
  en: 'Centre under the Vietnam Transport Environment Association researching occupational medicine, environmental hygiene, occupational health and HIV/AIDS in the transport sector; it provides consulting, holds conferences and contributes to training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ về Y học lao động và vệ sinh môi trường; Sức khoẻ nghề nghiệp, HIV/AIDS trong lĩnh vực môi trường giao thông vận tải. 2. Dịch vụ khoa học và công nghệ: Tư vấn chuyển giao công nghệ; Tổ chức hội thảo, hội nghị khoa học về môi trường và sức khoẻ giao thông vận tải; Tham gia đào tạo nghiệp vụ chuyên môn.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
