id: research-vien-hoc-tap-suot-doi
name:
  vi: Viện Học Tập Suốt Đời
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 111/8/2/100, Đặng Thùy Trâm, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kinh doanh, quản trị, ngôn ngữ, văn học và khoa học giáo dục; kinh doanh sản phẩm từ kết quả nghiên cứu, tổ chức hội thảo, thông tin khoa học và môi giới, tư vấn, đánh giá công nghệ.'
  en: 'An institute researching business, management, linguistics, literature and educational science; it commercialises research outputs, organises workshops, provides S&T information and offers technology brokerage, consulting and assessment.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Quan hệ sản xuất kinh doanh; Kinh doanh và quản trị kinh doanh; Nghiên cứu chung về ngôn ngữ; Nghiên cứu ngôn ngữ Việt Nam; Nghiên cứu ngôn ngữ khác, Lý luận văn học; Nghiên cứu văn học nói chung; Khoa học giáo dục nói chung (bao gồm cả sư phạm học, lý luận giáo dục). 2. Kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ, Dịch vụ đánh giá công nghệ, Dịch vụ xúc tiến chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
