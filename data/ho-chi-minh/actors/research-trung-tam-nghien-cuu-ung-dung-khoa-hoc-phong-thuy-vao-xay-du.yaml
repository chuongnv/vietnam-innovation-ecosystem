id: research-trung-tam-nghien-cuu-ung-dung-khoa-hoc-phong-thuy-vao-xay-du
name:
  vi: Trung Tâm Nghiên Cứu Ứng Dụng Khoa Học Phong Thủy Vào Xây Dựng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 79, Trần Hưng Đạo, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng phong thủy địa lý trong quản lý, quy hoạch và thiết kế công trình xây dựng; cung cấp dịch vụ tư vấn và tập huấn chuyên môn trong lĩnh vực này.'
  en: 'A centre researching the application of feng shui (geomancy) to construction management, planning and building design; it provides consulting and professional training in this field.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong các lĩnh vực: Khoa học phong thủy địa lý trong quản lý, xây dựng; Quy hoạch và thiết kế công trình xây dựng. 2. Dịch vụ khoa học và công nghệ: tư vấn, tập huấn và bồi dưỡng chuyên môn theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
