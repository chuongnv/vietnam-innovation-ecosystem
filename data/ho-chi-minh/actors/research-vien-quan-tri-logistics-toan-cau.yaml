id: research-vien-quan-tri-logistics-toan-cau
name:
  vi: Viện Quản trị Logistics Toàn Cầu
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 18M, Lý Văn Phức, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ về kinh doanh và quản trị trong hoạt động logistics, thử nghiệm sản phẩm từ nghiên cứu và cung cấp tư vấn, chuyển giao công nghệ, tập huấn chuyên môn logistics.'
  en: 'An institute doing research and technology development on business and management in logistics, piloting products from its research and offering consulting, technology transfer and professional logistics training.'
description_source:
  text: '5- Nghiên cứu khoa học và phát triển công nghệ lĩnh vực kinh doanh và quản trị kinh doanh trong hoạt động logistics. 6- Thử nghiệm - sản xuất thử nghiệm: các sản phẩm là kết quả nghiên cứu. 7- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, chuyển giao công nghệ, tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 8- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
