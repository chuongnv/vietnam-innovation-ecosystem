id: research-trung-tam-an-toan-lao-dong-va-cong-nghe-moi-truong
name:
  vi: Trung tâm An toàn Lao động và Công nghệ Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 98, Ngô Tất Tố, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng về quản lý, công nghệ môi trường và an toàn, vệ sinh lao động; sản xuất thử thiết bị bảo hộ, bảo vệ môi trường, tư vấn thiết kế hệ thống xử lý, quan trắc và đào tạo.'
  en: 'Centre researching environmental management and technology as well as occupational safety and health; it pilot-produces protective and environmental equipment and provides treatment-system design, monitoring, consulting and training.'
description_source:
  text: '- Nghiên cứu và triển khai ứng dụng trong lĩnh vực quản lý môi trường, công nghệ môi trường, kỹ thuật an toàn và vệ sinh lao động. - Sản xuất thử nghiệm các trang thiết bị an toàn lao động, phương tiện bảo vệ cá nhân, thiết bị bảo vệ môi trường. - Dịch vụ KH&CN: tư vấn thiết kế hệ thống xử lý môi trường, bảo hộ lao động, quan trắc, phân tích các chỉ tiêu môi trường và an toàn lao động, thẩm định và chuyển giao công nghệ môi trường và an toàn lao động theo Luật định, tư vấn quản lý hệ thống, thông tin, đào tạo bồi dưỡng về môi trường và an toàn lao động. - Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
