id: research-vien-cong-nghe-y-duoc-van-cao
name:
  vi: Viện Công Nghệ Y Dược Vân Cao
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Số 7, Đường C22, Phường Bảy Hiền, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty TNHH Y sinh dược Pasteur, nghiên cứu đa lĩnh vực y sinh và dược như di truyền, sinh học phân tử, vi sinh, công nghệ tế bào, dược lý và thực phẩm chức năng; sản xuất thử sản phẩm và cung cấp chứng nhận, tư vấn, đào tạo.'
  en: 'An institute under Pasteur Biomedical Pharmaceutical Co., Ltd. researching biomedicine and pharmacy, including genetics, molecular biology, microbiology, cell technology, pharmacology and functional foods; it pilots products and offers certification, consulting and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: Sinh học sinh sản; sinh học phát triển; Di truyền học; Vi sinh vật học; Sinh học phân tử; Công nghệ hóa dược; Công nghệ sinh học liên quan đến y học, y tế; Công nghệ tế bào trong y học; Công nghệ gen, protein trong y học; Vật liệu sinh học liên quan đến cấp phép trong y học, thiết bị, cảm biến y học; Di truyền y học; Miễn dịch học; Sinh lý học y học; Mô học; Sinh hóa y học; Vi sinh vật học y học; Ký sinh trùng y học; Sinh lý bệnh; Dịch tễ học; Sức khỏe nghề nghiệp; Dinh dưỡng; Y tế công cộng; Dược lý học; Dược học lâm sàng và điều trị; Dược liệu học; Hóa dược học; Thực phẩm chức năng. 2. Sản xuất - thử nghiệm; kinh doanh - sản xuất kinh doanh: các sản phẩm từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Dịch vụ chứng nhận hệ thống quản lý chất lượng; chứng nhận sản phẩm phù hợp tiêu chuẩn; tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); tổ chức chợ,
    hội chợ, triển lãm công nghệ và trung tâm giao dịch công nghệ); đào tạo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
