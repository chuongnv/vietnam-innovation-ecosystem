id: research-trung-tam-nghien-cuu-ung-dung-ve-cong-nghe-quan-ly-moi-truon
name:
  vi: Trung tâm Nghiên cứu ứng dụng về Công nghệ & Quản lý Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 45, Nguyễn Khắc Nhu, Phường Bến Thành, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về công nghệ, quản lý môi trường và cấp thoát nước; cung cấp dịch vụ đánh giá tác động môi trường, thiết kế, lắp đặt, vận hành hệ thống xử lý ô nhiễm, phân tích chất lượng nước, khí, chất thải và tư vấn môi trường.'
  en: 'An applied research centre in environmental technology and management, water supply and drainage; it provides environmental impact assessment, design, installation and operation of pollution treatment systems, analysis of water, air and waste, and environmental consulting.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực công nghệ và quản lý môi trường, cấp và thoát nước. 2. Sản xuất thử - thử nghiệm; sản xuất kinh doanh các sản phẩm từ kết quả nghiên cứu. 3. Dịch vụ KH&CN: Đánh giá tác động môi trường và cam kết bảo vệ môi trường; chuyển giao công nghệ; tư vấn lập đăng ký chủ nguồn thải; tư vấn thiết kế, lắp đặt và vận hành các hệ thống xử lý ô nhiễm; tư vấn giám sát thi công các công trình về môi trường; tư vấn về quản lý môi trường và công nghệ môi trường; tư vấn đấu thầu, lập dự án đầu tư, lập hồ sơ mời thầu và đánh giá hồ sơ dự thầu các công trình môi trường; tư vấn giám sát và kiểm soát chất lượng môi trường; phân tích thí nghiệm và đánh giá chất lượng nước, khí, chất thải rắn công nghiệp và nguy hại, đào tạo bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngòai nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
