- Tổ chức khoa học và công nghệ
address: 36A, Nơ Trang Long, Phường Bình Lợi Trung, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng tâm lý học, cả đại cương lẫn chuyên ngành; cung cấp dịch vụ trị liệu và tư vấn tâm lý, phổ biến thông tin khoa học và bồi dưỡng nâng cao chuyên môn.'
  en: 'Institute doing applied research in general and specialised psychology; offers psychotherapy and counselling, scientific information and professional upskilling.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: tâm lý học nói chung, tâm lý học chuyên ngành. 2. Dịch vụ KH&CN: Tư vấn trị liệu tâm lý; thông tin khoa học, huấn luyện bồi dưỡng nâng cao nghiệp chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
