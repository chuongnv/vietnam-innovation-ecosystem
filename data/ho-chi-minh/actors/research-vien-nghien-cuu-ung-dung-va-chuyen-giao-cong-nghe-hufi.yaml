id: research-vien-nghien-cuu-ung-dung-va-chuyen-giao-cong-nghe-hufi
name:
  vi: Viện Nghiên cứu Ứng Dụng Và Chuyển Giao Công Nghệ Hufi
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 93, Tân Kỳ Tân Quý, Phường Tây Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng và chuyển giao công nghệ mang tên HUFI, hoạt động trong các lĩnh vực công nghệ thực phẩm, kỹ thuật hóa học, môi trường, công nghệ sinh học và quản trị kinh doanh thực phẩm; cung cấp dịch vụ môi giới, tư vấn, đánh giá công nghệ và đào tạo ngắn hạn.'
  en: 'An applied research and technology transfer institute bearing the HUFI name, working in food technology, chemical engineering, environment, biotechnology and food business management, and offering technology brokerage, consulting, technology assessment and short training.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Công nghệ thực phẩm; Quản trị kinh doanh thực phẩm; Công nghệ kỹ thuật hóa học; Công nghệ kỹ thuật môi trường; Quản lý tài nguyên và môi trường; Công nghệ sinh học (Công nghệ sinh học Công nghiệp, Công nghệ sinh học Nông nghiệp, Công nghệ sinh học Y Dược). 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu nêu trên. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ, Dịch vụ đánh giá công nghệ, Dịch vụ xúc tiến chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng
    ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
