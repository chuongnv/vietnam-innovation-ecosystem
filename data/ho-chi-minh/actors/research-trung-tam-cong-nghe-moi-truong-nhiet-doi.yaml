id: research-trung-tam-cong-nghe-moi-truong-nhiet-doi
name:
  vi: Trung tâm Công nghệ Môi trường Nhiệt đới
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 67, Phan Sào Nam, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ quản lý và xử lý chất thải, sản xuất sạch, tái chế, phục hồi môi trường và quan trắc ô nhiễm; chuyển giao công nghệ, tư vấn, phân tích thí nghiệm và đào tạo.'
  en: 'Centre researching and developing technologies for waste management and treatment, cleaner production, recycling, environmental remediation and pollution monitoring; it provides technology transfer, consulting, laboratory analysis and training.'
description_source:
  text: '- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: quản lý và xử lý chất thải (rắn, lỏng, khí); sàn xuất sạch, tái chế; phục hồi và tái tạo môi trường; quan trắc môi trường, kiểm soát và xử lý ô nhiễm. - Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn; huấn luyện bồi dưỡng nghiệp vụ chuyên môn, phân tích thí nghiệm theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
