id: research-vien-cong-nghe-sinh-hoc-va-thuc-pham
name:
  vi: Viện Công nghệ Sinh học và Thực phẩm
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 12, Nguyễn Văn Bảo, Phường Hạnh Thông, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu công nghệ sinh học và thực phẩm cho các ngành công nghiệp cùng nông, lâm, ngư nghiệp; sản xuất thử chế phẩm sinh học, thử nghiệm mô hình, thiết bị, đồng thời tư vấn và đào tạo trong lĩnh vực này.'
  en: 'Institute researching biotechnology and food technology for industry, agriculture, forestry and fisheries; it pilot-produces bio-products, trials models and equipment, and offers consulting and training in the field.'
description_source:
  text: '- Nghiên cứu khoa học về công nghệ sinh học và thực phẩm phục vụ công nghiệp, nông lâm ngư nghiệp. - Triển khai ứng dụng, sản xuất thử nghiệm các chế phẩm sinh học, thử nghiệm các mô hình, thiết bị phục vụ cho ngành sinh học và thực phẩm. - Dịch vụ KH&CN: Tư vấn, đào tạo bồi dưỡng nâng cao nghiệp vụ về công nghệ sinh học và thực phẩm. - Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
