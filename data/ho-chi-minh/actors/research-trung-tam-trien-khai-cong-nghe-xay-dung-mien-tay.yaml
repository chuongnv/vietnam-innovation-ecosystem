id: research-trung-tam-trien-khai-cong-nghe-xay-dung-mien-tay
name:
  vi: Trung Tâm Triển Khai Công Nghệ Xây Dựng Miền Tây
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 20/5B, Quốc Lộ 13, Phường Hiệp Bình Phước, Thành phố Thủ Đức, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, chuyển giao công nghệ xây dựng; sản xuất, kinh doanh vật liệu, hóa phẩm và thiết bị xây dựng, thí nghiệm; biên soạn tiêu chuẩn kỹ thuật, kiểm tra chất lượng vật liệu, công trình và tư vấn khảo sát, thiết kế, giám sát xây dựng.'
  en: 'A centre researching and transferring construction technology; it makes and sells building materials, chemicals and testing equipment, drafts technical standards, tests materials and structures, and provides survey, design and supervision consulting.'
description_source:
  text: '1. Nghiên cứu khoa học và công nghệ, ứng dụng tiến bộ kỹ thuật, chuyển giao công nghệ trong lĩnh vực xây dựng. 2. Sản xuất, kinh doanh các loại vật liệu, hoá phẩm xây dựng, thiết bị công nghệ, thiết bị thí nghiệm và thiết bị sản xuất vật liệu xây dựng. 3. Dịch vụ khoa học và công nghệ: Biên soạn tiêu chuẩn xây dựng và các tài liệu hướng dẫn kỹ thuật; Kiểm tra chất lượng sản phẩm, hàng hóa thuộc lĩnh vực vật liệu xây dựng và công trình xây dựng; Tư vấn và dịch vụ kỹ thuật các công trình dân dụng, công nghiệp, hạ tầng kỹ thuật và xây dựng chuyên ngành (Lập dự án đầu tư; khảo sát địa kỹ thuật, môi trường; Lập bản đồ và hệ thống mốc, lưới khống chế mặt bằng, cao độ; Lập quy hoạch chi tiết, thiết kế công trình xây dựng, thẩm tra thiết kế và tổng dự toán các công trình xây dựng; Tư vấn đấu thầu, quản lý dự án, giám sát chất lượng công trình xây dựng; Khảo sát đánh giá hiện trạng, kiểm định chất lượng công trình xây dựng; Thí nghiệm, kiểm tra chất lượng vật liệu, đất đá, nền móng và kết
    cấu xây dựng; Kiểm tra chất lượng vật liệu kim loại, liên kết hàn và các sản phẩm kim loại; kiểm tra chất lượng mối hàn kết cấu kim loại; Kiểm tra, giám định, chứng nhận sự phù hợp chất lượng công trình xây dựng; Xác định nguyên nhân và thiết kế sửa chữa, khắc phục sự cố kỹ thuật các công trình xây dựng; Quan trắc biến dạng và chuyển dịch công trình; quan trắc địa kỹ thuật; Kiểm tra chất lượng nước, môi trường, vật liệu phòng chống cháy nổ, đánh giá tác động môi trường; Tư vấn tiếp nhận, chuyển giao hệ thống thiết bị, công nghệ mới); Nhận thầu và thi công xây dựng mới, sửa chữa, gia cường, cải tạo công trình; Bồi dưỡng, tập huấn, phổ biến thông tin về khoa học công nghệ và tiêu chuẩn xây dựng. 4. Hợp tác với các tổ chức trong nước và quốc tế về lĩnh vực xây dựng.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
