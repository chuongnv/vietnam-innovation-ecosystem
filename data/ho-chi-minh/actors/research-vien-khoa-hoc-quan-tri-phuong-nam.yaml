description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh; hoạt động dịch vụ gồm tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và tập huấn chuyên môn.'
  en: 'Institute doing applied research in business administration; services include consulting, transfer of research results, scientific information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
