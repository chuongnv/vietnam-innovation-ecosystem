id: research-hoc-vien-so-huu-tri-tue-quoc-te
name:
  vi: Học Viện Sở Hữu Trí Tuệ Quốc Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
- Học viện
address: 207/3, Hồ Học Lãm, Phường An Lạc, TP. Hồ Chí Minh
description:
  vi: 'Tổ chức KH&CN trực thuộc Liên hiệp Khoa học Kinh tế - Đô thị Nam bộ, nghiên cứu về sở hữu trí tuệ, kinh tế, giáo dục và công nghệ mới; cung cấp dịch vụ tư vấn, đánh giá, chuyển giao công nghệ, tổ chức hội thảo và bồi dưỡng chuyên môn.'
  en: 'S&T organisation under the Southern Economic-Urban Science Union, researching intellectual property, economics, education and new technologies; it offers consulting, evaluation, technology transfer, conferences and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học về sở hữu trí tuệ theo hướng nghiên cứu lý thuyết và triển khai ứng dụng; Nghiên cứu khoa học và phát triển công nghệ trong các lĩnh vực kinh tế, giáo dục, đào tạo và công nghệ mới theo hướng kết hợp nghiên cứu phát triển và nghiên cứu ứng dụng. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu khoa học. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các công trình khoa học và công nghệ; Chuyển giao nghiên cứu khoa học và công nghệ, thông tin khoa học và công nghệ; Tiêu chuẩn, đo lường, chất lượng, sở hữu trí tuệ; Huấn luyện, bồi dưỡng chuyên môn cho các tổ chức, cá nhân thuộc lĩnh vực đăng ký hoạt động (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
