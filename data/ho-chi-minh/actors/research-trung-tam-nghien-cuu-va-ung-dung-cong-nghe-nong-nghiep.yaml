id: research-trung-tam-nghien-cuu-va-ung-dung-cong-nghe-nong-nghiep
name:
  vi: Trung Tâm Nghiên Cứu Và Ứng Dụng Công Nghệ Nông Nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 62, Đường D1A, Phường Phước Long, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, thực nghiệm công nghệ nông nghiệp về cây trồng, giống, nông hóa, thổ nhưỡng, bảo vệ thực vật, chế biến nông sản, khảo nghiệm giống – phân bón – thuốc BVTV và công nghệ sinh học nông nghiệp; sản xuất thử, tư vấn và chuyển giao.'
  en: 'A centre doing agricultural R&D and field trials on crops, breeding, agrochemistry, soils, plant protection, post-harvest processing, testing of varieties, fertilisers and pesticides, and agricultural biotechnology; it pilots products and offers consulting and technology transfer.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Cây công nghiệp và cây dược liệu; Cây rau, cây hoa và cây ăn quả; Cây lương thực và cây thực phẩm; Nông lâm kết hợp; Nông hoá; Thổ nhưỡng; Chọn, tạo giống cây trồng; Công nghệ nhân giống cây trồng; Bảo vệ thực vật; Bảo quản và chế biến nông sản; Khảo nghiệm giống cây trồng, phân bón và thuốc bảo vệ thực vật; Công nghệ vi sinh vật trong nông nghiệp; Công nghệ sản xuất thuốc trừ sâu sinh học; Công nghệ sản phẩm sinh học; Công nghệ xử lý sinh học; Công nghệ xử lý môi trường bằng phương pháp sinh học. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo khoa học; Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn
    bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
