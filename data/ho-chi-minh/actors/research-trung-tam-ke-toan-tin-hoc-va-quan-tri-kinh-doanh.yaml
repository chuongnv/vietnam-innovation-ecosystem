id: research-trung-tam-ke-toan-tin-hoc-va-quan-tri-kinh-doanh
name:
  vi: Trung tâm Kế toán Tin học và Quản trị Kinh doanh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 54/2A-54/4-54/5, Thoại Ngọc Hầu, Phường Tân Phú, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng trong kinh doanh và quản trị kinh doanh; phát triển thử nghiệm phần mềm kế toán, quản trị, cung cấp tư vấn và đào tạo chuyên môn.'
  en: 'Centre researching and applying business and management practices; it develops and pilots accounting and management software and provides consulting and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh danh và quản trị kinh doanh. 2- Sản xuất thử nghiệm phần mềm kế toán, phần mềm quản trị. 3- Dịch vụ KH-CN: tư vấn, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4- Liên kết với các tổ chức trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
