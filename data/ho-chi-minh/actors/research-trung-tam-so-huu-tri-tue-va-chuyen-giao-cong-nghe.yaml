id: research-trung-tam-so-huu-tri-tue-va-chuyen-giao-cong-nghe
name:
  vi: Trung tâm Sở hữu Trí tuệ và Chuyển giao Công nghệ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Khu phố 6, Phường Linh Xuân, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về sở hữu trí tuệ và chuyển giao công nghệ, cung cấp dịch vụ đại diện sở hữu công nghiệp, tư vấn quyền tác giả, quyền đối với giống cây trồng, chuyển giao công nghệ và bồi dưỡng chuyên môn.'
  en: 'A centre researching intellectual property and technology transfer, providing industrial property representation, advice on copyright and plant variety rights, technology transfer and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học trong lĩnh vực sở hữu trí tuệ và chuyển giao công nghệ. 2- Dịch vụ KH&CN: Dịch vụ sở hữu trí tuệ (đại diện sở hữu công nghiệp, đại diện, tư vấn, dịch vụ quyền tác giả và quyền liên quan; tư vấn, dịch vụ quyền đối với giống cây trồng ; dịch vụ chuyển giao công nghệ; thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
