id: research-vien-nghien-cuu-va-pha-trien-cong-nghe-cao-van-lang
name:
  vi: Viện Nghiên cứu và phá triển công nghệ cao Văn Lang
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 45, Nguyễn Khắc Nhu, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ cao mang tên Văn Lang, hoạt động trong nông nghiệp công nghệ cao, công nghệ sinh học, thực phẩm, môi trường, công nghệ thông tin và năng lượng tái tạo; kinh doanh sản phẩm từ nghiên cứu, tư vấn, chuyển giao công nghệ và đào tạo ngắn hạn.'
  en: 'A high-technology research and development institute bearing the Van Lang name, working in high-tech agriculture, biotechnology, food, environment, IT and renewable energy; it commercialises research products and offers consulting, technology transfer and short training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: trong lĩnh vực công nghệ cao về quản lý, sản xuất ứng dụng công nghệ cao, nông nghiệp công nghệ cao, công nghệ sinh học, công nghiệ sinh học thực phẩm, công nghệ môi trường, công nghệ thông tin, năng lượng sinh học tái tạo; 2. Kinh doanh và sản xuất kinh doanh: các sản phẩm là kết quả nghiên cứu khoa học theo lĩnh vực đăng ký; 3. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo, đấu thầu các đề tài, dự án, các hợp đồng chuyển giao công nghệ, tư vấn khoa học, tổ chức triển khai phối hợp các hợp đồng liên kết về nghiên cứu khoa học, mở các lớp tập huấn, đào tạo ngắn hạn, bồi dưỡng kiến thức và kỹ năng (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ); 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
