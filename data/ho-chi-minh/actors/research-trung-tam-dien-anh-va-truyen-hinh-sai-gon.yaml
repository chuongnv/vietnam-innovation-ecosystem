id: research-trung-tam-dien-anh-va-truyen-hinh-sai-gon
name:
  vi: Trung Tâm Điện Ảnh Và Truyền Hình Sài Gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 139, Man Thiện, Phường Tăng Nhơn Phú A, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về nghệ thuật điện ảnh, truyền thanh, truyền hình; sản xuất nội dung số và cung cấp dịch vụ lưu trữ, số hóa tài liệu, vi phim, tư vấn và bồi dưỡng chuyên môn trong lĩnh vực này.'
  en: 'Centre researching film, radio and television arts; it produces digital content and provides archiving, document digitisation, microfilming, consulting and professional training in the field.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Nghệ thuật điện ảnh; Nghệ thuật truyền thanh, truyền hình. 2. Sản xuất thử nghiệm, sản xuất nội dung số, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học Công nghệ: Dịch vụ lưu trữ tài liệu khoa học và công nghệ (Xử lý, bảo quản tài liệu lưu trữ; Số hóa tài liệu lưu trữ); Dịch vụ sao chụp, vi hình hóa (làm vi phim, vi phiếu), thông tin khoa học và công nghệ; tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
