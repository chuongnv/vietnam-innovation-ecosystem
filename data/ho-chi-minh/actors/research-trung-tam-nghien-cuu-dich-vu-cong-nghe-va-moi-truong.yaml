id: research-trung-tam-nghien-cuu-dich-vu-cong-nghe-va-moi-truong
name:
  vi: Trung tâm Nghiên cứu Dịch vụ Công nghệ và Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 20, Đường số 4, Phường Hòa Hưng, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ xử lý chất thải, sản xuất sạch, tái chế, quan trắc ô nhiễm, thủy văn và tài nguyên nước; cung cấp tư vấn, chuyển giao công nghệ, thông tin và bồi dưỡng chuyên môn.'
  en: 'Centre researching and applying waste treatment, cleaner production, recycling, pollution monitoring, hydrology and water resources; it provides consulting, technology transfer, information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ sản xuất sạch, tái chế; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm, thủy văn; tài nguyên nước. 2. Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
