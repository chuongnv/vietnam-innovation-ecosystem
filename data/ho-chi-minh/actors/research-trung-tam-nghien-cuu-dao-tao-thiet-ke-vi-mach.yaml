id: research-trung-tam-nghien-cuu-dao-tao-thiet-ke-vi-mach
name:
  vi: Trung tâm Nghiên cứu Đào tạo Thiết kế Vi mạch
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Khu phố 6, Phường An Khánh, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Đại học Quốc gia TP.HCM, nghiên cứu, thiết kế vi mạch và thiết bị điện - điện tử, viễn thông, tự động hóa ứng dụng vi mạch; sản xuất thử, chuyển giao, tư vấn và đào tạo nhân lực thiết kế vi mạch.'
  en: 'Centre of Vietnam National University HCMC researching and designing integrated circuits and IC-based electronic, telecom and automation equipment; it carries out pilot production, transfer, consulting and training of chip-design engineers.'
description_source:
  text: '- Nghiên cứu, thiết kế, chế tạo các thiết bị (phần cứng và phần mềm) hệ thống điện – điện tử, viễn thông, công nghệ thông tin, cơ khí- tự động hóa sử dụng vi mạch. - Sản xuất thử nghiệm vi mạch và chuyển giao các thiết bị từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, thẩm định, giám sát và thi công, lắp đặt, bảo trì, bồi dưỡng đào tạo nguồn nhân lực theo lĩnh vực đăng ký. - Liên kết với các cơ sở nghiên cứu, đào tạo trong và ngoài nước thực hiện cc dịch vụ khoa học và công nghệ.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
