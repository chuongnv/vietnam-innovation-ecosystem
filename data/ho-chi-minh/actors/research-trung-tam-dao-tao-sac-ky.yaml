id: research-trung-tam-dao-tao-sac-ky
name:
  vi: Trung tâm Đào tạo Sắc Ký
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 79, Trương Định, Phường Bến Thành, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về hóa phân tích và quan trắc, kiểm soát ô nhiễm; cung cấp dịch vụ thử nghiệm chất lượng sản phẩm, kiểm định, hiệu chuẩn phương tiện đo, tư vấn xây dựng phòng thử nghiệm và đào tạo chuyên môn.'
  en: 'Centre researching analytical chemistry and pollution monitoring and control; it provides product quality testing, verification and calibration of measuring instruments, laboratory set-up consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; hóa phân tích. 2. Dịch vụ KH&CN: - Dịch vụ thử nghiệm chất lượng sản phẩm, hàng hóa. - Dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo. - Dịch vụ tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống bảo đảm về đo lường. - Dịch vụ tư vấn chuyển giao công nghệ. - Dịch vụ giám định công nghệ. - Thông tin khoa học và công nghệ, đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
