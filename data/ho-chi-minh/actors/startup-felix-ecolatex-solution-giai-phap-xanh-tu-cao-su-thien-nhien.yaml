id: startup-felix-ecolatex-solution-giai-phap-xanh-tu-cao-su-thien-nhien
name:
  vi: Felix Ecolatex Solution – Giải pháp xanh từ cao su thiên nhiên
type: startup
categories:
- Môi trường
sectors:
- climate
founded: 2020
website: https://thefelix.vn/
address: 52 Đường 30/4, P Phú Thọ Hoà, TP HCM
description:
  vi: 'Dự án Felix xử lý nệm cao su phế thải và phần vụn từ sản xuất nệm thành cao su tái sinh dạng khối, cung cấp làm nguyên liệu đầu vào cho các nhà máy sản xuất.'
  en: 'The Felix project processes discarded latex mattresses and offcuts from mattress production into recycled rubber blocks, supplied as raw material to manufacturers.'
description_source:
  text: https://thefelix.vn/ Môi trường Mô Hình Kinh Doanh Xanh và Bền Vững 27-08-2020 Việt Nam Hồ Chí Minh Sản phẩm chính của dự án là “Cao su tái sinh” (Recycled Rubber). Đây là một loại nguyên liệu thô được tạo ra từ quá trình xử lý nệm cao su phế thải và các loại ba vớ, rẻo thừa từ sản xuất nệm. Thay vì bán một tấm nệm hay một sản phẩm hoàn chỉnh, dự án tập trung vào việc bán nguyên liệu đầu vào, cụ thể là cao su tái sinh thành dạng bành (khối), với quy cách đóng gói tiện lợi (30kg hoặc 33kg) để dễ dàng vận chuyển và sử dụng trong các nhà máy sản xuất.
  source: HOIP (tự giới thiệu)
