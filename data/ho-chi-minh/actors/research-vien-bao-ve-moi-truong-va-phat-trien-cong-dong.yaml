id: research-vien-bao-ve-moi-truong-va-phat-trien-cong-dong
name:
  vi: Viện Bảo Vệ Môi Trường Và Phát Triển Cộng Đồng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 83, Đường Số 79, Phường Tân Hưng, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ môi trường như xử lý chất thải, sản xuất sạch, tái chế, quan trắc và xử lý ô nhiễm bằng phương pháp sinh học; cung cấp tư vấn, đánh giá, chuyển giao và đào tạo chuyên môn trong lĩnh vực này.'
  en: 'An institute researching and developing environmental technologies such as waste treatment, cleaner production, recycling, pollution monitoring and biological remediation; it also offers consulting, assessment, technology transfer and training in the field.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); Công nghệ sản xuất sạch, tái chế; Công nghệ phục hồi tái tạo môi trường; Công nghệ phân tích chu trình sống; Công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; Công nghệ xử lý môi trường bằng phương pháp sinh học; Y học lao động và vệ sinh môi trường. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học và Công nghệ: Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, không cấp văn bằng chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
