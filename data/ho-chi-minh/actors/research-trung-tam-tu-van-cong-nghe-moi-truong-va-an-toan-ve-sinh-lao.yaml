id: research-trung-tam-tu-van-cong-nghe-moi-truong-va-an-toan-ve-sinh-lao
name:
  vi: Trung tâm Tư vấn Công nghệ Môi trường và An toàn Vệ sinh Lao động
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 286/8A, Tô Hiến Thành, Phường Hòa Hưng, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về xử lý môi trường, tiết kiệm năng lượng và trang bị bảo hộ lao động; cung cấp thiết kế, giám sát công trình, đánh giá tác động môi trường, quan trắc, phân tích thí nghiệm và đào tạo về môi trường, an toàn lao động.'
  en: 'Centre doing applied research on environmental treatment, personal protective equipment and energy saving; it offers design consulting, construction supervision, monitoring, environmental impact assessment, lab analysis and training in environment and occupational safety.'
description_source:
  text: '1. Nghiên cứu và triển khai ứng dụng về xử lý môi trường; trang thiết bị bảo hộ lao động và tiết kiệm năng lượng. 2. Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 3. Dịch vụ KH&CN: - Tư vấn: thiết kế; giám sát thi công; thiết bị xử lý môi trường; quan trắc; đánh giá tác động môi trường; hệ thống quản lý chất lượng. - Phân tích thí nghiệm; thông tin khoa học và công nghệ; đào tạo bồi dưỡng về công nghệ môi trường và bảo hộ lao động. 4. Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
