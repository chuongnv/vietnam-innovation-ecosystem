id: research-trung-tam-chinh-sach-va-chien-luoc-nong-nghiep-nong-thon-mie
name:
  vi: Trung tâm Chính sách và Chiến lược Nông nghiệp Nông thôn Miền Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 12 Võ Văn Kiệt, P. Bến Thành - Nguyễn Thái Bình, Q.1, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm phía Nam chuyên nghiên cứu chính sách, chiến lược cho nông nghiệp và nông thôn, thị trường nông sản cùng các vấn đề kinh tế - xã hội vùng quê; ngoài ra còn tư vấn, phổ biến thông tin, chuyển giao thành quả và tập huấn.'
  en: 'Southern centre researching policy and strategy for agriculture and rural areas, farm-product markets and rural socio-economic issues; it also provides consulting, information, transfer of findings and training.'
description_source:
  text: '- Nghiên cứu khoa học và công nghệ trong các lĩnh vực: chính sách, chiến lược phát triển nông nghiệp, nông thôn; ngành hàng và thị trường nông sản; kinh tế - xã hội nông thôn; hội nhập kinh tế; quản lý tài nguyên nông nghiệp và phát triển; hệ thống nông nghiệp. - Dịch vụ KH&CN: thông tin khoa học và công nghệ, tư vấn, chuyển giao kết quả nghiên cứu, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
