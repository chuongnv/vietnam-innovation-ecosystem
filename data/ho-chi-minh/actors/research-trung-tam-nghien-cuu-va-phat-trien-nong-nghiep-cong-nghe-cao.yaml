id: research-trung-tam-nghien-cuu-va-phat-trien-nong-nghiep-cong-nghe-cao
name:
  vi: Trung tâm Nghiên cứu và Phát triển Nông nghiệp Công nghệ cao
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Ấp 1, Xã Nhuận Đức, Huyện Củ Chi, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển nông nghiệp công nghệ cao cho rau, quả, sinh vật cảnh, chăn nuôi (gia súc, gia cầm, thủy sản) và chế phẩm sinh học; làm thử nghiệm, kinh doanh sản phẩm từ nghiên cứu, kèm tư vấn và chuyển giao công nghệ.'
  en: 'Centre researching and developing high-tech agriculture for vegetables, fruit, ornamentals, aquaculture, livestock, poultry and bio-products; it pilot-produces and sells research-based products and offers consulting and technology transfer.'
description_source:
  text: '- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: rau; quả; sinh vật cảnh; chăn nuôi thủy sản; gia súc, gia cầm và chế phẩm sinh học. - Sản xuất thử - thử nghiệm; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. - Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
