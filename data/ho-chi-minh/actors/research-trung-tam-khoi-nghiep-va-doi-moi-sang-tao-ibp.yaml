id: research-trung-tam-khoi-nghiep-va-doi-moi-sang-tao-ibp
name:
  vi: Trung Tâm Khởi Nghiệp Và Đổi Mới Sáng Tạo Ibp
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 135, Hai Bà Trưng, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Công ty CP Xúc tiến Đầu tư và Hỗ trợ Doanh nghiệp IBP, thiết kế và vận hành chương trình ươm tạo, tăng tốc khởi nghiệp; tư vấn pháp lý, tài chính, thương mại hóa công nghệ và xúc tiến đầu tư cho startup.'
  en: 'Centre under IBP Investment Promotion and Business Support JSC that designs and runs incubation and acceleration programmes; it advises startups on legal, financial and technology-commercialisation matters and promotes investment in them.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: quan hệ sản xuất kinh doanh, kinh doanh và quản trị kinh doanh. 2. Dịch vụ khoa học và công nghệ: - Tư vấn về pháp lý, tài chính và quản trị doanh nghiệp cho các dự án, doanh nghiệp khởi nghiệp sáng tạo, doanh nghiệp công nghệ cao; - Thiết kế, xây dựng chương trình ươm tạo, tổ chức thực hiện chương trình ươm tạo; thiết kế, xây dựng và thực hiện các chương trình tăng tốc khởi nghiệp đổi mới sáng tạo; - Tổ chức tư vấn và các hoạt động hỗ trợ cho dự án khởi nghiệp, doanh nghiệp khởi nghiệp đổi mới sáng tạo, doanh nghiệp công nghệ cao; - Tư vấn chuyển giao công nghệ, thương mại hóa công nghệ cho các dự án, doanh nghiệp khởi nghiệp sáng tạo, doanh nghiệp công nghệ cao; - Tổ chức hội nghị, hội thảo, sự kiện, hội chợ, hoạt động xúc tiến, chương trình liên quan đến khoa học công nghệ và khởi nghiệp đổi mới sáng tạo; - Đầu tư và xúc tiến đầu tư cho các dự án và doanh nghiệp khởi nghiệp đổi mới sáng tạo. 3. Hợp tác trong và ngoài
    nước trên các lĩnh vực khởi nghiệp đổi mới sáng tạo, các lĩnh vực thuộc phạm vi đăng ký phù hợp theo quy định của pháp luật.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
