id: research-trung-tam-nghien-cuu-va-chuyen-giao-ky-thuat-nong-lam
name:
  vi: Trung tâm nghiên cứu và chuyển giao kỹ thuật Nông Lâm
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 504A, Tổ 11, Khu Phố 5, Phường Linh Xuân, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu nông lâm nghiệp về nông hóa, thổ nhưỡng, chọn tạo giống cây trồng và cây rừng, bảo vệ thực vật, lâm sinh, chế biến lâm sản và thức ăn chăn nuôi; tư vấn, chuyển giao kỹ thuật và tập huấn.'
  en: 'An agriculture and forestry research centre covering agrochemistry, soil science, crop and forest tree breeding, plant protection, silviculture, forest product processing and animal feed; it provides consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Nông hóa; Thổ nhưỡng; Chọn, tạo giống cây trồng; Bảo vệ thực vật; Lâm sinh, sinh thái và môi trường rừng; Quản lý và bảo vệ tài nguyên rừng; Chọn, tạo giống cây rừng; Nhân giống cây rừng; Bảo quản và chế biến lâm sản; Thức ăn và dinh dưỡng cho động vật nuôi. 2. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, tập huấn, bồi dưỡng chuyên môn; tư vấn hỗ trợ hình thành chương trình, đề tài, dự án trong lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
