description_source:
  text: 'Prowtech International Vina → Doanh nghiệp được định giá 1.000 tỷ VNĐ, đồng thời nhận đầu tư chiến lược từ VGI Public Company Limited (Thái Lan) thông qua VGI Vietnam JSC. Mở rộng hệ sinh thái với các công ty thành viên: T-ICON Company Limited, Transad Vietnam JSC, Viet Media Impressive JSC. Thành tựu, giải thưởng: Công ty Cổ phần Prowtech International Vina → Được vinh danh Top Thương hiệu Uy tín Hàng đầu Châu Á 2023. → Được vinh danh Top Thương hiệu Uy tín Hàng đầu Việt Nam 2022. Vai trò: Phó Tổng Giám Đốc (DGD), Trưởng Ban điều hành (BOM), Giám Đốc Kỹ Thuật (CTO)'
