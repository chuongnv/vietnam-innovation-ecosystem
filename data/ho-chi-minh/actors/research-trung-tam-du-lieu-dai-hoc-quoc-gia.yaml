id: research-trung-tam-du-lieu-dai-hoc-quoc-gia
name:
  vi: Trung Tâm Dữ Liệu Đại học Quốc Gia Thành Phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Phường Linh Xuân, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Khu Công nghệ Phần mềm ĐHQG-HCM, nghiên cứu CNTT - truyền thông; đồng thời xây dựng, vận hành và cung cấp dịch vụ data center cùng hạ tầng mạng, máy chủ.'
  en: 'Centre under the VNU-HCM Software Technology Park, researching ICT and building, operating and providing data-centre services together with network and server infrastructure.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực công nghệ thông tin và truyền thông. 2. Kinh doanh và sản xuất các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Xây dựng quản lý và khai thác dịch vụ trung tâm dữ liệu, hạ tầng mạng, hạ tầng máy thông tin khoa học công nghệ theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
