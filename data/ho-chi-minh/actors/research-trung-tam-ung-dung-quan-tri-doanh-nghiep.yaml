id: research-trung-tam-ung-dung-quan-tri-doanh-nghiep
name:
  vi: Trung tâm ứng dụng Quản trị Doanh nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 17-19-21, Nguyễn Văn Trỗi, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về kinh doanh và quản trị; cung cấp dịch vụ giám định, cấp chứng nhận cho hệ thống quản lý chất lượng, tư vấn áp dụng công cụ quản lý chất lượng và xây dựng tiêu chuẩn.'
  en: 'Centre researching business and management; it provides quality-management-system certification, inspection, and consulting on applying quality-management tools and developing standards.'
description_source:
  text: '1- Nghiên cứu khoa học trong lĩnh vực kinh doanh và quản trị kinh doanh. 2- Dịch vụ KH&CN: - Dịch vụ chứng nhận hệ thống quản lý chất lượng ; - Dịch vụ tổ chức giám định, tổ chức chứng nhận hệ thống - Dịch vụ tư vấn áp dụng các công cụ quản lý chất lượng, tư vấn xây dựng tiêu chuẩn. - Thông tin khoa học, chuyển giao kết quả nghiên cứu, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
