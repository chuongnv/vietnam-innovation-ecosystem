id: research-vien-nghien-cuu-khoa-hoc-co-ban-va-ung-dung
name:
  vi: Viện Nghiên cứu Khoa Học Cơ Bản Và Ứng Dụng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 6, Trần Nhật Duật, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Duy Tân, nghiên cứu đa ngành gồm công nghệ thông tin, điện – điện tử, hóa, vật lý, kinh tế, xây dựng, môi trường, công nghệ sinh học, y dược, ngôn ngữ và luật, tương ứng các ngành đào tạo của trường.'
  en: 'An institute under Duy Tan University conducting multidisciplinary research across IT, electrical and electronic engineering, chemistry, physics, economics, construction, environment, biotechnology, medicine and pharmacy, languages and law, mirroring the university''s fields of study.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong các lĩnh vực: Kỹ thuật phần mềm; Hệ thống thông tin; Công nghệ kỹ thuật Điện - Điện tử; Hóa học; Vật lý; Quản trị kinh doanh; Tài chính ngân hàng; Kế toán; Kiến trúc; Kỹ thuật xây dựng; Công nghệ kỹ thuật công trình xây dựng; Công nghệ kỹ thuật môi trường; Quản lý tài nguyên và môi trường; Công nghệ thực phẩm; Công nghệ sinh học; Điều dưỡng; Dược học; Y Đa khoa; Răng - Hàm - Mặt; Văn học, Việt Nam học; Truyền thông đa phương tiện; Quan hệ quốc tế; Ngôn ngữ Anh; Luật Kinh tế, Luật học; Ngôn ngữ Trung Quốc; Quản trị dịch vụ Du lịch và Lữ hành.'
