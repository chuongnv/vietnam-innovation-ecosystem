id: research-trung-tam-nghien-cuu-khoa-hoc-cong-nghe-7a
name:
  vi: Trung Tâm Nghiên Cứu Khoa Học Công Nghệ 7A
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 466 Nguyễn Trãi, Phường An Đông, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Bệnh viện Quân y 7A, nghiên cứu điện tử, CNTT, công nghệ sinh học và y học cơ sở, lâm sàng, dự phòng; sản xuất thử, tổ chức hội thảo, tư vấn chuyển giao công nghệ và liên kết đào tạo.'
  en: 'Centre of Military Hospital 7A researching electronics, IT, biotechnology and basic, clinical and preventive medicine; it carries out pilot production, holds conferences, advises on technology transfer and co-organises training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: kỹ thuật điện, điện tử, công nghệ thông tin và truyền thông (4.2); công nghệ sinh học (4.8); y học cơ sở (5.1), y học lâm sàng (5.2) và y học dự phòng (5.3). 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ, tư vấn môi giới chuyển giao công nghệ, tư vấn chuyển giao công nghệ, kết quả nghiên cứu; phối hợp, liên kết đào tạo tổ chức các khóa đào tạo ngắn hạn, dài hạn; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
