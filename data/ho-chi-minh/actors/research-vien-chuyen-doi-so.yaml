id: research-vien-chuyen-doi-so
name:
  vi: Viện Chuyển Đổi Số
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 140, Lê Trọng Tấn, Phường Tây Thạnh, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Công nghiệp Thực phẩm TP.HCM, nghiên cứu trong các lĩnh vực toán học, khoa học máy tính, kỹ thuật điện và kinh tế; tổ chức hội thảo, tư vấn chuyển giao công nghệ và tập huấn chuyên môn.'
  en: 'An institute under Ho Chi Minh City University of Food Industry conducting research in mathematics, computer science, electrical engineering and economics, and providing workshops, technology-transfer consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Toán học; Khoa học máy tính và thông tin; Kỹ thuật điện; Kinh tế. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ; môi giới, tư vấn chuyển giao công nghệ; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
