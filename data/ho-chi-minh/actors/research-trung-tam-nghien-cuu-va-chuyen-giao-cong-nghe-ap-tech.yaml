id: research-trung-tam-nghien-cuu-va-chuyen-giao-cong-nghe-ap-tech
name:
  vi: Trung Tâm Nghiên Cứu Và Chuyển Giao Công Nghệ Ap-Tech
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 39, Đường 20, Phường Hiệp Bình Phước, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu và phát triển công nghệ tự động hóa, điều khiển số, phần mềm và chế tạo máy cho y tế, nông sản và thủy sản; sản xuất thử, kinh doanh sản phẩm nghiên cứu và tư vấn, đánh giá, chuyển giao công nghệ.'
  en: 'A centre doing R&D in automation, computer control, software and machinery for healthcare, agricultural and aquatic products; it pilots and sells research products and provides technology consulting, assessment and transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; công nghệ phần mềm; kỹ thuật thiết kế và công nghệ chế tạo máy phục vụ trong y học; nông sản và thủy sản. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tư vấn chuyển giao công nghệ; đánh giá công nghệ; xúc tiến chuyển giao công nghệ; tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
