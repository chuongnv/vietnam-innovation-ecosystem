  text: '- Dịch vụ KH-CN: Tư vấn thiết kế, thẩm định, lập dự án đầu tư; đào tạo bồi dưỡng, thông tin khoa học và công nghệ trong lĩnh vực môi trường giao thông vận tải. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
