description:
  vi: 'Trung tâm hoạt động trong mảng môi trường của ngành giao thông vận tải, nhận tư vấn thiết kế, thẩm định và lập dự án đầu tư, đồng thời tổ chức đào tạo và cung cấp thông tin khoa học cho ngành.'
  en: 'Centre working on environmental matters in the transport sector, offering design consulting, appraisal and investment project preparation, along with training and scientific information.'
