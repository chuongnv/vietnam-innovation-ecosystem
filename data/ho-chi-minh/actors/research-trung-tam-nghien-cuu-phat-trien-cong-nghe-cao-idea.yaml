id: research-trung-tam-nghien-cuu-phat-trien-cong-nghe-cao-idea
name:
  vi: Trung Tâm Nghiên Cứu Phát Triển Công Nghệ Cao Idea
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 16, Bình Lợi, Phường Bình Lợi Trung, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu cơ khí chính xác, chế tạo máy, robot, tự động hóa và phần mềm nhúng, IoT, quản lý sản xuất; kinh doanh sản phẩm từ kết quả nghiên cứu, môi giới, xúc tiến chuyển giao công nghệ và đào tạo.'
  en: 'Centre researching precision mechanics, machine building, robotics, automation, embedded software, IoT and production-management software; it sells research-based products, brokers and promotes technology transfer and provides training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ cơ khí chính xác; Chế tạo máy, người máy và điều khiển tự động, tự động hóa; Phần mềm: điều khiển tự động, phần mềm nhúng, phần mềm quản lý sản xuất, IoT. 2. Kinh doanh và sản xuất kinh doanh sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Dịch vụ triển lãm khoa học và công nghệ, tổ chức hội chợ công nghệ và thiết bị; chuyển giao công nghệ; Dịch vụ môi giới chuyển giao công nghệ; Dịch vụ xúc tiến chuyển giao công nghệ; Đào tạo bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
