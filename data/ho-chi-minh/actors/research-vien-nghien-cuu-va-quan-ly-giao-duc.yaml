description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong giáo dục và quản trị kinh doanh; cung cấp các dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in education science and business administration; offers consulting, transfer of research results, scientific information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: khoa học giáo dục nói chung; kinh doanh và quản trị kinh doanh. 2. Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
