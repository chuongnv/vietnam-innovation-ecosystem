id: research-vien-cong-nghe-tata-mandala
name:
  vi: Viện Công Nghệ Tata Mandala
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 28-30, Ngô Quyền, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc một công ty tư nhân, nghiên cứu công nghệ sinh học nông nghiệp và y sinh như công nghệ gen, nhân giống, vi sinh, thuốc trừ sâu sinh học, lên men và vật liệu y sinh; kinh doanh sản phẩm nghiên cứu và cung cấp dịch vụ KH&CN.'
  en: 'An institute under a private company researching agricultural and biomedical biotechnology, including genetics, breeding, microbiology, bio-pesticides, fermentation and biomedical materials; it commercialises research products and provides S&T services.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ gen, công nghệ nhân giống cây trồng và vật nuôi; Công nghệ tế bào trong nông nghiệp; Công nghệ vi sinh vật trong nông nghiệp; Công nghệ sản xuất thuốc trừ sâu sinh học; Các công nghệ xử lý sinh học, xúc tác sinh học, lên men; Công nghệ sinh học liên quan đến y học, y tế; Vật liệu sinh học liên quan đến cấp phép trong y học, thiết bị, cảm biến y học. 2. Kinh doanh, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, tư vấn, phản biện, đánh giá các nhiệm vụ khoa học công nghệ; Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ, Dịch vụ đánh giá công nghệ, Dịch vụ xúc tiến chuyển giao công nghệ; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của
    cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
