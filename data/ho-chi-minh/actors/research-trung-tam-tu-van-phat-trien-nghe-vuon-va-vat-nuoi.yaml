id: research-trung-tam-tu-van-phat-trien-nghe-vuon-va-vat-nuoi
name:
  vi: Trung tâm Tư vấn Phát triển Nghề vườn và Vật nuôi
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 58 Nguyễn Bĩnh Khiêm, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về rau, hoa, cây ăn quả, chọn tạo và nhân giống cây trồng, bảo vệ thực vật, chế biến nông sản và thức ăn vật nuôi; cung cấp tư vấn, thông tin và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research on vegetables, flowers and fruit trees, crop breeding and propagation, plant protection, post-harvest processing and animal feed; it provides consulting, information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: cây rau, cây hoa và cây ăn quả; chọn, tạo giống cây trồng ; công nghệ nhân giống cây trồng; bảo vệ thực vật; bảo quản và chế biến nông sản; thức ăn và dinh dưỡng cho động vật nuôi. - Dịch vụ KH&CN: Tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
