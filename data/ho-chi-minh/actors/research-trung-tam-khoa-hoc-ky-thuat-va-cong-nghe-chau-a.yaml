id: research-trung-tam-khoa-hoc-ky-thuat-va-cong-nghe-chau-a
name:
  vi: Trung Tâm Khoa Học Kỹ Thuật Và Công Nghệ Châu Á
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 14/23, Đường số 53, Phường An Hội Tây, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Công ty CP Nam Công Group, nghiên cứu xây dựng, cơ khí chế tạo máy, vật liệu, kỹ thuật thực phẩm và phần mềm; sản xuất thử, tư vấn, chuyển giao công nghệ, tổ chức hội thảo và đào tạo.'
  en: 'Centre under Nam Cong Group JSC researching construction, mechanical engineering, materials, food engineering and software; it carries out pilot production, consulting, technology transfer, seminars and training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Kiến trúc và xây dựng dân dụng, Kỹ thuật cơ khí và công nghệ chế tạo máy, Công nghệ vật liệu và kỹ thuật luyện kim, Kỹ thuật thực phẩm và đồ uống, Công nghệ phần mềm. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao công nghệ; Tham gia đào tạo và bồi dưỡng nâng cao nghiệp vụ chuyên môn; Thông tin khoa học công nghệ; Tổ chức hội nghị, hội thảo khoa học chuyên ngành; Hoạt động tiêu chuẩn, đo lường, chất lượng; Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký trên (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
