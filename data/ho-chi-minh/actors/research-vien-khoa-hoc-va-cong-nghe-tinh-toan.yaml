id: research-vien-khoa-hoc-va-cong-nghe-tinh-toan
name:
  vi: Viện Khoa học và Công nghệ tính toán
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Tòa Nhà SBI, Công Viên Phần Mềm Quang Trung, Phường Trung Mỹ Tây, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Sở Khoa học và Công nghệ TP.HCM, nghiên cứu và ứng dụng khoa học tính toán; sản xuất thử từ kết quả nghiên cứu, cung cấp tư vấn, chuyển giao công nghệ và bồi dưỡng chuyên môn.'
  en: 'An institute under the Ho Chi Minh City Department of Science and Technology researching and applying computational science; it pilots research outputs and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực khoa học tính toán. 2. Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng nâng cao trình độ nghiệp vụ theo lĩnh vực đăng ký. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
