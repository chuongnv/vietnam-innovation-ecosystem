id: research-trung-tam-an-ninh-mang
name:
  vi: Trung tâm An ninh mạng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: DHCNTT, Khu phố 6, Phường Linh Xuân, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Công nghệ Thông tin TP.HCM, nghiên cứu và ứng dụng trong an toàn thông tin, công nghệ thông tin; phát triển sản phẩm từ kết quả nghiên cứu, tư vấn, chuyển giao công nghệ và bồi dưỡng nghiệp vụ.'
  en: 'Centre of the University of Information Technology (VNU-HCM) researching and applying information security and IT; it develops research-based products and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực an toàn thông tin, công nghệ thông tin. 2. Sản xuất thử - thử nghiệm, sản xuất - kinh doanh: các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
