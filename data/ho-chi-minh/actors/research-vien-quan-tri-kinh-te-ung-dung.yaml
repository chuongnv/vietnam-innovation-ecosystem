description:
  vi: 'Viện nghiên cứu và ứng dụng khoa học trong lĩnh vực kinh tế, cung cấp tư vấn và bồi dưỡng về tài chính, kế toán, kiểm toán, quản trị kinh doanh, du lịch, pháp lý, ngoại ngữ và tin học quản lý.'
  en: 'An institute researching and applying science in economics, offering consulting and training in finance, accounting, auditing, business administration, tourism, legal matters, foreign languages and management IT.'
description_source:
  text: '- Nghiên cứu phát triển ứng dụng khoa học công nghệ về lĩnh vực kinh tế. - Tư vấn, bồi dưỡng đào tạo, triển khai ứng dụng, thực hiện các dịch vụ KHCN về kinh tế, tài chính, kế toán, kiểm toán, QTKD, du lịch, pháp lý, ngoại ngữ & tin học quản lý. - Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký.'
