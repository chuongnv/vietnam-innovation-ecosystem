id: research-vien-kinh-te-va-ky-thuat-sai-gon
name:
  vi: Viện Kinh Tế Và Kỹ Thuật Sài Gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 97, Đặng Dung, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kinh doanh, quản trị, hệ thống thông tin – truyền thông, kỹ thuật xây dựng và hạ tầng đô thị; sản xuất thử, kinh doanh sản phẩm nghiên cứu, tổ chức hội thảo và tư vấn chuyển giao công nghệ.'
  en: 'An institute researching business and management, ICT systems, civil engineering and urban infrastructure; it pilots and sells research products, organises workshops and provides technology-transfer consulting.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Quan hệ sản xuất kinh doanh, Kinh doanh và quản trị kinh doanh, Các hệ thống thông tin và truyền thông, Kỹ thuật xây dựng, Công trình hạ tầng đô thị. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Tư vấn chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
