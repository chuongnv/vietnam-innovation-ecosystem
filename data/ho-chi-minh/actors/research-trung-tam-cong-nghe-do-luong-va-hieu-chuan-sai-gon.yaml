id: research-trung-tam-cong-nghe-do-luong-va-hieu-chuan-sai-gon
name:
  vi: Trung tâm công nghệ đo lường và hiệu chuẩn Sài Gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 151, Nguyễn Hữu Tiến, Phường Tây Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Công ty CP Công nghệ Đo lường Sài Gòn, nghiên cứu về đo lường, hiệu chuẩn; cung cấp dịch vụ kiểm định, hiệu chuẩn, thử nghiệm và bảo trì, sửa chữa phương tiện đo, thiết bị thử nghiệm.'
  en: 'Centre under Saigon Measurement Technology JSC, researching metrology and calibration; it provides verification, calibration and testing of measuring instruments, plus maintenance and repair of measuring and testing equipment.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực hiệu chuẩn và đo lường. 2. Dịch vụ KH&CN: dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo; dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật; tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ theo lĩnh vực đăng ký. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
