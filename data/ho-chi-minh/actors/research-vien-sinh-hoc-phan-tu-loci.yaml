id: research-vien-sinh-hoc-phan-tu-loci
name:
  vi: Viện sinh học phân tử LOCI
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 8/11 C, Linh Đông, Phường Tam Bình, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về sinh học phân tử; cung cấp dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin khoa học và tập huấn chuyên môn trong lĩnh vực này.'
  en: 'Institute doing applied research in molecular biology; offers consulting, transfer of research results, scientific information and professional training in the field.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực sinh học phân tử. 2- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
