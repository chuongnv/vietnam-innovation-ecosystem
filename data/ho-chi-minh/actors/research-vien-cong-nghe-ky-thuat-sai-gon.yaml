id: research-vien-cong-nghe-ky-thuat-sai-gon
name:
  vi: Viện Công nghệ Kỹ thuật Sài gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 287B, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về toán học, khoa học máy tính, hệ thống thông tin, viễn thông, phần cứng và phần mềm; đồng thời nhận tư vấn, chuyển giao thành quả, cung cấp thông tin khoa học và tập huấn chuyên môn.'
  en: 'Institute doing applied research in mathematics, computer science, information systems, telecommunications, hardware and software; it also offers consulting, transfer of results, scientific information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: toán học lý thuyết và ứng dụng; khoa học máy tính, khoa học thông tin; tin học trong các ngành khoa học tự nhiên; các hệ thống thông tin và truyền thông; kỹ thuật, công nghệ viễn thông; công nghệ phần cứng và kiến trúc máy tính; công nghệ phần mềm. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
