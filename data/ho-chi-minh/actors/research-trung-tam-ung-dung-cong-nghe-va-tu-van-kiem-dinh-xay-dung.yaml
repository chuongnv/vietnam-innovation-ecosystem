id: research-trung-tam-ung-dung-cong-nghe-va-tu-van-kiem-dinh-xay-dung
name:
  vi: Trung tâm Ứng dụng Công nghệ và Tư vấn Kiểm định Xây dựng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 778K/35, Nguyễn Kiệm, Phường Hạnh Thông, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng trong xây dựng giao thông, dân dụng và công nghiệp; thí nghiệm vật liệu, khảo sát địa hình – địa chất, quan trắc lún, thử tải cầu và sức chịu tải cọc, tư vấn lập dự án, thiết kế và kiểm định công trình.'
  en: 'A centre doing applied research in transport, civil and industrial construction; it tests building materials, conducts topographic and geological surveys, settlement monitoring, bridge and pile load tests, and advises on project preparation, design and inspection of works.'
description_source:
  text: '- Nghiên cứu và triển khai ứng dụng trong lĩnh vực xây dựng: giao thông, dân dụng và công nghiệp. - Sản xuất thử - thử nghiệm vật liệu xây dựng, chuyển giao công nghệ trong lĩnh vực xây dựng. - Dịch vụ KH&CN: Khảo sát địa hình, địa chất, thủy văn công trình; quan trắc biến dạng, lún; thí nghiệm kiểm tra thử tải cầu, thí nghiệm xác định sức chịu tải của cọc các lọai; thí nghiệm xác định chỉ tiêu cơ lý của vật liệu xây dựng. Tư vấn: lập dự án đầu tư, thiết kế, thẩm tra thiết kế và dự toán, đấu thầu, quản lý các dự án xây dựng; giám sát thi công các công trình giao thông, thủy lợi, dân dụng, công nghiệp; chứng nhận sự phù hợp về chất lượng công trình xây dựng theo Luật định. - Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
