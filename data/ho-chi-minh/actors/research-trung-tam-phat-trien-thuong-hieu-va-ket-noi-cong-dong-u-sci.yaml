id: research-trung-tam-phat-trien-thuong-hieu-va-ket-noi-cong-dong-u-sci
name:
  vi: Trung Tâm Phát Triển Thương Hiệu Và Kết Nối Cộng Đồng U-Sci
type: research
categories:
- Tổ chức khoa học và công nghệ
address: TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu các lĩnh vực hóa học, công nghệ hóa dược, xử lý chất thải, sản xuất sạch, tái chế và quan trắc, phục hồi môi trường; cung cấp thử nghiệm, giám định chất lượng, kiểm định – hiệu chuẩn phương tiện đo và chuyển giao công nghệ.'
  en: 'A research centre in chemistry, pharmaceutical chemistry, waste treatment, cleaner production, recycling and environmental monitoring and remediation; it provides quality testing and inspection, calibration of measuring instruments and technology transfer.'
description_source:
  text: '''- Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Hóa hữu cơ; Hóa vô cơ và hạt nhân; Hóa lý; Hóa phân tích; Hóa học cao phân tử; Các vấn đề chung về hóa học công nghiệp; Công nghệ hóa dược; Quá trình và thiết bị công nghệ hóa học; Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); Công nghệ sản xuất sạch, tái chế; Công nghệ phục hồi và tái tạo môi trường; Công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. - Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ; Dịch vụ thử nghiệm chất lượng sản phẩm hàng hóa; Kiểm định, hiệu chuẩn phương tiện đo; Dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu
    cầu theo các lĩnh vực đăng ký trên. - Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
