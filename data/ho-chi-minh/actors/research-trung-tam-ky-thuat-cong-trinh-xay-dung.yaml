id: research-trung-tam-ky-thuat-cong-trinh-xay-dung
name:
  vi: Trung Tâm Kỹ Thuật Công Trình Xây Dựng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 179, Trần Quốc Thảo, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu kỹ thuật xây dựng, hạ tầng đô thị, công trình giao thông và thủy lợi; tư vấn, lập dự án cho các công trình xây dựng, hạ tầng kỹ thuật, giao thông và thủy lợi.'
  en: 'Centre researching construction engineering, urban infrastructure, transport and irrigation works; it provides consulting and project preparation for construction, technical infrastructure, transport and irrigation works.'
description_source:
  text: '1. Nghiên cứu khoa học và công nghệ trong lĩnh vực: kỹ thuật xây dựng, công trình hạ tầng đô thị, công trình giao thông, công trình thủy lợi. 2. Dịch vụ khoa học và công nghệ: Tư vấn, lập dự án các công trình xây dựng, hạ tầng kỹ thuật, công trình giao thông, công trình thủy lợi. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
