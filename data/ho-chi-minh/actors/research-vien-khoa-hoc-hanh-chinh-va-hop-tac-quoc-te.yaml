id: research-vien-khoa-hoc-hanh-chinh-va-hop-tac-quoc-te
name:
  vi: Viện Khoa Học Hành Chính Và Hợp Tác Quốc Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 41/1A3, Đường 35, Phường Hiệp Bình Phước, Thành phố Thủ Đức
description:
  vi: 'Viện nghiên cứu về kinh doanh, quản trị kinh doanh và triết học; tổ chức hội thảo, tư vấn, chuyển giao kết quả nghiên cứu và mở các lớp đào tạo, bồi dưỡng ngắn hạn.'
  en: 'An institute researching business, business management and philosophy; it organises workshops, provides consulting and transfer of research results, and runs short training courses.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Kinh doanh và quản trị kinh doanh; Triết học. 2. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, chuyển giao nghiên cứu, tổ chức các lớp đào tạo, bồi dưỡng ngắn hạn phù hợp với lĩnh vực đăng ký cho các tổ chức cá nhân có nhu cầu (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước phục vụ công tác nghiên cứu trong lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
