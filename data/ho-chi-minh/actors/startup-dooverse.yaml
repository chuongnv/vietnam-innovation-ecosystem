founded: 2025
address: 12N7, KP Tây A, Đông Hòa, Dĩ An, Bình Dương
description:
  vi: 'Dự án tận dụng toàn bộ cây đu đủ để tạo các sản phẩm sinh học như đu đủ sấy, thuốc trừ sâu sinh học lên men từ lá và vỏ, viên enzyme papain, gel tẩy tế bào chết và trà thảo dược, kèm chủ động nguồn giống.'
  en: 'A project using the whole papaya plant to make bio-based products such as dried papaya, fermented bio-pesticides from leaves and peel, papain enzyme tablets, exfoliating gel and herbal tea, with its own seed stock.'
description_source:
  text: 'https://www.facebook.com/profile.php?id=61579991983818&mibextid=wwXIfr Sinh học, CNSH Mô Hình Kinh Doanh Xanh và Bền Vững 18-08-2025 Việt Nam Toàn quốc Dự án “Đa dạng hóa các chế phẩm sinh học từ đu đủ” được hình thành từ thực tiễn canh tác và tiêu thụ đu đủ tại Việt Nam – nơi cây đu đủ được trồng phổ biến nhưng giá trị kinh tế vẫn còn thấp do chỉ khai thác phần quả, trong khi các bộ phận khác như lá, hạt, hoa, vỏ và mủ chứa nhiều hợp chất sinh học quý như papain, alkaloid, flavonoid... thường bị bỏ phí. Trước thực trạng “được mùa mất giá” và sự lãng phí tài nguyên sinh học, nhóm chúng tôi hướng đến tận dụng toàn bộ cây đu đủ, bao gồm cả đu đủ đực và đu đủ cái, để tạo ra hệ sinh thái sản phẩm sinh học đa dạng, giá trị cao, thân thiện với môi trường và sức khỏe con người. Điểm khác biệt nổi bật của dự án là tự chủ nguồn giống đu đủ chất lượng cao, được tuyển chọn và lai tạo để đảm bảo độ ngọt trên 80%, hương thơm tự nhiên và giá trị dinh dưỡng vượt trội. Từ đó, nhóm đã phát triển
    chuỗi sản phẩm sinh học hoàn chỉnh theo định hướng kinh tế tuần hoàn xanh, bao gồm: đu đủ sấy dẻo và mứt đu đủ giàu vitamin; thuốc trừ sâu sinh học chiết xuất từ lá và vỏ đu đủ qua công nghệ lên men vi sinh; viên enzyme tiêu hóa chứa papain tinh khiết cao giúp hỗ trợ hệ tiêu hóa; gel tẩy tế bào chết thiên nhiên sử dụng hạt đu đủ thay thế hạt vi nhựa; bột nêm thảo mộc kết hợp hạt đu đủ với các dược liệu giàu hoạt tính sinh học; bột kháng giun và trà thảo dược từ hoa và lá đu đủ đực với nhiều hương vị phù hợp từng đối tượng sử dụng. Dự án không chỉ mang ý nghĩa khoa học – công nghệ trong việc khai thác giá trị sinh học của cây đu đủ, mà còn hướng đến mục tiêu phát triển bền vững, góp phần tăng thu nhập cho nông dân, giảm thiểu rác thải nông nghiệp, bảo vệ môi trường và nâng cao sức khỏe cộng đồng. Với định hướng “biến cây đu đủ từ nông sản phổ thông thành nguồn nguyên liệu sinh học đa năng”, dự án mở ra tiềm năng lớn trong ngành chế biến sinh học và nông nghiệp xanh Việt Nam.'
  source: HOIP (tự giới thiệu)
