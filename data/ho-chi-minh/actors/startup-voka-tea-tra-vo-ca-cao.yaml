id: startup-voka-tea-tra-vo-ca-cao
name:
  vi: VOKA TEA - Trà vỏ Ca cao
type: startup
categories:
- F&B
sectors:
- agrifood
founded: 2025
address: 477/43/14 Thống Nhất, phường 16, quận Gò Vấp, Tp Hồ Chí Minh
description:
  vi: 'Dự án sản xuất trà thảo mộc từ vỏ trái ca cao, một phụ phẩm thường bị bỏ đi, phối hợp với thảo dược tự nhiên, nhằm tái sử dụng phụ phẩm nông nghiệp.'
  en: 'A project making herbal tea from cocoa pod husks, a usually discarded by-product, blended with natural herbs to make use of agricultural waste.'
description_source:
  text: -- F&B Mô Hình Kinh Doanh Xanh và Bền Vững 06-06-2025 Việt Nam Toàn quốc Trà vỏ ca cao là trà thảo mộc làm từ vỏ trái ca cao – phụ phẩm thường bị bỏ đi. Kết hợp cùng với thảo dược tự nhiên tạo nên thức uống lành mạnh, thơm nhẹ, hậu ngọt tự nhiên và giàu dinh dưỡng. Sản phẩm góp phần hình thành chuỗi giá trị tuần hoàn mới – một sáng kiến xanh tái chế phụ phẩm nông nghiệp, nơi phụ phẩm được tái sinh thành sản phẩm có giá trị cho sức khỏe và kinh tế.
  source: HOIP (tự giới thiệu)
