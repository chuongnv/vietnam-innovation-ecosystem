id: research-trung-tam-ket-noi-khoa-hoc-ky-thuat-cong-nghiep
name:
  vi: Trung Tâm Kết Nối Khoa Học Kỹ Thuật - Công Nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 224, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Liên hiệp các Hội Khoa học và Kỹ thuật TP.HCM, nghiên cứu quản trị kinh doanh và quản lý chất lượng; tư vấn tiêu chuẩn, chuyển giao công nghệ, xúc tiến, trưng bày công nghệ và tổ chức hội thảo, bồi dưỡng.'
  en: 'Centre under the HCMC Union of Science and Technology Associations researching business and quality management; it advises on standards and technology transfer, promotes and showcases technologies, and organises seminars and training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: quản trị kinh doanh và quản lý chất lượng phục vụ các ngành khoa học kỹ thuật, công nghệ. 2. Dịch vụ khoa học - công nghệ: - Tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng tiêu chuẩn; Dịch vụ tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); - Dịch vụ xúc tiến chuyển giao công nghệ (tạo, tìm kiếm cơ hội và thúc đẩy chuyển giao công nghệ; quảng cáo, giới thiệu, trưng bày công nghệ; tổ chức, triển lãm công nghệ); - Tổ chức hội nghị, hội thảo khoa học, bồi dưỡng về lĩnh vực: quản trị kinh doanh; Quản lý chất lượng; Kỹ thuật môi trường; Chế biến thực phẩm và đồ uống; Xây dựng; Hỗ trợ phát triển doanh nghiệp đổi mới sáng tạo. 3. Hợp tác: Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
