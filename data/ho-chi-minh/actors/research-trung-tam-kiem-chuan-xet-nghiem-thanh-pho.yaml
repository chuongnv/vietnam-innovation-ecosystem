id: research-trung-tam-kiem-chuan-xet-nghiem-thanh-pho
name:
  vi: Trung Tâm Kiểm Chuẩn Xét Nghiệm Thành Phố
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 75A Cao Thắng, Phường Bàn Cờ, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Sở Y tế TP.HCM, nghiên cứu và đảm bảo chất lượng xét nghiệm y khoa; kiểm định, hiệu chuẩn thiết bị xét nghiệm, thử nghiệm tủ an toàn sinh học và đào tạo cán bộ các cơ sở xét nghiệm.'
  en: 'Centre under the HCMC Department of Health that researches and assures the quality of medical laboratory testing; it verifies and calibrates lab equipment, tests biosafety cabinets and trains laboratory staff.'
description_source:
  text: 1. Tổ chức nghiên cứu khoa học nhằm thúc đẩy các mặt hoạt động của công tác kiểm chuẩn xét nghiệm, phục vụ yêu cầu nâng cao chất lượng của các xét nghiệm về y khoa trên địa bàn thành phố. 2. Kiểm định, hiệu chuẩn trang thiết bị y tế phục vụ xét nghiệm và thử nghiệm tủ an toàn sinh học. 3. Đào tạo bồi dưỡng cán bộ chuyên môn kỹ thuật về kiểm chuẩn xét nghiệm. Phối hợp với các cơ quan liên quan tổ chức huấn luyện, bồi dưỡng nâng cao kiến thức và năng lực cán bộ trong các cơ sở xét nghiệm nhằm đảm bảo chất lượng xét nghiệm.
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
