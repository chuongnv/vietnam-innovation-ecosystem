id: research-trung-tam-nghien-cuu-phat-trien-thiet-bi-y-hoc-va-vat-lieu-s
name:
  vi: Trung tâm nghiên cứu phát triển thiết bị y học và vật liệu sinh học
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 55 Hồng Hà, Phường Tân Sơn Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng thiết bị y học, vật liệu sinh học cấy ghép, cảm biến y học và polyme; sản xuất thử từ kết quả nghiên cứu, tư vấn, chuyển giao công nghệ và bồi dưỡng chuyên môn.'
  en: 'Centre researching and applying medical devices, implantable biomaterials, medical sensors and polymers; it pilot-produces research outputs and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ và kỹ thuật thiết bị y học; vật liệu sinh học liên quan đến cấy ghép trong y học, thiết bị, cảm biến y học; hóa học cao phân tử (polyme). 2. Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
