id: research-vien-tai-chinh-ben-vung
name:
  vi: Viện Tài Chính Bền Vững
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 279, Nguyễn Tri Phương, Phường Vườn Lài, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về kinh tế, tài chính và quản trị gắn với các mục tiêu phát triển bền vững; tổ chức hội thảo, tư vấn, đánh giá nhiệm vụ khoa học và xây dựng chương trình đào tạo về kinh tế tuần hoàn, kinh doanh bền vững.'
  en: 'An institute researching economics, finance and management in relation to sustainable development goals; it holds workshops, provides consulting and evaluation of S&T projects, and develops training programmes on the circular economy and sustainable business.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học và công nghệ trong lĩnh vực kinh tế, tài chính và quản trị hướng đến các mục tiêu phát triển bền vững của quốc tế và Việt Nam. 2. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo (như hội thảo chuyên đề, hội thảo khoa học, hội thảo tham vấn, seminars và workshops); Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ về các lĩnh vực do Trung tâm phụ trách; Xây dựng và triển khai các chương trình đào tạo, liên kết đào tạo trong và ngoài nước trong lĩnh vực kinh tế, tài chính, quản trị và các lĩnh vực liên quan đến kinh tế tuần hoàn và kinh doanh bền vững; Tập huấn, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
