description_source:
  text: Giám đốc Trung tâm Khởi nghiệp Đổi mới Sáng tạo ĐHQG-HCM (IEC) Ông có hơn 9 năm kinh nghiệm trong quá trình tham gia xây dựng Hệ sinh thái Khởi nghiệp Đổi mới Sáng tạo tại ITP và Cộng đồng Khởi nghiệp Việt Nam. Ông đã hỗ trợ, tư vấn hơn 200 Dự án Khởi nghiệp Đổi mới Sáng tạo hằng năm; tham gia đào tạo, hướng dẫn hơn 5.000 cán bộ quản lý về phát triển, xây dựng Hệ sinh thái Khởi nghiệp tại địa phương.
  source: HOIP (tự giới thiệu)
