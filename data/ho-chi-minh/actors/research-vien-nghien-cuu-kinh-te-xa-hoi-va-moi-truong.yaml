id: research-vien-nghien-cuu-kinh-te-xa-hoi-va-moi-truong
name:
  vi: Viện Nghiên cứu Kinh Tế, Xã Hội Và Môi Trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 635, Nguyễn Kiệm, Phường Đức Nhuận, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty TNHH Du Lịch Khanh, nghiên cứu về kinh doanh, quản trị, du lịch, địa lý kinh tế – văn hóa và khía cạnh xã hội của môi trường; cung cấp tư vấn, chuyển giao kết quả, hội thảo và tập huấn.'
  en: 'An institute under Khanh Travel Co., Ltd. researching business, management, tourism, economic and cultural geography and social aspects of the environment; it provides consulting, transfer of results, workshops and training.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Kinh doanh và quản trị kinh doanh; Quan hệ sản xuất kinh doanh; Du lịch; Địa lý kinh tế và văn hóa; Khoa học môi trường - các khía cạnh xã hội. 2. Dịch vụ khoa học và công nghệ: Tư vấn, chuyển giao kết quả nghiên cứu; tổ chức hội nghị, hội thảo, tập huấn, bồi dưỡng cho các tổ chức cá nhân theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
