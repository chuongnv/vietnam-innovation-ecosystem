id: research-trung-tam-tu-van-va-chuyen-giao-tien-bo-ky-thuat-mia-duong
name:
  vi: Trung tâm Tư vấn và Chuyển giao Tiến bộ Kỹ thuật Mía Đường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 172/3A, Nguyễn Tất Thành, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về cây mía; sản xuất thử, kinh doanh sản phẩm từ nghiên cứu, đồng thời chuyển giao tiến bộ kỹ thuật, tư vấn, lập dự án, điều tra khảo sát và tập huấn chuyên môn cho ngành mía đường.'
  en: 'Centre doing applied research on sugarcane; it pilot-produces and sells research-based products and provides consulting, technical transfer, project preparation, surveys and professional training for the sugar industry.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng về cây mía. 2. Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao tiến bộ kỹ thuật, lập dự án đầu tư, điều tra khảo sát, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn trong ngành mía đường (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
