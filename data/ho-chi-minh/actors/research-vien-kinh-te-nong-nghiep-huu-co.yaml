id: research-vien-kinh-te-nong-nghiep-huu-co
name:
  vi: Viện Kinh tế Nông nghiệp Hữu cơ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 216, Phạm Thái Bường, Phường Tân Hưng, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về chọn tạo và nhân giống cây trồng, chăm sóc vật nuôi, hóa hữu cơ và quản trị kinh doanh hướng tới nông nghiệp hữu cơ; sản xuất thử từ kết quả nghiên cứu, tư vấn và chuyển giao.'
  en: 'An institute conducting applied research on crop breeding and propagation, livestock care, organic chemistry and business management oriented to organic agriculture; it pilots research outputs and provides consulting and transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: chọn, tạo giống cây trồng; công nghệ nhân giống cây trồng; chăm sóc, nuôi dưỡng và bảo vệ động vật vật nuôi; hóa hữu cơ; kinh doanh và quản trị kinh doanh. 2. Sản xuất thử nghiệm từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
