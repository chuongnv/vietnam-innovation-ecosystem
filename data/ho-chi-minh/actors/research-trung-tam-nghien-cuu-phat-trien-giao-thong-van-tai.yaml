id: research-trung-tam-nghien-cuu-phat-trien-giao-thong-van-tai
name:
  vi: Trung Tâm Nghiên Cứu Phát Triển Giao Thông Vận Tải
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 92, Nam Kỳ Khởi Nghĩa, Phường Bến Thành, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Viện Chiến lược và Phát triển Giao thông vận tải, nghiên cứu chiến lược, quy hoạch, chính sách, dự báo nhu cầu vận tải và an toàn giao thông; tư vấn quy hoạch, khảo sát, thiết kế, giám sát, thẩm tra công trình giao thông.'
  en: 'Centre under the Transport Development and Strategy Institute researching transport strategy, planning, policy, demand forecasting and road safety; it provides planning, survey, design, supervision and appraisal services for transport works.'
description_source:
  text: '1. Nghiên cứu chiến lược, quy hoạch, đánh giá hiệu quả các cơ chế, chính sách quản lý và phát triển giao thông vận tải, dự báo nhu cầu vận tải hành khách và hàng hóa, các giải pháp ứng phó biến đổi khí hậu, phân tích, đánh giá hiệu quả kinh tế các dự án đầu tư, an toàn giao thông, định mức, đơn giá, đảm bảo trật tự an toàn giao thông và giảm ùn tắt giao thông, quản lý và khai thác hệ thống cơ sở dữ liệu trong lĩnh vực giao thông vận tải; Nghiên cứu, ứng dụng khoa học công nghệ, thông tin, tư vấn các lĩnh vực có liên quan đến hạ tầng giao thông vận tải. 2. Tư vấn dịch vụ khoa học và công nghệ như: xây dựng, thủy lợi, lập quy hoạch tổng thể và chi tiết giao thông vận tải, khảo sát lưu lượng giao thông, phân tích hồ sơ dự báo nhu cầu vận tải, đánh giá môi trường, phương án tổng thể giải phóng mặt bằng, khảo sát địa hình, địa chất, thủy văn công trình, giám sát xây dựng các công trình giao thông, hạ tầng kỹ thuật, xây dựng dân dụng, giám sát môi trường, tham gia thẩm tra thiết kế và
    dự toán các công trình giao thông, xây dựng và thủy lợi, lập báo cáo nghiên cứu tiền khả thi, báo cáo khả thì đầu tư xây dựng, báo cáo kinh tế kỹ thuật, thiết kế bản vẽ, tư vấn đấu thầu, tư vấn quản lý dự án, thẩm tra an toàn giao thông đối với các dự án đầu tư xây dựng công trình, tư vấn chuẩn bị đầu tư. Thẩm định thiết kế, dự toán các công trình do các đơn vị khác lập. 3. Hợp tác trong và ngoài nước liên quan đến nghiên cứu khoa học, đào tạo, bồi dưỡng cán bộ khoa học, huấn luyện chuyển giao công nghệ và quản lý dự án. Tổ chức hội thảo, hội nghị thuộc lĩnh vực giao thông vận tải.'
