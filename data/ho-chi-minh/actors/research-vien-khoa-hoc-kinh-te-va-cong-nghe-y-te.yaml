id: research-vien-khoa-hoc-kinh-te-va-cong-nghe-y-te
name:
  vi: ViệN Khoa HọC Kinh Tế Và Công Nghệ Y Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 110 Hồ Văn Huê, Phường Đức Nhuận, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Quỹ Từ thiện Sức khoẻ là số 1, nghiên cứu về kinh tế y tế, dược lâm sàng, y học lao động, y tế công cộng và quản trị kinh doanh; sản xuất thử sản phẩm nghiên cứu, tổ chức hội thảo, tư vấn và bồi dưỡng ngắn hạn.'
  en: 'An institute under the ''Health is Number One'' Charity Fund researching health economics, clinical pharmacy, occupational medicine, public health and business management; it pilots research products, organises workshops and provides consulting and short courses.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Quan hệ sản xuất kinh doanh; Kinh doanh và quản trị kinh doanh; Kinh tế y tế; Dược học lâm sàng và điều trị; Y học lao động và vệ sinh môi trường; Y tế công cộng. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; huấn luyện, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
