id: research-trung-tam-nghien-cuu-tu-van-cong-tac-xa-hoi-va-phat-trien-co
name:
  vi: Trung tâm Nghiên cứu Tư vấn Công tác Xã hội và Phát triển Cộng đồng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 273/51, Nguyễn Văn Đậu, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu các vấn đề giới, phụ nữ, gia đình, dân số và giáo dục chuyên biệt cho người khuyết tật; tư vấn và tổ chức bồi dưỡng ngắn hạn về công tác xã hội và phát triển cộng đồng.'
  en: 'A centre researching gender, women, family, population and special education for people with disabilities; it offers consulting and short courses on social work and community development.'
description_source:
  text: '1. Nghiên cứu về giới và phụ nữ, gia đình, dân số, nếp sống, giáo dục chuyên biệt cho người khuyết tật. 2. Dịch vụ KH-CN: Tư vấn, thông tin khoa học, đào tạo bồi dưỡng ngắn hạn về các kiến thức kỹ năng chuyên môn công tác xã hội và phát triển cộng đồng (không cấp văn bằng, chứng chỉ) 3. Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
