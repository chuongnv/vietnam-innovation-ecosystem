id: research-trung-tam-hieu-chuan-va-thu-nghiem-vinacalib
name:
  vi: Trung Tâm Hiệu Chuẩn Và Thử Nghiệm Vinacalib
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 23/30, Đường C1, Phường Tân Bình, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, cung cấp dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo và chuẩn đo lường, thử nghiệm chất lượng hàng hóa; tư vấn xây dựng phòng thử nghiệm, hệ thống đảm bảo đo lường và bảo trì thiết bị.'
  en: 'Centre researching and providing verification, calibration and testing of measuring instruments and measurement standards and product quality testing; it also advises on test-lab set-up and measurement assurance systems and maintains equipment.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: kiểm định, hiệu chuẩn và thử nghiệm phương tiện đo, nghiên cứu thử nghiệm chất lượng sản phẩm hàng hóa. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Dịch vụ về kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, chuẩn đo lường. Dịch vụ tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống bảo đảm về đo lường. Dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật. Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký trên (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
