id: research-vien-giong-va-cong-nghe-nong-nghiep-lavi
name:
  vi: Viện Giống Và Công Nghệ Nông Nghiệp Lavi
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 261 Hoàng Văn Thụ, Phường Tân Sơn Hòa, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty Cổ phần Lavifood, nghiên cứu chọn tạo và nhân giống cây trồng, bảo vệ thực vật, bảo quản chế biến nông sản và vi sinh nông nghiệp; sản xuất thử sản phẩm và tư vấn sở hữu trí tuệ trong nông nghiệp.'
  en: 'An institute under Lavifood JSC researching crop breeding and propagation, plant protection, post-harvest processing and agricultural microbiology; it pilots products and advises on intellectual property protection in agriculture.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: Chọn, tạo giống cây trồng; Công nghệ nhân giống cây trồng; Cây rau, cây hoa và cây ăn quả; Cây lương thực và cây thực phẩm; Cây công nghiệp và cây dược liệu; Bảo vệ thực vật; Bảo quản và chế biến nông sản; Công nghệ vi sinh nông nghiệp. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: - Dịch vụ tư vấn đăng ký bảo hộ sở hữu trí tuệ trong nước và quốc tế trong lĩnh vực nông nghiệp và các lĩnh vực liên quan; - Xây dựng mô hình chuyển giao công nghệ nông nghiệp và các lĩnh vực liên quan; - Tư vấn, đánh giá, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
