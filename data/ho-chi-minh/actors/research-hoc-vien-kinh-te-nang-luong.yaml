id: research-hoc-vien-kinh-te-nang-luong
name:
  vi: Học Viện Kinh Tế - Năng Lượng
type: research
categories:
- Tổ chức khoa học và công nghệ
- Học viện
address: 207/3, Hồ Học Lãm, Phường An Lạc, TP. Hồ Chí Minh
description:
  vi: 'Tổ chức KH&CN trực thuộc Liên hiệp Khoa học Kinh tế - Đô thị Nam bộ, nghiên cứu kinh tế và năng lượng (gồm năng lượng mới, an toàn bức xạ, xử lý chất thải phóng xạ), tư vấn đầu tư, lập dự án và đào tạo cán bộ ngành năng lượng.'
  en: 'S&T organisation under the Southern Economic-Urban Science Union, researching economics and energy (including new energy, radiation safety and radioactive waste treatment) and providing investment consulting, project preparation and training for energy-sector staff.'
description_source:
  text: '1. Nghiên cứu khoa học kinh tế và năng lượng, xây dựng chiến lược, quy hoạch và kế hoạch phát triển kinh tế - xã hội; tham gia nghiên cứu xây dựng các dự án về năng lượng nước, môi trường, tài nguyên và năng lượng mới. 2. Thực hiện nghiên cứu cơ bản, nghiên cứu ứng dụng khoa học kỹ thuật năng lượng, nghiên cứu phát triển về an toàn bức xạ, công nghệ xử lý và công nghệ quản lý chất thải phóng xạ phục vụ phát triển kinh tế - xã hội. 3. Tham gia thực hiện quy hoạch, đào tạo và huấn luyện cán bộ khoa học kỹ thuật ngành năng lượng theo quy định của Nhà nước. 4. Thực hiện các dịch vụ khoa học và công nghệ: tư vấn đầu tư, lập dự án đầu tư, dịch thuật, tư vấn các vấn đề kinh tế và năng lượng, giám sát độc lập các đề tài/dự án khoa học trong lĩnh vực kinh tế và năng lượng. 5. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
