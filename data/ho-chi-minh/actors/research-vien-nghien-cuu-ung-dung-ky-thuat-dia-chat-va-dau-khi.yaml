id: research-vien-nghien-cuu-ung-dung-ky-thuat-dia-chat-va-dau-khi
name:
  vi: Viện Nghiên cứu Ứng dụng Kỹ thuật Địa chất và Dầu Khí
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 23A, Hậu Giang, Phường Tân Sơn Nhất, Thành phố Hồ Chí Minh
description:
  vi: 'Viện gắn với Khoa Kỹ thuật Địa chất và Dầu khí, Trường Đại học Bách khoa, nghiên cứu quy hoạch và khai thác hợp lý tài nguyên thiên nhiên, các chuyên ngành địa chất (khoáng sản, công trình, thủy văn, môi trường), địa kỹ thuật, kỹ thuật dầu khí; hoạt động gồm sản xuất thử, chuyển giao công nghệ, tư vấn, giám định công nghệ, phân tích thử nghiệm và đào tạo.'
  en: 'Institute linked to the Faculty of Geology and Petroleum Engineering, University of Technology, researching planning and sustainable use of natural resources, geology (minerals, engineering, hydro- and environmental), geotechnics and petroleum engineering; it pilots products, transfers technology and offers consulting, technology appraisal, testing and training.'
description_source:
  text: '- Nghiên cứu quy hoạch và sử dụng hợp lý tài nguyên thiên nhiên, địa chất khoáng sản, địa chất công trình, địa chất thuỷ văn, địa chất môi trường, địa kỹ thuật và kỹ thuật dầu khí. - Sản xuất thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. (Khoa KT, Địa chất và Dầu khí – ĐHBK) - Dịch vụ KH&CN: Tư vấn, giám định công nghệ, thông tin, phân tích thử nghiệm, đào tạo bồi dưỡng về lĩnh vực đăng ký theo quy định pháp luật. - Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
