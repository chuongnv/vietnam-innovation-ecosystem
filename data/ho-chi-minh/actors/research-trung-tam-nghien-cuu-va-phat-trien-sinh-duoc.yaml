id: research-trung-tam-nghien-cuu-va-phat-trien-sinh-duoc
name:
  vi: Trung tâm nghiên cứu và phát triển Sinh dược
alt_names:
- Trung tâm nghiên cứu và phát triển sinh dược VICOHN (335)
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: Lô I-9-6, Đường D2, Khu Công nghệ cao TP. Hồ Chí Minh, phường Long Thạnh Mỹ, TP. Thủ Đức, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về huyết học – truyền máu và công nghệ sinh học y học; sản xuất thử, kinh doanh sản phẩm từ kết quả nghiên cứu và cung cấp tư vấn, chuyển giao, bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research in haematology, blood transfusion and medical biotechnology; it pilots and sells research-based products and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: huyết học và truyền máu; công nghệ sinh học liên quan đến y học, y tế. 2. Sản xuất - thử nghiệm; sản xuất - kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
