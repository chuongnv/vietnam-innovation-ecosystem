- Viện đào tạo
address: 391A, Nam Kỳ Khởi Nghĩa, Phường Bình Tiên, Thành phố Hồ Chí Minh
description:
  vi: 'Đơn vị trực thuộc Trường Đại học FPT, nghiên cứu phát triển chương trình đào tạo theo chuẩn quốc tế gắn với ngành công nghệ thông tin; cung cấp tư vấn, chuyển giao công nghệ và đào tạo nhân lực CNTT.'
  en: 'A unit under FPT University that develops training programmes aligned with international standards and the IT industry; it provides consulting, technology transfer and IT workforce training.'
description_source:
  text: '- Nghiên cứu phát triển các chương trình đào tạo tiên tiến, cập nhật theo chuẩn mực quốc tế và gắn với công nghiệp công nghệ thông tin. - Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, đào tạo bồi dưỡng nguồn nhân lực công nghệ thông tin (chỉ được cấp giấy chứng nhận, không cấp văn bẳng, chúng chỉ). - Hợp tác với các tổ chức trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
