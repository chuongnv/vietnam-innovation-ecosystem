id: research-trung-tam-khoa-hoc-va-cong-nghe-moi-truong
name:
  vi: Trung tâm Khoa học và Công nghệ Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: MP 74, Tô Ký, Phường Trung Mỹ Tây, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Viện Môi trường và Tài nguyên, ĐHQG-HCM, nghiên cứu, ứng dụng công nghệ xử lý chất thải, sản xuất sạch, tái chế, phục hồi môi trường và quan trắc ô nhiễm; tư vấn, chuyển giao và đào tạo.'
  en: 'Centre of the Institute for Environment and Resources, VNU-HCM, researching and applying waste treatment, cleaner production, recycling, environmental remediation and pollution monitoring; it offers consulting, technology transfer and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng , khí); công nghệ sản xuất sạch, tái chế; công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. - Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
