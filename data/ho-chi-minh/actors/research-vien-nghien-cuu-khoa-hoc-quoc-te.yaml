id: research-vien-nghien-cuu-khoa-hoc-quoc-te
name:
  vi: Viện Nghiên cứu Khoa Học Quốc Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 50, Trương Định, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty TNHH American University of Science, nghiên cứu về sinh lý học y học, ung thư học, kinh tế y tế, quản trị bệnh viện, quản trị kinh doanh và giáo dục; kinh doanh sản phẩm nghiên cứu, tổ chức hội thảo và bồi dưỡng chuyên môn.'
  en: 'An institute under American University of Science Co., Ltd. researching medical physiology, oncology, health economics, hospital management, business management and education; it commercialises research outputs, organises workshops and provides professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Sinh lý học y học; Ung thư học; Kinh doanh và quản trị kinh doanh; Khoa học giáo dục nói chung (bao gồm cả sư phạm học, lý luận giáo dục); Kinh tế y tế; quản trị bệnh viện. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
