id: research-trung-tam-hieu-chuan-kiem-dinh-khoi-toan
name:
  vi: Trung tâm Hiệu chuẩn Kiểm định Khởi Toàn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 89, Đường số 6, Xã Bà Điểm, Huyện Hóc Môn, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu cải tiến thiết bị, công nghệ đo lường; cung cấp dịch vụ kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, thử nghiệm chất lượng hàng hóa, bảo trì sửa chữa thiết bị và tư vấn xây dựng phòng đo lường.'
  en: 'Centre working on improving measurement equipment and technology; it provides verification, calibration and testing of measuring instruments, product quality testing, equipment maintenance and repair, and consulting on setting up measurement labs.'
description_source:
  text: '1. Nghiên cứu cải tiến thiết bị và công nghệ trong lĩnh vực đo lường. 2. Dịch vụ KH&CN: thử nghiệm chất lượng sản phẩm, hàng hoá; kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo; bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết vị kỹ thuật; tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
