id: research-trung-tam-nghien-cuu-va-tu-van-thuy-san-thanh-loan
name:
  vi: Trung tâm nghiên cứu và tư vấn thủy sản Thanh Loan
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 246 Đường Bình Lợi, Phường Bình Lợi Trung, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về nuôi trồng thủy sản và bệnh thủy sản, cung cấp dịch vụ tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research on aquaculture and aquatic animal diseases, offering consulting, transfer of research results and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực nuôi trồng thủy sản; bệnh thủy sản. 2- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
