id: research-vien-cong-nghe-vien-thong-sai-gon
name:
  vi: Viện Công nghệ Viễn thông Sài gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 100, Đào Duy Anh, Phường Đức Nhuận, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và triển khai công nghệ thông tin, cơ điện tử và viễn thông; sản xuất thử, chuyển giao công nghệ và tư vấn khảo sát, thiết kế, giám sát, quản lý dự án công trình điện tử – viễn thông.'
  en: 'An institute researching and deploying IT, mechatronics and telecommunications technology; it pilots and transfers technology and provides survey, design, supervision and project-management consulting for electronics and telecom works.'
description_source:
  text: '- Nghiên cứu phát triển và triển khai áp dụng các công nghệ thuộc các lĩnh vực công nghệ thông tin, cơ - điện tử, viễn thông. - Sản xuất thử nghiệm, chuyển giao công nghệ thuộc các lĩnh vực công nghệ thông tin, cơ – điện tử, viễn thông. - Dịch vụ KH&CN: Tư vấn: khảo sát, thiết kế, giám sát công trình chuyên ngành điện tử, viễn thông, công nghệ thông tin; tư vấn đầu tư xây dựng: thẩm tra, quản lý dự án, đấu thầu, chuyển giao công nghệ điện tử, viễn thông, công nghệ thông tin theo Luật định. - Hợp tác trong và ngoài nước trên các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
