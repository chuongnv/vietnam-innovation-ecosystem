address: 521/105C, Cách Mạng Tháng Tám, Phường Xuân Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu tâm lý học chuyên ngành, cung cấp dịch vụ tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn về tâm lý.'
  en: 'A centre researching applied psychology, providing consulting, transfer of research results and professional training in psychology.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực tâm lý học chuyên ngành. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
