id: research-vien-cong-nghiep-moi-truong
name:
  vi: Viện Công Nghiệp Môi Trường
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 224, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Liên hiệp các Hội Khoa học và Kỹ thuật TP.HCM, nghiên cứu công nghệ kỹ thuật môi trường trong công nghiệp và nông nghiệp; tư vấn đo lường, thử nghiệm chất lượng, quản lý chất lượng và chuyển giao công nghệ.'
  en: 'An institute under the Ho Chi Minh City Union of Science and Technology Associations researching environmental engineering for industry and agriculture; it advises on measurement, quality testing and quality management and transfers technology.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực Công nghệ kỹ thuật môi trường trong công, nông nghiệp. 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ; Dịch vụ tư vấn về đầu tư, trang bị và quản lý đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; Tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng hệ thống bảo đảm về đo lường; chuyển giao công nghệ; tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
