id: research-vien-kinh-te-va-cong-nghe-dong-a
name:
  vi: Viện Kinh tế và Công nghệ Đông Á
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1, Đường 34, Phường An Lạc, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về kinh doanh, quản trị kinh doanh và triết học; sản xuất thử, chuyển giao phần mềm phục vụ tài chính, kế toán và quản trị doanh nghiệp, kèm dịch vụ tư vấn và đào tạo.'
  en: 'An institute conducting applied research in business, management and philosophy; it develops and transfers software for finance, accounting and business management, along with consulting and training services.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: quan hệ sản xuất kinh doanh; kinh doanh và quản trị kinh doanh; triết học. 2- Sản xuất thử - thử nghiệm, chuyển giao các phần mềm phục vụ trong lĩnh vực tài chính, kế toán và quản trị kinh doanh. 3- Dịch vụ KH&CN: Tư vấn; thông tin khoa học; đào tạo bồi dưỡng nâng cao nghiệp vụ chuyên môn (không cấp văn bằng, chứng chỉ) theo lĩnh vực đăng ký. 4- Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
