id: research-trung-tam-dich-vu-phan-tich-thi-nghiem
name:
  vi: Trung tâm Dịch vụ Phân tích Thí nghiệm Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm
description:
  vi: 'Đơn vị thuộc Trung tâm Dịch vụ Phân tích thí nghiệm và Tiêu chuẩn Đo lường Chất lượng TP.HCM, thực hiện phân tích, thử nghiệm chất lượng sản phẩm, quan trắc môi trường, chứng nhận hợp chuẩn, hiệu chuẩn thiết bị và tư vấn ISO 17025, ISO 9001.'
  en: 'Unit under the HCMC Centre for Analytical Services and Standards-Metrology-Quality, providing laboratory analysis, product quality testing, environmental monitoring, conformity certification, equipment calibration and ISO 17025/ISO 9001 consulting.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực phân tích thí nghiệm; nghiên cứu phục vụ yêu cầu điều tra khai thác, chế biến tài nguyên và phát hiện, xử lý ô nhiễm môi trường. 2. Sản xuất thử - thử nghiệm, sản xuất - kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: - Dịch vụ: thử nghiệm chất lượng sản phẩm, hàng hóa; khảo sát quan trắc, đánh giá tác động và thực trạng môi trường; tư vấn áp dụng các hệ thống quản lý ISO 17025, ISO 9001; chứng nhận sản phẩm phù hợp tiêu chuẩn và quy chuẩn kỹ thuật; hiệu chuẩn, bảo trì, sửa chữa thiết bị thử nghiệm; cung cấp chương trình thử nghiệm thành thạo, mẫu chuẩn, chủng chuẩn; tư vấn, cải tiến, nâng cao năng suất và chất lượng sản phẩm; tư vấn lập dự án đầu tư xây dựng và thiết bị phòng thí nghiệm. - Chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký
    phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
