id: research-trung-tam-tin-hoc
name:
  vi: Trung tâm Tin học
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 227, Nguyễn Văn Cừ, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ thông tin, sản xuất thử, chuyển giao và kinh doanh sản phẩm CNTT; cung cấp tư vấn, giám sát, thẩm định dự án CNTT, các dịch vụ CNTT và đào tạo tin học.'
  en: 'A centre doing applied IT research that pilots, transfers and sells IT products; it provides consulting, supervision and appraisal of IT projects, IT services and computer training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực công nghệ thông tin. - Sản xuất thử - thử nghiệm; chuyển giao công nghệ; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. - Dịch vụ KH&CN: Tư vấn, giám sát và thẩm định các dự án công nghệ thông tin; các dịch vụ về công nghệ thông tin; huấn luyện bồi dưỡng trong lĩnh vực công nghệ thông tin. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
