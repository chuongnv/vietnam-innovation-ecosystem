id: research-vien-cong-nghe-va-khoa-hoc-quan-ly-moi-truong-va-tai-nguyen
name:
  vi: Viện Công nghệ và Khoa học Quản lý Môi trường và Tài nguyên
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 950/43, Nguyễn Kiệm, Phường Hạnh Thông, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu ứng dụng về quản lý, xử lý chất thải, quan trắc và kiểm soát ô nhiễm, địa chất, tài nguyên nước, thủy văn và thủy sản; cung cấp tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng chuyên môn.'
  en: 'An institute conducting applied research on waste management and treatment, pollution monitoring and control, geology, water resources, hydrology and aquaculture; it provides consulting, transfer of results and training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng khí); công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; khoa học môi trường – các khía cạnh xã hội; công nghệ phần mềm; địa chất học; địa kỹ thuật; nuôi trồng thủy sản; quản lý, đánh giá và khai thác nguồn lợi thủy sản; thủy văn, tài nguyên nước. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
