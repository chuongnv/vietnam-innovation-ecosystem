id: research-vien-nghien-cuu-giao-duc-montessori
name:
  vi: Viện Nghiên cứu Giáo Dục Montessori
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 20, Đường số 46, Phường Tân Hưng, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học giáo dục, sư phạm và giáo dục chuyên biệt cho người khuyết tật, gắn với phương pháp Montessori; tổ chức hội thảo, tư vấn, tập huấn chuyên môn và kinh doanh sản phẩm từ kết quả nghiên cứu.'
  en: 'An institute researching educational science, pedagogy and special education for people with disabilities, linked to the Montessori method; it organises workshops, provides consulting and professional training, and commercialises research outputs.'
description_source:
  text: '1. Nghiên cứu khoa học trong lĩnh vực: Khoa học giáo dục nói chung (bao gồm cả sư phạm học, lý luận giáo dục); Giáo dục chuyên biệt cho người khuyết tật. 2. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, tư vấn, môi giới chuyển giao công nghệ, tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ) 3. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
