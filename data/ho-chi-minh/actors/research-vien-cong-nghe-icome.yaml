id: research-vien-cong-nghe-icome
name:
  vi: Viện Công nghệ ICOME
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 106A, Nguyên Hồng, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu đa lĩnh vực, gồm toán ứng dụng, quản trị kinh doanh, hóa dược, công nghệ nano, tự động hóa, phần mềm, xây dựng, công nghệ sinh học và thực phẩm; cung cấp tư vấn, chuyển giao kết quả và bồi dưỡng chuyên môn.'
  en: 'A multidisciplinary institute covering applied mathematics, business management, pharmaceutical chemistry, nanotechnology, automation, software, construction, biotechnology and food technology; it provides consulting, transfer of results and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực toán học ứng dụng; kinh doanh và quản trị kinh doanh; công nghệ hóa dược; các quy trình nano; người máy và điều khiển tự động; công nghệ phần mềm; kiến trúc; kỹ thuật xây dựng; công nghệ gen, công nghệ nhân giống cây trồng và vật nuôi; công nghệ tế bào trong nông nghiệp; công nghệ sinh học liên quan đến y học, y tế; công nghệ tế bào trong y học; công nghệ thực phẩm; công nghệ đồ uống. 2. Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
