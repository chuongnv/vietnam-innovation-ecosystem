id: research-trung-tam-phat-trien-khoa-hoc-cong-nghe-va-do-luong-chat-luo
name:
  vi: Trung Tâm Phát Triển Khoa Học Công Nghệ Và Đo Lường Chất Lượng Laco
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Xã Xuân Thới Sơn, Huyện Hóc Môn, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về tiêu chuẩn, đo lường, chất lượng và năng suất, phần mềm quản lý theo ISO 9001, truy xuất nguồn gốc và chuyển đổi số; cung cấp kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, tư vấn phòng thử nghiệm và bảo trì thiết bị đo.'
  en: 'A centre researching standards, metrology, quality and productivity, ISO 9001 management software, traceability and digital transformation; it provides verification, calibration and testing of measuring instruments, laboratory consulting and maintenance of measuring equipment.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: tiêu chuẩn, đo lường, chất lượng và năng suất; Nghiên cứu phát triển các phần mềm quản lý đáp ứng theo yêu cầu của tiêu chuẩn ISO 9001; Nghiên cứu ứng dụng công nghệ vào truy xuất nguồn gốc hàng hóa; Nghiên cứu các ứng dụng công nghệ vào hoạt động sản xuất, nâng cao hiệu quả sản xuất cho doanh nghiệp; Nghiên cứu ứng dụng công nghệ phục vụ chuyển đổi số cho tổ chức, cá nhân có nhu cầu. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học Công nghệ: Dịch vụ về kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, chuẩn đo lường (trừ hoạt động kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, chuẩn đo lường bức xạ, hạt nhân và hoạt động kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo, chuẩn đo lường phục vụ trực tiếp cho hoạt động đo lường đặc thù thuộc lĩnh vực quốc phòng, an ninh). Dịch vụ tư vấn về đầu tư, trang bị và quản lý
    phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống bảo đảm về đo lường. Dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật. Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; đào tạo, bồi dưỡng ngắn hạn về xây dựng và áp dụng các hệ thống quản lý theo tiêu chuẩn ISO và các hệ thống quản lý tiên tiến của thế giới và các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
