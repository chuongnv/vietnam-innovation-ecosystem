id: research-trung-tam-nghien-cuu-va-ung-dung-y-hoc-co-truyen-van-xuan
name:
  vi: Trung Tâm Nghiên Cứu Và Ứng Dụng Y Học Cổ Truyền Vạn Xuân
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 100/38 Đường TCH07, Phường Trung Mỹ Tây, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu y học cổ truyền: dược liệu từ động, thực vật và khoáng chất, bào chế bài thuốc đông y và thực phẩm bảo vệ sức khỏe, các phương pháp không dùng thuốc như châm cứu, bấm huyệt; sản xuất thử sản phẩm và tư vấn, chuyển giao, huấn luyện.'
  en: 'A traditional medicine research centre working on medicinal materials from plants, animals and minerals, formulation of herbal remedies and health supplements, and drug-free therapies such as acupuncture and acupressure; it pilots products and provides consulting, transfer and training.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực y học cổ truyền: Nghiên cứu và ứng dụng động vật, thực vật, khoáng chất làm dược liệu; Nghiên cứu và ứng dụng bào chế những bài thuốc đông y cổ phương; Nghiên cứu và ứng dụng bào chế từ thảo dược ra thành phẩm phục vụ trong việc phòng bệnh và chữa bệnh; Nghiên cứu và ứng dụng bào chế từ thực vật, động vật và khoáng chất ra thành phẩm là thực phẩm bảo vệ sức khỏe; Nghiên cứu và ứng dụng những phương pháp chữa bệnh không dùng thuốc như: châm cứu, bấm huyệt, vật lý trị liệu, tập dưỡng sinh. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tư vấn, phản biện, đánh giá, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ, huấn luyện chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước
    theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
