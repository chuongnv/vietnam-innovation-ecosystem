id: research-vien-phat-trien-nang-luong-ben-vung
name:
  vi: Viện phát triển năng lượng bền vững
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: 16/21, Đặng Văn Ngữ, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng công nghệ năng lượng và các loại nhiên liệu ngoài dầu khí; cung cấp dịch vụ tư vấn và chuyển giao công nghệ, phổ biến thông tin khoa học, bồi dưỡng chuyên môn về năng lượng.'
  en: 'Institute doing applied research in energy technology and non-petroleum fuels; offers consulting, technology transfer, scientific information and professional training on energy.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực công nghệ năng lượng và nhiên liệu không phải dầu khí. 2. Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
