id: expert-tran-anh-tuan
name:
  vi: Trần Anh Tuấn
type: expert
categories:
- Chuyên gia
- Dịch vụ
description:
  vi: Chuyên gia trên HOIP, lĩnh vực dịch vụ.
  en: 'Expert on HOIP – field: services.'
description_source:
  text: 'Với hơn 34 năm kinh nghiệm trong lĩnh vực tư vấn và đào tạo kinh doanh, ông Tuấn từng đảm nhiệm nhiều vị trí cấp cao tại các công ty tư vấn và dịch vụ đầu tư quốc tế, bao gồm Design International (Pháp), Peregrine Capital (Hồng Kông/Mỹ), Grant Thornton (Anh) và Austrade (Úc). Ông đã cung cấp dịch vụ tư vấn và đào tạo sâu rộng cho chính phủ, các tổ chức phi chính phủ, doanh nghiệp và startup trong nhiều lĩnh vực đa dạng. Hiện nay, ông Tuấn là Phó Viện trưởng Viện Nghiên cứu & Ứng dụng Đổi mới Kinh doanh (3AI), đồng thời tiếp tục tư vấn và đào tạo về Design Thinking, Đổi mới sáng tạo, Khởi nghiệp, Mô hình kinh doanh, Khởi nghiệp tạo tác động xã hội và Chuyển đổi xanh. Công việc của ông gắn liền với sự hợp tác cùng nhiều chương trình và tổ chức quốc tế hàng đầu, bao gồm: UNIDO (Liên Hợp Quốc) – Dự án Phát triển Năng lực Doanh nghiệp Ngân hàng Thế giới / IFC / MPDF – Dự án Hệ thống Thông tin Quản lý (MIS) Ủy ban châu Âu (EU) – Module Vườn ươm doanh nghiệp & Chương trình C3 START USAID
    / VNCI – Dự án Sáng kiến Nâng cao Năng lực Cạnh tranh Việt Nam CIDA (Canada) – Dự án Thông tin Thị trường Nông nghiệp Việt Nam (VAMIP) Yunus Environment Hub / GIZ – Các chương trình Kinh tế tuần hoàn HEC Montreal (Canada) – Chương trình Social Business Creation (Cố vấn & Giám khảo) Ecothon (ASEAN) & CIRCO (Hà Lan) – Các chương trình Startup Kinh tế tuần hoàn Trung tâm Sáng tạo và Đổi mới FTU (FIIS Incubator, Việt Nam) Trung tâm Nghiên cứu & Hỗ trợ Doanh nghiệp BSA – Cố vấn khởi nghiệp và xây dựng hệ sinh thái Học vấn & Chứng chỉ chuyên môn: Thạc sĩ Quản trị Kinh doanh (MBA) & Thạc sĩ Khoa học Chứng nhận Huấn luyện viên NLP (Certified NLP Coach) Thành tựu, giải thưởng: Giải thưởng & Ghi nhận: Hero of the Year 2001, Austrade Outstanding Evaluator Award 2023, HEC Montreal (Canada) Top 5 Mentor, Ecothon (ASEAN)'
  source: HOIP (tự giới thiệu)
