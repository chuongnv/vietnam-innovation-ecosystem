id: research-vien-nghien-cuu-va-ung-dung-cong-nghe-duoc-my-pham-thuc-pham
name:
  vi: Viện Nghiên cứu và Ứng Dụng Công Nghệ Dược Mỹ Phẩm - Thực Phẩm
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: Lầu 3, Số 05 đường Đinh Bộ Lĩnh, phường Bình Thạnh, thành phố Hồ Chí Minh.
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ trong hóa hữu cơ, sản phẩm sinh học, hóa dược, bào chế, thực phẩm chức năng, thực phẩm và đồ uống; sản xuất thử nghiệm sản phẩm từ nghiên cứu và cung cấp tư vấn, chuyển giao, tập huấn chuyên môn.'
  en: 'An institute doing research and technology development in organic chemistry, bio-products, pharmaceutical chemistry, formulation, functional foods, food and beverages; it produces pilot products from its research and provides consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Hóa hữu cơ. Công nghệ sản phẩm sinh học, vật liệu sinh học, chất dẻo sinh học, nhiên liệu sinh học, các hóa chất được chiết tách từ sinh học, các vật liệu mới có nguồn gốc sinh học; công nghệ sinh học liên quan đến y học, y tế. Hóa dược học; bào chế; thực phẩm chức năng; Công nghệ thực phẩm; Công nghệ đồ uống. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ, tư vấn, chuyển giao kết quả nghiên cứu; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp với Luật định (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
