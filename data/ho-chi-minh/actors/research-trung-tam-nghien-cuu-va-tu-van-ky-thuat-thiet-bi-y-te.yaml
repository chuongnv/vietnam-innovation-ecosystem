id: research-trung-tam-nghien-cuu-va-tu-van-ky-thuat-thiet-bi-y-te
name:
  vi: Trung tâm Nghiên cứu và Tư vấn Kỹ thuật Thiết bị Y tế
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 2, Cao Lỗ, Phường Chánh Hưng, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng trong lĩnh vực trang thiết bị, dụng cụ và cơ sở y tế; tư vấn lập dự án, thiết kế, lắp đặt, vận hành và bảo dưỡng thiết bị, tư vấn đấu thầu mua sắm, xây dựng cơ sở y tế, đồng thời đào tạo chuyên môn.'
  en: 'Centre doing applied research on medical equipment, instruments and facilities; it advises on project preparation, design, installation, operation and maintenance of equipment, procurement and construction tenders for health facilities, and provides training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng công nghệ về thiết bị, dụng cụ và công trình y tế. - Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. - Dịch vụ KH&CN: Tư vấn lập các dự án xây dựng cơ sở hạ tầng y tế, tư vấn thiết kế, lắp đặt, hướng dẫn vận hành, bảo dưỡng, sửa chữa, tư vấn đấu thầu xây dựng công trình y tế, tư vấn đấu thầu mua sắm trang thiết bị y tế, chuyển giao công nghệ, thông tin, đào tạo bồi dưỡng nghiệp vụ chuyên môn trong lĩnh vực thiết bị, dụng cụ và công trình y tế. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
