id: research-trung-tam-uom-tao-doanh-nghiep-cong-nghe-truong-dai-hoc-bach
name:
  vi: Trung tâm Ươm tạo Doanh nghiệp công nghệ - Trường Đại học Bách Khoa Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 268, Lý Thường Kiệt, Phường Tân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm ươm tạo doanh nghiệp công nghệ thuộc Trường Đại học Bách khoa TP.HCM, nghiên cứu ứng dụng trong hóa học, vật liệu, thực phẩm, điện – điện tử, môi trường, CNTT và quản lý doanh nghiệp; sản xuất thử, tư vấn và chuyển giao công nghệ.'
  en: 'A technology business incubator of Ho Chi Minh City University of Technology, doing applied research in chemistry, materials, food, electrical engineering, environment, IT and business management; it pilots products and provides consulting and technology transfer.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ hóa học, vật liệu và thực phẩm; điện - điện tử; công nghệ môi trường; công nghệ thông tin; quản lý doanh nghiệp. - Sản xuất thử - thử nghiệm, sản xuất - kinh doanh các sản phẩm là kết quả nghiên cứu khoa học. - Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
