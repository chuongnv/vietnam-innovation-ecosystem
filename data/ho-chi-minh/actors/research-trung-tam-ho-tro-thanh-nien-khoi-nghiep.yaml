id: research-trung-tam-ho-tro-thanh-nien-khoi-nghiep
name:
  vi: Trung Tâm Hỗ Trợ Thanh Niên Khởi Nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 2, Alexandre De Rhodes, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Hội Liên hiệp Thanh niên TP.HCM, hỗ trợ doanh nhân và doanh nghiệp trẻ qua nghiên cứu kinh tế theo đặt hàng, xây dựng và thẩm định dự án, tư vấn, cố vấn, đào tạo quản lý và tổ chức hội thảo, triển lãm.'
  en: 'Centre under the HCMC Youth Union supporting young entrepreneurs and businesses through commissioned economic research, project development and appraisal, consulting, mentoring, management training, seminars and exhibitions.'
description_source:
  text: 1. Nghiên cứu ứng dụng các đề tài khoa học kinh tế theo đơn đặt hàng xây dựng dự án đầu tư sản xuất kinh doanh và hướng dẫn thẩm định dự án; 2. Tổ chức hội nghị, hội thảo, tư vấn, bồi dưỡng kiến thức kinh tế, nghiệp vụ quản lý dưới dạng chuyên đề, hướng dẫn, cố vấn theo nhu cầu từ các đơn vị sản xuất kinh doanh nhất là đối với các doanh nghiệp trẻ. Thực hiện việc đào tạo mới và đào tạo lại đối với các nhà doanh nghiệp trẻ chưa hoặc đã qua trường lớp, trên cở sở phối hợp với các Trường Đại học, Viện, Trung tâm nghiên cứu; 3. Tổ chức báo cáo, thuyết trình, thảo luận, triển lãm về các đề tài khoa học kinh tế, tình hình kinh tế, kinh nghiệm quản lý kinh tế trong nước và nước ngoài; 4. Thực hiện một số nhiệm vụ khác theo quy định của pháp luật và do Hội Liên hiệp thanh niên Thành phố giao.
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
