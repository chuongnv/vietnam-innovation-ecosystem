id: research-trung-tam-kiem-tra-ve-sinh-thu-y-trung-uong-ii
name:
  vi: Trung tâm kiểm tra vệ sinh thú y Trung ương II
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 521/1 Hoàng Văn Thụ, Phường Tân Sơn Nhất, TP. Hồ Chí Minh
description:
  vi: 'Đơn vị trực thuộc Cục Thú y, xây dựng phương pháp thử và tiêu chuẩn kỹ thuật; xét nghiệm vệ sinh thú y và an toàn thực phẩm cho động vật và sản phẩm từ động vật, thức ăn chăn nuôi, thuốc thú y; đánh giá, chứng nhận cơ sở và đào tạo.'
  en: 'Unit under the Department of Animal Health, developing test methods and technical standards; it tests veterinary hygiene and food-safety indicators for animals, animal products, feed and veterinary drugs, and assesses and certifies facilities and provides training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: xây dựng các phương pháp thử nghiệm; xây dựng các tiêu chuẩn quốc gia; quy chuẩn kỹ thuật quốc gia; ứng dụng tiến bộ khoa học kỹ thuật, quy trình, định mức kinh tế kỹ thuật về kiểm tra vệ sinh thú y, an toàn vệ sinh thực phẩm; 2. Dịch vụ khoa học và công nghệ: - Xác định các chỉ tiêu vệ sinh thú y, an toàn thực phẩm (bao gồm cả việc xác định các yếu tố vi sinh vật, ký sinh trùng; các yếu tố lý học, hóa học và chất tồn dư độc hại) đối với động vật, sản phẩm động vật, thức ăn chăn nuôi và thuốc thú y; - Tham gia kiểm tra, đánh giá điều kiện vệ sinh thú y cơ sở chăn nuôi, giết mổ động vật; cơ sở sơ chế, chế biến, bảo quản, kinh doanh động vật, sản phẩm động vật; cơ sở cách ly kiểm dịch động vật; cơ sở cách ly kiểm dịch động vật, sản phẩm động vật; cơ sở sản xuất, kinh doah thuốc thú y; - Giám định các đối tượng thuộc diện phải kiểm tra vệ sinh thú y, an toàn thực phẩm khi có tranh chấp, khiếu nại, tố cáo; - Tư vấn dịch vụ về vệ sinh thú
    y; - Thực hiện chứng nhận phù hợp về điều kiện vệ sinh thú y; - Tổ chức tập huấn, bồi dưỡng chuyên môn, nghiệp vụ về kiểm tra vệ sinh thú y, an toàn thực phẩm. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
