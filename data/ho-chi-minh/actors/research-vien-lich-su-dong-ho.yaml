id: research-vien-lich-su-dong-ho
name:
  vi: Viện Lịch sử dòng họ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 275B, Phạm Ngũ Lão, Phường Bến Thành, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về lịch sử Việt Nam, gắn với lịch sử dòng họ; cung cấp các dịch vụ tư vấn, chuyển giao kết quả, phổ biến thông tin và tập huấn chuyên môn.'
  en: 'Institute doing applied research on Vietnamese history, with a focus on family lineage history; offers consulting, transfer of research results, information dissemination and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực lịch sử Việt Nam. 2. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng , chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
