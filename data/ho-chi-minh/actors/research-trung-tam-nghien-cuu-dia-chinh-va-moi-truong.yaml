id: research-trung-tam-nghien-cuu-dia-chinh-va-moi-truong
name:
  vi: Trung tâm Nghiên cứu Địa chính và Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 207/16/7A, Nam Cao, Phường Tăng Nhơn Phú A, Thành phố Thủ Đức
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng về khoa học môi trường, quy hoạch đô thị và nông thôn, trắc địa - bản đồ, xử lý chất thải và quan trắc ô nhiễm; sản xuất thử, tư vấn, chuyển giao công nghệ và bồi dưỡng.'
  en: 'Centre researching and applying environmental science, urban and rural planning, surveying and mapping, waste treatment and pollution monitoring; it provides pilot production, consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: khoa học môi trường; quy hoạch, phát triển đô thị và nông thôn; trắc địa học và bản đồ học; công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. 2. Sản xuất thử - thử nghiệm từ kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuêyn môn theo lĩnh vực đăng ký (chỉ ấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
  url: https://opendata.hochiminhcity.gov.vn/dataset/dữ-liệu-tổ-chức-khoa-học-và-công-nghệ-tổ-chức-khoa-học-và-công-nghệ-0
