id: research-trung-tam-tu-van-va-phat-trien-nong-nghiep-ben-vung
name:
  vi: Trung tâm Tư vấn và Phát triển Nông nghiệp Bền vững
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: Lầu 4, Khu C Tòa Nhà WASECO, Số 10 Phổ Quang, Phường Tân Sơn Hòa, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng trong nông lâm nghiệp bền vững; sản xuất thử, kinh doanh sản phẩm nghiên cứu, chứng nhận hệ thống quản lý chất lượng và sản phẩm, khảo nghiệm, tư vấn, chuyển giao và bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research in sustainable agriculture and forestry; it pilots and sells research products, certifies quality systems and products, conducts trials and provides consulting, technology transfer and training.'
description_source:
  text: 'Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực nông lâm nghiệp. - Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. - Dịch vụ KH&CN: dịch vụ chứng nhận hệ thống quản lý chất lượng, chứng nhận sản phẩm phù hợp tiêu chuẩn theo quy định pháp luật, tư vấn, khảo nghiệm, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
