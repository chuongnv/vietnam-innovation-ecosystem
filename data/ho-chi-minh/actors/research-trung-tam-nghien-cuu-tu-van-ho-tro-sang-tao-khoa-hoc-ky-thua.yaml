id: research-trung-tam-nghien-cuu-tu-van-ho-tro-sang-tao-khoa-hoc-ky-thua
name:
  vi: Trung Tâm Nghiên Cứu, Tư Vấn, Hỗ Trợ Sáng Tạo Khoa Học Kỹ Thuật Thành phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 224, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ trong công nghệ thông tin, công nghệ sinh học, hóa – môi trường và kinh tế nông nghiệp; tư vấn phát triển doanh nghiệp, chuyển giao kết quả nghiên cứu hỗ trợ doanh nghiệp đổi mới sáng tạo và tổ chức đào tạo, hội thảo.'
  en: 'A centre doing R&D in IT, biotechnology, chemical-environmental technology and agricultural economics; it advises on business development, transfers research results to innovative enterprises, and runs training and conferences.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Công nghệ thông tin, Công nghệ Sinh học, Công nghệ Hóa - Môi trường, Kinh tế Nông nghiệp. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: tư vấn, kiến nghị phát triển kinh doanh và doanh nghiệp; chuyển giao kết quả nghiên cứu về lĩnh vực khoa học và kỹ thuật hỗ trợ phát triển doanh nghiệp đổi mới sáng tạo; tổ chức hội nghị, hội thảo khoa học, đào tạo, bồi dưỡng trình độ chuyên môn và thực hiện các dịch vụ khoa học và công nghệ khác theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
