id: research-trung-tam-ung-dung-va-phat-trien-cong-nghe-vu-gia
name:
  vi: Trung Tâm Ứng Dụng Và Phát Triển Công Nghệ Vũ Gia
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 14, Đường B3, Phường Tây Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ xử lý chất thải, sản xuất sạch, tái chế, xử lý môi trường bằng phương pháp sinh học và năng lượng ngoài dầu khí; sản xuất thử, kinh doanh sản phẩm nghiên cứu và tư vấn, chuyển giao công nghệ.'
  en: 'A centre doing R&D on waste treatment, cleaner production, recycling, biological environmental treatment and non-petroleum energy; it pilots and sells research products and provides consulting and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); Công nghệ sản xuất sạch, tái chế; Công nghệ xử lý môi trường bằng phương pháp sinh học; Công nghệ năng lượng và nhiên liệu không phải dầu khí, khai thác tài nguyên. 2. Sản xuất thử - thử nghiệm, sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao kết quả nghiên cứu, chuyển giao công nghệ, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
