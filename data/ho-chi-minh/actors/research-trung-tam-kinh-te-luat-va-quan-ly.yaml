id: research-trung-tam-kinh-te-luat-va-quan-ly
name:
  vi: Trung Tâm Kinh Tế, Luật Và Quản Lý
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 279, Nguyễn Tri Phương, Phường Vườn Lài, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Kinh tế TP.HCM, nghiên cứu quản trị kinh doanh, luật kinh tế, kinh tế ngành và khoa học quản lý; tổ chức hội thảo, tư vấn, đánh giá nhiệm vụ KH&CN và bồi dưỡng ngắn hạn.'
  en: 'Centre of the University of Economics HCMC researching business administration, economic law, sectoral economics and management science; it holds seminars, consults, evaluates S&T projects and runs short courses.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Quan hệ sản xuất, kinh doanh; Quản trị kinh doanh; Luật Kinh tế; Khoa học kinh tế chuyên ngành (kinh tế công nghiệp, kinh tế nông nghiệp, kinh tế xây dựng, kinh tế thông tin); Khoa học quản lý (cung ứng; vấn đề ra quyết định; dự báo; quản lý sản xuất). 2. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo (như hội thảo chuyên đề, hội thảo khoa học, hội thảo tham vấn, seminars và workshops); Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ về các lĩnh vực do Trung tâm phụ trách; tập huấn, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
