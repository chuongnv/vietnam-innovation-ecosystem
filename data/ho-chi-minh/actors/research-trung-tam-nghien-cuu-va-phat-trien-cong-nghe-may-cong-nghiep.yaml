id: research-trung-tam-nghien-cuu-va-phat-trien-cong-nghe-may-cong-nghiep
name:
  vi: Trung tâm Nghiên cứu và Phát triển Công nghệ máy công nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 12, Nguyễn Văn Bảo, Phường Hạnh Thông, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ máy công nghiệp, gồm cơ khí chế tạo, nhiệt - lạnh, tự động hóa, năng lượng và kiểm toán năng lượng, bảo quản; sản xuất thử, chuyển giao công nghệ, lắp đặt, bảo trì và tư vấn dự án.'
  en: 'Centre researching and developing industrial machinery technology, covering machine building, refrigeration, automation, energy and energy auditing, and preservation; it does pilot production, technology transfer, installation, maintenance and project consulting.'
description_source:
  text: '- Nghiên cứu phát triển khoa học và công nghệ thuộc các lĩnh vực: cơ khí chế tạo máy, nhiệt - lạnh, tự động hóa, năng lương và kiểm toán năng lượng, công nghệ bảo quản. - Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu và ứng dụng kỹ thuật mới. - Dịch vụ KH&CN: Lắp đặt, sửa chữa, bảo trì, tư vấn, đào tạo bồi dưỡng, thẩm định và lập dự án đầu tư trên các lĩnh vực đăng ký theo Luật định. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
