id: accelerator-innovative-startups-accelerator-viisa
name:
  vi: Vietnam Innovative Startups Accelerator (VIISA)
type: accelerator
founded: 2017
description_source:
  text: 'Phần mềm, CNTT 02-01-2017 Việt Nam Toàn quốc Vietnam Innovative Startups Accelerator (VIISA) là một chương trình tăng tốc khởi nghiệp và một đơn vị đầu tư giai đoạn hạt giống, với mục tiêu đầu tư và xây dựng các startup sẵn sàng vươn ra toàn cầu tại Việt Nam. Được thành lập vào tháng 1 năm 2017 bởi FPT Ventures và Dragon Capital, VIISA là một đơn vị đầu tư giai đoạn hạt giống với sứ mệnh đầu tư và xây dựng các startup tại Việt Nam sẵn sàng vươn ra toàn cầu. Thông tin tài trợ: Gói hỗ trợ bao gồm một khoản tiền mặt có ý nghĩa kết hợp với các dịch vụ hỗ trợ linh hoạt (In-kind). Ngoài ra, các startup tốt nghiệp tiềm năng còn có cơ hội nhận vốn đầu tư tiếp theo lên đến 200.000 USD thông qua chương trình Investment Track của VIISA. Để biết thêm thông tin, vui lòng truy cập: https://www.viisa.vn/'
  source: HOIP (tự giới thiệu)
  url: https://hoip.sihub.gov.vn/investor/133
  accessed: '2026-11-22'
description:
  vi: Chương trình tăng tốc khởi nghiệp kiêm nhà đầu tư giai đoạn hạt giống, do FPT Ventures và Dragon Capital lập năm 2017; cấp vốn, hỗ trợ và cố vấn cho startup công nghệ Việt Nam hướng ra thị trường quốc tế.
  en: Startup accelerator and seed-stage investor founded in 2017 by FPT Ventures and Dragon Capital; provides funding, in-kind support and mentoring to Vietnamese tech startups aiming at global markets.
region: ho-chi-minh
verification:
  level: unverified
