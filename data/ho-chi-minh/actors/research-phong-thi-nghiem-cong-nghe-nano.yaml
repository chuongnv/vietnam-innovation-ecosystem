id: research-phong-thi-nghiem-cong-nghe-nano
name:
  vi: Phòng Thí nghiệm Công nghệ Nano
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Khu phố 6, Phường Linh Xuân, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Phòng thí nghiệm nghiên cứu, phát triển vật liệu và công nghệ micro-nano; sản xuất thử sản phẩm từ kết quả nghiên cứu và cung cấp dịch vụ phân tích, tư vấn, chuyển giao công nghệ, đào tạo trong lĩnh vực này.'
  en: 'Laboratory researching and developing micro- and nano-scale materials and technologies; it pilot-produces research-based products and offers analysis, consulting, technology transfer and training in the field.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển vật liệu và công nghệ Micro-Nano. 2. Sản xuất thử - thử nghiệm; sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. 3. Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, giám định công nghệ, thông tin khoa học và công nghệ, phân tích thí nghiệm, đào tạo bồi dưỡng theo lĩnh vực đăng ký. 4. Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
