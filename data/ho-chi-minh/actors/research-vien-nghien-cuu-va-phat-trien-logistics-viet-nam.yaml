address: 3, Nguyễn Tất Thành, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và phát triển công nghệ, kỹ thuật ứng dụng trong logistics, sản xuất thử nghiệm sản phẩm từ nghiên cứu và cung cấp dịch vụ tư vấn, thông tin khoa học, bồi dưỡng nghiệp vụ logistics.'
  en: 'An institute researching and developing applied technologies and techniques for logistics, producing pilot products from its research and offering consulting, scientific information and professional logistics training.'
description_source:
  text: '- Nghiên cứu và phát triển các công nghệ, kỹ thuật ứng dụng trong lĩnh vực logistic. - Sản xuất thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. - Dịch vụ KH&CN: Tư vấn; thông tin khoa học và công nghệ; huấn luyện bồi dưỡng nghiệp vụ chuyên môn theo lĩnh vực logistic. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
