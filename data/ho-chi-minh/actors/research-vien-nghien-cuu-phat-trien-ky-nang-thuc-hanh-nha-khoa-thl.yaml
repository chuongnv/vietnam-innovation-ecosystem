id: research-vien-nghien-cuu-phat-trien-ky-nang-thuc-hanh-nha-khoa-thl
name:
  vi: Viện Nghiên cứu phát triển kỹ năng thực hành nha khoa THL
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 51, Tú Xương, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu khoa học, phát triển công nghệ nha khoa; sản xuất, kinh doanh sản phẩm từ kết quả nghiên cứu và tổ chức tư vấn, đào tạo và nâng cao kỹ năng chuyên môn cho người hành nghề nha khoa.'
  en: 'Institute researching and developing dental technology; it produces and sells products from its research and provides consulting and professional training for dental practitioners.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực nha khoa. 2. Kinh doanh và sản xuất kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, đào tạo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
