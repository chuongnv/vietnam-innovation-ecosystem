id: research-trung-tam-tu-van-va-nghien-cuu-thuc-nghiem
name:
  vi: Trung tâm tư vấn và nghiên cứu thực nghiệm
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 2, Trường Sa, Phường Gia Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu thực nghiệm về thủy lợi, thủy điện, kỹ thuật sông – biển, cấp thoát nước, phòng chống thiên tai và hạ tầng giao thông; tư vấn thiết kế, thẩm định, giám sát thi công, kiểm tra chất lượng công trình và tổ chức hội thảo, đào tạo.'
  en: 'Centre doing experimental research on irrigation, hydropower, water supply and drainage, river and coastal engineering, disaster prevention and transport infrastructure; it offers design, appraisal, construction supervision, quality inspection, seminars and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: thủy lợi, thủy điện, cấp thoát nước, kỹ thuật sông, bờ biển, biển; phòng chống thiên tai và bảo vệ môi trường, nông nghiệp và phát triển nông thôn, giao thông và cơ sở hạ tầng, xây dựng dân dụng và công nghiệp; Nghiên cứu mô hình quản lý nâng cao hiệu quả của hệ thống thủy lợi và hệ thống cấp thoát nước (bao gồm các khía cạnh kỹ thuật, kinh tế, xã hội, môi trường và thể chế); Nghiên cứu công nghệ khảo sát, đánh giá và xử lý đảm bảo an toàn cho công trình thủy lợi, thủy điện, cầu đường, giao thông, cơ sở hạ tầng. 2. Dịch vụ khoa học và công nghệ: tư vấn thiết kế, thẩm định, thẩm tra dự án đầu tư, giám sát thi công xây dựng công trình, kiểm tra chất lượng công trình xây dựng, thực hiện các dự án sản xuất thử nghiệm; tổ chức hội nghị, hội thảo khoa học, đào tạo, bồi dưỡng trình độ chuyên môn và thực hiện các dịch vụ khoa học và công nghệ khác theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng
    chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
