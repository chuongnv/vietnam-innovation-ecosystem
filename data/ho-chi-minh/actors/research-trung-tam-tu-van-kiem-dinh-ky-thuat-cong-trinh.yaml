id: research-trung-tam-tu-van-kiem-dinh-ky-thuat-cong-trinh
name:
  vi: Trung tâm Tư vấn Kiểm định Kỹ thuật Công trình
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 195, Linh Trung, Phường Linh Xuân, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về công trình giao thông và địa kỹ thuật; thử nghiệm, chứng nhận, giám định chất lượng vật liệu xây dựng và tư vấn kỹ thuật cho công trình hạ tầng đô thị, giao thông.'
  en: 'A centre doing applied research on transport works and geotechnics; it tests, certifies and inspects construction materials and provides technical consulting for urban and transport infrastructure.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công trình giao thông vận tải; địa kỹ thuật. - Sản xuất thử - thử nghiệm, chuyển giao công nghệ từ kết quả nghiên cứu. - Dịch vụ KH&CN: + Dịch vụ thử nghiệm chất lượng sản phẩm, hàng hóa; dịch vụ chứng nhận sản phẩm phù hợp tiêu chuẩn; dịch vụ giám định số lượng, chất lượng sản phẩm, hàng hóa trong lĩnh vực xây dựng. + Tư vấn trong lĩnh vực: kỹ thuật xây dựng; công trình hạ tầng đô thị; công trình giao thông vận tải; công trình thủy lợi; địa kỹ thuật. + Thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
