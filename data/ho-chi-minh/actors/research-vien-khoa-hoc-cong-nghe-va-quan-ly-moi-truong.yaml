id: research-vien-khoa-hoc-cong-nghe-va-quan-ly-moi-truong
name:
  vi: Viện Khoa học Công nghệ và Quản lý Môi trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện/Trung tâm nghiên cứu
address: 12 Nguyễn Văn Bảo, Phường Hạnh Thông, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Công nghiệp TP.HCM, nghiên cứu khoa học công nghệ và quản lý môi trường nhằm giảm thiểu ô nhiễm; sản xuất thử chế phẩm sinh học, thiết bị xử lý, đồng thời cung cấp quan trắc, phân tích và đánh giá tác động môi trường.'
  en: 'An institute under the Industrial University of Ho Chi Minh City researching environmental technology and management to reduce pollution; it pilots bio-preparations and treatment equipment and provides environmental monitoring, analysis and impact assessment.'
description_source:
  text: '1- Nghiên cứu, phát triển về khoa học công nghệ và quản lý môi trường phục vụ ngăn ngừa và giảm thiểu ô nhiễm công nghiệp, nông lâm nghiệp, đô thị và nông thôn. 2- Triển khai ứng dụng, sản xuất thử nghiệm các chế phẩm sinh học, thử nghiệm các mô hình, thiết bị phục vụ xử lý ô nhiễm môi trường. 3- Dịch vụ KH&CN: - Tư vấn, dịch vụ về khoa học và công nghệ môi trường, tư vấn thiết kế và chuyển giao công nghệ ngăn ngừa và xử lý chất thải Hbảo vệ môi trường. - Dịch vụ quan trắc và phân tích môi trường, đánh giá tác động môi trường. - Thẩm định, phản biện xã hội về khoa học công nghệ và môi trường. - Đào tạo bồi dưỡng nâng cao nghiệp vụ trên lĩnh vực đăng ký. 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
