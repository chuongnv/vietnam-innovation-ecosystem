id: research-vien-kiem-dinh-va-phat-trien-chat-luong
name:
  vi: Viện Kiểm định và Phát triển Chất lượng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 72, Đường Số 2, Phường Chợ Quán, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu cả lý luận lẫn thực tiễn của khoa học chất lượng; tư vấn, đào tạo về đánh giá, kiểm định, chứng nhận và quản lý chất lượng theo pháp luật, cũng như phát triển chất lượng gắn với Hiệp định TBT về rào cản kỹ thuật trong thương mại.'
  en: 'Institute studying the theory and practice of quality science; provides consulting and training on quality assessment, inspection, certification and management under the law, and on quality development under the WTO Technical Barriers to Trade (TBT) Agreement.'
description_source:
  text: '- Nghiên cứu lý thuyết và thực tiễn về khoa học chất lượng - Dịch vụ KH&CN: tư vấn và đào tạo bồi dưỡng về quản lý, đánh giá, kiểm định chứng nhận theo quy định pháp luật, phát triển chất lượng theo Hiệp định rào cản kỹ thuật thương mại – TBT. - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
