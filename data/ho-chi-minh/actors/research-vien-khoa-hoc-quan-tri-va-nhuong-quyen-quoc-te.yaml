id: research-vien-khoa-hoc-quan-tri-va-nhuong-quyen-quoc-te
name:
  vi: Viện Khoa học Quản trị và Nhượng quyền Quốc tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 120/12, Mai Thị Lựu, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, phát triển công nghệ về kinh doanh và quản trị, quan hệ sản xuất kinh doanh, giáo dục người khuyết tật và tâm lý học chuyên ngành; dịch vụ gồm tư vấn, môi giới và xúc tiến chuyển giao công nghệ, cung cấp thông tin, đào tạo chuyên môn.'
  en: 'Institute researching business and management, production relations, special education for people with disabilities and applied psychology; services include consulting, brokering and promoting technology transfer, information and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Quan hệ sản xuất kinh doanh; Kinh doanh và quản trị kinh doanh; Giáo dục chuyên biệt cho người khuyết tật; Tâm lý học chuyên ngành. 2. Dịch vụ khoa học và công nghệ: môi giới, tư vấn, xúc tiến chuyển giao công nghệ, thông tin khoa học và công nghệ, đào tạo, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
