id: research-trung-tam-nghien-cuu-va-phat-trien-dat
name:
  vi: Trung Tâm Nghiên Cứu Và Phát Triển Dat
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: B163, Nguyễn Văn Quá, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ về điện – điện tử, robot và điều khiển tự động, cơ điện tử, chế tạo máy và thiết bị năng lượng; kinh doanh sản phẩm từ kết quả nghiên cứu và cung cấp dịch vụ môi giới, tư vấn, đánh giá, chuyển giao công nghệ.'
  en: 'A centre doing R&D in electrical and electronic engineering, robotics and automatic control, mechatronics, machinery and energy equipment; it sells research-based products and provides technology brokerage, consulting, assessment and transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Kỹ thuật điện và điện tử; Người máy và điều khiển tự động; Công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; Công nghệ cơ điện tử; hệ vi cơ điện tử; Công nghệ chế tạo máy nói chung; Kỹ thuật thiết kế và công nghệ chế tạo máy (máy công cụ; máy động lực; máy phục vụ nông, lâm, ngư nghiệp và công nghiệp chế biến; máy thủy lợi; máy xây dựng; ôtô, giao thông; thiết bị khai khoáng); Công nghệ chế tạo và kỹ thuật cơ khí thiết bị năng lượng (không bao gồm năng lượng hạt nhân). 2. Kinh doanh, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ, Dịch vụ đánh giá công nghệ, Dịch vụ xúc tiến chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập
    huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
