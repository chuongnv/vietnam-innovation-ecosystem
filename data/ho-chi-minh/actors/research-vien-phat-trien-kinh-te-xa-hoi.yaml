id: research-vien-phat-trien-kinh-te-xa-hoi
name:
  vi: Viện phát triển Kinh tế - Xã hội
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu về quan hệ sản xuất kinh doanh, quản trị kinh doanh, lịch sử Việt Nam và nghiên cứu văn học; cung cấp dịch vụ chuyển giao công nghệ, tư vấn và bồi dưỡng chuyên môn.'
  en: 'An institute researching business relations, business administration, Vietnamese history and literary studies, and providing technology transfer, consulting and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và phát triển công nghệ: lĩnh vực quan hệ sản xuất kinh doanh, kinh doanh và quản trị kinh doanh, lịch sử Việt Nam, lý luận văn học, nghiên cứu văn học nói chung. 2- Dịch vụ khoa học và công nghệ: chuyển giao công nghệ, tư vấn, huấn luyền bồi dưỡng chuyên môn theo lĩnh vực đăng ký. 3- Hợp tác trong và ngoài nước: theo lĩnh vực đăng ký phù hợp với các quy định của pháp luật.'
