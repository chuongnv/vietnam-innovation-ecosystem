id: research-trung-tam-cong-nghe-moi-truong-va-dich-vu-tu-van-dau-tu
name:
  vi: Trung tâm Công nghệ Môi trường và Dịch vụ Tư vấn Đầu tư
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1091, Trần Hưng Đạo, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu và đưa công nghệ mới vào lĩnh vực môi trường; nhận tư vấn, thiết kế và giám sát các dự án xử lý chất thải (kể cả chất thải nguy hại), cùng các dịch vụ như đánh giá tác động, quy hoạch môi trường và đào tạo.'
  en: 'Centre researching and applying new environmental technologies; it offers design and supervision consulting for waste-treatment projects, including hazardous waste, plus services such as impact assessment, environmental planning and training.'
description_source:
  text: '1- Nghiên cứu, triển khai ứng dụng công nghệ mới trong lĩnh vực môi trường. 2- Sản xuất thử - thử nghiệm và chuyển giao công nghệ từ kết quả nghiên cứu. 3- Dịch vụ KH-CN: - Tư vấn: thiết kế, giám sát các dự án xử lý môi trường, công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí), công nghệ thu gom xử lý chất thải nguy hại, công nghệ quan trắc, kiểm soát và xử lý ô nhiễm, công nghệ xử lý môi trường bằng phương pháp sinh học, đánh giá tác động môi trường, quy hoạch môi trường. - Đào tạo bồi dưỡng, chuyển giao công nghệ trong lĩnh vực môi trường theo Luật định. 4- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
