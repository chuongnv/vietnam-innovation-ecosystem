id: research-trung-tam-thong-tin-khoa-hoc-va-cong-nghe
name:
  vi: Trung tâm Thông tin Khoa học và Công nghệ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 79, Trương Định, Phường Tân Định, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm thu thập, xử lý, lưu trữ và cung cấp thông tin khoa học và công nghệ cho cơ quan quản lý, viện nghiên cứu và doanh nghiệp tại TP.HCM và các tỉnh phía Nam; tổ chức chợ công nghệ, kết nối cung – cầu, xuất bản ấn phẩm và cung cấp dịch vụ CNTT.'
  en: 'A centre that collects, processes, stores and supplies S&T information to policymakers, research bodies and businesses in Ho Chi Minh City and the southern provinces; it runs technology fairs and supply-demand matching, publishes S&T periodicals and offers IT services.'
description_source:
  text: '- Nghiên cứu phát triển công tác chuyên môn nghiệp vụ thông tin khoa học và công nghệ. - Thu thập, xử lý, lưu trữ và phát triển các nguồn tin khoa học và công nghệ trong nước và trên thế giới. - Phục vụ cung cấp thông tin khoa học và công nghệ đến các nhà lãnh đạo, quản lý, các cơ quan nghiên cứu và doanh nghiệp trên địa bàn thành phố Hồ Chí Minh và các tỉnh phía Nam. - Tổ chức: các hoạt động phát triển thị trường khoa học và công nghệ, triển khai các mô hình chợ công nghệ và thiết bị, các hoạt động xúc tiến kết nối cung – cầu sản phẩm khoa học và công nghệ, đào tạo huấn luyện, tuyên truyền phổ biến khoa học và công nghệ phục vụ doanh nghiệp, các nhà nghiên cứu và các đối tượng dùng tin. - Xuất bản các ấn phẩm, tạp chí thông tin khoa học và công nghệ theo quy định của pháp luật. - Thực hiện các dịch vụ thông tin tư vấn khoa học - công nghệ và quản lý, các dịch vụ về công nghệ thông tin (phần mềm, Website, quản trị mạng…). - Hợp tác trong và ngoài nước trên lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
