id: research-trung-tam-khoa-hoc-va-cong-nghe-nu-tri-thuc-bach-khoa
name:
  vi: Trung tâm Khoa học và Công nghệ Nữ trí thức Bách Khoa
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 268, Lý Thường Kiệt, Phường Diên Hồng, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Đại học Bách khoa TP.HCM, nghiên cứu, ứng dụng trong cơ khí, xây dựng, CNTT, điện tử, công nghệ hóa học và thực phẩm; sản xuất thử, tư vấn, chuyển giao kết quả nghiên cứu và bồi dưỡng.'
  en: 'Centre of Ho Chi Minh City University of Technology conducting research and applications in mechanics, construction, IT, electronics, chemical and food technology; it pilot-produces, consults, transfers research results and trains.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: cơ học; cơ khí; xây dựng; công nghệ thông tin; điện tử; công nghệ hóa học; công nghệ thực phẩm. 2. Sản xuất thử - thử nghiệm, sản xuất- kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng , chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
