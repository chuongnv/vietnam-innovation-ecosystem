id: research-lien-hiep-khoa-hoc-kinh-te-do-thi-nam-bo
name:
  vi: Liên Hiệp Khoa học Kinh tế- Đô thị Nam bộ
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 207/3, Hồ Học Lãm, Phường An Lạc, TP. Hồ Chí Minh
description:
  vi: 'Liên hiệp các tổ chức KH&CN, quản lý nhiều đơn vị nghiên cứu trực thuộc trong nhiều lĩnh vực từ kỹ thuật, kinh tế đến xã hội; cung cấp dịch vụ khảo sát, đo đạc, tư vấn đầu tư, thiết kế, giám sát công trình và đánh giá tác động môi trường.'
  en: 'Umbrella S&T union managing numerous affiliated research units across engineering, economics and social sciences; it provides surveying, mapping, investment consulting, construction design and supervision, and environmental impact assessment.'
description_source:
  text: '1. Nghiên cứu khoa học, công nghệ và quản lý, phát triển các tổ chức khoa học trực thuộc theo hướng kết hợp nghiên cứu, triển khai ứng dụng và đào tạo về lĩnh vực: Toán học; Khoa học máy tính và thông tin; Vật lý; Hóa học; Cơ học; Các khoa học trái đất; Sinh học; Tâm lý học; Kinh tế và kinh doanh; Khoa học giáo dục; Xã hội học; Địa lý kinh tế và xã hội; Lịch sử và khảo cổ học; Triết học; Nhân học; Ngôn ngữ học và văn học; Nghệ thuật; Kiến trúc và xây dựng dân dụng; Kỹ thuật điện, điện tử, thông tin, truyền thông; Nano; Năng lượng; Kỹ thuật cơ khí, công nghệ chế tạo máy; Công nghệ hóa học; Môi trường và sinh học; Vật liệu và luyện kim; Kỹ thuật y học; Khai thác tài nguyên; Khoa học y - dược; Nông nghiệp; Lý học, phong thuỷ; Tôn giáo học. 2. Khảo sát địa hình, địa chất, thuỷ văn, hiện trạng công trình; Quy hoạch, đo đạc và vẽ bản đồ; Tư vấn đầu tư, lập dự án và quản lý dự án; Tư vấn đấu thầu, lập tổng dự toán và dự toán công trình; Tư vấn, thiết kế tổng mặt bằng xây dựng công trình,
    thiết kế kiến trúc, kết cấu công trình công nghiệp - dân dụng, hạ tầng kỹ thuật đô thị, cơ khí, điện, điện tử, viễn thông, dầu khí, cầu, đường, cảng, nước, môi trường, nông nghiệp, nhà máy thuỷ điện, phần mềm, trang web, hệ thống mạng máy tính, hệ thống gis, tự động hóa và năng lượng; Tư vấn thẩm tra, thẩm định, thẩm kế, giám sát, kiểm định; Đánh giá tác động môi trường, đánh giá sự cố và lập phương án xử lý; Thí nghiệm vật liệu, sản xuất và thi công thử nghiệm công trình kỹ thuật đô thị, xây dựng, vật liệu mới, cơ khí, điện, điện tử, viễn thông, giao thông và nông nghiệp. 3. Thiết lập cơ sở toán học tính toán, điều khiển và kế toán định lượng; Đăng kiểm; Kiểm toán; Chứng khoán; Sở hữu trí tuệ; Tiêu chuẩn, đo lường, chất lượng; Tư vấn tài chính; Thẩm định giá và môi giới bất động sản; Giám sát độc lập các đề tài, dự án, công trình khoa học; Phản biện và giám định xã hội; Dịch thuật; Tư vấn pháp luật. 4. Tổ chức bản thảo, xuất bản; Chuyển giao công nghệ; Tổ chức ươm tạo công nghệ mới,
    doanh nghiệp khoa học và công nghệ; Đánh giá chỉ số tín nhiệm doanh nghiệp và các lĩnh vực kinh tế, văn hóa, xã hội; Tổ chức/ hợp tác giáo dục và đào tạo. 5. Hợp tác trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
