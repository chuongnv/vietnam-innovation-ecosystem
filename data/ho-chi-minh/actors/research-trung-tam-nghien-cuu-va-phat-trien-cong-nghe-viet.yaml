id: research-trung-tam-nghien-cuu-va-phat-trien-cong-nghe-viet
name:
  vi: Trung tâm Nghiên cứu và phát triển công nghệ Việt
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 253, Điện Biên Phủ, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ trong lĩnh vực kỹ thuật cơ khí và chế tạo máy, sản xuất thử sản phẩm nghiên cứu và cung cấp dịch vụ tư vấn, chuyển giao công nghệ, bồi dưỡng chuyên môn.'
  en: 'A centre doing R&D in mechanical engineering and machine manufacturing, piloting research products and providing consulting, technology transfer and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: lĩnh vực kỹ thuật cơ khí và công nghệ chế tạo máy nói chung. 2. Sản xuất thử - thử nghiệm: các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ).'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
