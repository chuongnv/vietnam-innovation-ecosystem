id: research-trung-tam-phan-tich-quoc-te
name:
  vi: Trung Tâm Phân Tích Quốc Tế
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 93, Tân Kỳ Tân Quý, Phường Tây Thạnh, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về thực phẩm, hóa học, sinh học và vật liệu, cung cấp dịch vụ phân tích, kiểm nghiệm hóa lý và vi sinh cho thực phẩm, môi trường và vật liệu, đồng thời tư vấn, chuyển giao công nghệ và tổ chức hội thảo, tập huấn.'
  en: 'A research centre in food, chemistry, biology and materials that provides physico-chemical and microbiological testing of food, environmental and material samples, as well as consulting, technology transfer, seminars and training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong trong lĩnh vực: thực phẩm, hoá học, sinh học, nguyên vật lệu. 2. Kinh doanh, sản xuất kinh doanh, sản xuất thử nghiệm các sản phẩm hình thành từ các kết quả nghiên cứu nêu trên. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo khoa học công nghệ. Kinh doanh các sản phẩm từ kết quả hoạt động nghiên cứu. Chuyển giao công nghệ từ kết quả hoạt động nghiên cứu; Phân tích kiểm nghiệm hóa lý, vi sinh trong thực phẩm, môi trường, hóa học, sinh học, vật liệu theo tiêu chuẩn đã được chứng nhận; Tư vấn và chuyển giao ứng dụng choa học công nghệ; Tập huấn, bồi dưỡng chuyên môn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
