id: research-vien-nghien-cuu-va-sang-tao-khoa-hoc-may-tinh
name:
  vi: Viện Nghiên cứu và Sáng Tạo Khoa Học Máy Tính
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 85A, Trương Văn Thành, Phường Tăng Nhơn Phú A, Thành phố Thủ Đức
description:
  vi: 'Viện nghiên cứu, phát triển công nghệ về máy tính và CNTT, sản xuất thử và kinh doanh sản phẩm từ kết quả nghiên cứu; dịch vụ gồm tổ chức hội thảo, phản biện, tư vấn, đánh giá nhiệm vụ khoa học – công nghệ, phổ biến thông tin và đào tạo ngắn hạn.'
  en: 'Institute researching and developing computing and IT, piloting and selling products from its research; services include conferences, consulting, review and evaluation of S&T projects, information dissemination and short-term training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Máy tính và Công nghệ thông tin. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; huấn luyện, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
