id: research-trung-tam-phat-trien-giao-duc-va-truyen-thong
name:
  vi: Trung tâm phát triển giáo dục và truyền thông
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 132, Nguyễn Văn Lương, Phường Gò Vấp, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về kinh doanh, quản trị, khoa học giáo dục và nghệ thuật phát thanh - truyền hình; tổ chức hội thảo, tư vấn, chuyển giao thành quả nghiên cứu và tập huấn chuyên môn.'
  en: 'Centre researching business and management, educational science and radio and television arts; it organises seminars and provides consulting, transfer of research results and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ: lĩnh vực kinh doanh và quản trị kinh doanh; khoa học giáo dục nói chung; nghệ thuật truyền thanh, truyền hình. 2. Dịch vụ khoa học và công nghệ: tổ chức hội nghị, hội thảo, tư vấn, chuyển giao kết quả nghiên cứu, tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký phù hợp Luật định (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
