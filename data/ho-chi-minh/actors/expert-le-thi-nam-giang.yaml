description:
  vi: Chuyên gia trên HOIP, lĩnh vực giáo dục, khác.
  en: 'Expert on HOIP – fields: education, other.'
description_source:
  text: PGS.TS Lê Thị Nam Giang là giảng viên cao cấp Khoa Luật Quốc tế đồng thời là Giám đốc Trung tâm Sở hữu trí tuệ Trường Đại học Luật TP. HCM, nguyên Ủy viên thường trực Hội Sáng chế Việt Nam, nguyên Tổng thư ký Hội Sở hữu trí tuệ TP. HCM. PGS.TS Lê Thị Nam Giang bắt đầu nghiên cứu chuyên sâu và giảng dạy về Tư pháp quốc tế và Sở hữu trí tuệ; Hợp đồng từ năm 1997 đến nay. PGS.TS Lê Thị Nam Giang đã tham gia gần 30 đề tài, dự án NCKH các cấp (cấp Quốc gia, cấp Bộ, cấp tỉnh và cấp trường) với tư cách chủ nhiệm hoặc thành viên chính, đã công bố trên 10 cuốn sách chuyên khảo và giáo trình, trên 50 bài báo khoa học với tư cách tác giả và đồng tác giả về lĩnh vực Tư pháp quốc tế (TPQT) và Sở hữu trí tuệ (SHTT). Bên cạnh việc giảng dạy về TPQT và SHTT cho các bậc đào tạo từ cử nhân đến sau đại học, PGS.TS Lê Thị Nam Giang còn tham gia giảng dạy nhiều khóa đào tạo chuyên sâu về SHTT và hợp đồng dành cho doanh nghiệp và cho các công ty luật, văn phòng luật sư và cơ quan thực thi quyền sở hữu
    trí tuệ. Bên cạnh đó, PGS.TS. Lê Thị Nam Giang còn là cố vấn cấp cao cho Công ty Luật TNHH AGL, có thẻ đại diện sở hữu công nghiệp, thẻ đại diện giống cây trồng và đại diện quyền tác giả, được đánh giá là một trong những chuyên gia rất giàu kinh nghiệm về tư vấn và đào tạo, về xác lập và bảo vệ quyền sở hữu trí tuệ, về thương mại hóa quyền sở hữu trí tuệ, quản trị tài sản trí tuệ, nhượng quyền thương mại, chuyển giao công nghệ cũng như về Tư pháp quốc tế. Cuốn sách Chỉ dẫn áp dụng các văn bản pháp luật về sở hữu trí tuệ do PGS.TS. Lê Thị Nam Giang làm chủ biên được xuất bản lần đầu tiên năm 2016, được bạn đọc đón nhận tích cực và đây là lần tái bản thứ 2 với sự sửa đổi hình thức trình bày và cập nhật văn bản pháp luật mới nhất nhằm phục vụ bạn đọc.
  source: HOIP (tự giới thiệu)
