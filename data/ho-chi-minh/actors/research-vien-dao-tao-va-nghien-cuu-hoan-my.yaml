id: research-vien-dao-tao-va-nghien-cuu-hoan-my
name:
  vi: Viện Đào Tạo Và Nghiên Cứu Hoàn Mỹ
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện đào tạo
address: 27 Đường Kỳ Đồng
description:
  vi: 'Viện trực thuộc một công ty tư vấn sức khỏe, nghiên cứu về y, dược và chăm sóc sức khỏe; mở các khóa ngắn hạn nâng cao nghiệp vụ cho nhân viên y tế, tổ chức hội thảo và xuất bản tài liệu chuyên môn.'
  en: 'Institute under a health consulting company, researching medicine, pharmacy and health; it runs short courses and professional development for health workers, holds seminars and publishes professional materials.'
description_source:
  text: '1.Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực Y, Dược và Sức khỏe 2.Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, phản biện, tổ chức hội nghị, hội thảo, kiểm tra kiến thức, kỹ năng, đào tạo ngắn hạn, bồi dưỡng nghiệp vụ cho nhân viên y tế (trực tiếp, trực tuyến, kết hợp, có hoặc không có chứng chỉ CME); xuất bản các bản tin, sách, hướng dẫn, góp ý và công bố các báo cáo khoa học trong nước và quốc tế trong lĩnh vực Y, Dược và Sức khỏe 3..Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
