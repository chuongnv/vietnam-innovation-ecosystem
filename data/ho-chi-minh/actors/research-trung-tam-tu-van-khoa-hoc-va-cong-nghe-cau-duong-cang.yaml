id: research-trung-tam-tu-van-khoa-hoc-va-cong-nghe-cau-duong-cang
name:
  vi: Trung tâm Tư vấn Khoa học và Công nghệ Cầu đường cảng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 16/16, Đường D1, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về cầu, đường và cảng; tư vấn khảo sát địa hình, địa chất, thủy văn, lập dự án, thiết kế, thẩm tra, giám sát, thí nghiệm và kiểm định công trình giao thông, hạ tầng.'
  en: 'A centre doing applied research on bridges, roads and ports; it provides topographic, geological and hydrological surveys, project preparation, design, appraisal, supervision, testing and inspection of transport and infrastructure works.'
description_source:
  text: '1.Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực cầu - đường - cảng. 2.Dịch vụ KH&CN: Tư vấn thiết kế phần mềm, thiết kế trang web các doanh nghiệp xây dựng; khảo sát địa hình, địa chất, thủy văn và hiện trạng công trình; tư vấn lập quy hoạch, dự án đầu tư; tổng dự toán; tư vấn thiết kế, thẩm tra thẩm định, đấu thầu, giám sát; thí nghiệm, kiểm định và giám định công trình cầu - đường - cảng, hạ tầng kỹ thuật, dân dụng và công nghiệp theo quy định pháp luật. Tư vấn chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
