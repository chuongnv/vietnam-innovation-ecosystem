id: research-trung-tam-phat-trien-khoa-hoc-va-cong-nghe-tre
name:
  vi: Trung tâm phát triển khoa học và công nghệ trẻ
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 1, Phạm Ngọc Thạch, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng ở cả khoa học kỹ thuật lẫn khoa học xã hội, hướng tới phát triển khoa học công nghệ trẻ; đồng thời nhận tư vấn, chuyển giao thành quả nghiên cứu và tập huấn chuyên môn.'
  en: 'Centre doing applied research in both engineering and social sciences, aimed at developing young science and technology; it also offers consulting, transfer of research results and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực khoa học kỹ thuật và khoa học xã hội. - Dịch vụ KH&CN: tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
