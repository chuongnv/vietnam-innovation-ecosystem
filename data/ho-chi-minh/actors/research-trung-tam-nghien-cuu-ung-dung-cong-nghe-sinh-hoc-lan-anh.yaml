id: research-trung-tam-nghien-cuu-ung-dung-cong-nghe-sinh-hoc-lan-anh
name:
  vi: Trung tâm Nghiên cứu Ứng dụng Công nghệ Sinh học Lan Anh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 119, Trường Định, Phường Xuân Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ sinh học trong hóa sinh, công nghệ gen, nhân giống cây trồng – vật nuôi, vật liệu và nhiên liệu sinh học; sản xuất thử, kinh doanh sản phẩm nghiên cứu và tư vấn, chuyển giao công nghệ.'
  en: 'An applied biotechnology research centre working on biochemistry, gene technology, plant and animal breeding, and bio-based materials and fuels; it pilots and sells research products and offers consulting and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: hóa sinh; công nghệ gen, công nghệ nhân giống cây trồng và vật nuôi; các công nghệ sản phẩm sinh học, vật liệu sinh, nhiên liệu sinh học, các hóa chất được chiết tách từ sinh học, các vật liệu mới có nguồn gốc sinh học. 2. Sản xuất thử- thử nghiệm; sản xuất- kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. 3. Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
