description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học trong lĩnh vực quản lý; cung cấp các dịch vụ khoa học – công nghệ như tư vấn, chuyển giao kết quả, phổ biến thông tin và tập huấn chuyên môn.'
  en: 'Institute doing applied research in management; provides S&T services such as consulting, transfer of research results, information dissemination and professional training.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực quản lý. 2- Dịch vụ KH&CN: - Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
