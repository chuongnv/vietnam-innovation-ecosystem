id: research-vien-toan-ung-dung
name:
  vi: Viện Toán Ứng Dụng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 279, Nguyễn Tri Phương, Phường Diên Hồng, Thành phố Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu và ứng dụng toán học ứng dụng, tổ chức hội thảo, chuyển giao kết quả nghiên cứu, tư vấn và đào tạo, bồi dưỡng chuyên môn.'
  en: 'An institute doing research and applications in applied mathematics, organising conferences, transferring research results and providing consulting and professional training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực toán học ứng dụng. 2. Dịch vụ khoa học và công nghệ: Tổ chức các hội nghị, hội thảo, chuyển giao kết quả nghiên cứu, thông tin khoa học công nghệ, chuyển giao công nghệ, tư vấn, đào tạo và bồi dưỡng chuyên môn theo các lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định./.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
