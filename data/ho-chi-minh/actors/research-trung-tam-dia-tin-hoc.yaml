id: research-trung-tam-dia-tin-hoc
name:
  vi: Trung tâm Địa Tin học
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Khu Phố 6, Phường Đông Hòa, Phường Dĩ An, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Khu Công nghệ Phần mềm ĐHQG-HCM, nghiên cứu, chuyển giao công nghệ địa tin học, công nghệ vũ trụ, CNTT phục vụ quy hoạch đô thị và quản lý tài nguyên, môi trường; xây dựng cơ sở dữ liệu, tư vấn và đào tạo.'
  en: 'Centre under the VNU-HCM Software Park researching and transferring geoinformatics, space technology and IT for urban planning and natural resource and environmental management; it builds databases and offers consulting and training.'
description_source:
  text: '- Nghiên cứu, triển khai và chuyển giao công nghệ trong các lĩnh vực: địa tin học, công nghệ vũ trụ, công nghệ thông tin, quy hoạch đô thị, quản lý tài nguyên và môi trường. - Sản xuất thử, thử nghiệm, xây dựng cơ sở dữ liệu và thực hiện các dịch vụ khoa học và công nghệ trên các lĩnh vực đăng ký. - Đào tạo, tư vấn, thẩm định, thiết kế và thực hiện các công trình, dự án, hợp tác quốc tế theo các lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
