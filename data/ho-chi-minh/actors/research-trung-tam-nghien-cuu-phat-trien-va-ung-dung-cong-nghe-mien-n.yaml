id: research-trung-tam-nghien-cuu-phat-trien-va-ung-dung-cong-nghe-mien-n
name:
  vi: Trung Tâm Nghiên Cứu Phát Triển Và Ứng Dụng Công Nghệ Miền Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
- Trung tâm nghiên cứu
address: 92/8, Quang Trung, Phường Thông Tây Hội, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, phát triển công nghệ điện - điện tử, tự động hóa, robot, viễn thông, phần cứng, phần mềm, cơ điện tử và chế tạo máy; sản xuất thử, môi giới, tư vấn chuyển giao công nghệ và tập huấn chuyên môn.'
  en: 'Centre researching and developing electrical and electronic engineering, automation, robotics, telecoms, computer hardware and software, mechatronics and machine building; it pilot-produces, brokers and advises on technology transfer and trains.'
description_source:
  text: '1. Nghiên cứu khoa học phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Kỹ thuật điện và điện tử; Người máy và điều khiển tự động; Công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; Các hệ thống thông tin và truyền thông; Kỹ thuật, công nghệ viễn thông; Công nghệ phần cứng và kiến trúc máy tính; Công nghệ phần mềm; Công nghệ cơ điện tử; hệ vi cơ điện tử; Kỹ thuật cơ khí nói chung; Công nghệ chế tạo máy nói chung; Kỹ thuật thiết kế và công nghệ chế tạo máy (máy công cụ; máy động lực; máy phục vụ nông, lâm, ngư nghiệp và công nghiệp chế biến; máy thủy lợi; máy xây dựng; ôtô, giao thông; thiết bị khai khoáng); Kỹ thuật thiết kế và công nghệ cơ khí liên quan đến laser, plasma, hồng ngoại. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ Khoa học Công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển
    giao công nghệ (hỗ trợ các bên có nhu cầu mua hoặc bán tìm kiếm đối tác để ký kết hợp đồng chuyển giao công nghệ); Dịch vụ tư vấn chuyển giao công nghệ (hỗ trợ các bên lựa chọn công nghệ, đàm phán, ký kết, thực hiện hợp đồng chuyển giao công nghệ); Dịch vụ tra cứu và chỉ dẫn thông tin khoa học và công nghệ; Tư vấn, phản biện, đánh giá, chuyển giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký, Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên. 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
