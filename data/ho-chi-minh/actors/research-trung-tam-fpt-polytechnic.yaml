id: research-trung-tam-fpt-polytechnic
name:
  vi: Trung Tâm Fpt Polytechnic Thành Phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 778/B1, Nguyễn Kiệm, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm trực thuộc Trường Cao đẳng FPT Polytechnic, nghiên cứu ứng dụng về công nghệ phần mềm và quản trị kinh doanh; tổ chức hội thảo, tư vấn, chuyển giao thành quả nghiên cứu và đào tạo nhân lực.'
  en: 'Centre under FPT Polytechnic College, conducting applied research in software engineering and business administration; it organises seminars, offers consulting, transfers research results and trains human resources.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai ứng dụng trong các lĩnh vực công nghệ phần mềm (kỹ thuật phần mềm, kỹ thuật lập trình, ngôn ngữ lập trình), lĩnh vực kinh doanh và quản trị kinh doanh; Quan hệ sản xuất kinh doanh. 2. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, tư vấn, chuyển giao kết quả nghiên cứu; thông tin khoa học và công nghệ; Đào tạo, bồi dưỡng nguồn nhân lực theo các lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác trong và ngoài nước triển khai lĩnh vực hoạt động phù hợp quy định của pháp luật.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
