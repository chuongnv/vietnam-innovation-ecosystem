id: research-trung-tam-phat-trien-cong-nghe-va-thiet-bi-cong-nghiep-sai-g
name:
  vi: Trung tâm Phát triển Công nghệ và Thiết bị Công nghiệp Sài gòn
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 91, Nguyễn Trọng Lội, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về kỹ thuật điện – điện tử, tự động hóa và điều khiển số, cơ điện tử, vi cơ điện tử và thiết kế chế tạo máy; sản xuất thử, kinh doanh sản phẩm nghiên cứu và tư vấn, chuyển giao công nghệ.'
  en: 'A centre doing applied research in electrical and electronic engineering, automation and computer control, mechatronics, MEMS and machine design; it pilots and sells research products and provides consulting and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong các lĩnh vực: kỹ thuật điện và điện tử; công nghệ tự động hóa và các hệ thống điều khiển, giám sát, điều khiển số bằng máy tính; công nghệ cơ điện tử; hệ vi cơ điện tử; kỹ thuật thiết kế và công nghệ chế tạo máy. 2. Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: Tư vấn, chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
