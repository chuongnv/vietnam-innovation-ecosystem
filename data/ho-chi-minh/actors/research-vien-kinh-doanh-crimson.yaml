id: research-vien-kinh-doanh-crimson
name:
  vi: Viện Kinh Doanh Crimson
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 57-59, Hồ Tùng Mậu, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty Cổ phần Beta Edtech, nghiên cứu về kinh doanh, quản trị, kinh tế và tài chính ngân hàng; tư vấn xây dựng chiến lược, kế hoạch kinh doanh, tổ chức hội thảo và đào tạo chuyên môn về tài chính, kế toán, quản trị.'
  en: 'An institute under Beta Edtech JSC researching business, management, economics, and banking and finance; it advises on business strategy and planning, organises workshops and runs professional training in finance, accounting and management.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: Kinh doanh và quản trị kinh doanh; Quan hệ sản xuất kinh doanh; Kinh tế, tài chính ngân hàng. 2. Dịch vụ khoa học và công nghệ: Tư vấn, xây dựng các chiến lược, kế hoạch trong lĩnh vực kinh tế, tài chính ngân hàng, quản trị kinh doanh, kế toán; Tổ chức hội nghị, hội thảo và sự kiện trao đổi thông tin; Phổ biến kiến thức, tập huấn, đào tạo, bồi dưỡng chuyên môn nghiệp vụ trong các các lĩnh vực kinh tế, tài chính ngân hàng, quản trị kinh doanh, kế toán (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 3. Hợp tác với các tổ chức, cá nhân trong và ngoài nước theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
