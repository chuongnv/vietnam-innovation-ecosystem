id: research-vien-khoa-hoc-giao-duc-dao-tao-giao-vien
name:
  vi: Viện Khoa Học Giáo Dục - Đào Tạo Giáo Viên
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 215, Điện Biên Phủ, Phường Gia Định, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Trường Đại học Quốc tế Hồng Bàng, nghiên cứu lý luận và thực tiễn về khoa học giáo dục và đào tạo giáo viên; phát triển học liệu, xuất bản tài liệu khoa học và bồi dưỡng nghiệp vụ sư phạm cho giáo viên, giảng viên.'
  en: 'An institute under Hong Bang International University researching the theory and practice of educational science and teacher training; it develops learning materials, publishes scholarly works and provides pedagogical training for teachers and lecturers.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học: Nghiên cứu các vấn đề lý luận và thực tiễn trong lĩnh vực khoa học giáo dục và đào tạo giáo viên. 2. Sản xuất mẫu và tiến tới thương mại hoá các học liệu được tạo ra từ kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Phát hành và công bố các tài liệu khoa học (sách, giáo trình, bài báo khoa học, hội thảo khoa học). Tổ chức hội nghị, hội thảo trao đổi thông tin, kết quả nghiên cứu. Ứng dụng kết quả nghiên cho các nhu cầu thực tiễn của xã hội. Ứng dụng các kết quả nghiên cứu vào việc đào tạo, bồi dưỡng, nâng cao trình độ sư phạm cho giáo viên, giảng viên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Liên kết, hợp tác với các tổ chức, cá nhân trong nước và quốc tế thực hiện nhiệm vụ của Viện theo các lĩnh vực đăng ký phù hợp với luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
