id: research-trung-tam-tu-van-va-nghien-cuu-khoa-hoc
name:
  vi: Trung Tâm Tư Vấn Và Nghiên Cứu Khoa Học
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 4, Nguyễn Thị Minh Khai, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu thủy lực, khí tượng thủy văn, môi trường và biến đổi khí hậu, giảm nhẹ thiên tai, cùng địa kỹ thuật, kết cấu và vật liệu xây dựng; tư vấn thẩm tra, thiết kế, giám sát, kiểm định công trình và quản lý dự án xây dựng.'
  en: 'Centre researching hydro-meteorology, hydraulics, environment and climate change, structures, geotechnics, building materials and disaster mitigation; it offers review, design, supervision and inspection of works and construction project management.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực: khí tượng, thủy văn, thủy lực, môi trường và thích ứng biến đổi khí hậu, tác động của biến đổi khí hậu; kết cấu công trình, địa kỹ thuật, vật liệu và công nghệ xây dựng (giao thông, xây dựng dân dụng và công nghiệp, hạ tầng kỹ thuật); giải pháp phòng tránh và giảm nhẹ thiên tai. 2. Sản xuất thử nghiệm, kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ khoa học và công nghệ: Tư vấn thẩm tra dự án đầu tư, báo cáo kinh tế - kỹ thuật, thiết kế kỹ thuật, thiết kế bản vẽ thi công, dự toán; giám sát công trình thi công xây dựng công trình; giám sát khảo sát xây dựng; tư vấn kiểm định chất lượng, kiểm tra an toàn công trình xây dựng, thí nghiệm chuyên ngành xây dựng; tư vấn quản lý dự án đầu tư xây dựng công trình; tư vấn đấu thầu công trình; chuyển giao công nghệ; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước
    có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
