id: research-vien-nghien-cuu-do-thi
name:
  vi: Viện Nghiên cứu Đô Thị
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 9, Đường 279, Phường Phước Long B, Thành phố Thủ Đức
description:
  vi: 'Viện trực thuộc Liên hiệp Khoa học Kinh tế – Đô thị Nam bộ, nghiên cứu đa ngành về đô thị, kiến trúc, xây dựng, kỹ thuật và kinh tế – xã hội; cung cấp khảo sát, đo đạc, tư vấn thiết kế, lập và quản lý dự án, thẩm tra, giám sát, kiểm định công trình.'
  en: 'An institute under the Southern Economic–Urban Science Union conducting multidisciplinary research on urban areas, architecture, construction, engineering and socio-economics; it provides surveying, design consulting, project preparation and management, verification, supervision and inspection of works.'
description_source:
  text: 1. Nghiên cứu khoa học lĩnh vực đô thị, kiến trúc, xây dựng, địa lý, địa chất, dầu khí, hải dương học, cơ khí, giao thông, điện tử, viễn thông, công nghệ thông tin, vật lý kỹ thuật (y sinh, trị liệu), sinh học, y - dược học, thẩm mỹ, môi trường, năng lượng và công nghệ cao. Nghiên cứu cấu trúc kinh tế, hành chính, pháp luật, tài chính, quản trị, thị trường, giáo dục, ngôn ngữ, tiếp biến văn hóa, thời trang, lý học, phong thuỷ học và tôn giáo học. 2. Khảo sát địa hình, địa chất, thuỷ văn, hiện trạng công trình, quy hoạch, đo đạc, vẽ bản đồ. Tư vấn đầu tư, lập dự án và quản lý dự án. Tư vấn đấu thầu, lập tổng dự toán và dự toán công trình. Tư vấn, thiết kế tổng mặt bằng, kiến trúc, kết cấu công trình công nghiệp và dân dụng. Thiết kế công trình hạ tầng kỹ thuật đô thị, công trình cơ khí, điện, điện tử, viễn thông, dầu khí, cầu, đường, cảng, nước, môi trường, nông nghiệp, thuỷ lợi, nhà máy thuỷ điện. Tư vấn, thiết kế phần mềm, trang web, hệ thống mạng máy tính, hệ thống gis, tự động
    hóa và năng lượng. 3. Tư vấn, thẩm tra, thẩm định, thẩm kế, giám sát, kiểm định, giám định, đánh giá tác động môi trường, sự cố và lập phương án xử lý. Thí nghiệm vật liệu, sản xuất và thi công thử nghiệm công trình kỹ thuật đô thị, xây dựng, vật liệu mới. Thiết lập cơ sở toán học tính toán và điều khiển, đăng kiểm, kiểm toán, chứng khoán, tư vấn tài chính, sở hữu trí tuệ, thẩm định giá, môi giới bất động sản. 4. Giám sát độc lập các đề tài, dự án, công trình khoa học và công nghệ. Tư vấn pháp luật, phát triển xã hội, sức khỏe cộng đồng. Tổ chức dịch thuật, bản thảo, xuất bản, chuyển giao công nghệ. Tổ chức giáo dục, đào tạo, ươm tạo công nghệ mới, ươm tạo doanh nghiệp khoa học và công nghệ. 5. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định.
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
