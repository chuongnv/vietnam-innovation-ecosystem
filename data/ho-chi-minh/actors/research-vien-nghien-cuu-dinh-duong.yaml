id: research-vien-nghien-cuu-dinh-duong
name:
  vi: Viện Nghiên cứu Dinh Dưỡng Thành Phố Hồ Chí Minh
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: J4 Bửu Long, Phường Hòa Hưng, TP. Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty CP Thực phẩm dinh dưỡng Nutifood, nghiên cứu công nghệ chế biến thực phẩm, đồ uống và y học (dự phòng, lâm sàng); cung cấp tư vấn dinh dưỡng, khám chữa bệnh, hội thảo, tập huấn và chuyển giao công nghệ.'
  en: 'Institute under Nutifood Nutrition Food JSC, researching preventive and clinical medicine and food and beverage technology; offers nutrition counselling, medical examination and treatment, seminars, training and technology transfer.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực công nghệ thực phẩm và đồ uống, y học dự phòng, y học lâm sàng. 2. Dịch vụ KH&CN: tổ chức hội nghị, hội thảo, tư vấn, tập huấn, bồi dưỡng chuyên môn, tư vấn dinh dưỡng, khám chữa bệnh, chuyển giao công nghệ theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
