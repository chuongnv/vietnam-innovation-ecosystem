id: research-trung-tam-phat-trien-nang-luong
name:
  vi: Trung tâm Phát triển Năng lượng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: A18 Mỹ Mỹ-An Phú, Nguyễn Hoàng, Phường An Phú, Thành phố Thủ Đức
description:
  vi: 'Trung tâm nghiên cứu ứng dụng công nghệ năng lượng, nhiên liệu ngoài dầu khí và chế tạo thiết bị năng lượng; sản xuất thử sản phẩm, xúc tiến chuyển giao công nghệ, tư vấn thiết kế, lắp đặt thiết bị điện và khảo sát, lập dự án năng lượng.'
  en: 'A centre doing applied research on energy technology, non-petroleum fuels and energy equipment manufacturing; it pilots products, promotes technology transfer, advises on design and installation of electrical equipment, and surveys and prepares energy projects.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ năng lượng và nhiên liệu không phải dầu khí; công nghệ chế tạo và kỹ thuật cơ khí thiết bị năng lượng (không bao gồm thiết bị năng lượng hạt nhân). 2. Sản xuất thử - thử nghiệm, sản xuất - kinh doanh các sản phẩm là kết quả nghiên cứu và phát triển. 3. Dịch vụ KH&CN - Xúc tiến chuyển giao công nghệ; xây dựng dự án về công nghiệp, dân dụng và kỹ thuật hạ tầng. - Tư vấn thiết kế, chế tạo, cung cấp, lắp đặt thiết bị lĩnh vực điện và điện tử; công nghệ năng lượng; - Tư vấn lập và xây dựng các dự án, tư vấn đấu thầu cá dự án thuộc lĩnh vực điện, công nghệ năng lượng; - Khảo sát thiết kế lập dự án khả thi cho các công trình thuộc các chuyên ngành công nghệ năng lượng và nhiên liệu không phải dầu khí; - Tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
