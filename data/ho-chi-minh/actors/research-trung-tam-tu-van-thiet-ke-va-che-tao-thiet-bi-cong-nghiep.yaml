id: research-trung-tam-tu-van-thiet-ke-va-che-tao-thiet-bi-cong-nghiep
name:
  vi: Trung tâm Tư vấn Thiết kế và Chế tạo Thiết bị Công nghiệp
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 1, Võ Văn Ngân, Phường Thủ Đức, Thành phố Thủ Đức
description:
  vi: 'Trung tâm nghiên cứu ứng dụng về cơ khí chế tạo máy và tự động hóa; thiết kế, sản xuất thử, kinh doanh thiết bị công nghiệp từ kết quả nghiên cứu và cung cấp tư vấn, chuyển giao, bồi dưỡng chuyên môn.'
  en: 'A centre doing applied research in mechanical engineering and automation; it designs, pilots and sells industrial equipment based on its research and provides consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: cơ khí- chế tạo máy, tự động hóa. 2. Sản xuất thử - thử nghiệm, sản xuất – kinh doanh các sản phẩm là kết quả nghiên cứu. 3. Dịch vụ KH&CN: Tư vấn, chuyển giao kết quả nghiên cứu, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
