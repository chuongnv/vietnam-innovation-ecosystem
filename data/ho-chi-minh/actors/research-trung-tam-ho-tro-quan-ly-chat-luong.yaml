id: research-trung-tam-ho-tro-quan-ly-chat-luong
name:
  vi: Trung tâm Hỗ trợ Quản lý Chất lượng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 10A, Tản Viên, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu về quản trị kinh doanh; tư vấn áp dụng công cụ quản lý chất lượng, xây dựng tiêu chuẩn, cung cấp thông tin và đào tạo về quản lý chất lượng cho tổ chức, doanh nghiệp.'
  en: 'Centre researching business administration; it advises organisations and businesses on applying quality management tools and developing standards, and provides information and training on quality management.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. 2- Dịch vụ KH&CN: tư vấn áp dụng các công cụ quản lý chất lượng,, thông tin khoa học, huấn luyện bồi dưỡng về quản lý chất lượng, xây dựng tiêu chuẩn (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
