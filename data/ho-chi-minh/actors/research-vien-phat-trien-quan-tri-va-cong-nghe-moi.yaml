id: research-vien-phat-trien-quan-tri-va-cong-nghe-moi
name:
  vi: Viện Phát triển Quản trị và Công nghệ mới
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện phát triển
address: 404, Huỳnh Văn Bánh, Phường Phú Nhuận, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh và quan hệ sản xuất – kinh doanh; dịch vụ gồm tư vấn xây dựng tiêu chuẩn và áp dụng công cụ quản lý chất lượng, cấp chứng nhận hệ thống chất lượng, tư vấn chuyển giao công nghệ, cung cấp thông tin và bồi dưỡng chuyên môn.'
  en: 'Institute doing applied research in business administration and production relations; services include advice on standards and quality management tools, quality system certification, technology transfer consulting, information and professional training.'
description_source:
  text: '- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: quan hệ sản xuất kinh doanh, kinh doanh và quản trị kinh doanh. - Dịch vụ KH&CN: tư vấn áp dụng các công cụ quản lý chất lượng, chứng nhận hệ thống quản lý chất lượng, tư vấn xây dựng tiêu chuẩn, tư vấn chuyển giao công nghệ, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
