id: research-trung-tam-moi-truong-va-sinh-thai-ung-dung
name:
  vi: Trung tâm Môi trường và Sinh thái Ứng dụng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 26, Đinh Bộ Lĩnh, Phường Phước Long, Thành phố Thủ Đức, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu, ứng dụng công nghệ xử lý chất thải, sản xuất sạch, phục hồi môi trường, quan trắc ô nhiễm, sinh thái học và vi sinh vật học; cung cấp phân tích thí nghiệm, tư vấn, chuyển giao công nghệ và bồi dưỡng.'
  en: 'Centre researching and applying waste treatment, cleaner production, environmental remediation, pollution monitoring, ecology and microbiology; it provides laboratory analysis, consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực: công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí), công nghệ sản xuất sạch, tái chế; công nghệ phục hồi và tái tạo môi trường; công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm; sinh thái học; vi sinh vật học. 2. Dịch vụ KH&CN: phân tích thí nghiệm, chuyển giao công nghệ, tư vấn, thông tin khoa học và công nghệ, huấn luyện bồi dưỡng chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
