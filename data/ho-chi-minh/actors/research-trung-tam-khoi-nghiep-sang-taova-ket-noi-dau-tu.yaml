id: research-trung-tam-khoi-nghiep-sang-taova-ket-noi-dau-tu
name:
  vi: Trung Tâm Khởi Nghiệp Sáng TạoVà Kết Nối Đầu Tư
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Số 10, Đường D4, Phường Phú Thuận, TP. Hồ Chí Minh
description:
  vi: 'Tổ chức KH&CN do cá nhân thành lập, đăng ký nghiên cứu hóa học, hóa dược, vật liệu sinh học, công nghệ thực phẩm, chế biến nông sản và quản trị kinh doanh; tư vấn sở hữu trí tuệ, chuyển giao công nghệ và tập huấn.'
  en: 'Privately founded S&T organisation registered for research in chemistry, pharmaceutical chemistry, biomaterials, food technology, agricultural processing and business management; it offers IP consulting, technology transfer and training.'
description_source:
  text: '1. Nghiên cứu khoa học, phát triển công nghệ và triển khai thực nghiệm trong lĩnh vực: Hóa hữu cơ; Hóa phân tích; Hóa học cao phân tử (polyme); Hóa sinh; Kinh doanh và quản trị kinh doanh; Các vấn đề chung về hóa học công nghiệp; Công nghệ hóa dược; Công nghệ hóa hữu cơ; Công nghệ sản xuất sạch, tái chế; Các công nghệ sản phẩm sinh học, vật liệu sinh học, chất dẻo sinh học, nhiên liệu sinh học, các hóa chất được chiết tách từ sinh học, các vật liệu mới có nguồn gốc sinh học; Công nghệ thực phẩm; Công nghệ đồ uống; Bảo quản và chế biến nông sản. 2. Sản xuất thử nghiệm, sản xuất kinh doanh sản phẩm là kết quả nghiên cứu khoa học và phát triển công nghệ trong lĩnh vực đăng ký. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, thông tin khoa học công nghệ, tư vấn về sở hữu trí tuệ, tư vấn chuyển giao công nghệ, kết quả nghiên cứu; tập huấn, bồi dưỡng chuyên môn theo lĩnh vực đăng ký (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép
    của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp với Luật định'
