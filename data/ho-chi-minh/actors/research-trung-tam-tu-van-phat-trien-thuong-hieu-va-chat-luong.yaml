id: research-trung-tam-tu-van-phat-trien-thuong-hieu-va-chat-luong
name:
  vi: Trung tâm Tư vấn Phát triển Thương hiệu và Chất lượng
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 014 Lô B CC Gò Dầu 2, Trương Vĩnh Ký, Phường Tân Sơn Nhì, Thành phố Hồ Chí Minh
description:
  vi: 'Trung tâm cung cấp dịch vụ tư vấn xây dựng tiêu chuẩn và hệ thống bảo đảm đo lường, ứng dụng mã số mã vạch cho sản phẩm, đại diện sở hữu trí tuệ và bồi dưỡng nghiệp vụ về thương hiệu, chất lượng.'
  en: 'A centre offering advice on standards and measurement assurance systems, barcode application for products, intellectual property representation and training on branding and quality.'
description_source:
  text: '- Dịch vụ KH&CN: + Dịch vụ tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống bảo đảm về đo lường. + Dịch vụ ứng dụng kỹ thuật mã số, mã vạch cho sản phẩm hàng hóa và dịch vụ. + Dịch vụ đại diện sở hữu trí tuệ. + Thông tin khoa học, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (không cấp văn bằng, chứng chỉ). - Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
