id: research-trung-tam-phat-trien-nong-thon-saemaul-undong
name:
  vi: Trung Tâm Phát Triển Nông Thôn - Saemaul Undong
type: research
categories:
- Tổ chức khoa học và công nghệ
address: Phường Đông Hòa, Phường Dĩ An, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm nghiên cứu phát triển nông thôn theo mô hình Saemaul Undong, gồm quy hoạch vùng và sử dụng đất, nhân học, nông nghiệp, khuyến nông, phát triển cộng đồng, văn hóa và du lịch; tổ chức hội thảo, tư vấn, đánh giá và tập huấn ngắn hạn.'
  en: 'A rural development research centre following the Saemaul Undong model, covering regional and land-use planning, anthropology, agriculture, extension, community development, culture and tourism; it runs seminars, consulting, assessment and short-term training.'
description_source:
  text: '1. Nghiên cứu khoa học và phát triển công nghệ trong các lĩnh vực phát triển nông thôn: Nghiên cứu quy hoạch nói chung; quy hoạch phát triển vùng; Quy hoạch phát triển nông thôn; Quy hoạch sử dụng đất; Nhân học văn hóa - xã hội; Nhân học kinh tế; Nông nghiệp; Khuyến nông; Phát triển nông thôn; Phát triển cộng đồng; Địa lý kinh tế -xã hội, Văn hóa, Du lịch. 2. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo; Tư vấn, phản biện, đánh giá các nhiệm vụ khoa học và công nghệ, chuyển giao nghiên cứu khoa học, thông tin khoa học công nghệ; Tập huấn, bồi dưỡng chuyên môn ngắn hạn cho các tổ chức, cá nhân có nhu cầu theo lĩnh vực đăng ký trên. 3. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
