id: research-vien-nghien-cuu-an-toan-suc-khoe-va-moi-truong
name:
  vi: Viện Nghiên cứu An Toàn, Sức Khỏe Và Môi Trường
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 491, Man Thiện, Phường Tăng Nhơn Phú, Thành phố Hồ Chí Minh
description:
  vi: 'Viện trực thuộc Công ty TNHH Thương mại Y Nhân, nghiên cứu về an toàn sức khỏe nghề nghiệp, công nghệ môi trường, hóa học, sinh học và xử lý chất thải, sản xuất sạch; cung cấp dịch vụ tư vấn và chuyển giao trong các lĩnh vực này.'
  en: 'An institute under Y Nhan Trading Co., Ltd. researching occupational health and safety, environmental technology, chemistry, biology, waste treatment and cleaner production; it provides consulting and transfer services in these fields.'
description_source:
  text: '1. Hoạt động nghiên cứu khoa học, phát triển công nghệ trong lĩnh vực: Khoa học trái đất, khoa học giáo dục và xã hội học; Công nghệ hóa học, công nghệ sinh học và công nghệ môi trường; an toàn sức khỏe nghề nghiệp; Sinh thái học, Đa dạng sinh học, Sinh học phân tử, Vi sinh vật học; Khoa học Môi trường - các khía cạnh xã hội, Nghiên cứu qui hoạch, phát triển đô thị và nông thôn, Quá trình và thiết bị công nghệ hóa học, Công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí), Công nghệ sản xuất sạch và tái chế, Công nghệ phục hồi và tái tạo môi trường, Công nghệ quan trắc môi trường, kiểm soát và xử lý ô nhiễm. 2. Sản xuất thử nghiệm, sản xuất kinh doanh các sản phẩm hình thành từ kết quả nghiên cứu nêu trên. 3. Dịch vụ khoa học và công nghệ: Tổ chức hội nghị, hội thảo, Thông tin khoa học và công nghệ; Dịch vụ môi giới chuyển giao công nghệ, Dịch vụ tư vấn chuyển giao công nghệ, Dịch vụ đánh giá công nghệ, Dịch vụ xúc tiến chuyển giao công nghệ; Tư vấn, phản biện, đánh giá, chuyển
    giao kết quả nghiên cứu khoa học trong lĩnh vực đăng ký; Tập huấn, bồi dưỡng chuyên môn theo các lĩnh vực đăng ký trên (chỉ được cấp giấy chứng nhận, đối với việc cấp văn bằng, chứng chỉ phải được phép của cơ quan Nhà nước có thẩm quyền). 4. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
