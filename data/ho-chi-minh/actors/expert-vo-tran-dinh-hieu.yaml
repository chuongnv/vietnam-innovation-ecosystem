description:
  vi: Chuyên gia trên HOIP, lĩnh vực khác.
  en: 'Expert on HOIP – field: other.'
description_source:
  text: 'Ông Võ Trần Đình Hiếu hiện là Giám đốc tài chính tại Vietnam Innovative Startups Accelerator (VIISA), đồng thời là Phó Giám đốc tại Quỹ đầu tư Dragon Capital và là đồng sáng lập Câu lạc bộ Fintech Việt Nam. nguyen-quynh-anh-1605864591-7748-1605864889.jpg Ông Hiếu có nhiều năm kinh nghiệm trong lĩnh vực đầu tư tại Việt Nam cũng như khu vực Đông Nam Á. Là người rất tâm huyết với hệ sinh thái khởi nghiệp Việtông tin tưởng vào doanh nhân Việt Nam có thể tận dụng ưu thế và thay đổi thế giới. Chuyên môn: Thạc sỹ Quản trị kinh doanh chuyên ngành tài chính ngân hàng (Thụy Sỹ) Tài chính – Ngân hàng tại Đại học Ngân hàng TPHCM (Việt Nam). Chứng chỉ hành nghề Quản lý quỹ (Ủy ban chứng khoán nhà nước Việt Nam). Nơi công tác: - 2/2007 – 3/2008: Chuyên viên Tiến dụng tiêu dùng tại Ngân hàng ANZ - 3/2008 – 6/2008: Trợ lý Trưởng Đại diện tại Ngân hàng Raifeisen Bank International AG - 2015 đến nay: Sáng lập Câu lạc bộ Fintech Việt Nam - 1/2013 đến nay: Thành viên Ban kiểm soát Quỹ VietFund Management
    - 7/2008 đến nay: Phó Giám đốc tại Quỹ đầu tư Dragon Capital - 9/2016 đến nay: CFO kiêm Giám đốc chương trình, đồng sáng lập VIISA.'
  source: HOIP (tự giới thiệu)
