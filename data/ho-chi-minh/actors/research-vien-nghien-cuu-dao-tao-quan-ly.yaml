id: research-vien-nghien-cuu-dao-tao-quan-ly
name:
  vi: Viện Nghiên cứu Đào tạo Quản lý
type: research
categories:
- Tổ chức khoa học và công nghệ
- Viện nghiên cứu
address: 2, Phùng Khắc Khoan, Phường Sài Gòn, TP. Hồ Chí Minh
description:
  vi: 'Viện nghiên cứu, ứng dụng khoa học về quản trị kinh doanh; tư vấn việc áp dụng công cụ quản lý chất lượng và xây dựng tiêu chuẩn chất lượng, đồng thời cung cấp thông tin khoa học và bồi dưỡng nâng cao nghiệp vụ.'
  en: 'Institute doing applied research in business administration; advises on applying quality management tools and building quality standards, and provides scientific information and professional upskilling.'
description_source:
  text: '1- Nghiên cứu khoa học và triển khai ứng dụng trong lĩnh vực kinh doanh và quản trị kinh doanh. 2- Dịch vụ KH&CN: tư vấn áp dụng các công cụ quản lý chất lượng, tư vấn xây dựng tiêu chuẩn chất lượng, thông tin khoa học, huấn luyện bồi dưỡng nâng cao nghiệp vụ chuyên môn theo lĩnh vực đăng ký (chỉ được cấp chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
