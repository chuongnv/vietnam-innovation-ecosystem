id: research-trung-tam-kiem-dinh-hieu-chuan-do-luong-mien-nam
name:
  vi: Trung tâm Kiểm định Hiệu chuẩn Đo lường Miền Nam
type: research
categories:
- Tổ chức khoa học và công nghệ
address: 370, Trường Chinh, Phường Đông Hưng Thuận, TP. Hồ Chí Minh
description:
  vi: 'Trung tâm chuyên kiểm định, hiệu chuẩn và thử nghiệm các phương tiện đo, giám định hàng hóa về số lượng lẫn chất lượng; ngoài ra tư vấn thiết lập phòng đo lường, xây dựng tiêu chuẩn, quản lý chất lượng và bảo trì thiết bị.'
  en: 'Centre specialising in inspection, calibration and testing of measuring instruments and in quantity and quality surveys of goods; it also advises on setting up metrology labs, standards, quality management and equipment maintenance.'
description_source:
  text: '1. Dịch vụ KH&CN: Thông tin; huấn luyện bồi dưỡng; kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo; giám định số lượng, chất lượng sản phẩm hàng hóa; tư vấn về đầu tư, trang bị và quản lý phòng đo lường, thử nghiệm chất lượng sản phẩm, hàng hóa; tư vấn áp dụng các công cụ quản lý chất lượng; tư vấn xây dựng tiêu chuẩn; tư vấn xây dựng hệ thống bảo đảm về đo lường; dịch vụ bảo trì, bảo dưỡng và sửa chữa các phương tiện đo, thiết bị thử nghiệm, thiết bị kỹ thuật; dịch vụ môi giới, tư vấn chuyển giao công nghệ. 2. Hợp tác trong và ngoài nước theo lĩnh vực đăng ký.'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
