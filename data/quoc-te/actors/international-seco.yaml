description:
  vi: Bộ phận Hợp tác và Phát triển Kinh tế của Cục Kinh tế Liên bang Thụy Sĩ (SECO). Thúc đẩy tăng trưởng kinh tế bền vững, thân thiện môi trường, khí hậu, tạo việc làm tốt hơn ở các nước đang phát triển. Việt Nam là nước ưu tiên; SECO tài trợ Swiss Entrepreneurship Program.
  en: The Economic Cooperation and Development Division of the Swiss State Secretariat for Economic Affairs (SECO). Promotes sustainable, environmentally and climate-friendly economic growth and better jobs in developing countries. Vietnam is a priority country; SECO funds the Swiss Entrepreneurship Program.
history:
- date: '2015'
  text: Tài trợ Swiss Entrepreneurship Program (Swiss EP), giao Swisscontact và J.E. Austin Associates thực hiện, trong đó có Việt Nam.
  source: https://swissep.org/about-us/behind-swiss-ep
- date: 2025-01
  text: 'Công bố Chương trình hợp tác Việt Nam 2025–2028 với ba trọng tâm: thương mại bền vững và đổi mới sáng tạo (trong đó có củng cố môi trường đổi mới sáng tạo, khởi nghiệp); tài chính công và tư bền vững; phát triển công nghiệp, đô thị thông minh với khí hậu.'
  source: https://www.seco-cooperation.admin.ch/en/vietnam
- date: 2026-02
  text: 'Các dự án tiêu biểu tại Việt Nam: SwissTrade+ (phát triển thương mại, xuất khẩu), ST4SD (du lịch bền vững), GQSP giai đoạn II (chất lượng và tiêu chuẩn), Swiss Entrepreneurship Program.'
  source: https://www.seco-cooperation.admin.ch/en/vietnam
- date: '2026-10-17'
  text: Chuyến thăm Hà Nội của Tổng thống Thụy Sĩ Guy Parmelin, tăng cường hợp tác thương mại, đầu tư, đổi mới sáng tạo; ngày 18/10 ký Hiệp định thương mại tự do EFTA – Việt Nam.
  source: https://www.seco-cooperation.admin.ch/en
