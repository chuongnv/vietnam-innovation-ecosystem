id: support-org-trung-tam-ung-pho-su-co-an-toan-moi-truong-ese
name:
  vi: Trung tâm Ứng phó sự cố an toàn môi trường (ESE)
alt_names:
- TRUNG TÂM ỨNG PHÓ SỰ CỐ AN TOÀN MÔI TRƯỜNG (ESE) CENTER FOR ENVIROMENTAL SAFETY RESPONSE (ESE)
- Trung tâm ứng phó sự cố an toàn môi trường
type: support_org
categories:
- Tổ chức khoa học và công nghệ
address: 160, Nam Kỳ Khởi Nghĩa, Phường Tân Sơn Hòa, Thành phố Hồ Chí Minh
description:
  vi: Dự án hỗ trợ người thu gom rác phi chính thức tham gia trách nhiệm mở rộng của nhà sản xuất (EPR).
  en: Project supporting informal waste pickers to take part in extended producer responsibility (EPR).
description_source:
  text: '1- Nghiên cứu khoa học và công nghệ lĩnh vực công nghệ quản lý và xử lý chất thải (rắn, lỏng, khí); công nghệ sản xuất sạch và tái chế; công nghệ phục hồi và tái tạo môi trường; công nghệ phân tích chu trình sống; công nghệ quan trắc môi trường; kiểm soát và xử lý ô nhiễm; an toàn lao động, vệ sinh lao động. 2- Dịch vụ khoa học và công nghệ: tư vấn, chuyển giao công nghệ, bồi dưỡng, tập huấn chuyên môn theo lĩnh vực đăng ký (chỉ cấp giấy chứng nhận, không cấp văn bằng, chứng chỉ). 3- Hợp tác trong và ngoài nước theo lĩnh vực đăng ký phù hợp Luật định'
  source: Cổng dữ liệu mở TP.HCM (lĩnh vực hoạt động đăng ký)
