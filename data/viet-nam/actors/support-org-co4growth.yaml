id: support-org-co4growth
name:
  vi: Co4Growth
type: support_org
categories:
- Chương trình tăng tốc doanh nghiệp trẻ
- Vốn mồi không hoàn lại
status: active
website: https://co4growth.com/
description:
  vi: 'Dự án do SVF thực hiện với sự hỗ trợ của Standard Chartered Foundation và Youth Business International (YBI): Chương trình Tăng tốc "Vững Tài chính – Sáng Niềm tin" cho doanh nghiệp do người trẻ 18–35 tuổi điều hành, gồm huấn luyện tài chính, mô hình kinh doanh, gọi vốn, cố vấn 1:1 và vốn mồi.'
  en: 'A project implemented by SVF with support from Standard Chartered Foundation and Youth Business International (YBI): the "Vung Tai chinh - Sang Niem tin" (Strong Finances - Bright Trust) Accelerator Programme for businesses run by young people aged 18-35, comprising financial coaching, business models, fundraising, 1:1 mentoring and seed capital.'
history:
- date: '2026-11-27'
  text: 'Tổng kết Khóa 4 tại Đà Nẵng: Top 10 thuyết trình gọi vốn; 5 doanh nghiệp nhận vốn mồi 98 triệu đồng mỗi đơn vị (VinaHealth Center, HTX Thanh niên Bình Phục, 5RTech, HTX Po Mỷ, Vụn Art). Khóa 5 nhận hồ sơ đến 31/12/2026.'
  source: https://www.ybadanang.com/su-kien/2026-11-27-co4growth-pitching/
